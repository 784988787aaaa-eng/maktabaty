<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="theme-color" content="#FAF6ED"/>
  <meta name="color-scheme" content="light"/>
  <meta name="author" content="علي بن جابر الفيفي"/>
  <meta name="description" content="لأنك الله: رحلة إلى السماء السابعة — تأملات روحانية وأدبية في ظلال عشرة من أسماء الله الحسنى: الصمد، الحفيظ، اللطيف، الشافي، الوكيل، الشكور، الجبار، الهادي، الغفور، القريب"/>
  <title>لأنك الله — رحلة إلى السماء السابعة</title>
  <style>
    /* الخطوط المدمجة أوفلاين في تطبيق مكتبتي */
    @font-face {
      font-family: "Amiri";
      src: url("https://maktabati.app/assets/fonts/amiri/amiri-400.woff2") format("woff2"),
           url("https://maktabati.app/fonts/amiri.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Amiri";
      src: url("https://maktabati.app/assets/fonts/amiri/amiri-700.woff2") format("woff2"),
           url("https://maktabati.app/fonts/amiri.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Noto Naskh Arabic";
      src: url("https://maktabati.app/assets/fonts/noto-naskh-arabic/noto-naskh-arabic-400.woff2") format("woff2"),
           url("https://maktabati.app/fonts/noto_naskh_arabic.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Noto Naskh Arabic";
      src: url("https://maktabati.app/assets/fonts/noto-naskh-arabic/noto-naskh-arabic-700.woff2") format("woff2"),
           url("https://maktabati.app/fonts/noto_naskh_arabic.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Aref Ruqaa";
      src: url("https://maktabati.app/assets/fonts/aref-ruqaa/aref-ruqaa-400.woff2") format("woff2"),
           url("https://maktabati.app/fonts/aref_ruqaa.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Aref Ruqaa";
      src: url("https://maktabati.app/assets/fonts/aref-ruqaa/aref-ruqaa-700.woff2") format("woff2"),
           url("https://maktabati.app/fonts/aref_ruqaa.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Noto Kufi Arabic";
      src: url("https://maktabati.app/assets/fonts/noto-kufi-arabic/noto-kufi-arabic-400.woff2") format("woff2"),
           url("https://maktabati.app/fonts/noto_kufi_arabic.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Noto Kufi Arabic";
      src: url("https://maktabati.app/assets/fonts/noto-kufi-arabic/noto-kufi-arabic-700.woff2") format("woff2"),
           url("https://maktabati.app/fonts/noto_kufi_arabic.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Amiri Quran";
      src: url("https://maktabati.app/fonts/amiri_quran.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Scheherazade New";
      src: url("https://maktabati.app/fonts/scheherazade_new.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Noto Sans Arabic";
      src: url("https://maktabati.app/assets/fonts/noto-sans-arabic/noto-sans-arabic-400.woff2") format("woff2"),
           url("https://maktabati.app/fonts/noto_sans_arabic.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Cairo";
      src: url("https://maktabati.app/fonts/cairo.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }

    :root {
      /* حلة اللازورد السماوي والتذهيب السلطاني (مستوحاة من رحلة إلى السماء السابعة) */
      --bg-primary: #FAF6ED;
      --bg-secondary: #FFFDF8;
      --paper-bg: #FFFDF8;
      --bg-card: #FFFDF8;
      --bg-soft-rose: #EEF3F8;
      --bg-soft-sage: #F4EFE2;
      --bg-pearl-gold: #FCF4DF;

      --text-primary: #1B2430;
      --text-secondary: #4B5666;
      --accent-rose: #1E3A5F;
      --accent-rose-dark: #0F2542;
      --accent-rose-light: #3B6998;
      --accent-sage: #065F46;
      --accent-sage-dark: #044332;
      --accent-gold: #B8860B;
      --accent-gold-soft: rgba(184,134,11,0.25);
      --line: rgba(30,58,95,0.16);
      --border-ornate: rgba(184,134,11,0.38);
      --paper-edge: #D6CBB5;
      --shadow-card: 0 16px 42px rgba(15,37,66,0.07);

      /* نظام التحجيم التفاعلي */
      --reader-font: 21px;
      --reader-font-size: 100%;
      --font-scale: 1;

      --font-body: "Noto Naskh Arabic", "Amiri", serif;
      --font-headings: "Aref Ruqaa", "Amiri", serif;
      --font-titles: "Noto Kufi Arabic", sans-serif;
      --font-chapter-titles: "Noto Kufi Arabic", sans-serif;
      --font-quotes: "Amiri", "Aref Ruqaa", serif;
      --font-quran: "Amiri Quran", "Scheherazade New", "Amiri", serif;
      --font-ui: "Noto Sans Arabic", "Cairo", sans-serif;
      --font-interface: "Noto Sans Arabic", "Cairo", sans-serif;
      --font-numbers: "Noto Sans Arabic", "Cairo", sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; max-width: 100%; overflow-wrap: anywhere; }
    html, body, .app { touch-action: pan-y !important; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); }
    .app { height: 100vh; max-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(155deg, var(--bg-primary), var(--bg-secondary) 55%, var(--bg-soft-rose) 100%); }

    /* الشريط العلوي */
    .top-bar { height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--bg-secondary); border-bottom: 1px solid var(--line); z-index: 10; box-shadow: 0 3px 14px rgba(0,0,0,0.04); }
    .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-ui); font-size: 14px; font-weight: 700; color: var(--accent-rose-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-gem { width: 30px; height: 30px; flex: 0 0 30px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: linear-gradient(135deg, var(--accent-rose), var(--accent-rose-dark)); font-size: 14px; }
    .tools { display: flex; gap: 6px; }
    .icon-btn { border: 1px solid var(--line); background: var(--bg-primary); color: var(--accent-rose-dark); border-radius: 12px; min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .15s; }
    .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .icon-btn.bookmarked { background: var(--bg-pearl-gold); color: var(--accent-gold); border-color: var(--accent-gold); }

    /* شريط الفصل الجاري */
    .running-header { height: 34px; flex: 0 0 34px; display: flex; align-items: center; justify-content: center; background: var(--accent-rose-dark); color: #FAF6ED; border-bottom: 2px solid var(--accent-gold); font-family: var(--font-ui); font-size: 11px; font-weight: 700; }
    .running-header[hidden] { display: none; }

    /* مسرح الصفحة الورقية وتنسيقات الإخراج الفني */
    .book-stage { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: clamp(10px, 2.5vw, 22px); display: flex; justify-content: center; align-items: flex-start; }
    .page-canvas { width: min(100%, 760px); min-height: 100%; margin: 0 auto; background: var(--bg-secondary); border: 1.5px solid var(--paper-edge); border-radius: 18px; padding: clamp(22px, 4.2vw, 42px); position: relative; box-shadow: var(--shadow-card); }
    .page-canvas::before { content: ""; position: absolute; inset: 7px; border: 1px solid var(--accent-gold-soft); border-radius: 12px; pointer-events: none; }
    .page { position: relative; z-index: 1; font-size: calc(var(--reader-font)); line-height: 2.06; color: var(--text-primary); animation: pageIn .22s ease both; }
    @keyframes pageIn { from { opacity: .5; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .page p { margin: 0 0 15px; text-align: justify; line-height: 2.06; }
    .page h1 { font-family: var(--font-headings); font-size: clamp(1.5em, 4.8vw, 2.05em); color: var(--accent-rose-dark); margin: 0 0 12px; font-weight: 700; }
    .page h2 { font-family: var(--font-headings); font-size: clamp(1.22em, 3.8vw, 1.5em); color: var(--accent-rose-dark); margin: 18px 0 10px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .page h2::before { content: "❖"; color: var(--accent-gold); font-size: 0.78em; }

    /* الشريط السفلي للتنقل */
    .bottom-nav-dock { min-height: 60px; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 8px 16px calc(env(safe-area-inset-bottom, 6px) + 6px); background: var(--bg-secondary); border-top: 1px solid var(--line); }
    .nav-btn { min-width: 90px; border-radius: 12px; background: var(--accent-rose-dark); color: #fff; border: none; padding: 8px 14px; font-family: var(--font-ui); font-size: 12px; font-weight: 700; cursor: pointer; }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }
    .page-counter { font-family: var(--font-ui); font-size: 12px; font-weight: 700; color: var(--text-secondary); background: var(--bg-primary); border: 1px solid var(--line); border-radius: 99px; padding: 5px 15px; direction: ltr; }

    /* نوافذ الفهرس والبحث */
    .overlay { position: fixed; inset: 0; z-index: 45; background: rgba(15,37,66,0.45); backdrop-filter: blur(3px); display: none; align-items: flex-end; justify-content: center; padding: 12px; }
    .overlay.open { display: flex; }
    .panel { width: min(100%, 640px); max-height: 78vh; overflow-y: auto; background: var(--bg-secondary); border-radius: 18px; padding: 16px; border: 1px solid var(--paper-edge); box-shadow: 0 20px 60px rgba(0,0,0,0.22); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .panel-head h3 { margin: 0; font-family: var(--font-ui); font-size: 15px; color: var(--accent-rose-dark); }
    #searchInput { width: 100%; min-height: 44px; padding: 9px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg-primary); font-family: var(--font-ui); font-size: 14px; margin-bottom: 10px; outline: none; }
    .search-result, .toc-item { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; margin: 4px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-primary); cursor: pointer; font-family: var(--font-ui); font-size: 13px; color: var(--text-primary); }
    .toc-item.toc-part { background: var(--bg-soft-rose); color: var(--accent-rose-dark); font-weight: 700; border-color: var(--accent-gold-soft); }
    .toc-item small, .search-result small { color: var(--accent-gold); font-weight: 700; background: var(--bg-secondary); padding: 2px 8px; border-radius: 99px; border: 1px solid var(--accent-gold-soft); }
    mark.page-search-highlight, mark.search-hit-mark { background: var(--accent-gold-soft); color: var(--accent-rose-dark); font-weight: 700; border-radius: 4px; padding: 0 4px; }

    /* ========================================================
       فضاء الإبداع الطباعي لدار النشر (خاص بكتاب «لأنك الله»)
       ======================================================== */
    .cover-page {
      min-height: clamp(460px, 70vh, 760px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      isolation: isolate;
      padding: clamp(26px, 5vw, 48px) clamp(16px, 4vw, 32px);
      background: radial-gradient(ellipse at 50% 34%, #FFFFFF 0%, var(--bg-soft-rose) 52%, var(--bg-primary) 100%);
      border: 2px solid var(--border-ornate);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 0 0 6px var(--bg-secondary), inset 0 0 0 7.5px var(--accent-gold-soft);
    }
    .cover-art-svg { width: clamp(135px, 36vw, 195px); height: auto; margin: 0 auto 16px; filter: drop-shadow(0 8px 18px rgba(15,37,66,0.12)); }
    .cover-title-frame {
      position: relative;
      padding: clamp(14px, 3vw, 22px) clamp(22px, 5vw, 36px);
      margin: 4px auto 14px;
      max-width: 94%;
      background: linear-gradient(180deg, rgba(255,255,255,0.95), var(--bg-pearl-gold));
      border-top: 2px solid var(--accent-gold);
      border-bottom: 2px solid var(--accent-gold);
      border-radius: 14px;
      box-shadow: 0 10px 26px rgba(15,37,66,0.06);
    }
    .cover-page h1 { font-family: var(--font-headings); font-size: clamp(2.2em, 7.6vw, 3.3em); line-height: 1.38; color: var(--accent-rose-dark); margin: 0; }
    .cover-page .subtitle { font-family: var(--font-headings); font-size: clamp(1.05em, 3.2vw, 1.28em); color: var(--accent-rose-light); margin: 6px auto 12px; text-align: center; }
    .cover-page .author { font-family: var(--font-ui); font-size: 0.78em; font-weight: 700; color: var(--accent-rose-dark); background: var(--bg-secondary); border: 1px solid var(--accent-gold-soft); border-radius: 99px; padding: 5px 20px; margin: 4px 0 14px; }
    .ornament { color: var(--accent-gold); font-size: 0.92em; letter-spacing: 6px; margin: 12px 0; text-align: center; }
    .primary-btn { border: 1px solid var(--accent-gold); background: linear-gradient(135deg, var(--accent-rose), var(--accent-rose-dark)); color: #fff; border-radius: 99px; padding: 10px 28px; font-family: var(--font-ui); font-size: 0.76em; font-weight: 700; cursor: pointer; margin-top: 6px; box-shadow: 0 7px 18px rgba(15,37,66,0.18); }

    /* لوحة مطلع الاسم الإلهي الجليل */
    .divine-name-opener {
      text-align: center;
      padding: 20px 16px;
      margin: 4px 0 18px;
      border-radius: 16px;
      background: radial-gradient(circle at 50% 30%, #FFFFFF, var(--bg-soft-rose) 65%, var(--bg-pearl-gold) 100%);
      border: 1.5px solid var(--accent-gold-soft);
      box-shadow: 0 8px 24px rgba(15,37,66,0.04);
    }
    .letter-envelope-header {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--accent-gold-soft);
      border-radius: 99px;
      padding: 4px 16px;
      margin: 0 auto 10px;
      font-family: var(--font-titles);
      font-size: 0.68em;
      font-weight: 700;
      color: var(--accent-rose-dark);
    }
    .divine-epigraph {
      font-family: var(--font-quotes);
      font-size: 1.08em;
      line-height: 2.0;
      color: var(--accent-rose-dark);
      max-width: 90%;
      margin: 10px auto 0;
      padding-top: 10px;
      border-top: 1px dashed var(--accent-gold-soft);
      text-align: center;
    }

    /* البطاقات القرآنية والنبوية والشعرية والوجدانية */
    .quran-box {
      margin: 16px 0;
      padding: 15px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--bg-pearl-gold), var(--bg-secondary));
      border: 1.5px solid var(--accent-gold-soft);
      border-inline-start: 4px solid var(--accent-gold);
      text-align: center;
    }
    .quran-box p, .quran-verse { font-family: var(--font-quran); font-size: 1.15em; line-height: 2.15; color: var(--accent-rose-dark); margin: 0; text-align: center; }

    .hadith-box {
      margin: 16px 0;
      padding: 15px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--bg-soft-sage), var(--bg-secondary));
      border: 1px solid var(--line);
      border-inline-start: 4px solid var(--accent-sage);
      text-align: center;
    }
    .hadith-box p { font-family: var(--font-quotes); font-size: 1.06em; line-height: 2.02; color: var(--accent-sage-dark); margin: 0; text-align: center; }

    .poetry-stanza {
      margin: 16px 0;
      padding: 14px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--bg-soft-rose), var(--bg-secondary));
      border: 1px dashed var(--accent-gold);
      text-align: center;
      font-family: var(--font-quotes);
    }
    .poetry-shatr { font-size: 1.05em; color: var(--accent-rose-dark); line-height: 1.95; }

    .reflection-card {
      margin: 16px 0;
      padding: 15px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--bg-secondary), var(--bg-soft-rose));
      border: 1px solid var(--line);
      border-inline-start: 4px solid var(--accent-rose);
    }
    .reflection-card p { font-family: var(--font-quotes); font-size: 1.03em; color: var(--accent-rose-dark); margin: 0; line-height: 1.98; }

    .wisdom-pearl {
      margin: 16px 0;
      padding: 14px 18px;
      border-radius: 12px;
      background: var(--bg-pearl-gold);
      border: 1px solid var(--accent-gold-soft);
      border-inline-start: 3.5px solid var(--accent-gold);
      font-family: var(--font-quotes);
    }

    .heart-keepsake-card {
      background: linear-gradient(145deg, var(--bg-secondary), var(--bg-soft-rose) 65%, var(--bg-pearl-gold) 100%);
      border: 1.5px solid var(--accent-gold-soft);
      border-radius: 16px;
      padding: 18px;
      margin: 16px 0;
      text-align: center;
    }
    .heart-keepsake-card p { font-family: var(--font-quotes); font-size: 1.1em; line-height: 2.08; color: var(--accent-rose-dark); margin: 0; text-align: center; }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-gem" aria-hidden="true">✦</div>
        <span id="topBarBookTitle">لأنك الله — رحلة إلى السماء السابعة</span>
      </div>
      <div class="tools">
        <button id="searchOpen" class="icon-btn" aria-label="بحث"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        <button id="tocBtn" class="icon-btn" aria-label="فهرس"><svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="18" y2="18"/></svg></button>
        <button id="bookmarkBtn" class="icon-btn" aria-label="حفظ"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
      </div>
    </header>

    <div id="runningHeader" class="running-header" hidden><span id="runningHeaderTag"></span></div>

    <main id="bookStage" class="book-stage">
      <div class="page-canvas"><article id="activePageArticle" class="page"></article></div>
    </main>

    <footer class="bottom-nav-dock">
      <button id="btnPrevPage" class="nav-btn" onclick="window.prevPage()">السابق</button>
      <span id="pageCounter" class="page-counter" dir="ltr">1 / 1</span>
      <button id="btnNextPage" class="nav-btn" onclick="window.nextPage()">التالي</button>
    </footer>
  </div>

  <div id="searchPanel" class="overlay"><div class="panel"><div class="panel-head"><h3>البحث في الكتاب</h3><button id="searchClose" class="icon-btn">✕</button></div><input id="searchInput" type="text" placeholder="ابحث عن اسم من أسماء الله، آية، أو خاطرة..."/><div id="searchResults"></div></div></div>
  <div id="tocPanel" class="overlay"><div class="panel"><div class="panel-head"><h3>فهرس أسماء الله الحسنى والفصول</h3><button id="tocClose" class="icon-btn">✕</button></div><div id="tocPanelList"></div></div></div>

  <script>
    const BOOK_DATA = {
      title: "لأنك الله",
      subtitle: "رحلة إلى السماء السابعة",
      author: "علي بن جابر الفيفي",
      pages: [
        {
          tag: "",
          title: "غلاف الكتاب",
          type: "cover",
          html: `
            <div class="cover-page">
              <svg class="cover-art-svg" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="120" cy="120" r="108" fill="var(--bg-primary)" stroke="var(--accent-gold)" stroke-width="1.8" stroke-dasharray="4 3"/>
                <circle cx="120" cy="120" r="92" fill="var(--bg-secondary)" stroke="var(--accent-rose)" stroke-width="1.5"/>

              <p>إلى التي قالت لي ذات ليلة، وأنا في السابعة من عمري: هل صليت العِشاء؟<br/>فقلت لها -كاذبًا- نعم!<br/>فنظرت إلي نظرة شكّ، وقالت: قل ما شئت .. ولكنّه قد رآك!<br/>فأفزعتني «قد رآك» هذه .. وجعلتني أنهض لأصلي .. رغم ادعائي الكاذب!<br/><strong>إلى أمّي ..</strong></p>

            <h2>مُقدِّمَة</h2>
            <p>الحمد لله والصلاة والسلام على رسول الله وصحبه ومن والاه .. وبعد:</p>
            <p>فهذه كلمات عن بعض أسماء الله، كتبتها بضعفي عن القويّ سبحانه، وبعجزي عن القدير سبحانه، وبجهلي عن العليم سبحانه .. حرصت أن أجعلها مما يفهمه متوسّط الثقافة، ويستطيع قراءته المريض على سريره، والحزين بين دموعه، والمحتاج وسط كروبه ..</p>
            <p>لديّ يقين أن تعلّق القلب بالله، وعلمه به، ومراقبته له، وحبّه وخوفه ورجاءه، كما أنّه سرّ سعادة الآخرة، فإنّه سر سعادة الدنيا كذلك، وأنّ مرحلة الأحزان والوساوس والكروب ستنتهي تمامًا إن وجّه العبد بوصلة اهتمامه إلى الذي لم يخلقه إلا لعبادته ..</p>
            <p>وباب أسماء الله الحسنى باب إيمانيّ عظيم، يدلف العبد من خلاله إلى عالم قدسي خاص، يجعل النفس تسجد تعظيمًا، والروح تتبتّل خشوعًا وحبًّا .. أردت من هذا الكتاب الدلالة على الله سبحانه، والإشارة إليهِ بالقليل مما لديهِ، وتذكير نفسي وإخواني بأنّه على كل شيء قدير، وأن فضله كبير، وأنّه سبحانه السميع البصير .. وأردت أن أربت بهذه الكلمات على أكتاف أتعبتها الأوجاع، وأمسح بها على رؤوس صدّعتها الآلام، أردت أن أواري بأحرفي الدموع، وأن أطفئ لهيب الضلوع ..</p>
            <p>إنّنا بدون معرفة أسماء الله في صحراء تائهون، تتبدد أيامنا في لهيب تلك الصحراء، ودوّامة كثبان القلق النفسي .. اختر الله: معرفة، وإيمانًا، ويقينًا، وعبادة، وخضوعًا، ثم أنسًا، وسعادة، وهناء .. أو اختر التيه، والضياع، والاختناق، والشعور بالكآبة، والتمزّق النفسي .. لا أدّعي في هذا الكتاب إحاطة ولا علمًا ولا سبقًا، الذي أدعيه هو العجز والتقصير والافتقار إلى عفوه سبحانه وتجاوزه .. فإن كان في هذا الكتاب من خير فأسأل الله أن يشيعه بين الناس، وإن كان غير ذلك فقد علم سبحانه كل التقصير الذي عندي، وقد علمتُ بعض العفو الذي عنده .. أسأل الله صلاح النيّة، وأن يغفر ما قد يندّ به القلم، أو يخطئ به الفؤاد .. وصلى الله وسلم على سيّدنا محمد .. وآخر دعوانا أن الحمد لله رب العالمين ..</p>

              <h1 class="chapter-opener">الصَّمَد</h1>
              <div class="divine-epigraph">لا يستطيع العالَم كلّه أن يمسّك بسوء لم يرده الله ..<br/>ولا يستطيع العالَم كله أن يدفع عنك سوءًا قدّره الله ..</div>
            </div>
            <p>إذا كان الضعف قد بنى حولك سجنًا ضيقًا لا تستطيع الخروج منه! إذا حاصرتك الحاجات، وداهمتك الخطوب، والتفّت من حولك الهموم، وأخذت روحك في الهرب إلى المجهول! فأنت ساعتها بحاجة إلى أن تصمد إليه .. اسم الله «الصمد» سيمدّك بكل ما تحتاجه لتكون قويًّا في هذه الحياة، وتجابه واقعك بشموخ، وتتجاوز عقدك بعزيمة! ابدأ مع الصمد عهدًا جديدًا، ثم ثق أنّ الغد سيكون أفضل من اليوم .. وبكثير!!</p>
            <h2>في ظلال الصَّمَديّة</h2>
            <p>الصمد اسم كما ترى بالغ الهيبة، قويّ الحروف، شامخ المعنى، قليل الورود والذكر، ذو جلالة خاصّة. وكأن الصمود له سبحانه أهم تجلّيات الإخلاص في العبادة، فمَن أكثرَ من استحضار معنى الإخلاص في عباداته، أكسب قلبه صفة الرضوخ إلى مولاه والصمود له وعدم الالتجاء إلاّ إليه.</p>
            <p>وها نحن ندلف إلى عالَم الصمديّة لنستلهم شيئًا من معاني الصمد: الصمد هو من تصمد إليه الخلائق، أي تلجأ إليه، هذا من أجلّ معاني هذا الاسم، لذا فسوف نُطوّف بهذا المعنى .. الصمد هو المقصود في الرغائب، المستغاث به عند المصائب، والمفزوع إليه وقت النوائب. جاء ذكره في سورة من أعظم سُوَر المصحف، ومن أقصرها، وهي سورة الإخلاص التي تعدل ثلث القرآن الكريم:</p>

            <p>المزارع إذا تأخر وقت الحصاد، وقد تعاظمت حاجته للثمر، وصار الماء شحيحًا، نظر إلى السماء وقال: يا الله! ركاب السفينة إذا تلاطمت بهم الأمواج، وزعزعت فكرة الموت طمأنينة الحياة في نفوسهم قالوا: يا الله! إذا أعلن قائد الطائرة أن عجلاتها رفضت التحرّك ولذلك فسيأخذ جولة على المطار إلى أن تُحل المشكلة، ينسى ركاب الطائرة كل الشخصيات المهمة، ولا يتذكرون إلا الذي بيده ملكوت كل شيء وهو يجير ولا يجار عليه.</p>

            <h2>أفكار الزيف</h2>
            <div class="hadith-box">
              <p>جَاءَ شَيْخٌ أَعْرَابِيٌّ اسْمُهُ الحُصَيْنُ إِلَى رَسُولِ اللهِ ﷺ، فَسَأَلَهُ النَّبِيُّ ﷺ: «كَمْ تَعْبُدُ يَا حُصَيْنُ؟» فَقَالَ: سَبْعَةٌ، سِتَّةٌ فِي الأَرْضِ وَوَاحِدٌ فِي السَّمَاءِ، فَسَأَلَهُ النَّبِيُّ ﷺ: «مَنْ لِرَهْبِكَ؟» قَالَ: الَّذِي فِي السَّمَاءِ، قَالَ: «مَنْ لِرَغْبِكَ؟» قَالَ الَّذِي فِي السَّمَاءِ، فَقَالَ لَهُ النَّبِيُّ ﷺ: «فَاتْرُكِ الَّذِينَ فِي الأَرْضِ وَاعْبُدْ الَّذِي فِي السَّمَاءِ»، فَأَسْلَمَ الحُصَيْنُ!</p>

            <p>إن الكافر وهو كافر إذا سمع القرآن يخضع .. ومن قصص السيرة الشهيرة أن رسول الله ﷺ قرأ سورة النجم على مشركي مكّة في المسجد الحرام، وما إن انتهى حتى سجدوا .. كلّهم سجدوا .. حتى أولئك الذين طردوه وآذوه وخططوا لاغتياله سجدوا! تلك الأشياء التي في خلاياهم وشرايينهم تفجّرت فيها طاقة إيمانيّة رهيبة فجعلتهم يخرّون للأذقان سجّدًا ..</p>

          html: `
            <h2>الكواكب</h2>
            <p>خلق في نفوس عباده حاجة إلى حبّه سبحانه! هناك نوع من الحب المقدّس في قلوب العباد لا يشبعه إلا الانحناء له، والطواف ببيته، والوقوف بين يديه، والقيام من النوم لأجله، وبذل المهج في سبيله. الحياة بكل تجلياتها همس يقول لك: الذي تبحث عنه على عرشه يسمعك ﴿ الرَّحْمَنُ عَلَى الْعَرْشِ اسْتَوَى ﴾ ..</p>
            <p>امرأة يخلو بها فاجر في إحدى الخلوات فيراودها عن نفسها، ولكنّها تأبى! فيقول حاثًّا لها: لا يرانا إلا الكواكب، فتردّ بشموخ: فأين مكوكبها؟ أين الله؟! إنّه قلب صامد إلى الله، يراقبه، متيقن أنّه عليم خبير سميع بصير محيط! وصمودك إليه بقلبك تماما كصمود المصلّي إلى الكعبة ليصلي إليها! هكذا يجب أن يكون القلب، يوزّع رغباته في كل الاتجاهات لكن الاتجاه الأمامي يجب أن يكون لله فقط .. ضع يمين قلبك ما شئت ويساره ما شئت، ولكن أمامه لا تضع إلا مرضاة الله، إلا مراقبة الله، إلا حب الله.</p>
            <h2>وتنساه ..</h2>
            <p>إذا بحثت عن شيء فلم تجده فدعه، وانشغل بالله. هو الذي جعل ذلك الشيء يضيع لتصمد إليه وتلتجئ، لتقول: اللهم ردّ عليّ ضالّتي، فيردّها! يريدك أن تنشغل به عن حاجتك، ولكنّك تنشغل بها، وتنساه!!</p>
            <div class="wisdom-pearl">
              ولشيخ الإسلام ابن تيمية رحمه الله كلام بالغ النفاسة في هذا المعنى، فتأمّله بقلبك، ثم اجعله بالقرب من أوجاعك، وكربك، وحاجاتك، يقول: «العبد قد تنزل به النازلة فيكون مقصوده طلب حاجته، وتفريج كرباته، فيسعى في ذلك بالسؤال والتضرع، وإن كان ذلك من العبادة والطاعة، ثم يكون في أول الأمر قصده حصول ذلك المطلوب: من الرزق والنصر والعافية مطلقا، ثم الدعاء والتضرع يفتح له من أبواب الإيمان بالله عز وجل ومعرفته ومحبته، والتنعم بذكره ودعائه، ما يكون هو أحب إليه وأعظم قدرا عنده من تلك الحاجة التي همته، وهذا من رحمة الله بعباده، يسوقهم بالحاجات الدنيوية إلى المقاصد العلية الدينية».

            <p>تنقطع الأمطار، وتصبح الدنيا قاحلة على عهد موسى عليه السلام فيخرج هو وقومه وهم آلاف من الرجال والنساء والولدان، فيرى موسى نملة خرجت رافعة يديها إلى السماء صامدة إلى ربّ السحاب، فعلم موسى أن هذا الصمود، وهذا الذل لن يعقبه إلا هطول السماء بماء منهمر، فقال لقومه: ارجعوا فقد كُفيتم، فعادوا على صوت الرعود، ورذاذ المطر! في طفولتي كنت أسمع دعاء لأحد القرّاء فيهزني: «اللهم أوقَفْنا مطايانا ببابك .. فلا تطردنا عن جنابك» هذا الإيقاف للمطايا بباب الكريم هو معنى الصمد.</p>
            <h2>اصمد إليه</h2>
            <p>يجب أن تعلم أنّه لو لم يأذن للدواء أن يؤدّي مفعوله في جسدك لما ارتفع عنك ذلك المرض، فاصمد إليه أن يشفيك .. يجب أن توقن أنّه لو لم يصرف تلك السيارة المتهوّرة عنك لكنت الآن في عداد الموتى، فاصمد إليه أن يحفظك .. يجب أن تتأكد أنّه لو لم يحطك برعايته عندما ركبت البحر، لكنت الآن طُعمًا لأسماك المحيط، فاصمد إليه أن يكون معك .. ولهذا تصمد إليه لترتاح، ليهدأ لُهاثك، لأنّك بدونه تركض وتلهث وتتوتر.</p>
            <div class="quran-box">
              <p class="quran-verse">﴿ هُوَ الَّذِي يُسَيِّرُكُمْ فِي الْبَرِّ وَالْبَحْرِ حَتَّى إِذَا كُنتُمْ فِي الْفُلْكِ وَجَرَيْنَ بِهِم بِرِيحٍ طَيِّبَةٍ وَفَرِحُوا بِهَا جَاءَتْهَا رِيحٌ عَاصِفٌ وَجَاءَهُمُ الْمَوْجُ مِن كُلِّ مَكَانٍ وَظَنُّوا أَنَّهُمْ أُحِيطَ بِهِمْ دَعَوُا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ لَئِنْ أَنجَيْتَنَا مِنْ هَذِهِ لَنَكُونَنَّ مِنَ الشَّاكِرِينَ ﴾</p>

          html: `
            <h2>البوصلة</h2>
            <p>لماذا ننتظر جائحة تردّنا إليه؟ ومصيبة تذكرنا باسمه؟ وكارثة نعود بها إلى المسجد؟ ألا يستحق أن نخضع ونلتجئ إليه دون جوائح وكوارث ومصائب؟ عدّل بوصلة قلبك باتّجاهه ثم سر إليه ولو حبوًا على ركبتيك، ستصل ﴿ فَأَيْنَمَا تُوَلُّوا فَثَمَّ وَجْهُ اللَّهِ ﴾. إذا التجأت لفلان من الناس صباحًا قد يغلق بابه دونك في المساء. إذا نصرك على زيد قد لا ينصرك على عمرو. إذا أعطاك اليوم فسوف يمنعك في الغد. أما الله .. فلا! ﴿ هُوَ الْحَيُّ لَا إِلَهَ إِلَّا هُوَ فَادْعُوهُ ﴾ يعطي بالليل والنهار، ينصرك على الجميع إن كنت مظلوما، لا يغلق بابه، يده سحاء الليل والنهار، أكرم الأكرمين، لذلك تصمد إليه كل الخلائق، فإذا جرّبت أن تصمد إلى غيره في حاجة رجعت خائبا، ولا بد!</p>
            <h2>فرّغ قلبك من غيره</h2>
            <p>دخلت قديمًا مكتب وكيل إحدى الجامعات وقد كتبت له معروضًا في شأن من شؤون دراستي، ثم شرحت له بعض التفاصيل فقال لي: لا تكثّر (هرْج)! الناس لا يريدونك أن تكثّر من الهرج! ولكن الله يحبّك إن كثّرت من الهرج بين يديه! فهو يحب العبد اللحوح في الدعاء .. فلماذا تشكو لغيره وتتركه؟ يقول النبي ﷺ لابن عباس: «إِذَا سَأَلْتَ فَاسْأَلِ اللَّهَ» مادام أن هناك حاجة تستحق السؤال؛ فليكن الله هو من تسأله! أعجبتني مقولة نقلها أبو حامد الغزالي عن أحد العارفين يقول فيها عن اسم الله الأعظم: فرّغ قلبك من غيره ثم ادعه بأي اسم يجبك .. المرض رسالة لتذلّ له .. والفقر برقيّة لتسجد له .. والضعف مكالمة تقول لك استجلب القوّة من القويّ .. الحياة كلّها تصرخ في وجهك: لديك رب، اصمد إليه! وفي حديث ابن عباس سالف الذكر يقول المصطفى ﷺ: «احْفَظِ اللَّهَ يَحْفَظْكَ احْفَظِ اللَّهَ تَجِدْهُ تُجَاهَكَ» أمامك!! احفظه في نفسك وجوارحك وخطراتك، سيكون أمامك بحفظه ومعيّته ونصرته. الصمد لا تهدأ قلوب خلقه حتى تضع زوّاداتها عند عتبة مُلكه ..</p>
            <h2>خطوات وشموخ وحقيقة</h2>
            <p>انظر في أي اتجاه شئت، ولكن اجعل في قلبك عينين لا تنظران إلاّ إلى عظمته! تحدّث بكل ما تريد، ولكن اجعل في قلبك لسانًا لا ينطق إلا بذكره! استمع إلى الجميع، ولكن اصنع في قلبك سمعًا لا يدرك إلا كلامه! امش إلى حيث شئت، ولكن احفر في قلبك خطوات نهايتها عرش الملك! اصنع منبّها وعلّقه في أعلى قلبك دقاته تقول: ماذا يريد الله؟ ماذا يريد الله؟ ماذا يريد الله؟</p>
            <p>إذا علّمت روحك الصمود إليه، فإنّها مع الزمن ستستحي أن تكثر من الطلبات الدنيويّة لأنّها ليست الحيّز الذي خلقك له، كل آمالك أُخروية .. قال الخليفة لابن عمر وهو يطوف حول الكعبة سلْني يا ابن عمر، فنظر إليك بشموخ الصامد إلى الله وقال، من أمر الدنيا أم الآخرة؟ فقال أما الآخرة فلله ولكن من شؤون الدنيا، فقال: لم أسأل الدنيا من يملكها فكيف أسألها من لا يملكها؟! وقال أمير لابن تيمية، سمعنا أنّك تريد ملكنا يا ابن تيمية! فرفع ابن تيمية رأسه بشموخ وقال: والله إن ملكك لا يساوي عندي فلسين! رجل يعرّض وجهه لله آناء الليل، كيف يذل لقطعة خزف أطراف النهار؟</p>
            <div class="heart-keepsake-card">
              <p>اللحظة التي تصمد فيها إليه لأجل حاجتك، هي نفسها اللحظة التي تصبح حاجتك ملك يمينك! لا عبور لأي رغبة إلا من طريق الله، لا وجود لأي حاجة إلا في ساحة الله، لا إمكانيّة لحدوث شيء إلا بالله، فإنّه وحده الذي لا حول في الوجود ولا قوّة إلا به. إذن فاجعل وجهك إليه، وألجئ ظهرك إليه، وفوّض أمرك إليه .. فهو الصمد الذي لم يلد ولم يولد ولم يكن له كفوا أحد .. اللهم أصمد قلوبنا إليك، واجعلنا لا نطلب غيرك ولا نسأل سواك ولا نستغيث بأحد من خلقك يا الله ..</p>
            </div>
          `

          title: "الحَفِيظ — أيها القلب اطمئنّ",
          type: "opener",
          html: `
            <div class="divine-name-opener">
              <div class="letter-envelope-header">✦ الاسم الثاني ✦</div>
              <h1 class="chapter-opener">الحَفِيظ</h1>
              <div class="divine-epigraph">نتذكر فائدة مانع الانزلاق .. وفائدة كابح السرعة ..<br/>وفائدة البالون الواقي .. وفائدة حزام الأمان .. وننسى الله!</div>
            </div>
            <p>إذا شعرت أن حياتك في خطر، أو أن المرض يهدد صحّتك، أو كان ابنك بعيدًا عنك وقد خشيت عليه من الضياع أو رفقاء السوء، أو أن مالك الذي جمعته قد بات قاب قوسين أو أدنى من التبدد والتلف فاعلم أنّك بحاجة إلى أن تعلم أن من أسماء ربّك سبحانه «الحفيظ» وأنّه ينبغي عليك أن تجدد إيمانك بهذا الاسم العظيم، وأنّه قد جاء الوقت المناسب لتتفكّر فيه وتتأمّل .. فهو وحده من يحفظ حياتك، ويحفظ صحّتك، ويحفظ أبناءك، ويحفظ مالك، ويحفظ كل شيء في هذه الحياة!</p>
            <h2>أيها القلب اطمئنّ ..</h2>
            <p>يقول الشيخ السعدي رحمه الله تعالى: «الحفيظ الذي حفظ ما خلقه، وأحاط علمه بما أوجده، وحفظ أولياءه من وقوعهم في الذنوب والهَلَكات، ولطف بهم في الحركات والسكنات». منتهى الحفظ عنده، وغاية الرعاية لديه، وأقصى الطمأنينة ستكون وأنت بمعيّته. يحفظ عبده؛ لذلك نقول دائمًا: اللهم احفظني من بين يدي ومن خلفي وعن يميني وعن شمالي ومن فوقي وأعوذ بعظمتك أن أُغتال من تحتي. إنّك تستحفظ الله جهاتك الستّ، إنّك تطلب منه هالة حفظ تحوطك من جميع الجهات، ولا يقدر على ذلك إلا هو!</p>
            <p>يحفظ سمعك وبصرك، لذلك ندعوه في الصباح والمساء أن: اللهمّ عافني في سمعي، اللهم عافني في بصري .. ستفقد الجهاز الذي تستطيع به فهم هذا العالم إن فقدت سمعك وبصرك، ستعيش في عزلة سوداء، ستخنقك الدنيا بصمتها! ﴿ قُلْ أَرَأَيْتُمْ إِنْ أَخَذَ اللَّهُ سَمْعَكُمْ وَأَبْصَارَكُمْ وَخَتَمَ عَلَى قُلُوبِكُم مَّنْ إِلَهٌ غَيْرُ اللَّهِ يَأْتِيكُم بِهِ ﴾. ويحفظ دينك، لذلك تناجيه في السجود أن: يا مقلّب القلوب والأبصار ثبّت قلبي على دينك.</p>
          `
        },

          type: "reading",
          html: `
            <h2>طرقات الزيغ!</h2>
            <p>لو لم يثبّت قلبك على دينه لتناوشتك الشبهات، وتخطّفتك الأهواء! علماء أفنوا أعمارهم بين الكتب والمحابر لم يرد الله أن يحفظ عقائدهم: فكفروا به سبحانه، وبعضهم صار مبتدعًا في الدين، وأنت بعلمك القليل ما زلت تسجد له؟ لقد حفظ الحفيظ دينك! عالم اسمه «عبد الله القصيمي» يؤلّف كتابًا يدافع فيه عن دين الله اسمه «الصراع بين الإسلام والوثنيّة» قيل عنه -مبالغة- إنّه دفع به مهر الجنّة! وأُثني عليه من منبر الحرم، ثم بعد ذلك بسنوات تطرق أصابع الزيغ قلبه – والعياذ بالله- وتبدأ الشبهات تنسج حول أفكاره بيوت الشك! ثم تغدو المسلّمات ممكنات، والحقائق آراء، وتحت تلك الشبهات ومن بين أكوام الضلال يمسك قلمه ويؤلف كتابًا يهاجم فيه الإسلام اسمه: «هذي هي الأغلال»، يقول: إن دين الله آصار وأغلال وقيود! نعوذ بالله من الخذلان! إن الحفيظ هو من يحفظ دينك، لا مجموعة المعلومات التي في رأسك! هذا «بلعام بن باعوراء» يؤتيه الله اسمه الأعظم، ليدعوه في أي وقت فيستجيب له، فلا يحول هذا الاسم العظيم بينه وبين الزيغ فيهلك في الهالكين.</p>
            <h2>وننسى الله!</h2>
            <p>يحفظ حياتك، لذلك نستودعه سبحانه أحبّتنا عندما نفارقهم ونقول: أستودعك الله الذي لا تضيع ودائعه! إذا صفعت الأمواج بعتوّها السفينة، وبلغت القلوب الحناجر، من الذي يحفظ السفينة من أن يبتلعها المحيط؟ يعلن قائد الطائرة عن وجود عطل في الطائرة فيتحوّل أولئك الذين كان كل واحد منهم في فلك يسبح إلى مخبتين، الكل يلتجئ إلى الله ويعلن توبته .. من هو الذي أصلح العطل بقدرته كي تنزل الطائرة بسلام ويخرج منها أولئك الذين حوّلهم الخوف إلى أشباح؟</p>
            <div class="poetry-stanza">
              <div class="poetry-shatr">ندعوه في البحر أن ينجي سفينتنا ••• فإن وصلنا إلى الشاطي عصيناهُ</div>
              <div class="poetry-shatr">ونركب الجوّ في أمن وفي دعة ••• فما سقطنا لأن الحافظ اللهُ</div>
            </div>
            <h2>المعقّبات وما بين القوسين</h2>
            <div class="quran-box">
              <p class="quran-verse">﴿ لَهُ مُعَقِّبَاتٌ مِّن بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِ يَحْفَظُونَهُ مِنْ أَمْرِ اللَّهِ ﴾</p>
            </div>
            <p>لأجلك أنت يأمر الحفيظ سبحانه أربعة ملائكة أن يحيطوا بك حتى يحفظوك بأمره من كل ما لم يقدّره عليك. شاهدت وبذهول المقطع الذي تظهر فيه حادثة محاولة اغتيال الشيخ عائض القرني في الفلبين، وكيف أن المجرم وجّه إلى صدر الشيخ عائض ستّ رصاصات من مسافة متر تقريبًا، ولا حائل بين الطلقات والشيخ .. ثم يخرج الشيخ من تلك المحاولة الآثمة سليمًا معافى!! وأتذكر كيف أن طلقة واحدة ومن مسافة بعيدة، أودت بحياة الرئيس الأمريكي جون كندي مع أن سيّارته كانت تتحرّك، وحوله الحرس والجنود! ثم يعلن الشيخ أنّه كان قد ذكر الله، وحصّن نفسه بالأدعية!</p>
            <p>في هذه اللحظة التي تقرأ فيها (ما بين القوسين) حفظ قلبك من التوقّف، وشرايينك من الانسداد، وعقلك من الجنون، وكليتك من الفشل، وأعصابك من التلف، ورأسك من الصداع، ومعدتك من القرحة، وأمعاءك من التهاب القولون، وأعضاءك من الشلل، وعينيك من العمى، وسمعك من الصمم، ولسانك من الخرس، كل هذا وأكثر حفظه في هذه اللحظة، ثم يستمر هذا الحفظ في اللحظة التي تليها، وهكذا .. فكم «الحمد لله» ينبغي أن نقولها في اللحظة الواحدة؟</p>
          `
        },
        {
          tag: "٢ • الحَفِيظ",
          title: "قارورة .. ويدافع عنك .. ووديان السباع",
          type: "reading",
          html: `
            <h2>قارورة .. وأعظم وأكثر وأكبر</h2>
            <p>أربعة من الأصدقاء ذهبوا إلى مكان يبعد عن تبوك ستين كيلًا اسمه «نعمة ريط» ثم هبطوا الساعة التاسعة صباحًا سائرين على أقدامهم إلى مكان يُسمّى الشق! والشق هذا شرخ عظيم في قشرة الأرض، الهبوط إليه مغامرة، بل مجازفة بالحياة! وصلوا إلى القاع في نصف ساعة تقريبًا، ثم مكثوا إلى قريب من المغرب في محاولة الصعود إلى السطح! تعبوا، تشققت أرجلهم، أُنهكوا تمامًا، بلغ بهم العطش مبلغًا عظيمًا، باختصار: رأوا الموت!! كانت قلوبهم معلّقة بالله، يقول أحدهم إنّه دعا الله بإلحاح وقد بلغ به العطش حدّ تمنّي الموت، فإذا به، وفي مكان لا يمكن أن يكون قد وطئته قدم إنسان في القريب على الأقل يرى قارورة ماء صحّة! نظيفة، فلم يفرح بالماء الذي تقاسمه مع رفاقه، بل فرح بالله الذي كان معه في تلك اللحظة، علم أن الله الذي أوجد تلك القارورة في تلك اللحظة سينقذهم من تلك الرحلة المميتة.</p>
            <div class="poetry-stanza">
              <div class="poetry-shatr">سهرت أعين ونامت عيونُ ••• في شؤون تكون أو لا تكونُ</div>
              <div class="poetry-shatr">إن ربًا كفاك ما كان بالأمس ••• سيكفيك في غد ما يكونُ</div>
            </div>
            <p>ولاسم الحفيظ مع كل مخلوق قصّة، فهو لا يخلق خلقه ثم يتركهم، بل يمدّهم بالسلاح الذي يواجهون به مفاجآت الحياة: فهو يحفظ بعض الحيوانات بقدرتها على الجري السريع كالغزال والأرنب .. ويحفظ بعضها بقرون تبقر بها بطن من يقترب منها بسوء مثل وحيد القرن والجاموس .. ويحفظ بعضها بضخامة الجثّة كالفيل والدب .. وبعضها بصعقة كهربائية مثل فانوس البحر! وبعضها بسموم كالثعابين والعقارب! ويحفظ الحرباء بأن جعلها تستطيع أن تغيّر لونها عند الحاجة!</p>
            <h2>يدافع عنك .. ووديان السباع</h2>
            <p>ومن صور حفظ الله أنّه سبحانه يدافع عن المؤمنين: ﴿ إِنَّ اللَّهَ يُدَافِعُ عَنِ الَّذِينَ آمَنُوا ﴾ .. وفي الحديث القدسي: «مَنْ عَادَى لِي وَلِيًّا فَقَدْ آذَنْتُهُ بِالحَرْبِ»! يتجمّع مشركو قريش حول غار فيه رجلان: محمد ﷺ وأبو بكر الصديق رضي الله عنه .. فيتسلل الخوف إلى فؤاد أبي بكر، فينظر إليه صاحبه العظيم ويقول: ما ظنّك باثنين، الله ثالثهما؟ وها هم فتية الكهف يلتجئون إليه فيلقي عليهم أحد جنوده، إنّه جندي الرعب!! ﴿ لَوِ اطَّلَعْتَ عَلَيْهِمْ لَوَلَّيْتَ مِنْهُمْ فِرَارًا وَلَمُلِئْتَ مِنْهُمْ رُعْبًا ﴾.</p>
            <p>من يقرأ قصّة الشيخ عبد الرحمن السميط رحمه الله في سفره إلى أفريقيا للدعوة ونشر الدين وكيف أنّه خاض المستنقعات والوديان الموحشة في مجاهل القارة السوداء، وجاع وعطش ومرض، ومع ذلك لم يمسسه سوء، بل ظل خمسًا وعشرين سنة في طريقه اللاحب الذي اختاره لنفسه، ثم مات في الكويت على السرير! وذكر البعض أن سعيد بن جبير أمسك به جنديان من جند الحجاج، فتركاه في الأسفل عند صومعة راهب وصعدا، فإذا بأسد يقترب من سعيد فلا يحرّك سعيد ساكنًا بل يظلّ في عالم من الذكر دافئ، فيقترب الأسد أكثر، ثم يصل إلى سعيد وكأنّه يهمس له همسا ثم ينصرف!</p>
            <h2>أنا الفقير .. يا غلام .. اختناق</h2>
            <p>شاهدت في مقطع مروّع عبر اليوتيوب أحدهم يمرّ من على سكّة الحديد مشيًا، فجأة تعْلَق رجله بين حديد السكّة، والقطار مقبل بسرعة جبّارة، ولمّا تكون المسافة بينه وبين القطار أمتارا يأذن الله لحديد السكّة أن يفسح لرجله المجال فتخرج وينتقل إلى الجهة الأخرى في ومضة! ونبيّ الله لوط عليه السلام يقول بكل ضعف: ﴿ لَوْ أَنَّ لِي بِكُمْ قُوَّةً أَوْ آوِي إِلَى رُكْنٍ شَدِيدٍ ﴾ قال نبيّنا عليه الصلاة والسلام: «يَرْحَمُ اللَّهُ لُوطًا، لَقَدْ كَانَ يَأْوِي إِلَى رُكْنٍ شَدِيدٍ».</p>
            <p>ويقال إن لصًّا دخل إلى بيت، فحمل الطفل ونقله إلى غرفة أخرى فصرخ الطفل فاستيقظ الوالدان وخرجا يبحثان عنه، واستغل اللص تلك اللحظة ودخل غرفة الأبوين لسرقتها، فجأة انهار سقف الغرفة ودفن اللص! إنّه الحفيظ الذي يحفظ عباده حتى بأعدائهم! أعد وتأمّل حديث: «يَا غُلَامُ، إِنِّي أُعَلِّمُكَ كَلِمَاتٍ: احْفَظِ اللَّهَ يَحْفَظْكَ، احْفَظِ اللَّهَ تَجِدْهُ تُجَاهَكَ، تَعَرَّفْ إِلَى اللَّهِ فِي الرَّخَاءِ يَعْرِفْكَ فِي الشِّدَّةِ».</p>
            <div class="heart-keepsake-card">
              <p>كلّنا في هذه الحياة ذو النون، والحياة قد التأمت علينا بكروبها، ولن ينجينا منها إلا: «لا إله إلا أنت سبحانك، إني كنت من الظالمين» .. اللهم احفظنا بحفظك، واكلأنا برعايتك، واجعل من بين أيدينا ومن خلفنا وعن أيماننا وعن شمائلنا ومن فوقنا ومن تحتنا حفظًا منك تنجينا به مما نخشى ونحاذر ..</p>
            </div>

            <h2>نسيم اللطف</h2>
            <p>إذا أراد اللطيف أن ينصرك أمر ما لا يكون سببًا في العادة فكان أعظم الأسباب! وإذا أراد اللطيف أن يكرمك جعل من لا ترجو الخير منه هو سبب أعظم العطايا التي تنالك! وإذا أراد اللطيف أن يعصمك من معصية جعلك تبغضها، أو جعلها صعبة المنال منك، أو أوحشك منها، أو جعلك تقدم عليها فيعرض لك عارض يصرفك به عنها!</p>

            <h2>الخفايا والخبايا والأحلام البعيدة</h2>

            <p>مهما تباعدت أحلامك وصار بينك وبينها مفاوز شاسعة فاللطيف يأتي بها: ﴿ يَا بُنَيَّ إِنَّهَا إِن تَكُ مِثْقَالَ حَبَّةٍ مِّنْ خَرْدَلٍ فَتَكُن فِي صَخْرَةٍ أَوْ فِي السَّمَاوَاتِ أَوْ فِي الْأَرْضِ يَأْتِ بِهَا اللَّهُ إِنَّ اللَّهَ لَطِيفٌ خَبِيرٌ ﴾. يصل صاحبي في رحلة شاقة من تبوك إلى حدود الأردن لحضور محاضرات في جامعة مؤتة، وفي الحدود يتذكر أن جواز سفره في بيته! يتكدّر ويقرر العودة، وفي الغد يقرأ في الصحف عن أعمال شغب في جامعة مؤتة أسفرت عن جرحى! اللطيف أنساه الجواز، حتى لا يرى الدم، أو حتى لا يصبح الصباح وهو في المستشفى!</p>

            </div>
          `

              <h1 class="chapter-opener">الوَكِيل</h1>
              <div class="divine-epigraph">أمانيك مع الله حقائق .. تطلّعاتك واقع معاش ..<br/>رغباتك ستُهدى إليك .. أشواقك ستهبّ عليك .. فقط تذكّر: ﴿ وَتَوَكَّلْ عَلَى الْعَزِيزِ الرَّحِيمِ ﴾</div>
            </div>
            <p>الوكيل سبحانه هو الكفيل بأرزاق عباده، القائم بمصالحهم، الحافظ لشؤونهم؛ فإذا فوضتَ أمرك إليه تولّاك بعنايته، وكفاك ما أهمّك، وفتح لك الأبواب المغلقة من حيث لا تحتسب.</p>
            <h2>فاتخذه وكيلا ..</h2>
            <div class="quran-box">
              <p class="quran-verse">﴿ رَّبُّ الْمَشْرِقِ وَالْمَغْرِبِ لَا إِلَٰهَ إِلَّا هُوَ فَاتَّخِذْهُ وَكِيلًا ﴾</p>
            </div>
            <p>إذا كان ربّ المشرق والمغرب هو وكيلك، فمَن ذا الذي يقدر على كيدك أو حرمانك؟ تأمّل كيف جمع الله في آيةٍ أخرى بين العزّة والرحمة ليطمئن قلب المتوكل: ﴿ وَتَوَكَّلْ عَلَى الْعَزِيزِ الرَّحِيمِ * الَّذِي يَرَاكَ حِينَ تَقُومُ * وَتَقَلُّبَكَ فِي السَّاجِدِينَ ﴾؛ فهو عزيزٌ لا يُغلب، رحيمٌ لا يخذل من لجأ إليه.</p>
            <h2>خطّة سنويّة .. وانكسر له</h2>
            <p>نحن نتوكل على الله في طلب الرزق ودفع البلاء، لكنّ أعظم التوكل ما أشار إليه شيخ الإسلام ابن تيمية وتلميذه ابن القيم في سرّ اقتران العبادة بالاستعانة في قوله تعالى: ﴿ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ﴾؛ فإياك نعبد تدفع الرياء، وإياك نستعين تدفع الكبر، ولا قيام لك بطاعةٍ ولا ثبات على هدى إلا إذا توكلتَ على الله واستعنتَ به وقلتَ في دبر كل صلاة: «اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ».</p>
            <p>سافر شابٌّ للدراسة في الخارج، وكانت أمه الصالحة تودعه عند الباب وهي تقول بدموع التوكل: «اللهم إني أستودعك دين ابني وقلبه وعفته، وأتخذك عليه وكيلًا». وفي الغربة تعرض الشاب لفتنٍ عظيمةٍ كادت تعصف به، فكان في كل مرةٍ يجد حاجزًا خفيًّا يصرفه عن الحرام ويعيده إلى رشده، حتى رجع إلى أمه حافظًا لدينه، متفوقًا في علمه، ببركة توكل أمه وانكسارها للوكيل سبحانه.</p>
            <h2>الدموع المبتسمة!</h2>
            <div class="quran-box">
              <p class="quran-verse">﴿ وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ وَسَبِّحْ بِحَمْدِهِ ﴾</p>
            </div>

          `

            <p>حين ينكسر زجاجٌ بين يديك يعجز البشر عن إعادته كما كان، أمّا القلوب المهشّمة بمرارة الفقد أو خذلان الأحبة أو قسوة الظلم، فإذا عُرضت على الجبّار سبحانه أعاد صياغتها أقوى وأصفى وأجمل مما كانت! لذلك شرع الله لنا أن نقول في أخصّ لحظات القرب بين السجدتين: «اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَعَافِنِي، وَاهْدِنِي، وَارْزُقْنِي، وَاجْبُرْنِي».</p>

              <div class="divine-epigraph">قال لي صديقي مرّة قبل أن يخرج من زيارتي في غرفتي بإسكان الجامعة:<br/>اكتب لي في هذه الورقة كلمة لأقرأها وأنا عائد إلى غرفتي، فكتبت له: «إنّه يراك الآن» .. أخبرني فيما بعد أنّه فُجع بها!!</div>

            <h2>يا الله! .. ومن أجلك</h2>
            <div class="hadith-box">
              <p>قال رسول الله ﷺ لأصحابه حين رفعوا أصواتهم بالتكبير: «يَا أَيُّهَا النَّاسُ، ارْبَعُوا عَلَى أَنْفُسِكُمْ، فَإِنَّكُمْ لَا تَدْعُونَ أَصَمَّ وَلَا غَائِبًا، إِنَّكُمْ تَدْعُونَ سَمِيعًا قَرِيبًا، وَهُوَ مَعَكُمْ».</p>
            </div>
            <p>يروي المؤلف كيف داهمه ألمٌ شديدٌ في أذنه وهو في المسجد، فوضع يده عليها وناجى ربه القريب همسًا، فزال الألم في التوّ واللحظة! وتأمّل مشاعر أُبيّ بن كعب رضي الله عنه حين قال له النبي ﷺ: «إِنَّ اللَّهَ أَمَرَنِي أَنْ أَقْرَأَ عَلَيْكَ الْقُرْآنَ»، فقال أُبيّ والدموع تملأ عينيه: «آللَّهُ سَمَّانِي لَكَ؟»، قال: «نَعَمْ»، فبكى أُبيّ شوقًا وإجلالًا لقرب ربه العظيم من عبده!</p>
            <h2>دبيب النملة .. ويراك الآن! .. وابتسم</h2>
            <p>سبحان من يبصر دبيب النملة السوداء، على الصخرة الصمّاء، في الليلة الظلماء! وسبحان من سمع شكوى خولة بنت ثعلبة من فوق سبع سماوات وهي تهمس للنبي ﷺ في طرف الحجرة، وعائشة رضي الله عنها في الحجرة نفسها يخفى عليها بعض كلامها، فأنزل الله: ﴿ قَدْ سَمِعَ اللَّهُ قَوْلَ الَّتِي تُجَادِلُكَ فِي زَوْجِهَا وَتَشْتَكِي إِلَى اللَّهِ وَاللَّهُ يَسْمَعُ تَحَاوُرَكُمَا ﴾. ولما اعترض قاطع طريقٍ أحد الصالحين ليقتله، استأذنه أن يصلي ركعتين، فقرأ في صلاته: ﴿ أَمَّن يُجِيبُ الْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ السُّوءَ ﴾، فجاء فارسٌ فأنقذه في الحال! وكذا سمع القريب نداء يونس عليه السلام في الظلمات الثلاث: ﴿ لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ ﴾. وفي الحديث القدسي الجليل: «أَنَا عِنْدَ ظَنِّ عَبْدِي بِي، وَأَنَا مَعَهُ إِذَا ذَكَرَنِي، فَإِنْ ذَكَرَنِي فِي نَفْسِهِ ذَكَرْتُهُ فِي نَفْسِي، وَإِنْ ذَكَرَنِي فِي مَلَإٍ ذَكَرْتُهُ فِي مَلَإٍ خَيْرٍ مِنْهُمْ، وَإِنْ تَقَرَّبَ إِلَيَّ شِبْرًا تَقَرَّبْتُ إِلَيْهِ ذِرَاعًا، وَإِنْ تَقَرَّبَ إِلَيَّ ذِرَاعًا تَقَرَّبْتُ إِلَيْهِ بَاعًا، وَإِنْ أَتَانِي يَمْشِي أَتَيْتُهُ هَرْوَلَةً».</p>

          type: "reading",
          html: `
            <h2>وصلت إليه .. وإذا سألوك</h2>
            <p>سُئل طفلٌ نابغٌ: «كيف تصل إلى الله؟»، فأجاب بكلمةٍ تكتب بماء الذهب: «إذا تفكّرتَ في مخلوقاته وصلتَ إليه!». وتأمّل كيف جاءت كلّ أسئلة القرآن بلفظ «يسألونك .. فقل»، إلا سؤال القرب والدعاء فقد تولّى الله الجواب عنه بنفسه دون واسطةٍ ليُشعرك بكمال القرب:</p>
            <div class="quran-box">
              <p class="quran-verse">﴿ وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ فَلْيَسْتَجِيبُوا لِي وَلْيُؤْمِنُوا بِي لَعَلَّهُمْ يَرْشُدُونَ ﴾</p>

            <h2>من بين الأدخنة .. ومراتب القرب الثلاث</h2>
            <p>حين تشتدّ المحن وتدلهمّ الخطوب ويتصاعد دخان الكرب، تذكّر مراتب القرب الثلاث في كتاب الله: قرب الإجابة: ﴿ إِنَّهُ سَمِيعٌ قَرِيبٌ ﴾، وقرب الرحمة: ﴿ إِنَّ رَحْمَتَ اللَّهِ قَرِيبٌ مِّنَ الْمُحْسِنِينَ ﴾، وقرب النصر والفرج: ﴿ أَلَا إِنَّ نَصْرَ اللَّهِ قَرِيبٌ ﴾.</p>

            <p>وهنا تحطّ رحلتنا رحالها بعد أن حلّقنا في رحاب عشرةٍ من أسماء الله الحسنى: <strong>الصّمد، الحفيظ، اللطيف، الشافي، الوكيل، الشكور، الجبّار، الهادي، الغفور، القريب</strong>. وما هذه الصفحات إلا قبساتٌ يسيرةٌ تدعوك لأن تعيش مع الله بقلبك، فتصمد إليه في حاجاتك، وتستحفظه دينك وأهلك، وتستشعر لطفه في أقداره، وتطلب الشفاء منه، وتتوكل عليه، وتشكره ليزيدك، وتجبر به كسرك، وتستهديه صراطه، وتستغفره لذنبك، وتأنس بقربه في كلّ حين.</p>

    (function() {
      const STORAGE_KEY_PAGE = "maktabati_lianaka_allah_page_v4";
      const STORAGE_KEY_BOOKMARKS = "maktabati_lianaka_allah_bookmarks_v4";

      let currentPage = 0;
      let bookmarks = [];

      const activePageArticle = document.getElementById("activePageArticle");
      const runningHeader = document.getElementById("runningHeader");
      const runningHeaderTag = document.getElementById("runningHeaderTag");
      const pageCounter = document.getElementById("pageCounter");
      const btnPrevPage = document.getElementById("btnPrevPage");
      const btnNextPage = document.getElementById("btnNextPage");
      const bookmarkBtn = document.getElementById("bookmarkBtn");
      const searchOpen = document.getElementById("searchOpen");
      const searchClose = document.getElementById("searchClose");
      const searchPanel = document.getElementById("searchPanel");
      const searchInput = document.getElementById("searchInput");
      const searchResults = document.getElementById("searchResults");
      const tocBtn = document.getElementById("tocBtn");
      const tocClose = document.getElementById("tocClose");
      const tocPanel = document.getElementById("tocPanel");
      const tocPanelList = document.getElementById("tocPanelList");

      function normalizeArabic(text) {
        if (!text) return "";
        return text
          .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, "")
          .replace(/[أإآٱ]/g, "ا")
          .replace(/ة/g, "ه")
          .replace(/ى/g, "ي");
      }

      function loadState() {
        try {
          const saved = parseInt(localStorage.getItem(STORAGE_KEY_PAGE), 10);
          if (!isNaN(saved) && saved >= 0 && saved < BOOK_DATA.pages.length) {
            currentPage = saved;
          }
          const savedBm = JSON.parse(localStorage.getItem(STORAGE_KEY_BOOKMARKS) || "[]");
          if (Array.isArray(savedBm)) bookmarks = savedBm;
        } catch (e) {}
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY_PAGE, String(currentPage));
          localStorage.setItem(STORAGE_KEY_BOOKMARKS, JSON.stringify(bookmarks));
        } catch (e) {}
        try {
          const total = BOOK_DATA.pages.length;
          const progress = total > 1 ? Math.round((currentPage / (total - 1)) * 100) : 100;
          if (window.MaktabatiBridge && typeof window.MaktabatiBridge.onPageChanged === "function") {
            window.MaktabatiBridge.onPageChanged(currentPage + 1, total, progress);
          }
        } catch (e) {}
      }

      function renderPage(idx) {
        if (idx < 0 || idx >= BOOK_DATA.pages.length) return;
        currentPage = idx;
        const p = BOOK_DATA.pages[idx];
        activePageArticle.innerHTML = p.html || "";

        if (p.tag && p.type !== "cover") {
          runningHeaderTag.textContent = p.tag + " — " + p.title;
          runningHeader.hidden = false;
        } else {
          runningHeader.hidden = true;
        }

        const total = BOOK_DATA.pages.length;
        pageCounter.textContent = (idx + 1) + " / " + total;
        btnPrevPage.disabled = idx === 0;
        btnNextPage.disabled = idx === total - 1;
        bookmarkBtn.classList.toggle("active", bookmarks.includes(idx));

        buildToc();
        const stage = document.getElementById("bookStage");
        if (stage) stage.scrollTop = 0;
        window.scrollTo(0, 0);
        saveState();
      }

      function buildToc() {
        tocPanelList.innerHTML = "";
        BOOK_DATA.pages.forEach((p, idx) => {
          const item = document.createElement("div");
          item.className = "toc-item" + (idx === currentPage ? " active" : "");
          item.innerHTML = "<strong>" + (p.tag ? p.tag + " • " : "") + p.title + "</strong><span>صفحة " + (idx + 1) + "</span>";
          item.addEventListener("click", () => {
            tocPanel.classList.remove("open");
            renderPage(idx);
          });
          tocPanelList.appendChild(item);
        });
      }

      function runSearch(q) {
        searchResults.innerHTML = "";
        const normQ = normalizeArabic(q.trim());
        if (normQ.length < 2) return;
        const tmp = document.createElement("div");
        BOOK_DATA.pages.forEach((p, idx) => {
          tmp.innerHTML = p.html || "";
          const raw = tmp.textContent || "";
          const normRaw = normalizeArabic(raw);
          const pos = normRaw.indexOf(normQ);
          if (pos !== -1 || normalizeArabic(p.title).includes(normQ)) {
            const start = Math.max(0, pos - 40);
            const snippet = raw.substring(start, start + 120).trim();
            const item = document.createElement("div");
            item.className = "search-item";
            item.innerHTML = "<strong>" + (p.tag ? p.tag + " — " : "") + p.title + " (ص " + (idx + 1) + ")</strong><p>…" + snippet + "…</p>";
            item.addEventListener("click", () => {
              searchPanel.classList.remove("open");
              renderPage(idx);
            });
            searchResults.appendChild(item);
          }
        });
      }

      window.goToPage = function(idx) { renderPage(idx); };
      window.nextPage = function() { if (currentPage < BOOK_DATA.pages.length - 1) renderPage(currentPage + 1); };
      window.prevPage = function() { if (currentPage > 0) renderPage(currentPage - 1); };

      searchOpen.addEventListener("click", () => {
        searchPanel.classList.add("open");
        setTimeout(() => searchInput.focus(), 100);
      });
      searchClose.addEventListener("click", () => searchPanel.classList.remove("open"));
      tocBtn.addEventListener("click", () => tocPanel.classList.add("open"));
      tocClose.addEventListener("click", () => tocPanel.classList.remove("open"));
      bookmarkBtn.addEventListener("click", () => {
        const i = bookmarks.indexOf(currentPage);
        if (i === -1) bookmarks.push(currentPage);
        else bookmarks.splice(i, 1);
        bookmarkBtn.classList.toggle("active", bookmarks.includes(currentPage));
        saveState();
      });
      searchInput.addEventListener("input", (e) => runSearch(e.target.value));

      loadState();
      renderPage(currentPage);
    })();
  </script>
</body>
