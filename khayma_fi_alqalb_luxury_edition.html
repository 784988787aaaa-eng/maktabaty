<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9E3B5A">
<meta name="author" content="إصدارات مكتبتي الفاخرة — حواريّةٌ في بناءِ الذات">
<meta name="description" content="رحلةُ فتاةٍ من ركامِ الصراخ إلى سكينةِ البناء — طبعةٌ رقميةٌ تفاعليةٌ فاخرة">
<title>خَيْمَةٌ فِي القَلْب — رحلةُ فتاةٍ من ركامِ الصراخ إلى سكينةِ البناء</title>
<style>
:root {
  --bg-primary: #FAF2EE;
  --bg-secondary: #FFFDFC;
  --bg-soft-rose: #F6E4E9;
  --bg-pearl-gold: #FBF4E8;
  --accent-rose: #9E3B5A;
  --accent-rose-light: #C86D88;
  --accent-gold: #C49148;
  --accent-gold-soft: rgba(196, 145, 72, 0.24);
  --text-primary: #2D1A22;
  --text-secondary: #6F4E5B;
  --line: rgba(158, 59, 90, 0.16);
  --shadow-card: 0 12px 34px rgba(74, 21, 40, 0.08);
  --reader-font: 21px;
  --reader-family: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", Georgia, serif;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--reader-family);
}
.app {
  height: 100vh;
  max-height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: radial-gradient(circle at top right, var(--bg-soft-rose), var(--bg-primary) 62%);
}
.top-bar {
  height: 56px;
  min-height: 56px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-secondary);
  gap: 8px;
  z-index: 4;
  box-shadow: 0 2px 12px rgba(0,0,0,0.03);
}
.brand {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  font-weight: 800;
  color: var(--accent-rose);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-gem {
  color: var(--accent-gold);
  font-size: 16px;
}
.tools {
  display: flex;
  align-items: center;
  gap: 6px;
}
.icon-btn, .nav-btn {
  border: 1px solid var(--line);
  background: var(--bg-primary);
  color: var(--text-primary);
  border-radius: 12px;
  min-width: 38px;
  min-height: 38px;
  padding: 6px 10px;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
}
.icon-btn:active, .nav-btn:active {
  transform: scale(0.96);
}
.icon-btn.bookmarked {
  background: var(--bg-soft-rose);
  color: var(--accent-rose);
  border-color: var(--accent-rose);
}
.book-stage {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: clamp(12px, 3.2vw, 24px) 14px 16px;
  display: flex;
  justify-content: center;
  scrollbar-width: thin;
}
.page-canvas {
  width: 100%;
  max-width: 660px;
  min-height: 100%;
  margin: auto;
  background: var(--bg-secondary);
  border: 1px solid var(--accent-gold-soft);
  border-radius: 22px;
  padding: clamp(18px, 4vw, 30px) clamp(16px, 4.2vw, 28px) 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.page-canvas::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px dashed var(--accent-gold-soft);
  border-radius: 16px;
  pointer-events: none;
}
.page {
  position: relative;
  z-index: 1;
  animation: appear 0.22s ease both;
  font-size: var(--reader-font);
  line-height: 1.92;
  overflow-wrap: anywhere;
}
@keyframes appear {
  from { opacity: 0.35; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}
.eyebrow {
  display: inline-block;
  color: var(--accent-rose);
  background: var(--bg-soft-rose);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 3px 14px;
  font-size: 0.64em;
  letter-spacing: 0.04em;
  font-weight: 700;
  margin-bottom: 14px;
}
h1, h2, h3, p {
  margin-top: 0;
}
h1 {
  font-size: 1.58em;
  line-height: 1.5;
  color: var(--accent-rose);
  margin-bottom: 14px;
}
h2 {
  font-size: 1.16em;
  line-height: 1.6;
  color: var(--accent-rose);
  margin-bottom: 16px;
}
h3 {
  font-size: 1em;
  color: var(--accent-gold);
  margin: 18px 0 8px;
}
p {
  margin: 0 0 0.95em;
  white-space: normal;
  text-align: justify;
}
.cover-page {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 64vh;
  padding: 24px 16px;
  background: radial-gradient(ellipse at center, var(--bg-secondary) 0%, var(--bg-soft-rose) 100%);
  border-radius: 16px;
}
.cover-page p {
  text-align: center;
}
.cover-crest {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: var(--bg-secondary);
  border: 1.5px solid var(--accent-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  box-shadow: 0 6px 18px rgba(196, 145, 72, 0.18);
}
.cover-page h1 {
  font-size: 2.05em;
  color: var(--accent-rose);
  margin-bottom: 10px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.cover-page .subtitle {
  font-size: 0.96em;
  color: var(--text-secondary);
  max-width: 90%;
  line-height: 1.75;
  margin: 4px auto 18px;
}
.ornament {
  color: var(--accent-gold);
  letter-spacing: 0.35em;
  font-size: 0.85em;
  margin: 14px 0;
  text-align: center;
}
.author {
  font-size: 0.78em;
  color: var(--text-secondary);
  margin: 8px 0 22px;
}
.primary-btn {
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 99px;
  background: linear-gradient(135deg, var(--accent-rose), #7A2440);
  color: #FFFFFF;
  padding: 11px 28px;
  font: inherit;
  font-size: 0.82em;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 22px rgba(158, 59, 90, 0.28);
}
.dedication {
  text-align: center;
  padding: 12px 6px;
}
.dedication p {
  text-align: center;
  font-size: 1.04em;
  line-height: 2;
  margin-bottom: 1.2em;
}
.quote-card {
  border-inline-start: 4px solid var(--accent-gold);
  padding: 18px 20px;
  background: linear-gradient(135deg, var(--bg-pearl-gold), var(--bg-secondary));
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.04);
  margin: 10px 0;
}
.quote-text {
  font-size: 1.12em;
  line-height: 2;
  color: var(--text-primary);
  text-align: center;
}
.quote-caption {
  color: var(--accent-rose);
  font-size: 0.74em;
  font-weight: 700;
  margin-top: 14px;
  text-align: center;
}
.opener {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60dvh;
  padding: 18px 10px;
}
.chapter-number {
  display: inline-block;
  color: var(--accent-gold);
  background: var(--bg-pearl-gold);
  border: 1px solid var(--accent-gold-soft);
  border-radius: 99px;
  padding: 4px 18px;
  font-size: 0.74em;
  font-weight: 700;
  margin-bottom: 14px;
}
.reading-header {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.reading .chapter-tag {
  font-size: 0.64em;
  font-weight: 700;
  color: var(--accent-gold);
  display: flex;
  align-items: center;
  gap: 6px;
}
.reading .section-title {
  font-size: 1.08em;
  color: var(--accent-rose);
  margin: 0;
  line-height: 1.5;
}
.pullquote, .wisdom-pearl {
  border-inline-start: 3.5px solid var(--accent-gold);
  border-top: 1px solid var(--accent-gold-soft);
  border-bottom: 1px solid var(--accent-gold-soft);
  border-inline-end: 1px solid var(--accent-gold-soft);
  padding: 12px 16px;
  margin: 14px 0;
  background: var(--bg-pearl-gold);
  border-radius: 14px;
  font-size: 0.92em;
  line-height: 1.85;
}
.wisdom-badge {
  display: inline-block;
  font-size: 0.72em;
  font-weight: 800;
  color: var(--accent-gold);
  margin-bottom: 4px;
}
.manal-voice {
  border-inline-start: 3.5px solid var(--accent-rose);
  padding: 13px 16px;
  margin: 14px 0;
  background: var(--bg-soft-rose);
  border-radius: 14px;
  font-size: 0.94em;
  line-height: 1.9;
}
.manal-badge {
  display: inline-block;
  font-size: 0.72em;
  font-weight: 800;
  color: var(--accent-rose);
  margin-bottom: 4px;
}
.toc-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toc-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: start;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 14px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font: inherit;
  font-size: 0.78em;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.15s;
}
.toc-item.toc-chapter {
  background: var(--bg-soft-rose);
  border-color: var(--accent-rose-light);
  font-weight: 700;
  color: var(--accent-rose);
}
.toc-item small {
  color: var(--accent-gold);
  font-weight: 700;
  white-space: nowrap;
  background: var(--bg-secondary);
  padding: 2px 8px;
  border-radius: 99px;
  border: 1px solid var(--accent-gold-soft);
}
.closing {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60dvh;
}
.closing p {
  text-align: center;
}
.bottom-nav-dock {
  min-height: 64px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 14px calc(env(safe-area-inset-bottom, 12px) + 8px);
  background: var(--bg-secondary);
  border-top: 1px solid var(--line);
  z-index: 4;
}
.nav-btn {
  font-size: 13px;
  font-weight: 700;
  min-width: 88px;
  background: var(--bg-soft-rose);
  color: var(--accent-rose);
  border-color: var(--line);
}
.nav-btn:disabled {
  opacity: 0.32;
  cursor: default;
}
.page-counter {
  font: 700 12.5px system-ui, sans-serif;
  color: var(--text-secondary);
  background: var(--bg-primary);
  padding: 5px 14px;
  border-radius: 99px;
  border: 1px solid var(--line);
  white-space: nowrap;
}
.progress {
  height: 3px;
  background: var(--line);
  position: absolute;
  bottom: 0;
  inset-inline: 0;
}
.progress span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--accent-gold), var(--accent-rose));
  width: 0;
  transition: width 0.22s ease;
}
.overlay {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  inset: 0;
  background: rgba(26, 14, 20, 0.62);
  z-index: 20;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.overlay.open {
  display: flex;
}
.panel {
  background: var(--bg-secondary);
  color: var(--text-primary);
  width: 100%;
  max-width: 650px;
  max-height: 84vh;
  overflow: auto;
  border-radius: 24px 24px 0 0;
  border-top: 2px solid var(--accent-gold);
  padding: 20px 18px calc(env(safe-area-inset-bottom, 12px) + 18px);
  box-shadow: 0 -12px 40px rgba(0,0,0,0.22);
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.panel h2 {
  margin: 0;
  font-size: 18px;
}
.field {
  display: block;
  margin: 14px 0;
  font-size: 14px;
  font-weight: 600;
}
.field input, .field select {
  display: block;
  width: 100%;
  margin-top: 7px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font: inherit;
}
.theme-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.theme-btn {
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font: inherit;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
}
.theme-btn.active {
  border-color: var(--accent-rose);
  background: var(--bg-soft-rose);
  color: var(--accent-rose);
}
.search-result {
  padding: 12px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  font-size: 14px;
  border-radius: 10px;
}
.search-result:hover {
  background: var(--bg-primary);
}
.search-result small {
  display: block;
  color: var(--text-secondary);
  margin-top: 4px;
  line-height: 1.6;
}
.empty {
  color: var(--text-secondary);
  font-size: 14px;
  text-align: center;
  padding: 20px 0;
}
@media(min-width: 700px) {
  .book-stage { padding-top: 24px; }
  .bottom-nav-dock { justify-content: center; gap: 28px; }
  .panel { border-radius: 22px; margin-bottom: 24px; }
}
@media(prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top-bar">
    <div class="brand"><span class="brand-gem">✿</span><span>خيمةٌ في القلب</span></div>
    <div class="tools">
      <button class="icon-btn" id="searchOpen" aria-label="بحث">⌕</button>
      <button class="icon-btn" id="tocOpen" aria-label="الفهرس">☷</button>
      <button class="icon-btn" id="settingsOpen" aria-label="إعدادات القراءة">Aa</button>
      <button class="icon-btn" id="bookmarkBtn" aria-label="علامة مرجعية">☆</button>
    </div>
  </header>
  <main class="book-stage" id="bookStage">
    <div class="page-canvas" id="pageCanvas">
      <article class="page cover-page">
        <div class="cover-crest">
          <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
            <path d="M24 6C27 14 34 19 42 22C34 25 27 30 24 38C21 30 14 25 6 22C14 19 21 14 24 6Z" stroke="#C49148" stroke-width="2" fill="rgba(158,59,90,0.12)"/>
            <circle cx="24" cy="22" r="4" fill="#9E3B5A"/>
          </svg>
        </div>
        <div class="eyebrow">✿ رحلةٌ إلى السكينةِ وبناءِ الذات ✿</div>
        <h1>خَيْمَةٌ فِي القَلْب</h1>
        <p class="subtitle">رحلةُ فتاةٍ من ركامِ الصراخ إلى سكينةِ البناء</p>
        <div class="ornament">✦ ❀ ✦</div>
        <p class="author">حواريّةٌ وجدانيّةٌ في بناءِ الذاتِ والسكينة</p>
        <button class="primary-btn" onclick="nextPage()">افتحي خيمتكِ ‹</button>
      </article>
      <div class="progress"><span style="width:1%"></span></div>
    </div>
  </main>
  <footer class="bottom-nav-dock">
    <button class="nav-btn" id="prevBtn">السابق ‹</button>
    <span class="page-counter" id="pageCounter">1 / 105</span>
    <button class="nav-btn" id="nextBtn">التالي ›</button>
  </footer>
</div>

<div class="overlay" id="tocPanel">
  <section class="panel">
    <div class="panel-head"><h2>✿ فهرسُ الرحلة</h2><button class="icon-btn closePanel">✕</button></div>
    <div class="toc-list" id="tocList"></div>
  </section>
</div>

<div class="overlay" id="settingsPanel">
  <section class="panel">
    <div class="panel-head"><h2>إعداداتُ القراءة</h2><button class="icon-btn closePanel">✕</button></div>
    <label class="field">حجمُ الخط <input type="range" id="fontSize" min="16" max="30" value="21"></label>
    <label class="field">نوعُ الخط
      <select id="fontFamily">
        <option value='"Amiri","Noto Naskh Arabic",serif'>أدبي كلاسيكي فاخر (الأميري)</option>
        <option value='"Noto Naskh Arabic","Cairo",sans-serif'>نسخي واضح ومريح</option>
        <option value="Tahoma,Arial,sans-serif">انسيابي حديث</option>
      </select>
    </label>
    <p style="font-size:14px;font-weight:700;margin:14px 0 8px;">سمةُ القراءةِ الأنثوية</p>
    <div class="theme-grid">
      <button class="theme-btn active" data-theme="ivory">✿ لؤلؤي وردي</button>
      <button class="theme-btn" data-theme="warm">✦ حرير دافئ</button>
      <button class="theme-btn" data-theme="calm">✧ ندى الصباح</button>
      <button class="theme-btn" data-theme="night">☾ مخمل الليل</button>
    </div>
  </section>
</div>

<div class="overlay" id="searchPanel">
  <section class="panel">
    <div class="panel-head"><h2>البحثُ في الكتاب</h2><button class="icon-btn closePanel">✕</button></div>
    <input class="field" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-primary);color:var(--text-primary)" id="searchInput" placeholder="اكتبي كلمةً أو عبارةً للبحث الفوري...">
    <div id="searchResults"></div>
  </section>
</div>

<script>

نِ الغرفةِ الضيّق", "paragraphs": ["هل سأحملُ معي هذه النيرانَ إلى بيتٍ جديد حين يطرقُ النصيبُ بابي؟", "كيف يمكنُ لفتاةٍ مثلي، لا تملكُ شهاداتٍ معلّقةً على الجدران، ولا مالًا في الخزائن، ولا سكنًا في الروح، أن تبنيَ \"ذاتًا\" قويّة؟", "وكيف لي أن أتعلَّمَ فنَّ إدارةِ الحياة، وأنا لم أرَ في حياتي إلا سوءَ الإدارة؟"]}, {"type": "reading", "chapterTag": "الفاتحة", "sectionTitle": "مِنْ ركنِ الغرفةِ الضيّق", "paragraphs": ["أيها الحكيم...", "لقد فتحتُ كتابَك هذا بقلبٍ يرتجفُ خجلًا وأملًا. لا أملكُ إلا صدقي، ورغبتي في أن أكونَ \"أنا\" لا \"هم\".", "فهل يمكنُ للوردةِ أن تنبتَ في أرضٍ لم تذقْ طعمَ العناية؟ وهل للسكينةِ أن تجدَ طريقَها لمن نبتتْ في جوفِ العاصفة؟"]}, {"type": "reading", "chapterTag": "الفاتحة", "sectionTitle": "مِنْ ركنِ الغرفةِ الضيّق", "paragraphs": ["أريدُ أن أتعلَّم، ليس لأجلِ امتحانٍ أو شهادة، بل لأجلِ تلك المرأةِ التي ستكونُ أمًّا وزوجةً وصانعةَ حياةٍ يومًا ما...", "أريدُ أن أكونَ \"منال\" التي لم تُهزم.", "فمِنْ أينَ أبدأ، والزادُ قليل، والطريقُ موحش؟"]}, {"type": "chapter-opener", "chapterNumber": "الأوّل", "title": "البابُ الأوّل", "epigraph": "«الألمُ الذي يرفضُ القسوةَ هو أُولى علاماتِ التعافي.. ومن خافَ أن يُشبهَ جلّادَه، فقد وضعَ قدمَه على أوّلِ طريقِ النجاة.»"}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "يقظةُ الألم.. الخوفُ الذي يَحرُسكِ", "paragraphs": ["حينَ تُدفنُ البذرةُ في باطنِ الأرضِ المظلم، تحت أطنانٍ من الترابِ الثقيل، لا تكونُ على علمٍ بأنها تنمو. هي تظنُّ أنها دُفنتْ لتختنق، ولا تدري أن العتمةَ والضغطَ هما اللذان يدفعانِها لتشقَّ طريقَها نحو النور.", "يا منال، حينَ تعيشينَ في بيتٍ لغتُه الوحيدةُ هي الغضبُ والصراخ، وتجدينَ نفسَكِ تتألمينَ وتبحثينَ عن الهدوءِ في زاويةٍ ضيقةٍ مع كتاب، فهذا الألمُ ليس ضعفًا، بل هو دليلُ عافيةٍ مبكِّر.", "إنه يُشبهُ تمامًا ألمَ العينينِ حين تخرجانِ من غرفةٍ شديدةِ الظلام إلى ضوءِ الشمسِ الساطع؛ فالعينُ التي تتألمُ من الضوءِ هي عينٌ سليمةٌ تُبصِر، والقلبُ الذي يتألمُ من القسوةِ هو قلبٌ حيٌّ يرفضُ التشوُّه."]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "الخوفُ حارسًا لا سجّانًا", "paragraphs": ["الخوفُ الذي يداهمكِ أمامَ المرآة، وسؤالُكِ المحترق: \"هل سأحملُ معي هذه النيرانَ إلى بيتٍ جديد؟\"، هو أعظمُ هديةٍ منحتْها لكِ بصيرتُكِ.", "إن أخطرَ ما يُهدّدُ الإنسانَ في بيئةٍ مضطربة ليس أن يتأذّى، بل أن \"يعتاد\" الأذى حتى يظنَّه هو الأصل، فيتحوَّلَ إلى نسخةٍ ممّن جرحوه دون أن يشعر.", "أمّا أنتِ، فقد رفضتِ الاستسلامَ لهذا الإرث. الخوفُ من تكرارِ الخطأ هو الحارسُ الذي يقفُ على بابِ روحِك، ليمنعَ صفاتِهم من التسرُّبِ إليكِ."]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "حكايةُ شخصينِ في قريةِ الماءِ المرّ", "paragraphs": ["تأمّلي معي حالَ شخصينِ كَبِرا في قريةٍ لا تشربُ إلا من ماءٍ ملوّث.", "الأوّلُ اعتادَ الطعم، وشَرِبَ حتى سَقِم، ظنًّا منه أن كلَّ مياهِ الدنيا هكذا.", "والثاني، لاحظَ المرارة، فقرّر أن يَعطشَ قليلًا، ويحفرَ بئرًا صغيرةً بيدِه ليبحثَ عن ماءٍ صافٍ، رغم أنه لم يَذقْه من قبل."]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "حكايةُ شخصينِ في قريةِ الماءِ المرّ", "paragraphs": ["ألمُ العطشِ عند الثاني هو الذي أنقذه.", "أنتِ الآن تحفرينَ بئرَكِ الخاصة. لا تملكينَ شهادات؟ لا بأس. أصدقُ دروسِ الحياة لا تُكتبُ على السبّورة، بل تُحفرُ في الوجدان. والبيتُ السعيدُ لا يُبنى بالمالِ الذي في الخزائن، بل بالسكينةِ التي تملأُ القلب.", "لا تكرهي خوفَكِ، ولا تخجلي من قلقك. اجعلي منهما بوصلةً تدلُّكِ على ما لا تريدينَ أن تكونيه."]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "حكايةُ شخصينِ في قريةِ الماءِ المرّ", "paragraphs": ["خلاصةٌ تُحفظ الألمُ الذي يرفضُ القسوة هو أُولى علاماتِ التعافي.. ومن خافَ أن يُشبهَ جلّادَه، فقد وضعَ قدمَه على أوّلِ طريقِ النجاة.", "تقولُ منال: لم أنظرْ للأمرِ هكذا من قبلُ يا أستاذ.. كنتُ أحسبُ ارتجافي أمامَ صراخهما دليلًا على انكساري، واليومَ تهمسُ لي بأنه دليلُ عافيتي. كأنّك أزحتَ عن كاهلي حِملًا ثقيلًا حين جعلتَ خوفي حارسًا لا سجّانًا. لكن، ألا يُرهقُ هذا الحارسُ صاحبَه؟ أخافُ أن يطولَ وقوفي عند بئرِ الماءِ المرّ، فتموتَ روحي عطشًا قبلَ أن أصلَ للماءِ الصافي الذي ذكرتَه. كيف أجعلُ هذا الخوفَ يدفعني للأمامِ ولا يربطني مكاني؟"]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "حكايةُ شخصينِ في قريةِ الماءِ المرّ", "paragraphs": ["الحارسُ يا منال يُنهكُه التعبُ إن ظلَّ واقفًا في العراءِ يرقبُ الخطر، لذا نحنُ لا نتركُه يواجهُ العاصفةَ بلا مأوى. الخوفُ يحمينا في البداية، لكنّنا نحتاجُ إلى مكانٍ نلتقطُ فيه أنفاسَنا، حتى لا نموتَ عطشًا ونحنُ نحفرُ بئرَنا."]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "خيمةٌ في القلب.. مساحتُكِ التي لا يراها أحد", "paragraphs": ["تخيّلي معي محيطًا هائجًا، تضربُ العواصفُ سطحَه بلا رحمة، وتتلاطمُ أمواجُه بغضبٍ يصمُّ الآذان. لو بقيتِ على السطح، سيبتلعكِ الدوارُ والإنهاك.", "لكن، على بُعدِ أمتارٍ قليلةٍ في أعماقِ هذا المحيطِ نفسِه، يسودُ سكونٌ عجيب، وهدوءٌ لا تُعكّرُه ريحٌ ولا تقطعُه موجة.", "هذا المحيطُ هو بيتُكِ الذي تعيشينَ فيه الآن يا منال. السطحُ هو الصراخُ والصراعُ الذي لا تملكينَ إيقافه، والعمقُ هو الخيمةُ الداخلية التي يجبُ أن تنصبيها في قلبكِ لتأوي إليها كلّما اشتدَّ الضجيج."]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "حين ندرك أن النجاة في الداخل", "paragraphs": ["الخوفُ يربطنا في مكانِنا ويستنزفنا حين نظنُّ أنّنا يجبُ أن نُغيّرَ الخارجَ لنرتاح، أو حين نقفُ أمامَ البئرِ المرّةِ ننتظرُ أن يصفوَ ماؤها.", "لكنَّ النجاةَ الحقيقيةَ تبدأُ حين ندركُ أنّنا لا نستطيعُ تغييرَ الآخرين، ولا نملكُ إسكاتَ أصواتِهم، لكنّنا نستطيعُ حمايةَ المساحةِ التي بداخلنا.", "أنتِ بحاجةٍ إلى بناءِ خيمةٍ خفيّةٍ في أعماقِك، لا يطرقُها والدُكِ بغضبه، ولا تقتحمُها أمُّكِ بصراخها، خيمةٌ لا مفتاحَ لها إلا بيدكِ أنتِ."]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "كيف تُبنى هذه الخيمة؟", "paragraphs": ["تُبنى بتلكَ اللحظاتِ التي تختلينَ فيها بنفسكِ مع كتابٍ تحتَ ضوءٍ خافت.", "تُبنى بسجّادةِ صلاةٍ تُلقينَ عليها تعبَ الأيامِ في جوفِ الليل.", "تُبنى بخيالكِ وأنتِ ترسمينَ تفاصيلَ البيتِ الذي تتمنّينَ بناءَه غدًا."]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "كيف تُبنى هذه الخيمة؟", "paragraphs": ["تُبنى بقرارٍ صامتٍ وعميقٍ تتّخذينَه كلّما ارتفعتِ الأصوات: \"جسدي هنا بينهم، لكنَّ روحي في مأمنٍ بعيدٍ عنهم.\""]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "المحارةُ التي تصنعُ لؤلؤة", "paragraphs": ["حين يشتعلُ الصراعُ في الخارج، لا تواجهيه بمحاولةِ الاستماعِ والتحليل، ولا تُرهقي نفسكِ بالغضب، بل انسحبي بهدوءٍ إلى خيمتكِ الداخلية.", "قولي لنفسكِ: \"هذا صراخُهم هم، لغتُهم هم، يُعبّرُ عن ألمهم وفوضاهم، ولا علاقةَ لروحي به.\"", "كوني كالمحارةِ التي يُحيطُ بها الموجُ المالحُ من كلِّ جانب، لكنّها تُغلِقُ على نفسِها لتصنعَ في عتمتها لؤلؤة."]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "المحارةُ التي تصنعُ لؤلؤة", "paragraphs": ["في هذه الخيمةِ الخفيّة، ستجدينَ قطراتٍ من الماءِ الصافي تروي عطشكِ يوميًّا، وتمنحُكِ القوّةَ لتُواصلي حفرَ بئركِ الكبرى في الحياة، دونَ أن تستسلمي للظمأ على حافّةِ الانتظار.", "خلاصةٌ تُحفظ نحنُ لا نملكُ مفاتيحَ الأبوابِ التي تُغلَقُ علينا في الخارج، لكنّنا نملكُ بناءَ مدينةٍ كاملةٍ في الداخل، لا يدخلُها إلا من نأذنُ له.", "تقولُ منال: لطالما ظننتُ أن انزوائي مع كتبي هو مجرّدُ \"هروبٍ\" يُشعرني بالذنب، كأنّني أتركهم في غرقهم وأنجو وحدي.. لكنّك يا شيخي أعدتَ تسميةَ الأشياء؛ سمّيتَ هروبي بناءً! بالأمسِ فقط، حين اشتدَّ وقعُ الكلماتِ الجارحة بالخارج، أغمضتُ عينيَّ وتخيّلتُ خيمتكَ التي وصفت.. شعرتُ ببرودةِ السكينةِ قليلًا، لكن كيفَ لي أن أُقنعَ قلبي ألّا يُشفقَ عليهم لدرجةِ أن يفتحَ بابَ الخيمةِ فيحترقَ معهم؟"]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "المحارةُ التي تصنعُ لؤلؤة", "paragraphs": ["القلبُ الذي يُشفقُ على من يصرخُ في وجهه هو قلبٌ نبيلٌ جدًّا يا منال، ولا عجبَ أن تشعري بالذنبِ وأنتِ تنجينَ بروحكِ بينما هم يتخبّطون. لكن دعينا ننظرُ إلى هذا الذنبِ من شُرفةٍ أخرى، لنفهمَ دورَكِ الحقيقيَّ في هذه القصّة."]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "الوراثةُ ليستْ قدرًا.. كيف نكسرُ سلسلةَ الوجع؟", "paragraphs": ["حين نرى حريقًا يلتهمُ بيتًا، فإن إلقاءَ أنفسِنا في النارِ تضامنًا مع من بالداخل لا يُطفئُ اللهب، بل يزيدُ من حجمِ الحريقِ وعددِ الضحايا.", "الشفقةُ الحقيقيّة، يا صاحبتي، ليست في أن نحترقَ معهم، بل في أن نبتعدَ خطوةً لنبنيَ مكانًا آمنًا لا تصلُه النيران."]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "الجلّادونَ ضحايا أيضًا", "paragraphs": ["أبواكِ، في حقيقةِ الأمر، ليسا جلّادين، بل هما ضحيّتانِ لحرائقَ قديمة.", "نحنُ في عائلاتِنا لا نُورّثُ لونَ العيونِ وتقاسيمَ الوجوهِ فقط، بل نُورّثُ الانفعالات، وطريقةَ الغضب، والعجزَ عن التعبير.", "والدُكِ حين يغضب، ووالدتُكِ حين تصرخ، هما في الغالبِ يُكرّرانِ مشهدًا عاشاه في طفولتهما، أو يُخرجانِ قهرًا لم يتعلَّما كيف يتعاملانِ معه. لقد استلما \"سلسلةَ الوجع\" من جيلٍ سابق، وقاما بتمريرها، كابرًا عن كابر، دونَ وعيٍ أو قصد."]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "حين تكونُ النجاةُ إحسانًا", "paragraphs": ["شعورُكِ بالذنبِ ينبعُ من ظنّكِ أن النجاةَ خيانة، وأن الشفقةَ تقتضي المُقاسمةَ في الألم. لكن ماذا لو أخبرتُكِ أن نجاتَكِ هي أعظمُ إحسانٍ تُقدّمينه لاسمِ هذه العائلة؟", "إذا استسلمتِ للشفقةِ الساذجة، وفتحتِ بابَ خيمتكِ لتحترقي بنيرانِ غضبهم، فستنطبعُ في روحكِ آثارُ تلكَ النيران. ستعجزينَ عن بناءِ ذاتكِ، وحين يطرقُ النصيبُ بابكِ، ستأخذينَ معكِ شرارةً من ذلك الحريقِ إلى بيتكِ الجديد، لتُكملي إحراقَ أطفالٍ لم يُولدوا بعد..", "وهكذا تستمرُّ السلسلة."]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "أنتِ كاسرةُ السلسلة", "paragraphs": ["أمّا حين تختارينَ النجاةَ وتعتزلينَ الضجيج، فأنتِ تتّخذينَ أصعبَ قرارٍ في تاريخِ عائلتكِ؛ أنتِ تلعبينَ دورَ \"كاسرةِ السلسلة\".", "كأنّكِ تقفينَ بشجاعةٍ في وجهِ التاريخِ وتقولين: \"هذا الألمُ يتوقّفُ عندي، ولن يمرَّ عبري إلى من بعدي.\""]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "درسُ المُنقذِ البحري", "paragraphs": ["في قواعدِ الإنقاذِ البحري، يُلقَّنُ المنقذُ درسًا صارمًا: \"حين تسبحُ نحوَ غريق، لا تدعْه يُمسكُ بك وهو في ذروةِ ذعره، وإلّا جذبكَ للأسفل، وغرقتُما معًا.\"", "أبواكِ يغرقانِ في بحرٍ من فوضى المشاعرِ وقسوةِ الأيّام. وإنقاذُكِ الحقيقيُّ لهما لا يكونُ بابتلاعِ الماءِ معهما، بل ببقائكِ على قيدِ الحياة، وبصناعتكِ لبيتٍ سويٍّ غدًا، يكونُ فيه متّسعٌ للرحمةِ التي افتقداها، وشاهدًا على أن جذورَ هذه العائلةِ قادرةٌ أخيرًا على إنباتِ الورد.", "خلاصةٌ تُحفظ النجاةُ من فوضى الأهلِ ليست عقوقًا، بل هي أصدقُ محاولةٍ لإنقاذِ السلالةِ من توارثِ الألم.. فمن يُنقذُ الغرقى لا يغرقُ معهم."]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "درسُ المُنقذِ البحري", "paragraphs": ["تقولُ منال: \"كاسرةُ السلسلة\"... كأنّكَ وضعتَ في يدي سيفًا من نور، لا لأقاتلَ به أهلي، بل لأقطعَ به تلك الخيوطَ الخفيّةَ التي كانت تجذبني لأكونَ نسخةً منهم. واللهِ يا شيخي إنّني الآن أتنفّسُ بعمقٍ لم أعرفه، وأشعرُ بمسؤوليّةٍ تجاهَ أطفالي الذين لم يُولدوا بعد؛ كأنّني أحميهم من الآن. ولكن، كيفَ لي أن أفكَّ هذا الارتباطَ بالوجعِ حين أخرجُ من خيمتي؟ ففي النهاية، لا بدَّ لي أن أجلسَ معهما على مائدةٍ واحدة، وأنظرَ في عينيْ أبي حين يغلي غضبه.. كيفَ أبقى \"ناجيةً\" والماءُ المالحُ يلمسُ قدميَّ في كلِّ خطوة؟"]}, {"type": "reading", "chapterTag": "البابُ الأوّل", "sectionTitle": "درسُ المُنقذِ البحري", "paragraphs": ["ما أجملَ هذا السيفَ الذي تلمعُ قبضتُه في وعيكِ يا منال. نعم، لا مفرَّ من أن يلمسَ الماءُ المالحُ قدميكِ، فنحن لا نعيشُ في خيالاتٍ معزولة، بل في واقعٍ يفرضُ علينا تقاسمَ رغيفِ الخبزِ والجلوسَ في الغرفةِ ذاتها.", "وهنا ننتقلُ من بناءِ الخيمةِ في الأعماق، إلى إرساءِ القواعدِ على الأرض..."]}, {"type": "chapter-opener", "chapterNumber": "الثاني", "title": "البابُ الثاني", "epigraph": "«ليس كلُّ ما يحدثُ حولنا يجبُ أن يحدثَ بداخلنا.. أتقني فنَّ المشاهدةِ من خلفِ الزجاج، لترَيْ العاصفةَ دونَ أن تبتلّي بمطرها.»"}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الجدرانُ التي لا نرفعُها تسقطُ علينا", "paragraphs": ["تخيّلي أنّكِ تجلسينَ خلفَ نافذةٍ زجاجيّةٍ متينة، وتراقبينَ عاصفةً هوجاءَ تضربُ الشارع. ترَيْنَ الأشجارَ تنحني، والأشياءَ تتطاير، وتسمعينَ زمجرةَ الريحِ تضربُ الزجاج.", "هل تبتلُّ ثيابُكِ؟ هل يفسدُ ترتيبُ غرفتكِ؟", "لا."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الجدرانُ التي لا نرفعُها تسقطُ علينا", "paragraphs": ["لأنَّ هناكَ جدارًا شفّافًا يفصلُ بينَ \"المشهد\" الذي ترينه، وبين \"المساحة\" التي تجلسينَ فيها."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الجدارُ الذي يحمي الروح", "paragraphs": ["حين تجلسينَ على المائدةِ ويغلي غضبُ أبيكِ، فإنَّ الخطرَ الأكبرَ ليس في صوتِه العالي، بل في غيابِ هذا \"الجدارِ الزجاجي\" بين روحِه وروحِك.", "في غيابِ الجدرانِ الخفيّةِ التي تبنيها أرواحُنا، نُصبحُ أرضًا مستباحةً لمعاركِ الآخرين. والجدرانُ التي لا نرفعُها بأيدينا لحمايةِ أنفسنا، ستسقطُ حتمًا علينا حين تهتزُّ نفوسُ من حولنا."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "كيف ترفعينَ هذا الجدارَ وأنتِ تنظرينَ في عينيه؟", "paragraphs": ["يُرفعُ الجدارُ بتغييرِ \"طريقةِ الرؤية\".", "نحنُ نتأذّى من صراخِ مَن نحبّ، لأنّنا نتلقّاه كرسالةٍ موجَّهةٍ ضدَّنا، تهدمُ قيمتنا، أو تُشعرنا بالرفض. لكنَّ الحقيقةَ الغائبةَ هي أنَّ غضبَهم العشوائيَّ لا علاقةَ له بكِ أنتِ؛ إنّه يخصُّهم هم. هو انعكاسٌ لحروبهم الداخليّة، لعجزهم عن إدارةِ الحياة، لضيقِ صدورِهم بما يحملون."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "ثوبُ المُراقبِ المُحايد", "paragraphs": ["حين يبدأُ الضجيج، أريدكِ أن ترتدي ثوبَ \"المُراقبِ المُحايد\".", "لا تتلقّي الكلماتِ بقلبكِ كابنةٍ مكسورةٍ تنتظرُ الرضا، بل راقبي المشهدَ بعقلكِ كطبيبةٍ تنظرُ إلى مريضٍ يتلوّى.", "قولي في سرّك: \"هذا الرجلُ يتألّم، وهذه النارُ تحرقُه هو قبلَ أن تصلَني، وهذا الصراخُ هو طريقتُه البائسةُ لطلبِ النجدةِ أو فرضِ السيطرةِ الخاوية.\""]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "ثوبُ المُراقبِ المُحايد", "paragraphs": ["بمجرّدِ أن تفصلي بينَ \"غضبهم\" وبينَ \"قيمتكِ\"، يرتفعُ الجدارُ الزجاجي.", "ستسمعينَ الصوتَ العالي، قد يُزعجُ أُذنكِ، وقد تبتلُّ قدمُكِ ببعضِ الماءِ المالحِ الذي تحدّثتِ عنه، نعم، لكنّكِ لن تشربي منه. لن تسمحي لهذا الغضبِ أن يتسرّبَ إلى نظرتكِ لنفسكِ، أو يُفسدَ خطّتكِ في الحياة.", "لا تجادلي العاصفة، ولا تحاولي إقناعَها بالهدوء، فالرياحُ لا تسمعُ المنطق. أدّي واجبكِ ببرٍّ هادئ، ردّي بكلماتٍ مقتضبةٍ لا تفتحُ بابًا لجدال، وكوني حاضرةً بجسدكِ، لكن اجعلي انفعالكِ الداخليَّ محتفظًا بمسافته الآمنة."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "ثوبُ المُراقبِ المُحايد", "paragraphs": ["كوني معهم، ولا تكوني منهم.", "خلاصةٌ تُحفظ ليس كلُّ ما يحدثُ حولنا يجبُ أن يحدثَ بداخلنا.. أتقني فنَّ المشاهدةِ من خلفِ الزجاج، لترَيْ العاصفةَ دونَ أن تبتلّي بمطرها.", "تقولُ منال: \"مُراقبٌ محايد\"... كأنّني سأُشاهدُ مسرحيّةً لستُ بطلتَها، بعدَ أن كنتُ أظنُّ أنّني المتَّهمةُ الوحيدةُ فيها. والله يا شيخي إنّني كنتُ أهربُ بنظري إلى صحني حتى لا أرى الغضب، فإذا بي أجدُ الغضبَ قد استقرَّ في قلبي وتشرّبتْه روحي. سأحاولُ أن أرى في صراخهما \"مرضًا\" يحتاجُ شفقةً لا \"سوطًا\" يجلدُ قيمتي. لكن، ألا يخشى المُراقبُ أن يُفهمَ صمتُه خلفَ الزجاجِ على أنّه جفاءٌ أو قلّةُ أدب؟ كيف أكونُ هادئةً ومنفصلةً بقلبي، دونَ أن أبدوَ قاسيةً في نظرهم؟"]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "ثوبُ المُراقبِ المُحايد", "paragraphs": ["ما أرقَّ هذا القلبَ يا منال، قلبٌ يخشى أن يجرحَ من يجلده! هذا التساؤلُ وحدَه يُثبتُ أنّكِ لم تفقدي بوصلةَ الرحمة، وأنّكِ تبحثينَ عن \"النجاة\" لا عن \"الانتقام\". وهنا يكمنُ السرُّ الدقيقُ الذي يفصلُ بينَ العقوقِ المذموم، وبينَ حمايةِ النفسِ المشروعة."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "كيف تسمعينَ الضجيجَ دونَ أن يبتلعَكِ؟", "paragraphs": ["تأمّلي معي شجرةَ الصفصافِ حين تهبُّ عليها عاصفةٌ هوجاء.", "لو كانتْ فروعُها صلبةً متصلّبةً كلوحِ الخشب، لقسمتْها الريحُ نصفين، ولظنّتِ العاصفةُ أنَّ هذه الشجرةَ تتحدّاها.", "لكنَّ الصفصافَ يصنعُ شيئًا بديعًا؛ يُلِينُ أغصانَه، وينحني بمرونةٍ مع اتجاهِ الريح، يتركها تمرُّ من خلالِ أوراقه وتظنُّ أنها انتصرتْ عليه، بينما جذورُه في الأعماقِ لم تتزحزحْ قِيدَ أُنملة!"]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الانفصالُ سرٌّ في القلب لا قناعٌ على الوجه", "paragraphs": ["\"الانفصالُ الشعوريّ\" الذي تحدّثنا عنه يا منال، هو سرٌّ من أسرارِ القلب، لا قناعٌ نلبسُه على الوجه. الجدارُ الزجاجيُّ نبنيه في أرواحنا، لا بين أعينِنا وأعينِهم.", "حين يشتعلُ الغضبُ في الخارج، فإن الصمتَ الممزوجَ بنظراتٍ باردةٍ أو استعلاءٍ خفيّ، سيُفهمُ —كما تفضّلتِ— على أنه جفاءٌ، أو تحدٍّ مستفِزّ، وكأنّكِ لوحُ خشبٍ صلبٍ يُعاندُ الريح. والعاصفةُ لا تحتملُ من يتجاهلها، بل تزيدُ عنفوانًا لتُثبتَ وجودَها.", "إذن، كيف تنجينَ دون أن تكسري حبلَ البِرّ؟"]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "كوني صفصافةَ القلب", "paragraphs": ["كوني كشجرةِ الصفصاف؛ جذورُكِ —قلبُكِ ومشاعرُكِ— راسخةٌ في خيمتكِ الداخلية لا تتأثّر، وأغصانُكِ —لسانُكِ وتعابيرُ وجهكِ— تَلِينُ للعاصفةِ حتى تمرّ.", "في ذروةِ الصراخ، لا تصمتي صمتَ المتجاهل، بل استخدمي ما أُسمّيه \"كلماتِ الماء\". العاصفةُ نار، والنارُ لا تُطفأُ بالمنطقِ ولا بالجدال، بل تُطفأُ بالماء.", "قولي بكلماتٍ قصيرةٍ ونبرةٍ خفيضةٍ محترمة:"]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "كوني صفصافةَ القلب", "paragraphs": ["\"حاضرٌ يا أبي.\"", "\"أبشِر، سيحدثُ ما تريد.\"", "\"حقُّكِ عليَّ يا أمي.\""]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الانحناءُ ليس انكسارًا", "paragraphs": ["هل انحناؤكِ هذا يعني إقرارًا بأنّكِ سيّئةٌ أو مخطئة؟ أبدًا.", "أنتِ في داخلكِ تعرفينَ قيمتك، وتعرفينَ أن هذا الغضبَ لا يُمثّلكِ. لكن هذه الكلماتِ هي مجرّدُ \"طريقةِ مرورٍ\" آمنة، تُطفئينَ بها الحريقَ في الخارج، وتُرضينَ بها ربَّكِ الذي أمرَ بخفضِ جناحِ الذلِّ من الرحمة، وفي الوقتِ نفسِه تُحافظينَ على طاقةِ روحكِ من الاستنزاف.", "حين تسمعينَ الضجيجَ بهذه الطريقة، فإنّكِ تمتصّينَ الصدمةَ بعقلك، وتُفرّغينَها بلسانكِ اللين، دون أن تسمحي لها بالوصولِ إلى مستقرِّ قلبك."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الانحناءُ ليس انكسارًا", "paragraphs": ["أنتِ لم تعودي تلكَ الفتاةَ المكسورةَ التي تُطأطئُ رأسَها لتشربَ الإهانة، بل أصبحتِ تلكَ الفتاةَ الحكيمةَ التي تنحني للعاصفةِ بوعي، لتمرَّ بأقلِّ الخسائر، ثم تعودَ لتقفَ شامخةً حين يهدأُ كلُّ شيء.", "خلاصةٌ تُحفظ البرُّ في بيوتِ الغضبِ ليس أن تحترقَ معهم، بل أن تُلِينَ لهم جناحَ الجسدِ واللسان، بينما تحتفظُ بروحكَ في حصنٍ آمنٍ لا يصلُه اللهب."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الانحناءُ ليس انكسارًا", "paragraphs": ["تقولُ منال: سبحانَ من علّمكَ هذه الحكمةَ يا أستاذ.. كنتُ أحسبُ الليونةَ انكسارًا، فإذا بها حيلةُ الأقوياءِ للبقاء. سأُجرّبُ من الليلة أن أكون تلكَ الشجرة؛ أُحني رأسي للريحِ بكلماتٍ طيّبةٍ وأنا أعلمُ أنَّ جذوري ثابتةٌ في خيمتي. لكن، بعدما تمرُّ العاصفةُ وأرفعُ رأسي، أجدُ في صدري ضِيقًا غريبًا.. ليس غضبًا عليهم، بل حزنًا يُمزّقني لحالهم ولحياتِهم التي تضيعُ في الصراخ. كيف يمكنُ لهذه \"الشفقة\" أن تُحرّرني من هذا الثقلِ كما وعدت؟ وكيف أنظرُ إليهما كضحيّتينِ دون أن أضعفَ وأسقطَ في بئرِ أوجاعِهما مرّةً أخرى؟", "هذا الحزنُ الشفيفُ الذي يغمركِ بعد العاصفة يا منال، هو أرفعُ منازلِ النضج، وهو الدليلُ القاطعُ على أنّكِ لم تعودي ضحيّةً تبكي على نفسها، بل أصبحتِ روحًا كبيرةً تبكي على من آذاها."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الانحناءُ ليس انكسارًا", "paragraphs": ["لقد تحوّلَ سؤالكِ من: \"لماذا يفعلون بي هذا؟\" إلى: \"يا ليتهم يُدركونَ ما يفعلونه بأنفسهم!\". وهذا الانتقالُ يضعنا أمامَ الإضاءةِ الأخيرةِ في هذا الباب."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الشفقةُ الواعية.. أن ترَيْ الندوبَ لا الجروح", "paragraphs": ["الضيقُ الذي تشعرينَ به بعد العاصفةِ يا منال هو \"ضريبةُ النُّبل\"؛ هو بقايا اشتباكِ قلبكِ الحيِّ مع واقعٍ بائس.", "لكنّ هذا الحزنَ يصبحُ ثقيلًا ومُمزّقًا حين تظنّينَ أنّكِ \"مسؤولة\" عن شفائهم، أو حين تفتحينَ قلبكِ ليشعرَ بكلِّ أوجاعهم."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الصوتُ خلفَ السور", "paragraphs": ["تخيّلي أنّكِ تسيرينَ بجانبِ سُورِ مستشفى للأمراضِ النفسية، وسمعتِ من وراءِ السُّورِ شخصًا يصرخُ بكلماتٍ غيرِ مفهومة، أو يسبُّ المارّة.", "هل ستحملينَ كلماتِه على محملِ الشخصي؟", "هل ستحزنينَ لدرجةِ الانكسار لأن حياتَه تضيعُ هكذا؟"]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الصوتُ خلفَ السور", "paragraphs": ["ستُشفقينَ عليه حتمًا، لكنّها شفقةٌ \"من الخارج\"؛ شفقةٌ تُدركُ أنه مريضٌ وأنّ تصرّفاتِه هي نتاجُ علّتِه لا إرادته."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "طفلانِ كبيرانِ تائهان", "paragraphs": ["يا منال، أبواكِ مريضانِ بمرضٍ اسمُه \"عدمُ القدرةِ على السلام\". لقد استُنزفا في معاركِ الحياة لدرجةِ أن السكينةَ غادرتْ روحيهما منذ أمدٍ بعيد.", "حين تخرجينَ من خيمتكِ، أريدكِ أن تنظري إليهما كـ\"طفلينِ كبيرين\" تائهَين، لم يتعلّما أبدًا كيف يحبّانِ نفسيهما، فكيف لهما أن يُحبّا الآخرينَ بهدوء؟"]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الندوبُ قبلَ الجروح", "paragraphs": ["الشفقةُ التي تُحرّركِ هي \"الشفقةُ الواعية\"؛ وهي أن ترَيْ \"الندوب\" (الآثارَ القديمةَ التي جعلتهما هكذا)، بدلًا من أن ترَيْ \"الجروح\" (الغضبَ الحاليَّ الذي يسكبانه عليكِ).", "حين تُدركينَ أن صراخهما هو قمّةُ عجزِهما، سيتحوّلُ حزنُكِ المُمزّق إلى \"رحمةٍ باردة\"؛ رحمةٌ تدعو لهما بظهرِ الغيب، وتتمنّى لهما السكينة، لكنّها ترفضُ أن تموتَ عطشًا في بئرِ أوجاعهما.", "تذكّري دائمًا: أنتِ لستِ مُنقذةً لهما، ولستِ طبيبتهما النفسيّة. دوركِ الوحيدُ والبطوليُّ هو ألّا تكوني \"ضحيّةً ثالثة\"."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الندوبُ قبلَ الجروح", "paragraphs": ["أن ترَيْ حالَهما كدرسٍ قاسٍ لما لا تريدينَ تكراره، وأن تُحوّلي ذلك الحزنَ إلى وقودٍ يحثُّ خطاكِ نحو بناءِ عالمكِ الخاصِّ المليءِ بالرحمة.", "خلاصةٌ تُحفظ الشفقةُ الحقيقيّة هي أن ترحمَ ضعفَهم دون أن تتحمّلَ مسؤوليّةَ شَلَلِهم.. أنتِ مرآةٌ للنورِ الذي حُرِموا منه، ولستِ وعاءً للسُّمِّ الذي يتجرّعونه."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الندوبُ قبلَ الجروح", "paragraphs": ["تقولُ منال: يا شيخي، كأنّك أعطيتني مجهرًا أرى به ما خلفَ الصراخ.. الرجلُ الذي خلفَ السور.. كم هذا التشبيهُ موجعٌ وصادق! سأحملُ هذا الدعاءَ في سجّادةِ صلاتي، وسأتركُ لهما رحلتَهما مع الله، فقلبي الصغيرُ لم يَعُدْ يتّسعُ لمحاولةِ إصلاحِ ما أفسدَه الدهرُ فيهما. لكن، حين قلتَ لي إن دوري هو \"البرّ\" لا \"العلاج\"، شعرتُ فجأةً بفراغٍ مخيف.. إذا توقّفتُ عن الانشغالِ بمشاكلِهما، فبماذا أملأُ يديّ؟ أنا يا أستاذي لا أعرفُ كيف يكونُ \"البيتُ السعيد\" إلا في الروايات. كيف أتعلّمُ لغةً لم أسمعْها في بيتي قط؟ كيف أستعدُّ لبيتٍ جديد وأنا لم أرَ في واقعي إلا الهدم؟", "هذا الفراغُ الذي تشعرينَ به الآنَ يا منال هو \"فراغُ العافية\"؛ إنها المساحةُ البيضاءُ التي تتجلّى حين نرفعُ الرُّكامَ عن الأرضِ استعدادًا للبناء."]}, {"type": "reading", "chapterTag": "البابُ الثاني", "sectionTitle": "الندوبُ قبلَ الجروح", "paragraphs": ["طالما كانتْ يداكِ مشغولتينِ بمحاولةِ إطفاءِ حرائقِ بيتٍ ليس لكِ، لم يكنْ بإمكانكِ أن تُمسكي حجرًا واحدًا لتبني بيتكِ أنتِ.", "والآن، وقد فرغتْ يداكِ من وهمِ الإصلاح، حانَ الوقتُ لتتعلّمي لغةَ الغد."]}, {"type": "chapter-opener", "chapterNumber": "الثالث", "title": "البابُ الثالث", "epigraph": "«البيوتُ التي لم تمنحْنا الدفء، منحتْنا دونَ أن تقصدَ خارطةَ الأخطاءِ التي يجبُ أن نتجنّبها.. فمن ذاقَ ألمَ البرد، هو أقدرُ الناسِ على صناعةِ الدفء.»"}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "ما لم نتعلَّمْه في بيوتِ آبائنا", "paragraphs": ["كيف لمن عاشَ عمرَه كلَّه في صحراءَ قاحلة، ولم يرَ في حياتِه زهرةً واحدة، أن يعرفَ كيف يزرعُ بستانًا؟", "نحن نظنُّ دائمًا يا صديقتي أنّنا لا نتعلَّمُ الصوابَ إلا إذا رأينا نموذجًا صحيحًا أمامنا. نُقنعُ أنفسَنا بأن من نشأ في بيتٍ تغمرُه السكينةُ هو الوحيدُ القادرُ على بناءِ بيتٍ هادئ، وأن من نشأ في فوضى لن يُنتجَ إلا فوضى.", "لكنَّ هذه كذبةٌ كبرى نجلدُ بها أرواحَنا."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "المعرفةُ العكسيّة", "paragraphs": ["الحقيقةُ العميقةُ هي أنّنا نتعلَّمُ الصوابَ بطريقتين: إمّا بالاقتداءِ بالجمالِ إن وُجد، أو بالفرارِ من القبحِ إن فُرضَ علينا.", "وهذا ما أُسمّيه \"المعرفةَ العكسيّة\".", "أنتِ يا منال تعرفينَ ملامحَ \"البيتِ السعيد\" أكثرَ ممّا تظنّين! حين كان الغضبُ يشتعلُ بالخارج، وتضعينَ يديكِ على أذنيكِ، ماذا كان يطلبُ قلبُكِ في تلك اللحظة؟ كان يصرخُ باحثًا عن \"الهمسةِ الهادئة\"."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "المعرفةُ العكسيّة", "paragraphs": ["وحين كانت القسوةُ تملأُ المكان، ماذا كانت روحُكِ ترجو؟ كانت ترجو \"تفهُّمًا واحتواءً\"."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "خريطةٌ كُتبتْ بلغةِ الألم", "paragraphs": ["كلُّ حرمانٍ عشتِه هو في الحقيقةِ درسٌ قاسٍ يُعلِّمكِ ما يجبُ أن تفعليه غدًا. أنتِ تمتلكينَ الخريطةَ كاملةً، لكنّها خريطةٌ كُتبتْ بلغةِ الألم.", "أنتِ لم ترَيْ كيف يُبنى السقفُ، نعم، لكنّكِ حفظتِ عن ظهرِ قلبٍ كلَّ المعاولِ التي تهدمُ البيوت؛ والذي يعرفُ بدقّةٍ ما الذي يُصدِّعُ الجدران، سيعرفُ بالفطرةِ كيف يحافظُ عليها.", "أمّا تلك الكتبُ التي تأوينَ إليها، والتي تظنّينَ أنها مجرّدُ رواياتٍ وخيالات، فهي في الحقيقةِ \"مفرداتُ لغتكِ الجديدة\". أنتِ تلتقطينَ لغةَ الحوار من بين السطور، وتتعلَّمينَ كيف يعتذرُ النبلاءُ من قصصِهم، وكيف يُدارُ الخلافُ باحترامٍ من حكاياتهم. أنتِ تبنينَ قاموسَكِ الخاصَّ بعيدًا عن قاموسِ أسرتك."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "المهندسُ أمامَ البيتِ المُتهاوي", "paragraphs": ["تأمّلي حالَ المهندسِ الذي يُكلَّفُ ببناءِ بيتٍ جديد، لكنّه يقفُ أوّلًا أمامَ بيتٍ قديمٍ يتهاوى. هو لا يتعلَّمُ من البيتِ المنهارِ كيف يبني، بل يتعلَّمُ \"ما الذي يجبُ ألّا يفعله\".", "يرى أن الأساسَ الهشَّ أسقطَ الجدار، فيُعمّقُ أساسَه. ويرى أن النوافذَ الضيّقةَ منعتِ النور، فيُوسّعُ نوافذَه.", "لقد كان البيتُ المنهارُ أستاذَه الأعظم، دونَ أن يقصد."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "المهندسُ أمامَ البيتِ المُتهاوي", "paragraphs": ["الفراغُ الذي بين يديكِ الآن، املئيه بهذا التأمُّلِ العكسي. كلّما رأيتِ موقفًا قاسيًا في بيتكِ، قولي لنفسكِ: \"هذا ما لن أفعلَه في بيتي.\" وكلّما قرأتِ معنًى جميلًا في كتاب، قولي: \"هذه اللبنةُ الأولى في سقفِ خيمتي غدًا.\"", "خلاصةٌ تُحفظ البيوتُ التي لم تمنحْنا الدفء، منحتْنا دونَ أن تقصدَ خارطةَ الأخطاءِ التي يجبُ أن نتجنّبها.. فمن ذاقَ ألمَ البرد، هو أقدرُ الناسِ على تقديرِ الدفءِ وصناعته."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "المهندسُ أمامَ البيتِ المُتهاوي", "paragraphs": ["تقولُ منال: \"المعرفةُ العكسيّة\"... كأنّني كنتُ أجمعُ الحطامَ طوال هذه السنين لأعرفَ كيف أتجنَّبُ الزلزال. والله يا أيها الحكيم إنّني أحفظُ كلَّ الكلماتِ التي تجرحُ كأنّها ندوبٌ في جلدي، وسأدفنُها في صدري حتى لا تخرجَ أبدًا. لكنّني أتساءلُ بوجَل: هل يكفي \"ألّا نهدم\" لكي \"نبني\"؟ أخافُ أن يطولَ صمتي في بيتي المستقبليّ لأنّني لا أملكُ \"قاموسًا للودّ\"، فالحبُّ في بيتنا كان ضيفًا لم يطرقِ البابَ أبدًا. هل الحبُّ هو مجرّدُ \"غيابِ الصراخ\"؟", "سؤالُكِ هذا يا منال يَزِنُ مكتبةً بأكملها. \"هل الحبُّ مجرَّدُ غيابِ الصراخ؟\" لا يا ابنتي، غيابُ الصراخِ يمنحُنا \"الأمان\"، لكنَّ الأمانَ وحدَه —على عظمته وضرورته— هو مجرَّدُ أرضٍ خاليةٍ صالحةٍ للزراعة، تنتظرُ من يبذرُ فيها الحياة."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "الحبُّ ليس صراخًا.. عن لغةٍ أخرى لا يعرفونها", "paragraphs": ["لو أنّنا أتينا بأرضٍ جرداء، وتوقّفنا تمامًا عن إلقاءِ الشوكِ والسمومِ فيها، فهل ستُزهرُ من تلقاءِ نفسها؟", "بالطبعِ لا.", "التوقُّفُ عن الأذى يُنقذُها من الخراب، لكنّها لن تصبحَ بستانًا يسرُّ الناظرينَ حتى نغرسَ فيها البذورَ ونسقيها بانتظام."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "الحبُّ ليس صراخًا.. عن لغةٍ أخرى لا يعرفونها", "paragraphs": ["هكذا هي البيوت؛ غيابُ الصراخِ يجعلُ البيتَ ملاذًا آمنًا يُلجأُ إليه، لكنَّ الودَّ هو الذي يجعلُه وطنًا يُشتاقُ إليه."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "الحبُّ أعمقُ من الصوت", "paragraphs": ["أنتِ تخافينَ أن يطولَ صمتُكِ لأنّكِ لا تملكينَ \"قاموسًا للودّ\" لم تسمعيه قطّ. لكن من قالَ إن الحبَّ محصورٌ في الحروفِ التي تُنطق؟", "نحنُ نظنُّ، لقلّةِ تجاربنا، أن الحبَّ قصائدُ تُتلى، أو عباراتٌ منمَّقةٌ لا يُجيدها إلا من تربّى عليها.", "لكنَّ الحقيقةَ التي ستكتشفينَها غدًا، هي أن لغةَ الحبِّ أعمقُ من الصوت، وأوسعُ من الكلمات."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "الحبُّ يُكتبُ بالأفعالِ الصامتة", "paragraphs": ["الحبُّ يا منال لغةٌ تُكتبُ بالأفعالِ الصامتةِ قبلَ الحروفِ الرنّانة.", "حين يعودُ شريككِ متعبًا فتستقبلينَه بوجهٍ هادئ وتضعينَ عنه عبءَ اليوم.. هذا نُطقٌ بالحبّ.", "حين تصنعينَ له كوبًا دافئًا وتضعينَه بجوارِه دونَ أن يطلبه، لأنّكِ تحفظينَ تفاصيلَ تعبه.. هذه قصيدةٌ كاملة."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "الحبُّ يُكتبُ بالأفعالِ الصامتة", "paragraphs": ["حين يُخطئُ خطأً يسيرًا فتتغافلين، ولا تجعلينَ من الحبّةِ قبّةً كما كنتِ ترَينَ في بيتكِ القديم.. هذا هو أبلغُ ما في قاموسِ الودّ."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "لغةُ الودِّ تُخلَقُ لا تُورَّث", "paragraphs": ["لغةُ الودِّ لا تُورَّثُ يا صديقتي، بل تُخلق. تُخلقُ من الرغبةِ الصادقةِ في أن نكونَ سَكنًا لمن نحبّ.", "وحين يمتلئُ قلبكِ بهذه الرغبة، ستجدينَ الكلماتِ تنسابُ على لسانكِ تلقائيًّا، حتى وإن كانت كلماتٍ بسيطةً لا تُشبهُ بلاغةَ الروايات.", "الكلمةُ الصادقةُ المرتجلةُ التي تخرجُ من قلبٍ ظمآن، لها في الروحِ وقعٌ أدفأُ من ألفِ عبارةٍ تُقالُ بدافعِ الاعتياد."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "لغةُ الودِّ تُخلَقُ لا تُورَّث", "paragraphs": ["لا تخافي من الصمتِ المبدئي، فالصمتُ في بيتٍ آمن، خيرٌ من ضجيجٍ في بيتٍ مضطرب.", "غدًا، حين تطمئنُّ روحكِ في بيتكِ الجديد، ستسقطُ عنكِ كلُّ الدروعِ التي كنتِ ترتدينَها للحمايةِ من عواصفِ أهلك، وستكتشفينَ أنّكِ تملكينَ من اللينِ والرحمةِ ما يُغطّي بيتًا بأكمله.", "أنتِ لستِ فاقدةً للغةِ الحبّ، أنتِ فقط كنتِ تدّخرينَها لمن يستحقُّ أن يسمعها."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "لغةُ الودِّ تُخلَقُ لا تُورَّث", "paragraphs": ["خلاصةٌ تُحفظ غيابُ الأذى يرفعُ جدرانَ البيت، لكنَّ الرحمةَ هي التي تُنيرُ غرفه.. ولغةُ الودِّ ليست كلماتٍ نحفظُها من غيرنا، بل أفعالٌ تفيضُ من صدقِ قلوبنا.", "تقولُ منال: يا صاحبَ القلبِ الكبير.. جعلتَ من صمتي الذي كنتُ أخشاه مساحةً للسكينة، لا فجوةً للجفاء. أدركتُ الآنَ أن الحبَّ أفعالٌ تُبنى بالصبرِ واللينِ، لا كلماتٌ تُحفظ. لكنّني يا شيخي، كلّما فكّرتُ في ذلكَ \"البيتِ الجديد\"، شعرتُ بثقلِ حقائبي.. أحملُ في صدري ذكرياتٍ مريرة، ومخاوفَ كَبِرَتْ معي، وعاداتٍ أخشى أن تتسرَّبَ منّي دونَ وعي. كيفَ أُميّزُ بين ما يجبُ أن آخذَه معي كـ\"درس\"، وبين ما يجبُ أن أُلقيَه خلفَ ظهري قبلَ أن أعبرَ عتبةَ داري الجديدة؟"]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "لغةُ الودِّ تُخلَقُ لا تُورَّث", "paragraphs": ["هذا الثقلُ الذي تشعرينَ به يا منال هو علامةُ \"المسافرِ الحكيم\"؛ فالمغرورُ يظنُّ أنه يستطيعُ أن يُهرولَ نحوَ مستقبلِه دونَ أن يلتفتَ لماضيه، فيتعثّرُ بذاتِ الحجارةِ التي أسقطتْه من قبل.", "أمّا الحكيم، فهو الذي يجلسُ قبلَ الرحلة، يفتحُ حقائبَه على مَهَل، ويفرزُ محتواها قطعةً قطعة تحتَ ضوءِ الوعي."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "حقيبةُ الروح.. ماذا تأخذينَ وماذا تتركين؟", "paragraphs": ["تخيّلي أنّكِ تقفينَ على أعتابِ قصرٍ جديدٍ وجميل، ومعكِ حقائبُ قديمةٌ أتيتِ بها من بيتكِ المهدّم. بعضُ ما في هذه الحقائبِ هو \"ذهبٌ\" خالصٌ استخلصتِه من بينِ الأنقاض، وبعضُها الآخر ليس سوى \"رمادٍ\" وأوساخٍ ستُفسدُ سجّادَ قصركِ الجديد وتُكدّرُ هواءه.", "السرُّ يا ابنتي يكمنُ في الغربلة. إليكِ كيفَ تُميّزينَ بين الزادِ وبينَ العبء."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "أوّلًا: ما يجبُ أن تتركيه خلفكِ — الرماد", "paragraphs": ["اتركي \"رداءَ الضحيّة\". نعم، لقد أُوذيتِ، ونعم، كانَ الواقعُ قاسيًا، لكنَّ حملَ هذا الشعورِ إلى بيتكِ الجديد سيجعلكِ تتحسّسينَ من كلِّ كلمة، وتتوقّعينَ الغدرَ في كلِّ زاوية، وتطلبينَ تعويضًا من شريكِ حياتكِ عن ذنبٍ لم يرتكبه هو.", "اتركي \"أصداءَ الأصوات\". تلكَ الكلماتُ الجارحةُ التي قيلتْ لكِ: \"أنتِ فاشلة\"، \"لن تصلحي لشيء\"... هذه ليستْ حقيقتكِ، بل هي سمومٌ أفرغها أصحابُها فيكِ لأنَّ أوعيتَهم ضاقتْ بها. لا تُعطيها تذكرةَ عبورٍ إلى بيتكِ الجديد.", "اتركي \"توقُّعَ الكارثة\". البيئةُ المضطربةُ تُعلّمنا أنَّ الهدوءَ مجرَّدُ استراحةٍ بين عاصفتين. اتركي هذا الترقُّب، وتعلّمي أنَّ الهدوءَ يمكنُ أن يكونَ \"حالةً مستمرّة\"، وأنّه حقٌّ لكِ وليس فخًّا."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "ثانيًا: ما يجبُ أن تأخذيه معكِ — الذهب", "paragraphs": ["خذي \"قوّةَ النجاة\". أنتِ فتاةٌ لم تكسرها العواصف، وهذا يعني أنّكِ تملكينَ صلابةً داخليّةً وصبرًا لا يملكُه من عاشَ في دلالٍ دائم. هذه القوّةُ ستكونُ سندَكِ في مواجهةِ تحدّياتِ الحياةِ العاديّة.", "خذي \"المجسّاتِ الحسّاسة\". أنتِ تملكينَ قدرةً فائقةً على قراءةِ المشاعرِ قبلَ أن تُنطَق، لأنّكِ اعتدتِ مراقبةَ تقلُّباتِ الجوِّ في بيتكِ. استخدمي هذه القدرةَ غدًا لا للتجسُّسِ على الغضب، بل للاحتواءِ المبكِّر؛ لتشعري بتعبِ زوجكِ قبلَ أن يتكلَّم، ولتفهمي حاجةَ طفلكِ قبلَ أن يبكي.", "خذي \"خارطةَ الأخطاء\". تذكَّري جيّدًا تلك المواقفَ التي آلمتكِ، لا لتبكي عليها، بل لتكونَ هي \"كتيِّبَ التعليمات\" الذي يُخبركِ: \"هذا الطريقُ يُؤدّي إلى الهدم، سأسلكُ غيرَه.\""]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "ثانيًا: ما يجبُ أن تأخذيه معكِ — الذهب", "paragraphs": ["يا منال، البيتُ الجديدُ ليس مجرّدَ جدرانٍ وأثاث، بل هو بدايةٌ للزمن. حين تضعينَ قدمكِ على عتبته، ضعي الحقائبَ الثقيلةَ جانبًا، ولا تفتحي إلا ما فيه نفعٌ لغدكِ.", "أنتِ لا تذهبينَ هناكَ لتكوني \"امتدادًا\" لأمكِ أو أبيكِ، بل لتكوني الأصلَ لنسلكِ أنتِ.", "المسافرُ الحكيمُ لا يحملُ معه الحجارةَ التي تعثَّرَ بها، بل يحملُ \"الخبرةَ\" التي تجعلُه يتفاداها في المرّةِ القادمة."]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "ثانيًا: ما يجبُ أن تأخذيه معكِ — الذهب", "paragraphs": ["خلاصةٌ تُحفظ الذاكرةُ مستودع، فاجعليها مخزنًا للدروسِ لا مقبرةً للأوجاع.. خذي منها ما يُقوّي بناءكِ، واتركي فيها ما يأكلُ روحكِ.", "تقولُ منال: يا أستاذي، لقد جعلتَ لآلامي وظيفةً نبيلةً بعد أن كانت محضَ أثقالٍ تُقوِّسُ ظهري. \"مجسّاتٌ حسّاسة\"... والله لقد أصبتَ كبدَ الحقيقة؛ فقد كنتُ أظنُّ حذري المفرطَ وسرعةَ تأثُّري عيبًا أداريه، فإذا بكَ تجعلُهما أدواتِ بناءٍ تسبقُ الكلمات. سأحاولُ من الآنَ أن أُفرِّغَ حقائبي من \"رمادِ\" التوقُّعاتِ المظلمة، وأُبقي على \"ذهبِ\" الخبرة. لكنّني، وأنا أنظرُ إلى يديَّ الخاليتين، أتوجَّسُ خيفةً من فكرةِ \"الهندسة\"؛ فأنا ابنةُ القليل، لم أملكْ يومًا ترفَ التخطيطِ ولا بريقَ الشهادات.. فكيفَ لي، وأنا بهذه الإمكاناتِ البسيطة، أن أرسمَ خارطةً لحياةٍ واسعة؟ وكيفَ نصنعُ من \"اللاشيءِ\" حياةً تليقُ بالسكينةِ التي تصفها؟"]}, {"type": "reading", "chapterTag": "البابُ الثالث", "sectionTitle": "ثانيًا: ما يجبُ أن تأخذيه معكِ — الذهب", "paragraphs": ["لا تحتقري \"القليلَ\" الذي في يدكِ يا منال، فالبحرُ العظيم ما هو إلا قطراتٌ اجتمعت، والغابةُ الوارفةُ ما هي إلا بذورٌ صغيرةٌ صبَرَ عليها التراب.", "أنتِ تظنّينَ أنّكِ ابنةُ \"اللاشيء\" لأنّكِ تفتقدينَ بريقَ الشهاداتِ الورقية، لكنّكِ لا تدرينَ أنّكِ تملكينَ \"شهادةَ الحياة\" التي لم تمنحْها الجامعاتُ لمن يملكونَ المالَ ويفتقدونَ التجربة.", "لقد وصلنا إلى البابِ الأخيرِ في رحلتنا، حيث تتحوّلُ الرؤى إلى خطوات، والكلماتُ إلى واقع."]}, {"type": "chapter-opener", "chapterNumber": "الرابع", "title": "البابُ الرابع", "epigraph": "«ليستِ المدارسُ كلُّها بأسوار، ولا الشهاداتُ كلُّها بأوراق.. فمن قرأَ قلبَه في وحدته، فقد تخرَّجَ من أعظمِ جامعاتِ الأرض.»"}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "المدارسُ التي لا تمنحُ شهادات", "paragraphs": ["حين تنظرينَ إلى يديكِ الخاليتين، تذكّري أن القصورَ تُبنى من الطينِ والحجر، لكنَّ \"البيوتَ\" تُبنى من الأرواح.", "المهندسُ الذي يملكُ أحدثَ الأدواتِ والخرائط قد يبني جدارًا أصمَّ لا حياةَ فيه، أمّا المرأةُ التي مَحَّصها الألم، وصهرتْها التجارب، فهي تبني زوايا بيتها بحكمةٍ تجعلُ من الكوخِ الضيّقِ جنّةً يتسابقُ إليها الناسُ طلبًا للسكينة."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "مدرسةُ المصباحِ الخافت", "paragraphs": ["أنتِ لم تُكملي تعليمكِ المدرسيَّ، نعم.. ولكن، هل فكَّرتِ يومًا في \"المدرسة\" التي كنتِ تُديرينها في غرفتكِ تحت ضوءِ المصباحِ الخافت؟", "القراءةُ التي مارستِها بشغفٍ وأنتِ تهربينَ من الضجيج، هي أصدقُ أنواعِ التعليم؛ لأنّكِ لم تقرَئي لأجلِ \"علامةٍ\" في ورقة، بل قرأتِ لأجلِ \"علامةٍ\" في روحك.", "الفهمُ الذي وصلَ بكِ إلى حدِّ التساؤلِ عن \"بناءِ الذات\" هو تفوُّقٌ عقليٌّ لا تمنحُه كلُّ المناهجِ الجافّة."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "الهندسةُ التي لا تحتاجُ مسطرة", "paragraphs": ["هندسةُ الحياة يا ابنتي لا تحتاجُ إلى مساطرَ وخرائطَ معقّدة، بل تحتاجُ إلى \"وعيِ اللحظة\".", "المثقّفُ الحقيقيُّ ليس من يحفظُ الكتب، بل من يعرفُ كيف يُحوِّلُ الكتابَ إلى \"خُلق\"؛ من يعرفُ كيف يصمتُ حينَ يشتعلُ الغضب، وكيفَ يبتسمُ حينَ تضيقُ الدنيا، وكيفَ يُديرُ ميزانيّةً بسيطةً بكرامةٍ لا تُشعرُ أحدًا بالفقر.", "هذه هي الهندسةُ التي ستجعلُ بيتكِ المستقبليَّ مختلفًا عن كلِّ ما رأيتِ."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "الهندسةُ التي لا تحتاجُ مسطرة", "paragraphs": ["لا تملكينَ شهادة؟ اجعلي \"حكمتكِ\" هي شهادتك.", "لا تملكينَ مالًا؟ اجعلي \"تدبيركِ\" هو ثروتك.", "لا تملكينَ جاهًا؟ اجعلي \"سكينتكِ\" هي هيبتك."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "الهندسةُ التي لا تحتاجُ مسطرة", "paragraphs": ["القارئُ الذكيُّ مثلكِ لا يحتاجُ إلى من يُلقِّنُه كيفَ يعيش، بل يحتاجُ فقط إلى أن يثقَ بأن الأدواتِ التي صنعَها في سنواتِ عزلته هي أدواتٌ جبّارة، تكفي لبناءِ أعظمِ حياة.", "خلاصةٌ تُحفظ ليستِ المدارسُ كلُّها بأسوار، ولا الشهاداتُ كلُّها بأوراق.. فمن قرأَ قلبَه في وحدته، فقد تخرَّجَ من أعظمِ جامعاتِ الأرض."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "زادُ الطريقِ الصغير.. كيف نصنعُ من القليلِ حياة؟", "paragraphs": ["تخيّلي أنّكِ تسيرينَ في طريقٍ مظلمٍ طويل، ولا تملكينَ إلا مصباحًا صغيرًا لا يُضيءُ لكِ إلا موضعَ قدمكِ التالية.", "هل تجلسينَ في مكانكِ تبكينَ لأن المصباحَ لا يُضيءُ نهايةَ الطريق؟ أم تتقدّمينَ خطوةً واحدة، فتجدينَ أن المصباحَ قد أضاءَ لكِ الخطوةَ التي بعدها؟", "هكذا هي الحياةُ التي تليقُ بكِ يا منال؛ لا تُبنى بضربةِ حظ، ولا بخطّةٍ سحريّةٍ واسعة، بل تُبنى بـ\"الزادِ الصغير\" اليومي."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "تدبيرُ التفاصيلِ الصغيرة", "paragraphs": ["صناعةُ الحياةِ من \"اللاشيء\" تبدأُ من إدارةِ التفاصيلِ البسيطةِ بجمال:", "ترتيبُ الوقت: حين تنظّمينَ ساعاتِ يومكِ في بيتكِ البسيط، أنتِ تتدرّبينَ على إدارةِ مملكتكِ الكبرى غدًا.", "- تجويدُ العمل: حين تطبخينَ طعامًا، أو ترتّبينَ ركنًا، افعليه بحبٍّ وإتقان، وكأنّكِ ترسمينَ لوحةً فنّيّة. هذا الإتقانُ هو الذي سيجعلُ من بيتكِ بيئةً منظّمةً تُريحُ الأعصابَ وتطردُ الفوضى."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "تدبيرُ التفاصيلِ الصغيرة", "paragraphs": ["- تغذيةُ العقل: صفحةٌ واحدةٌ من كتابٍ جيّدٍ كلَّ يوم، هي حجرُ بناءٍ جديدٍ في وعيك.", "- الادّخارُ النفسيّ: كلُّ دقيقةٍ تقضينَها في سكينةٍ داخلَ خيمتكِ، هي رصيدٌ من الهدوءِ ستسحبينَ منه يومَ يطرقُ القلقُ بابك."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "الروحُ العظيمةُ تصنعُ من القليلِ كثيرًا", "paragraphs": ["أنتِ لستِ بحاجةٍ إلى \"إمكاناتٍ\" لتكوني سيّدةً عظيمة، أنتِ بحاجةٍ إلى \"روحٍ\" عظيمة.", "والروحُ العظيمةُ هي التي تعرفُ كيف تجعلُ من الخبزِ والملحِ مائدةً شهيّة، ومن الكلمةِ الطيّبةِ ركنًا دافئًا، ومن الصبرِ سلاحًا لا يُهزَم.", "بيتُكِ القادمُ لن يكونَ \"بيتًا سعيدًا\" لأنه فخم، بل سيكونُ كذلك لأنّكِ أنتِ من تسكنينَه؛ أنتِ التي عرفتِ قيمةَ الكلمة، وقدّستِ الهدوء، وحوّلتِ \"عدمَ\" الإمكاناتِ إلى \"قوّةِ\" الإرادة."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "الروحُ العظيمةُ تصنعُ من القليلِ كثيرًا", "paragraphs": ["خلاصةٌ تُحفظ لا يهمُّ كم تملكُ من الوسائل، المهمُّ كم تملكُ من المعنى.. فالقليلُ ببركةِ الحكمةِ كثير، والكثيرُ بغيابِ الروحِ هباء."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "الروحُ العظيمةُ تصنعُ من القليلِ كثيرًا", "paragraphs": ["تقولُ منال: أيها الحكيم، وضعتَ المصباحَ في يدي، وعلّمتني أن الخطوةَ الواحدةَ تكفي.. لقد كنتُ أحتقرُ ساعاتي التي أقضيها في ترتيبِ زوايا بيتنا المتواضع أو القراءةِ في كتبي القديمة، وأراها مجرّدَ \"انتظارٍ\" باهتٍ لقطارِ الحياة، فإذا بك تخبرني أنها هي \"الحياةُ\" ذاتُها، وهي تدريبي الأغلى على رعايةِ الجمالِ وسطَ الركام. سأكفُّ عن النظرِ ليديَّ الخاليتينِ من الأوراقِ الملوّنة، وأبدأُ بالنظرِ إلى النورِ الذي بدأ يسطعُ في وعيي. أشعرُ الآنَ كأنّني تلك البذرةُ التي كانت تخشى العتمة، فإذا بها تدركُ أن الضغطَ لم يكن ليخنقها، بل ليُقوِّيَ ساقَها لتشقَّ الأرض. أريدُ منك الآن وصيّتكَ الأخيرة، تلك الكلمةَ التي أضعها تاجًا على رأسي حين يجيءُ يومي المنتظر، وأخرجُ من \"خيمةِ الورق\" إلى \"بيتِ الواقع\".. هل حانَ وقتُ إزهارِ الوردة؟"]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "الروحُ العظيمةُ تصنعُ من القليلِ كثيرًا", "paragraphs": ["نعم يا منال، حانَ وقتُ الإزهار؛ فالبذرةُ التي شقّتْ صخرةَ الخوفِ والجهل لا تستأذنُ أحدًا لتعانقَ الضياء.", "أنتِ اليومَ لستِ تلك الفتاةَ التي بدأتْ معنا الرحلةَ بقلبٍ يرتجف، بل أنتِ \"صانعةُ حياةٍ\" نضجتْ قبلَ الأوان، وتزيّنتْ بالحكمةِ قبلَ أن تتزيّنَ بالذهب.", "إليكِ الإضاءةَ الأخيرة، لغةَ الختامِ وفاتحةَ العمل."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "حينَ تُزهرُ الوردة.. العهدُ الجديد", "paragraphs": ["يقولونَ يا ابنتي إن البيوتَ تُبنى على الأرض، وأنا أقولُ لكِ إن البيوتَ تُبنى في \"الأرواحِ\" أوّلًا.", "غدًا، حين تضعينَ قدمكِ على عتبةِ داركِ الجديدة، لن تكوني مجرّدَ \"زوجةٍ\" تنتظرُ من يُسعدها، بل ستكونينَ \"المصدرَ\" الذي يفيضُ بالسعادة.", "تلك اللحظةُ التي تخرجينَ فيها من بيتِ الصراخِ إلى بيتِ السكينة هي لحظةُ \"العهد\"."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "حينَ تُزهرُ الوردة.. العهدُ الجديد", "paragraphs": ["لا تلتفتي وراءكِ بحقد، بل انظري بخفّة؛ فكلُّ ما مرَّ بكِ كان \"صقلًا\" لجوهرك. لولا عتمةُ بيتكِ القديم، لما عرفتِ كيف تُقدِّسينَ النور. ولولا جفافُ العاطفةِ الذي عشتِه، لما عرفتِ كيف ترْوينَ قلوبَ من حولكِ بالرحمة.", "وصيّتي لكِ، وتاجُها الذي طلبتِ، أوجزُها لكِ في ثلاث:"]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "أوّلًا: كوني \"الملاذَ\" لا \"القاضي\"", "paragraphs": ["في بيتكِ الجديد، اجعلي من صوتكِ رداءً دافئًا. لا تجعلي من الحوارِ محاكمة، ولا من الخلافِ معركة. تذكّري دائمًا أن الكلمةَ التي لا تخرج، لا تُحدثُ جرحًا.", "كوني ذلكَ الحضنَ الذي يفرُّ إليه زوجكِ وأطفالكِ من هجيرِ الدنيا، لا الذي يفرّونَ منه."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "ثانيًا: قُدسيّةُ \"الجوِّ النفسيّ\"", "paragraphs": ["البيتُ ليس نظافةَ الجدران، بل طهارةَ الأنفاس. عاهدي نفسكِ ألّا يدخلَ \"سمُّ\" الصراخِ إلى بيتكِ أبدًا.", "إن ضاقتْ بكِ السبل، فاعتزلي في \"خيمتكِ\" حتى تهدئي، ثم اخرجي بوجهٍ طلق.", "تذكّري أن أطفالكِ سيشربون \"هدوءَكِ\" قبل أن يشربوا الحليب، وسيتعلّمون \"السكينةَ\" من نظرةِ عينيكِ قبل أن يتعلّموا الحروف."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "ثالثًا: أنتِ \"الأصل\" الجديد", "paragraphs": ["انسَيْ تمامًا جملةَ \"هكذا وجدنا آباءنا\". أنتِ اليومَ تبدئينَ تاريخًا جديدًا لسلالتكِ.", "كلُّ فعلِ حُبٍّ، وكلُّ جلسةِ حوار، وكلُّ ضحكةٍ صافيةٍ في بيتكِ، هي مسمارٌ يُدقُّ في نعشِ الماضي المرير.", "أنتِ لستِ \"ضحيّة\" بعد الآن، أنتِ \"المؤسِّسة\" لجيلٍ سيعرفُ المعنى الحقيقيَّ لكلمةِ \"بيت\"."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "ثالثًا: أنتِ \"الأصل\" الجديد", "paragraphs": ["يا منال... الوردةُ التي تنبتُ في الصخر تكون رائحتُها أزكى، وقوّتُها أعظم. لقد تعلّمتِ في \"ركنكِ الضيّق\" ما لم يتعلّمْه الكثيرون في القصور.", "فامضِ ببركةِ الله، وضعي يدَكِ في يدِ النصيبِ بقلبٍ مطمئن، وعينٍ تُبصرُ الجمالَ في كلِّ شيء.", "لقد انتهتْ كلماتُ الكتاب، لكنَّ رحلتكِ الحقيقيّةَ بدأتِ الآن."]}, {"type": "reading", "chapterTag": "البابُ الرابع", "sectionTitle": "ثالثًا: أنتِ \"الأصل\" الجديد", "paragraphs": ["استودعُ اللهَ قلبكِ، وعقلكِ، وبيتكِ الذي سيُضيءُ يومًا ما ويقول للعابرين: \"هنا تسكنُ منال... هنا يسكنُ السلام.\"", "خلاصةٌ تُحفظُ في القلب البيوتُ العظيمةُ لا تُبنى بالرخام، بل بالرحمة.. والمرأةُ الحكيمةُ هي التي تُحوّلُ رمادَ الماضي إلى وقودٍ يُنيرُ حاضرَها ومستقبلَ أطفالها.", "تمّتِ الرحلة... وبدأ البناء."]}, {"type": "chapter-opener", "chapterNumber": "الخاتمة", "title": "خاتمةُ الرحلة", "epigraph": "«لقد صارَ لي الآنَ وطنٌ في داخلي، قبلَ أن أملكَ دارًا على الأرض.. وتعلّمتُ كيفَ أُزهرُ حتى لو كانتِ التربةُ صخرًا.»"}, {"type": "reading", "chapterTag": "خاتمةُ الرحلة", "sectionTitle": "كلمةُ منال الأخيرة.. على عتبةِ الفجر", "paragraphs": ["أُغلقُ الكتابَ الآن... ولا أشعرُ بوزنِ الورقِ في يدي، بل أشعرُ بوزنِ الأملِ في قلبي.", "يا صاحبي، ويا من أمسكتَ بيدي حين كادَ الضجيجُ يبتلعني...", "لقد جئتُ إليك وأنا أظنّني \"بقايا\" إنسان، فخرجتُ من بين كلماتك وأنا أشعرُ أنّني \"بدايةُ\" أُمّة. لم أعدْ تلك الفتاةَ التي تسدُّ أذنيها عن الصراخِ هربًا، بل صرتُ تلك المرأةَ التي ستُعلّمُ الصمتَ كيف ينطقُ بالرحمة، والبيوتَ كيف تمتلئُ بالسكينة."]}, {"type": "reading", "chapterTag": "خاتمةُ الرحلة", "sectionTitle": "كلمةُ منال الأخيرة.. على عتبةِ الفجر", "paragraphs": ["سأحملُ وصاياكَ الثلاثَ كما يحملُ المسافرُ في عتمةِ الليلِ سراجًا لا ينطفئ.", "لن أكون \"امتدادًا\" للألم، بل سأكونُ \"الحدَّ الفاصل\" الذي ينتهي عنده الوجع، ويبدأ منه الودّ.", "سأبني ذلك البيتَ الذي حلمتُ به، حجرًا من صبري، وسقفًا من صلاتي، وروحًا استمدّتْ نورَها من صدقِ كلماتك."]}, {"type": "reading", "chapterTag": "خاتمةُ الرحلة", "sectionTitle": "كلمةُ منال الأخيرة.. على عتبةِ الفجر", "paragraphs": ["سأضعُ الكتابَ جانبًا لحظة... دعني أتنفّسُ مع هذه الفكرةِ الأخيرة.", "لقد صار لي الآن \"وطنٌ\" في داخلي، قبلَ أن أملكَ دارًا على الأرض.", "شكرًا لأنّك لم تُعلّمني كيف أقرأُ الكتب، بل علّمتني كيف أقرأُ نفسي... وكيف أُزهرُ، حتى لو كانت التربةُ صخرًا."]}, {"type": "reading", "chapterTag": "خاتمةُ الرحلة", "sectionTitle": "كلمةُ منال الأخيرة.. على عتبةِ الفجر", "paragraphs": ["سأقومُ الآن... أُطفئُ مصباحي الخافت، لأستقبلَ فجرَ حياتي الجديدةِ بقلبٍ لا يرتجف.", "استودعتُكَ اللهَ يا صاحبَ القلبِ الكبير...", "ولقاؤنا في دعواتِ الغيب."]}, {"type": "reading", "chapterTag": "خاتمةُ الرحلة", "sectionTitle": "كلمةُ منال الأخيرة.. على عتبةِ الفجر", "paragraphs": ["تمّ بحمدِ الله"]}, {"type": "closing", "title": "تمّتِ الرحلة... وبدأ البناء.", "subtitle": "خيمةٌ في القلب — رحلةُ منال إلى ذاتها"}]};

  night: {
    "--bg-primary": "#1A1118",
    "--bg-secondary": "#251822",
    "--bg-soft-rose": "#321E2D",
    "--bg-pearl-gold": "#2D221E",
    "--accent-rose": "#E598B2",
    "--accent-rose-light": "#F0B4C8",
    "--accent-gold": "#E2B86B",
    "--text-primary": "#F6ECF0",
    "--text-secondary": "#C4A8B4"
  }
};

let state = { page: 0, currentPage: 0, bookmarks: [], theme: "ivory", fontSize: 21, fontFamily: '"Amiri","Noto Naskh Arabic",serif' };
try {
  const saved = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
  if (saved) {
    state = { ...state, ...saved };
    if (typeof saved.page === "number") state.currentPage = saved.page;
    else if (typeof saved.currentPage === "number") state.page = saved.currentPage;
  }
} catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function saveState() {
  state.currentPage = state.page;
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  } catch (e) {}
  try {
    if (window.MaktabatiBridge && window.MaktabatiBridge.onPageChanged) {
      window.MaktabatiBridge.onPageChanged(state.page + 1, BOOK_DATA.pages.length);
    }
  } catch (e) {}
}

function applyPrefs() {
  const t = themes[state.theme] || themes.ivory;
  Object.entries(t).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
  document.documentElement.style.setProperty("--reader-font", state.fontSize + "px");
  document.documentElement.style.setProperty("--reader-family", state.fontFamily);
  if ($("fontSize")) $("fontSize").value = state.fontSize;
  if ($("fontFamily")) $("fontFamily").value = state.fontFamily;
  document.querySelectorAll(".theme-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.theme === state.theme);
  });
}

function formatParagraph(pText) {
  const raw = String(pText ?? "").trim();
  if (!raw) return "";
  if (raw.startsWith("خلاصةٌ تُحفظ")) {
    const body = raw.replace(/^خلاصةٌ تُحفظ(?:ُ في القلب)?\s*/, "");
    return '<div class="wisdom-pearl"><div class="wisdom-badge">✦ خلاصةٌ تُحفظ في القلب ✦</div><div>' + esc(body) + '</div></div>';
  }
  if (raw.startsWith("تقولُ منال:")) {
    const body = raw.replace(/^تقولُ منال:\s*/, "");
    return '<div class="manal-voice"><div class="manal-badge">✿ بَوْحُ مَنَال</div><div>' + esc(body) + '</div></div>';
  }
  return "<p>" + esc(raw) + "</p>";
}

function paragraphHtml(arr) {
  return (arr || []).map(formatParagraph).join("");
}

function tocEntries() {
  const entries = [];
  let lastSection = "";
  BOOK_DATA.pages.forEach((p, i) => {
    if (p.type === "chapter-opener") {
      entries.push({ p, i, isChapter: true, label: (p.chapterNumber ? "الباب " + p.chapterNumber + ": " : "") + (p.title || "") });
    } else if (p.type === "reading" && p.sectionTitle && p.sectionTitle !== lastSection) {
      lastSection = p.sectionTitle;
      entries.push({ p, i, isChapter: false, label: p.sectionTitle });
    }
  });
  return entries;
}

function renderToc() {
  const items = tocEntries();
  $("tocList").innerHTML = items.map(({ i, isChapter, label }) =>
    '<button class="toc-item ' + (isChapter ? "toc-chapter" : "") + '" data-go="' + i + '"><span>' + (isChapter ? "✿ " : "◦ ") + esc(label) + '</span><small>ص ' + (i + 1) + '</small></button>'
  ).join("");
}

const renderedCache = {};

function buildSinglePageMarkup(p, i) {
  if (renderedCache[i]) return renderedCache[i];
  let out = "";
  if (p.type === "cover") {
    out = '<article class="page cover-page">' +
      '<div class="cover-crest"><svg width="36" height="36" viewBox="0 0 48 48" fill="none"><path d="M24 6C27 14 34 19 42 22C34 25 27 30 24 38C21 30 14 25 6 22C14 19 21 14 24 6Z" stroke="#C49148" stroke-width="2" fill="rgba(158,59,90,0.12)"/><circle cx="24" cy="22" r="4" fill="#9E3B5A"/></svg></div>' +
      '<div class="eyebrow">✿ رحلةٌ إلى السكينةِ وبناءِ الذات ✿</div>' +
      '<h1>' + esc(p.title) + '</h1>' +
      '<p class="subtitle">' + esc(p.subtitle) + '</p>' +
      '<div class="ornament">✦ ❀ ✦</div>' +
      '<p class="author">' + esc(p.author) + '</p>' +
      '<button class="primary-btn" onclick="nextPage()">افتحي خيمتكِ ‹</button>' +
    '</article>';
  } else if (p.type === "dedication") {
    out = '<article class="page dedication">' +
      '<div class="eyebrow">✿ إهداءٌ من القلب ✿</div>' +
      '<h1>إلى كلِّ قلبٍ أنثويٍّ يبحثُ عن السكينة</h1>' +
      '<div class="ornament">✦ ❀ ✦</div>' +
      paragraphHtml(p.paragraphs) +
    '</article>';
  } else if (p.type === "toc") {
    out = '<article class="page">' +
      '<div class="eyebrow">✿ خارطةُ القراءة ✿</div>' +
      '<h1>' + esc(p.title || "فهرسُ الرحلة") + '</h1>' +
      '<p>اختاري بابًا أو محطةً للانتقالِ مباشرةً إلى موضعها:</p>' +
      '<div class="toc-list">' + tocEntries().map(({ i: ti, isChapter, label }) =>
        '<button class="toc-item ' + (isChapter ? "toc-chapter" : "") + '" data-go="' + ti + '"><span>' + (isChapter ? "✿ " : "◦ ") + esc(label) + '</span><small>ص ' + (ti + 1) + '</small></button>'
      ).join("") + '</div>' +
    '</article>';
  } else if (p.type === "chapter-opener") {
    out = '<article class="page opener">' +
      '<div class="chapter-number">✿ ' + esc(p.chapterNumber || "من الرحلة") + ' ✿</div>' +
      '<div class="ornament">✦ ✧ ✦</div>' +
      '<h1>' + esc(p.title) + '</h1>' +
      (p.epigraph ? '<div class="quote-card"><div class="quote-text">' + esc(p.epigraph) + '</div></div>' : '') +
      '<div class="ornament">❀ ❀ ❀</div>' +
    '</article>';
  } else if (p.type === "reading") {
    out = '<article class="page reading">' +
      '<div class="reading-header">' +
        '<div class="chapter-tag"><span>✿</span><span>' + esc(p.chapterTag || "خيمةٌ في القلب") + '</span></div>' +
        (p.sectionTitle ? '<h2 class="section-title">' + esc(p.sectionTitle) + '</h2>' : '') +
      '</div>' +
      paragraphHtml(p.paragraphs) +
      (p.pullquote ? '<blockquote class="pullquote">' + esc(p.pullquote) + '</blockquote>' : '') +
      (p.afterParagraphs ? paragraphHtml(p.afterParagraphs) : '') +
    '</article>';
  } else if (p.type === "quote-showcase") {
    out = '<article class="page">' +
      '<div style="text-align:center"><div class="eyebrow">✿ إضاءةٌ على العتبة ✿</div></div>' +
      '<div class="quote-card">' +
        '<div class="quote-text">' + esc(p.quote) + '</div>' +
        '<div class="quote-caption">✦ ' + esc(p.caption || "") + ' ✦</div>' +
      '</div>' +
    '</article>';
  } else if (p.type === "closing") {
    out = '<article class="page closing">' +
      '<div class="eyebrow">✿ مسكُ الختام ✿</div>' +
      '<div class="ornament">✧ ❀ ✧</div>' +
      '<h1>' + esc(p.title || "تمّتِ الرحلة") + '</h1>' +
      '<p>' + esc(p.subtitle || "") + '</p>' +
      '<div class="ornament">✦ ❀ ✦</div>' +
      '<button class="primary-btn" onclick="goToPage(0)">العودةُ إلى الغلاف</button>' +
    '</article>';
  } else {
    out = '<article class="page">' + paragraphHtml(p.paragraphs || [p.content || p.text || ""]) + '</article>';
  }
  renderedCache[i] = out;
  return out;
}

function renderCurrentPage() {
  const i = Math.max(0, Math.min(BOOK_DATA.pages.length - 1, state.page));
  state.page = i;
  state.currentPage = i;
  const p = BOOK_DATA.pages[i];
  const out = buildSinglePageMarkup(p, i);
  $("pageCanvas").innerHTML = out + '<div class="progress"><span style="width:' + (((i + 1) / BOOK_DATA.pages.length) * 100) + '%"></span></div>';
  $("pageCounter").textContent = (i + 1) + " / " + BOOK_DATA.pages.length;
  $("prevBtn").disabled = i === 0;
  $("nextBtn").disabled = i === BOOK_DATA.pages.length - 1;
  const isBm = state.bookmarks.includes(i);
  $("bookmarkBtn").textContent = isBm ? "★" : "☆";
  $("bookmarkBtn").classList.toggle("bookmarked", isBm);
  saveState();
  $("bookStage").scrollTop = 0;
}

function goToPage(index) {
  state.page = Math.max(0, Math.min(BOOK_DATA.pages.length - 1, index));
  state.currentPage = state.page;
  renderCurrentPage();
  closePanels();
}
function nextPage() { goToPage(state.page + 1); }
function prevPage() { goToPage(state.page - 1); }
window.goToPage = goToPage;
window.nextPage = nextPage;
window.prevPage = prevPage;

$("nextBtn").onclick = nextPage;
$("prevBtn").onclick = prevPage;

function openPanel(id) {
  $(id).classList.add("open");
  if (id === "searchPanel") setTimeout(() => $("searchInput").focus(), 100);
}
function closePanels() {
  document.querySelectorAll(".overlay").forEach(x => x.classList.remove("open"));
}
$("tocOpen").onclick = () => openPanel("tocPanel");
$("settingsOpen").onclick = () => openPanel("settingsPanel");
$("searchOpen").onclick = () => openPanel("searchPanel");
document.querySelectorAll(".closePanel").forEach(b => b.onclick = closePanels);
document.querySelectorAll(".overlay").forEach(o => o.addEventListener("click", e => { if (e.target === o) closePanels(); }));

$("bookmarkBtn").onclick = () => {
  const i = state.page;
  state.bookmarks = state.bookmarks.includes(i) ? state.bookmarks.filter(n => n !== i) : [...state.bookmarks, i];
  saveState();
  renderCurrentPage();
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b) goToPage(Number(b.dataset.go));
});

$("fontSize").oninput = e => { state.fontSize = Number(e.target.value); applyPrefs(); saveState(); };
$("fontFamily").onchange = e => { state.fontFamily = e.target.value; applyPrefs(); saveState(); };
document.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { state.theme = b.dataset.theme; applyPrefs(); saveState(); });

let searchTimer;
const norm = s => String(s || "").toLocaleLowerCase("ar").replace(/[ًٌٍَُِّْـ]/g, "");
function searchable(p) {
  return [p.title, p.subtitle, p.author, p.chapterTag, p.sectionTitle, p.epigraph, p.quote, p.caption, p.content, p.text, ...(p.paragraphs || []), ...(p.afterParagraphs || [])].filter(Boolean).join(" ");
}
$("searchInput").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const q = norm($("searchInput").value.trim());
    if (!q) { $("searchResults").innerHTML = ""; return; }
    const hits = [];
    BOOK_DATA.pages.forEach((p, i) => {
      const t = searchable(p);
      const pos = norm(t).indexOf(q);
      if (pos >= 0) hits.push({ i, p, t, pos });
    });
    $("searchResults").innerHTML = hits.length
      ? hits.slice(0, 80).map(h => '<div class="search-result" data-go="' + h.i + '"><strong>✿ ' + esc(h.p.sectionTitle || h.p.title || h.p.chapterTag || "صفحة") + '</strong><small>صفحة ' + (h.i + 1) + ' · ' + esc(h.t.slice(Math.max(0, h.pos - 35), h.pos + 95)) + '</small></div>').join("")
      : '<p class="empty">لا توجد نتائج مطابقة.</p>';
  }, 180);
});

document.addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  if (e.key === "ArrowRight") { document.documentElement.dir === "rtl" ? prevPage() : nextPage(); }
  else if (e.key === "ArrowLeft") { document.documentElement.dir === "rtl" ? nextPage() : prevPage(); }
  else if (e.key === "ArrowDown" && $("bookStage").scrollTop + $("bookStage").clientHeight >= $("bookStage").scrollHeight - 3) nextPage();
  else if (e.key === "ArrowUp" && $("bookStage").scrollTop <= 0) prevPage();
  else if (e.key === "Escape") closePanels();
});

let touchX = 0, touchY = 0;
const stage = $("bookStage");
stage.addEventListener("touchstart", e => {
  const t = e.changedTouches[0];
  touchX = t.clientX;
  touchY = t.clientY;
}, { passive: true });
stage.addEventListener("touchend", e => {
  const t = e.changedTouches[0], dx = t.clientX - touchX, dy = t.clientY - touchY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 50) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0) nextPage(); else prevPage();
  } else if (dy < 0 && stage.scrollTop + stage.clientHeight >= stage.scrollHeight - 4) {
    nextPage();
  } else if (dy > 0 && stage.scrollTop <= 2) {
    prevPage();
  }
}, { passive: true });

applyPrefs();
renderCurrentPage();
setTimeout(() => {
  renderToc();
  let warmIdx = 0;
  function warmBatch() {
    const end = Math.min(BOOK_DATA.pages.length, warmIdx + 8);
    for (let k = warmIdx; k < end; k++) {
      buildSinglePageMarkup(BOOK_DATA.pages[k], k);
    }
    warmIdx = end;
    if (warmIdx < BOOK_DATA.pages.length) setTimeout(warmBatch, 20);
  }
  warmBatch();
}, 16);
</script>
</body>
</html>
