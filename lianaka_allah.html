<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover"/>
  <meta name="theme-color" content="#F8F4E8"/>
  <meta name="color-scheme" content="light"/>
  <meta name="author" content="علي بن جابر الفيفي"/>
  <meta name="description" content="رحلة إلى السماء السابعة"/>
  <title>لأنك الله — رحلة إلى السماء السابعة</title>
  <style>
    @font-face { font-family: "Amiri"; src: url("https://maktabati.app/assets/fonts/amiri/amiri-400.woff2") format("woff2"), url("https://maktabati.app/fonts/amiri.ttf") format("truetype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Amiri"; src: url("https://maktabati.app/assets/fonts/amiri/amiri-700.woff2") format("woff2"), url("https://maktabati.app/fonts/amiri.ttf") format("truetype"); font-weight: 700; font-display: block; }
    @font-face { font-family: "Noto Naskh Arabic"; src: url("https://maktabati.app/assets/fonts/noto-naskh-arabic/noto-naskh-arabic-400.woff2") format("woff2"), url("https://maktabati.app/fonts/noto_naskh_arabic.ttf") format("truetype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Noto Naskh Arabic"; src: url("https://maktabati.app/assets/fonts/noto-naskh-arabic/noto-naskh-arabic-700.woff2") format("woff2"), url("https://maktabati.app/fonts/noto_naskh_arabic.ttf") format("truetype"); font-weight: 700; font-display: block; }
    @font-face { font-family: "Aref Ruqaa"; src: url("https://maktabati.app/assets/fonts/aref-ruqaa/aref-ruqaa-400.woff2") format("woff2"), url("https://maktabati.app/fonts/aref_ruqaa.ttf") format("truetype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Aref Ruqaa"; src: url("https://maktabati.app/assets/fonts/aref-ruqaa/aref-ruqaa-700.woff2") format("woff2"), url("https://maktabati.app/fonts/aref_ruqaa.ttf") format("truetype"); font-weight: 700; font-display: block; }
    @font-face { font-family: "Amiri Quran"; src: url("https://maktabati.app/fonts/amiri_quran.ttf") format("truetype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Scheherazade New"; src: url("https://maktabati.app/fonts/scheherazade_new.ttf") format("truetype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Markazi Text"; src: url("https://maktabati.app/fonts/markazi_text.ttf") format("truetype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "El Messiri"; src: url("https://maktabati.app/fonts/el_messiri.ttf") format("truetype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Tajawal"; src: url("https://maktabati.app/fonts/tajawal.ttf") format("truetype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Cairo"; src: url("https://maktabati.app/fonts/cairo.ttf") format("truetype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Noto Sans Arabic"; src: url("https://maktabati.app/assets/fonts/noto-sans-arabic/noto-sans-arabic-400.woff2") format("woff2"), url("https://maktabati.app/fonts/noto_sans_arabic.ttf") format("truetype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Noto Kufi Arabic"; src: url("https://maktabati.app/assets/fonts/noto-kufi-arabic/noto-kufi-arabic-700.woff2") format("woff2"), url("https://maktabati.app/fonts/noto_kufi_arabic.ttf") format("truetype"); font-weight: 700; font-display: block; }

    :root {
      --bg-primary: #F8F4E8; --bg-secondary: #FFFDF7; --paper-bg: #FFFDF7; --bg-card: #FFFDF7;
      --bg-soft-rose: #ECF6F1; --bg-soft-sage: #F3EFE2; --bg-pearl-gold: #FBF3E0;
      --accent-rose: #065F46; --accent-rose-dark: #044332; --accent-rose-light: #348F73;
      --accent-sage: #785323; --accent-sage-dark: #4D3414; --accent-gold: #B47B26;
      --accent-gold-soft: rgba(180,123,38,0.26);
      --text-primary: #1E2923; --ink-main: #1E2923; --text-secondary: #4B5E54;
      --line: rgba(180,140,110,0.20); --border-ornate: rgba(180,123,38,0.36);
      --paper-edge: #D8CEB8; --shadow-card: 0 16px 42px rgba(20,30,25,0.07);
      --reader-base-font: 21px; --reader-font: 21px; --reader-font-size: 100%; --font-scale: 1;
      --font-body: "Noto Naskh Arabic", "Amiri", serif;
      --font-headings: "Aref Ruqaa", "El Messiri", serif;
      --font-chapter-titles: "Noto Kufi Arabic", "Aref Ruqaa", sans-serif;
      --font-quotes: "Amiri", "Scheherazade New", serif;
      --font-quran: "Amiri Quran", "Scheherazade New", "Amiri", serif;
      --font-interface: "Noto Sans Arabic", "Cairo", sans-serif;
      --font-numbers: "Noto Sans Arabic", "Cairo", sans-serif;
      --reader-family: var(--font-body);
      color-scheme: light;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; max-width: 100%; overflow-wrap: anywhere; }
    html, body, .app { touch-action: pan-y pinch-zoom !important; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); }
    button, input, select, textarea { touch-action: manipulation; font: inherit; }
    .app { height: 100vh; height: 100dvh; max-height: 100dvh; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(155deg, var(--bg-primary), var(--bg-secondary) 55%, var(--bg-soft-rose) 100%); }

    .top-bar { height: 56px; min-height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(10px, 2.5vw, 18px); gap: 8px; background: var(--bg-secondary); border-bottom: 1px solid var(--line); z-index: 10; box-shadow: 0 3px 14px rgba(0,0,0,0.04); }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--accent-rose-dark); font-family: var(--font-interface); font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-gem { width: 30px; height: 30px; flex: 0 0 30px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: linear-gradient(135deg, var(--accent-rose), var(--accent-rose-dark)); font-size: 14px; box-shadow: 0 3px 9px rgba(0,0,0,0.14); }
    .tools { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
    .icon-btn, .nav-btn { border: 1px solid var(--line); background: var(--bg-primary); color: var(--accent-rose-dark); border-radius: 11px; min-width: 38px; min-height: 38px; padding: 5px 8px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-interface); font-size: 12.5px; font-weight: 700; cursor: pointer; transition: background .18s, border-color .18s, transform .15s; }
    .icon-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .icon-btn:active, .nav-btn:active { transform: scale(0.96); }
    .icon-btn.bookmarked { background: var(--bg-pearl-gold); color: var(--accent-gold); border-color: var(--accent-gold); }

    .running-header { height: 34px; min-height: 34px; flex: 0 0 34px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 2px 14px; background: var(--accent-rose-dark); color: #FAF4EF; border-bottom: 2px solid var(--accent-gold); font-family: var(--font-interface); font-size: 11px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .running-header[hidden] { display: none; }
    .running-header-mark { color: #FDE68A; overflow: hidden; text-overflow: ellipsis; }

    .book-stage { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; scroll-behavior: auto !important; overflow-anchor: none !important; padding: clamp(12px, 2.8vw, 22px); display: flex; justify-content: center; align-items: flex-start; perspective: 1200px; }
    .page-canvas { width: min(100%, 750px); min-height: 100%; height: auto; margin: 0 auto; background: var(--bg-secondary); border: 1.5px solid var(--paper-edge); border-radius: 18px; padding: clamp(22px, 4.5vw, 36px) clamp(16px, 4.5vw, 40px) clamp(24px, 4.5vw, 40px); padding-top: clamp(22px, 4.5vw, 36px); box-shadow: var(--shadow-card); position: relative; display: flex; flex-direction: column; justify-content: flex-start; transform-origin: top center; overflow-anchor: none !important; will-change: transform, opacity; }
    .page-canvas::before { content: ""; position: absolute; inset: 7px; border: 1px solid var(--accent-gold-soft); border-radius: 12px; pointer-events: none; }

    @keyframes flipNextRtl { 0% { opacity: 0.32; transform: translateX(-22px) rotateY(4deg); } 100% { opacity: 1; transform: translateX(0) rotateY(0deg); } }
    @keyframes flipPrevRtl { 0% { opacity: 0.32; transform: translateX(22px) rotateY(-4deg); } 100% { opacity: 1; transform: translateX(0) rotateY(0deg); } }
    .page-canvas.flip-next { animation: flipNextRtl 220ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .page-canvas.flip-prev { animation: flipPrevRtl 220ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    .page { position: relative; z-index: 1; width: 100%; font-family: var(--font-body); font-size: var(--reader-font, 21px); line-height: 2.04; color: var(--text-primary); overflow-anchor: none !important; }
    .page p { font-family: var(--font-body); margin: 0 0 0.9em; text-align: justify; line-height: 2.04; }
    .page h1 { font-family: var(--font-headings); font-size: clamp(1.32em, 4.2vw, 1.72em); line-height: 1.58; color: var(--accent-rose-dark); margin: 0 0 0.65em; font-weight: 700; }
    .page h2 { font-family: var(--font-headings); font-size: clamp(1.14em, 3.6vw, 1.38em); line-height: 1.62; color: var(--accent-rose-dark); margin: 0.9em 0 0.5em; font-weight: 700; display: flex; align-items: center; gap: 0.45em; }
    .page h2::before { content: "❖"; color: var(--accent-gold); font-size: 0.78em; flex-shrink: 0; }
    .page h3 { font-family: var(--font-headings); font-size: 1.05em; color: var(--accent-sage-dark); margin: 0.8em 0 0.4em; font-weight: 700; }

    .cover-page { min-height: clamp(460px, 68vh, 740px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; isolation: isolate; padding: clamp(22px, 4.5vw, 44px) clamp(14px, 3.8vw, 28px); background: radial-gradient(ellipse at 50% 36%, #FFFFFF 0%, var(--bg-secondary) 55%, var(--bg-primary) 100%); border: 2px solid var(--border-ornate); border-radius: 16px; overflow: hidden; box-shadow: inset 0 0 0 6px var(--bg-secondary), inset 0 0 0 7.5px var(--accent-gold-soft); }
    .cover-page::before, .cover-page::after { content: ""; position: absolute; z-index: -1; border: 1px solid var(--accent-gold-soft); border-radius: 48% 48% 16px 16px; width: 84%; height: 84%; top: 8%; left: 8%; pointer-events: none; }
    .cover-page::after { width: 76%; height: 76%; top: 12%; left: 12%; border-color: var(--line); border-style: dashed; }
    .cover-art-svg { width: clamp(120px, 34vw, 180px); height: auto; margin: 0 auto 14px; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.09)); }
    .cover-title-frame { position: relative; padding: 0.7em 1.2em; margin: 0.2em auto 0.6em; max-width: 94%; background: linear-gradient(180deg, rgba(255,255,255,0.92), var(--bg-pearl-gold)); border-top: 2px solid var(--accent-gold); border-bottom: 2px solid var(--accent-gold); border-radius: 14px; box-shadow: 0 10px 26px rgba(0,0,0,0.05); }
    .cover-page h1 { font-family: var(--font-headings); font-size: clamp(1.85em, 6.5vw, 2.8em); line-height: 1.42; color: var(--accent-rose-dark); margin: 0; }
    .cover-page h1::before { content: none; }
    .cover-page .subtitle { font-family: var(--font-body); font-size: clamp(0.9em, 2.8vw, 1.02em); line-height: 1.85; color: var(--text-secondary); max-width: 88%; margin: 0.35em auto 0.6em; text-align: center; }
    .ornament { color: var(--accent-gold); font-size: 0.88em; letter-spacing: 6px; margin: 0.6em 0; text-align: center; }
    .cover-page .author { font-family: var(--font-interface); font-size: 0.74em; font-weight: 700; color: var(--accent-rose-dark); background: var(--bg-secondary); border: 1px solid var(--accent-gold-soft); border-radius: 99px; padding: 0.3em 1.2em; margin: 0.25em 0 0.85em; }
    .primary-btn { border: 1px solid var(--accent-gold); background: linear-gradient(135deg, var(--accent-rose), var(--accent-rose-dark)); color: #fff; border-radius: 99px; padding: 0.55em 1.5em; font-family: var(--font-interface); font-size: 0.76em; font-weight: 700; cursor: pointer; margin-top: 0.3em; box-shadow: 0 7px 18px rgba(0,0,0,0.15); }

    .chapter-opener, .opener { text-align: center; padding: 0.6em 0.4em; position: relative; }
    .letter-envelope-header { display: inline-flex; align-items: center; gap: 0.45em; background: linear-gradient(135deg, var(--bg-soft-rose), var(--bg-pearl-gold)); border: 1px solid var(--accent-gold-soft); border-radius: 99px; padding: 0.3em 1em; margin: 0 auto 0.6em; width: fit-content; }
    .letter-seal { font-size: 0.9em; color: var(--accent-gold); }
    .letter-envelope-title { font-family: var(--font-chapter-titles); font-size: 0.68em; font-weight: 700; color: var(--accent-rose-dark); }
    .letter-greeting, .opening-lead { font-family: var(--font-headings); font-size: 1.08em; color: var(--accent-rose-dark); margin-bottom: 0.75em; font-weight: 700; border-bottom: 1px dashed var(--line); padding-bottom: 0.45em; }
    .epigraph-box { margin: 1em auto; padding: 1.1em 1.2em; border-radius: 16px; background: radial-gradient(circle at center, var(--bg-secondary), var(--bg-pearl-gold)); border: 1.5px double var(--accent-gold); text-align: center; box-shadow: 0 8px 22px rgba(0,0,0,0.04); }
    .epigraph-box p { font-family: var(--font-quotes); font-size: 1.12em; line-height: 2.08; color: var(--accent-rose-dark); text-align: center; margin: 0; }

    .quran-box { margin: 0.85em 0; padding: 0.85em 1em; border-radius: 14px; background: linear-gradient(135deg, var(--bg-pearl-gold), var(--bg-secondary)); border: 1.5px solid var(--accent-gold-soft); border-inline-start: 4px solid var(--accent-gold); text-align: center; }
    .quran-box p, .quran-verse { font-family: var(--font-quran); font-size: 1.12em; line-height: 2.15; color: var(--accent-rose-dark); margin: 0 0 0.25em; text-align: center; }
    .quran-box .ayah-source { font-family: var(--font-interface); font-size: 0.66em; color: var(--accent-gold); font-weight: 700; }

    .hadith-box { margin: 0.85em 0; padding: 0.8em 1em; border-radius: 14px; background: linear-gradient(135deg, var(--bg-soft-sage), var(--bg-secondary)); border: 1px solid var(--line); border-inline-start: 4px solid var(--accent-sage); text-align: center; }
    .hadith-box p, .hadith-quote { font-family: var(--font-quotes); font-size: 1.06em; line-height: 2.05; color: var(--accent-sage-dark); margin: 0; text-align: center; }
    .hadith-box .hadith-source { font-family: var(--font-interface); font-size: 0.65em; color: var(--accent-sage-dark); font-weight: 700; margin-top: 0.3em; }

    .reflection-card { margin: 0.85em 0; padding: 0.85em 1em; border-radius: 14px; background: linear-gradient(135deg, var(--bg-secondary), var(--bg-soft-rose)); border: 1px solid var(--line); border-inline-start: 4px solid var(--accent-rose); box-shadow: 0 6px 18px rgba(0,0,0,0.03); }
    .reflection-card-title { display: flex; align-items: center; gap: 0.35em; font-family: var(--font-interface); font-size: 0.68em; font-weight: 700; color: var(--accent-rose-dark); margin-bottom: 0.35em; }
    .reflection-card p { font-family: var(--font-quotes); font-size: 1.02em; color: var(--accent-rose-dark); margin: 0; line-height: 1.96; }

    .did-you-know-card { margin: 0.85em 0; padding: 0.85em 1em; border-radius: 14px; background: linear-gradient(135deg, var(--bg-soft-rose), var(--bg-secondary)); border: 1.5px dashed var(--accent-rose); position: relative; }
    .did-you-know-badge { display: inline-flex; align-items: center; gap: 0.35em; font-family: var(--font-interface); font-size: 0.68em; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--accent-rose), var(--accent-rose-dark)); padding: 0.2em 0.8em; border-radius: 99px; margin-bottom: 0.45em; }
    .did-you-know-card p { margin: 0; font-size: 0.96em; line-height: 1.95; }

    .wisdom-pearl { margin: 0.85em 0; padding: 0.8em 1em; border-radius: 12px; background: var(--bg-pearl-gold); border: 1px solid var(--accent-gold-soft); border-inline-start: 3.5px solid var(--accent-gold); font-family: var(--font-quotes); font-size: 0.98em; line-height: 1.96; }
    .wisdom-pearl.action-callout { background: linear-gradient(135deg, var(--bg-soft-rose), var(--bg-pearl-gold)); border-inline-start: 4px solid var(--accent-rose); }
    .wisdom-pearl.academic-callout { background: var(--bg-soft-sage); border-inline-start: 4px solid var(--accent-sage-dark); border-radius: 10px; }
    .wisdom-badge { display: block; font-family: var(--font-interface); font-size: 0.65em; font-weight: 700; color: var(--accent-gold); margin-bottom: 0.3em; }

    .heart-keepsake-card { background: linear-gradient(145deg, var(--bg-secondary), var(--bg-soft-rose) 65%, var(--bg-pearl-gold) 100%); border: 1.5px solid var(--accent-rose-light); border-radius: 16px; padding: 0.95em 1em; margin: 0.85em 0; text-align: center; box-shadow: 0 10px 24px rgba(0,0,0,0.04); }
    .heart-badge { display: inline-block; font-family: var(--font-interface); font-size: 0.66em; font-weight: 700; color: var(--accent-rose-dark); background: var(--bg-secondary); border: 1px solid var(--accent-rose-light); border-radius: 99px; padding: 0.2em 0.85em; margin-bottom: 0.5em; }
    .heart-keepsake-card p { font-family: var(--font-quotes); font-size: 1.08em; line-height: 2.08; color: var(--accent-rose-dark); margin: 0; text-align: center; }

    .step-card { margin: 0.55em 0; padding: 0.65em 0.8em; background: var(--bg-primary); border: 1px solid var(--line); border-radius: 12px; display: flex; gap: 0.6em; align-items: flex-start; }
    .step-num { width: 1.65em; height: 1.65em; flex: 0 0 1.65em; border-radius: 50%; background: linear-gradient(135deg, var(--accent-rose), var(--accent-rose-dark)); color: #fff; display: grid; place-items: center; font-family: var(--font-numbers); font-weight: 700; font-size: 0.76em; margin-top: 0.15em; }
    .step-content { flex: 1; min-width: 0; font-size: 0.96em; line-height: 1.9; }

    .contrast-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13.5em), 1fr)); gap: 0.65em; margin: 0.8em 0; }
    .contrast-box { padding: 0.75em 0.85em; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-primary); font-size: 0.92em; line-height: 1.88; }
    .contrast-box strong { display: block; font-family: var(--font-interface); font-size: 0.82em; color: var(--accent-rose-dark); margin-bottom: 0.25em; }

    .poetry-stanza { margin: 0.85em 0; padding: 0.8em 1em; border-radius: 14px; background: linear-gradient(135deg, var(--bg-soft-rose), var(--bg-secondary)); border: 1px dashed var(--accent-gold); text-align: center; font-family: var(--font-quotes); }
    .poetry-shatr { font-size: 1.04em; color: var(--accent-rose-dark); line-height: 1.95; }
    .poetry-ornament { color: var(--accent-gold); font-size: 0.76em; margin: 0.15em 0; }

    .book-table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0.9em 0; border: 1px solid var(--border-ornate); border-radius: 12px; background: var(--bg-secondary); }
    .book-table-wrap table { width: 100%; border-collapse: collapse; font-size: 0.88em; line-height: 1.75; }
    .book-table-wrap th, .book-table-wrap td { padding: 0.55em 0.75em; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
    .book-table-wrap th { background: var(--bg-pearl-gold); color: var(--accent-rose-dark); font-family: var(--font-interface); font-weight: 700; }

    .figure-card, .equation-box { margin: 0.85em 0; padding: 0.8em 1em; border-radius: 14px; background: var(--bg-primary); border: 1px solid var(--line); text-align: center; }
    .figure-card figcaption { font-family: var(--font-interface); font-size: 0.72em; color: var(--text-secondary); margin-top: 0.45em; }

    .term-btn { appearance: none; -webkit-appearance: none; background: rgba(180,123,38,0.10); border: none; border-bottom: 1.5px dashed var(--accent-gold); color: var(--accent-rose-dark); font-family: inherit; font-size: inherit; font-weight: 600; line-height: inherit; padding: 0 0.22em; margin: 0 0.05em; border-radius: 5px; cursor: pointer; display: inline; transition: background 0.15s, color 0.15s; }
    .term-btn::after { content: "؟"; font-family: var(--font-interface); font-size: 0.62em; font-weight: 700; color: var(--accent-gold); vertical-align: super; margin-inline-start: 2px; }
    .term-btn:active, .term-btn.active-term { background: var(--accent-rose-dark); color: #fff; }
    .term-popover { position: fixed; inset-inline: 12px; bottom: 74px; z-index: 42; max-width: 560px; margin: 0 auto; background: var(--bg-secondary); border: 1.5px solid var(--accent-gold); border-radius: 16px; padding: 14px 16px; box-shadow: 0 18px 46px rgba(0,0,0,0.22); display: none; animation: termPopIn 180ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .term-popover.open { display: block; }
    @keyframes termPopIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .term-popover-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed var(--line); }
    .term-popover-title { font-family: var(--font-interface); font-size: 13.5px; font-weight: 700; color: var(--accent-rose-dark); display: flex; align-items: center; gap: 6px; }
    .term-popover-close { border: 1px solid var(--line); background: var(--bg-primary); color: var(--text-secondary); border-radius: 8px; width: 28px; height: 28px; display: grid; place-items: center; font-size: 12px; cursor: pointer; }
    .term-popover-body { font-family: var(--font-body); font-size: 14.5px; line-height: 1.85; color: var(--text-primary); margin: 0; }

    .bottom-nav-dock { min-height: 62px; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px calc(env(safe-area-inset-bottom, 6px) + 6px); background: var(--bg-secondary); border-top: 1px solid var(--line); z-index: 4; }
    .nav-btn { min-width: 92px; border-radius: 12px; background: var(--accent-rose-dark); color: #fff; border-color: var(--accent-rose-dark); font-family: var(--font-interface); font-size: 12px; padding: 8px 14px; }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }
    .page-counter { font-family: var(--font-numbers); font-size: 11.5px; font-weight: 700; color: var(--text-secondary); background: var(--bg-primary); border: 1px solid var(--line); border-radius: 99px; padding: 5px 15px; direction: ltr; unicode-bidi: isolate; }

    .overlay { position: fixed; inset: 0; z-index: 45; background: rgba(30,20,25,0.45); backdrop-filter: blur(3px); display: none; align-items: flex-end; justify-content: center; padding: 12px; }
    .overlay.open { display: flex; }
    .panel { width: min(100%, 640px); max-height: 78vh; overflow-y: auto; background: var(--bg-secondary); border: 1px solid var(--paper-edge); border-radius: 18px; padding: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.22); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { margin: 0; color: var(--accent-rose-dark); font-family: var(--font-interface); font-size: 15px; }
    .search-bar-wrap { position: relative; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    #searchInput { width: 100%; min-height: 44px; padding: 9px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-interface); font-size: 14px; outline: none; }
    .search-clear-btn { border-radius: 8px; border: 1px solid var(--line); background: var(--bg-secondary); color: var(--accent-rose); font-family: var(--font-interface); font-size: 12px; font-weight: 700; padding: 4px 10px; cursor: pointer; }
    .search-clear-btn[hidden] { display: none; }
    .search-status { font-family: var(--font-interface); font-size: 12px; color: var(--text-secondary); margin: 4px 2px 10px; }
    .toc-list { display: flex; flex-direction: column; gap: 6px; }
    .search-result, .toc-item { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: start; padding: 10px 14px; margin: 4px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-interface); font-size: 13px; cursor: pointer; }
    .search-result { display: block; }
    .search-result-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .toc-item.toc-part { font-family: var(--font-chapter-titles); background: var(--bg-soft-rose); font-weight: 700; color: var(--accent-rose-dark); }
    .toc-item small, .search-result-page { color: var(--accent-gold); font-family: var(--font-numbers); font-size: 11px; font-weight: 700; background: var(--bg-secondary); padding: 2px 8px; border-radius: 99px; border: 1px solid var(--accent-gold-soft); }
    mark.search-hit-mark, mark.page-search-highlight { background: rgba(198,154,78,0.28); color: var(--accent-rose-dark); padding: 1px 5px; border-radius: 5px; font-weight: 700; }
    .book-table-wrap tr.toc-row { cursor: pointer; transition: background 0.15s; }
    .book-table-wrap tr.toc-row:hover, .book-table-wrap tr.toc-row:active { background: var(--bg-soft-rose); }
    .book-table-wrap td.toc-page-num { font-family: var(--font-numbers); font-weight: 700; color: var(--accent-gold); width: 78px; text-align: center; direction: ltr; }
    .drop-cap::first-letter { font-family: var(--font-headings); font-size: 1.45em; font-weight: 700; color: var(--accent-rose-dark); padding-inline-end: 2px; }
    .author-signature { font-family: var(--font-headings); font-size: 1.18em; font-weight: 700; color: var(--accent-rose-dark); text-align: center; margin: 0.8em auto 0.4em; padding: 0.35em 1.2em; border-radius: 99px; background: var(--bg-pearl-gold); border: 1px solid var(--accent-gold-soft); width: fit-content; }

    /* === نظام الأوضاع البصرية المتكامل (الوضع الليلي والورقي) والتناغم مع التطبيق === */
    html[data-theme="sepia"] {
      --bg-primary: #F1E6D0; --bg-secondary: #F8F0DF; --paper-bg: #F8F0DF; --bg-card: #F8F0DF;
      --bg-soft-rose: #E5EFE8; --bg-soft-sage: #EDE3CE; --bg-pearl-gold: #F4E7C8;
      --text-primary: #2B2118; --ink-main: #2B2118; --text-secondary: #5A4634;
      --paper-edge: #CDBE9F;
      color-scheme: light;
    }

    html[data-theme="night"] {
      --bg-primary: #0B1114; --bg-secondary: #121B20; --paper-bg: #121B20; --bg-card: #162228;
      --bg-soft-rose: #132A23; --bg-soft-sage: #1E1A14; --bg-pearl-gold: #231D12;
      --accent-rose: #34D399; --accent-rose-dark: #6EE7B7; --accent-rose-light: #10B981;
      --accent-sage: #D9A05B; --accent-sage-dark: #F3C68F; --accent-gold: #E5B454;
      --accent-gold-soft: rgba(229,180,84,0.32);
      --text-primary: #ECE8DF; --ink-main: #ECE8DF; --text-secondary: #B0BEB6;
      --line: rgba(229,180,84,0.20); --border-ornate: rgba(229,180,84,0.40);
      --paper-edge: #26353D; --shadow-card: 0 18px 46px rgba(0,0,0,0.60);
      color-scheme: dark;
    }

    html[data-theme="night"] .cover-page {
      background: radial-gradient(ellipse at 50% 36%, #1A2830 0%, #111A20 58%, #090E12 100%) !important;
      border-color: rgba(229,180,84,0.48) !important;
      box-shadow: inset 0 0 0 6px #121B20, inset 0 0 0 7.5px rgba(229,180,84,0.32) !important;
    }
    html[data-theme="night"] .cover-title-frame {
      background: linear-gradient(180deg, rgba(22,34,40,0.96), rgba(35,29,18,0.94)) !important;
      border-top-color: #E5B454 !important;
      border-bottom-color: #E5B454 !important;
      box-shadow: 0 12px 30px rgba(0,0,0,0.55) !important;
    }
    html[data-theme="night"] .cover-art-svg {
      filter: drop-shadow(0 10px 22px rgba(0,0,0,0.65)) !important;
    }
    html[data-theme="night"] .cover-art-svg circle[fill="#FFFFFF"] {
      fill: #162329 !important;
    }
    html[data-theme="night"] .cover-art-svg path[fill="#FFFDF7"] {
      fill: #132226 !important;
    }
    html[data-theme="night"] .running-header {
      background: #15242B !important;
      color: #ECE8DF !important;
      border-bottom-color: #E5B454 !important;
    }
    html[data-theme="night"] .running-header-mark { color: #FDE68A !important; }
    html[data-theme="night"] .nav-btn,
    html[data-theme="night"] .primary-btn,
    html[data-theme="night"] .did-you-know-badge,
    html[data-theme="night"] .step-num,
    html[data-theme="night"] .brand-gem {
      background: linear-gradient(135deg, #065F46, #044332) !important;
      color: #F9FAFB !important;
      border-color: rgba(229,180,84,0.45) !important;
    }
    html[data-theme="night"] .term-btn:active,
    html[data-theme="night"] .term-btn.active-term {
      background: #065F46 !important;
      color: #FFFFFF !important;
    }
    html[data-theme="night"] mark.search-hit-mark,
    html[data-theme="night"] mark.page-search-highlight {
      background: rgba(229,180,84,0.32) !important;
      color: #FDE68A !important;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-gem" aria-hidden="true">✦</div>
        <span id="topBarBookTitle">لأنك الله</span>
      </div>
      <div class="tools">
        <button id="searchOpen" class="icon-btn" aria-label="بحث في الكتاب" title="بحث في الكتاب">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button id="tocBtn" class="icon-btn" aria-label="فهرس الكتاب" title="فهرس الكتاب">
          <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="18" y2="18"/></svg>
        </button>
        <button id="bookmarkBtn" class="icon-btn" aria-label="حفظ علامة مرجعية" title="حفظ علامة مرجعية">
          <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>
    </header>

    <div id="runningHeader" class="running-header" hidden>
      <span id="runningHeaderTag" class="running-header-mark"></span>
    </div>

    <main id="bookStage" class="book-stage">
      <div id="pageCanvas" class="page-canvas">
        <article id="activePageArticle" class="page"></article>
      </div>
    </main>

    <div id="termPopover" class="term-popover" role="dialog" aria-live="polite">
      <div class="term-popover-head">
        <span id="termPopoverTitle" class="term-popover-title">✦ بيان المعنى</span>
        <button id="termPopoverClose" type="button" class="term-popover-close" aria-label="إغلاق">✕</button>
      </div>
      <p id="termPopoverBody" class="term-popover-body"></p>
    </div>

    <footer class="bottom-nav-dock">
      <button id="btnPrevPage" type="button" class="nav-btn" onclick="window.prevPage()">السابق</button>
      <span id="pageCounter" class="page-counter" dir="ltr">1 / 1</span>
      <button id="btnNextPage" type="button" class="nav-btn" onclick="window.nextPage()">التالي</button>
    </footer>
  </div>

  <div id="searchPanel" class="overlay" aria-hidden="true">
    <div class="panel">
      <div class="panel-head">
        <h2>البحث في الكتاب ✦</h2>
        <button id="searchClose" class="icon-btn" aria-label="إغلاق البحث">✕</button>
      </div>
      <div class="search-bar-wrap">
        <input id="searchInput" type="text" placeholder="ابحث عن آية، حديث، عنوان، أو أي كلمة..." autocomplete="off"/>
        <button id="searchClearBtn" class="search-clear-btn" hidden aria-label="مسح">مسح</button>
      </div>
      <div class="search-status">
        <span id="searchStatus">اكتب كلمة للبحث في جميع صفحات الكتاب...</span>
      </div>
      <div id="searchResults" class="search-results-list"></div>
    </div>
  </div>

  <div id="tocPanel" class="overlay" aria-hidden="true">
    <div class="panel">
      <div class="panel-head">
        <h2>فهرس فصول الكتاب</h2>
        <button id="tocClose" class="icon-btn" aria-label="إغلاق الفهرس">✕</button>
      </div>
      <div id="tocPanelList" class="toc-list"></div>
    </div>
  </div>

  <script>
    const BOOK_DATA = {
      title: "لأنك الله",
      subtitle: "رحلة إلى السماء السابعة",
      author: "علي بن جابر الفيفي",
      pages: [
        { tag: "", title: "غلاف الكتاب", type: "cover", html: `<div class="cover-page"><svg class="cover-art-svg" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="120" cy="120" r="108" fill="var(--bg-primary)" stroke="var(--accent-gold)" stroke-width="1.8" stroke-dasharray="4 3"/><circle cx="120" cy="120" r="94" fill="var(--bg-secondary)" stroke="var(--accent-rose)" stroke-width="1.5"/><path d="M64 146 C 52 108, 74 72, 120 56 C 166 72, 188 108, 176 146" stroke="var(--accent-gold)" stroke-width="2.2" stroke-linecap="round"/><g transform="translate(120, 120)"><polygon points="0,-42 12,-12 42,0 12,12 0,42 -12,12 -42,0 -12,-12" fill="var(--bg-pearl-gold)" stroke="var(--accent-gold)" stroke-width="1.6"/><circle cx="0" cy="0" r="12" fill="var(--accent-rose)"/><circle cx="0" cy="0" r="5" fill="var(--accent-rose-dark)"/></g></svg><div class="cover-title-frame"><h1>لأنّكَ الله</h1></div><div class="subtitle">رحلةٌ إلى السّماءِ السّابعةِ</div><div class="ornament">❖ ✦ ❖</div><div class="author">علي بن جابر الفيفي</div><button class="primary-btn" onclick="window.goToPage(1)">افتح صفحات الكتاب ✦</button></div>` },
        { tag: "الإهداء", title: "الإهداء — إلى أمي", type: "reading", html: `<div class="quran-box" data-role="quran"><p>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p></div><h2>الإهداء</h2><p>إلى التي قالت لي ذات ليلة، وأنا في السابعة من عمري:</p><div class="reflection-card"><div class="reflection-card-title">✦ سؤال يوقظ الفطرة</div><p>هل صليت العِشاء؟</p></div><p>فقلت لها -كاذبًا- نعم!</p><p>فنظرت إليّ نظرة شكّ، وقالت: قل ما شئت ..</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ يقين المراقبة</span>ولكنّه قد رآك!</div><p>فأفزعتني «قد رآك» هذه .. وجعلتني أنهض لأصلي .. رغم ادعائي الكاذب!</p><div class="heart-keepsake-card"><span class="heart-badge">وفاء وعرفان</span><p>إلى أمّي ..</p></div>` },
        { tag: "استفتاح", title: "لأنك الله لا خوف ولا قلق", type: "reading", html: `<div class="poetry-stanza"><div class="poetry-shatr">لأنّك الله .. لا خوفٌ ولا قلقُ</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">ولا غروبٌ .. ولا ليلٌ .. ولا شفقُ</div></div><div class="poetry-stanza"><div class="poetry-shatr">لأنّك الله .. قلبي كلّه أملُ</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">لأنّك الله .. روحي ملؤها الألقُ</div></div>` },
        { tag: "مقدمة", title: "مقدمة الكتاب", type: "opener", html: `<div class="opener"><div class="letter-envelope-header"><span class="letter-seal">✦</span><span class="letter-envelope-title">مدخل الكتاب</span></div><h1 class="chapter-opener">مُقدّمة</h1></div><p>الحمد لله والصلاة والسلام على رسول الله وصحبه ومن والاه .. وبعد</p><p>فهذه كلمات عن بعض أسماء الله، كتبتها بضعفي عن القويّ سبحانه، وبعجزي عن القدير سبحانه، وبجهلي عن العليم سبحانه ..</p><p>حرصت أن أجعلها مما يفهمه متوسّط الثقافة، ويستطيع قراءته المريض على سريره، والحزين بين دموعه، والمحتاج وسط كروبه ..</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ سرّ سعادة الدارين</span>لديّ يقين أن تعلّق القلب بالله، وعلمه به، ومراقبته له، وحبّه وخوفه ورجاءه، كما أنّه سرّ سعادة الآخرة، فإنّه سر سعادة الدنيا كذلك، وأنّ مرحلة الأحزان والوساوس والكروب ستنتهي تمامًا إن وجّه العبد بوصلة اهتمامه إلى الذي لم يخلقه إلا لعبادته ..</div>` },
        { tag: "مقدمة", title: "باب أسماء الله الحسنى", type: "reading", html: `<p>وباب أسماء الله الحسنى باب إيمانيّ عظيم، <button type="button" class="term-btn" data-term="يدلف" data-def="يدلف: يدخل ويتقدم برفق وخشوع.">يدلف</button> العبد من خلاله إلى عالم قدسي خاص، يجعل النفس تسجد تعظيمًا، والروح تتبتّل خشوعًا وحبًّا ..</p><p>أردت من هذا الكتاب الدلالة على الله سبحانه، والإشارة إليه بالقليل مما لديه، وتذكير نفسي وإخواني بأنّه على كل شيء قدير، وأن فضله كبير، وأنّه سبحانه السميع البصير ..</p><p>وأردت أن أربت بهذه الكلمات على أكتاف أتعبتها الأوجاع، وأمسح بها على رؤوس صدّعتها الآلام، أردت أن أواري بأحرفي الدموع، وأن أطفئ لهيب الضلوع ..</p><p>إننا بدون معرفة أسماء الله في صحراء تائهون، تتبدد أيامنا في لهيب تلك الصحراء، ودوّامة كثبان القلق النفسي ..</p><div class="contrast-grid"><div class="contrast-box"><strong>✦ اختر الله</strong>معرفة، وإيمانًا، ويقينًا، وعبادة، وخضوعًا، ثم أُنسًا، وسعادة، وهناء ..</div><div class="contrast-box"><strong>❖ أو اختر التيه</strong>والضياع، والاختناق، والشعور بالكآبة، والتمزّق النفسي ..</div></div><p>لا أدّعي في هذا الكتاب إحاطة ولا علمًا ولا سبقًا، الذي أدعيه هو العجز والتقصير والافتقار إلى عفوه سبحانه وتجاوزه ..</p>` },
        { tag: "مقدمة", title: "سؤال الإخلاص والقبول", type: "reading", html: `<p>فإن كان في هذا الكتاب من خير فأسأل الله أن يشيعه بين الناس، وإن كان غير ذلك فقد علم سبحانه كل التقصير الذي عندي، وقد علمتُ بعض العفو الذي عنده ..</p><p>أسأل الله صلاح النيّة، وأن يغفر ما قد <button type="button" class="term-btn" data-term="يندّ به القلم" data-def="يندّ به القلم: يسبق إليه أو يزلّ به عن غير قصد.">يندّ</button> به القلم، أو يخطئ به الفؤاد ..</p><p>وصلى الله وسلم على سيّدنا محمد .. وآخر دعوانا أن الحمد لله رب العالمين ..</p><div class="heart-keepsake-card"><span class="heart-badge">توقيع المؤلف</span><p>علي جابر الفيفي<br/>٢٧ / ٧ / ١٤٣٧هـ</p></div>` },
        { tag: "الصمد", title: "اسم الله الصمد", type: "opener", html: `<div class="opener"><div class="letter-envelope-header"><span class="letter-seal">✦</span><span class="letter-envelope-title">الاسم الأول</span></div><h1 class="chapter-opener">الصَّمد</h1></div><div class="epigraph-box"><p>لا يستطيع العالَم كلّه أن يمسّك بسوء لم يرده الله ..<br/>ولا يستطيع العالَم كله أن يدفع عنك سوءًا قدّره الله ..</p></div>` },
        { tag: "الصمد", title: "في ظلال الصمدية", type: "reading", html: `<p>إذا كان الضعف قد بنى حولك سجنًا ضيّقًا لا تستطيع الخروج منه!</p><p>إذا حاصرتك الحاجات، وداهمتك الخطوب، والتفّت من حولك الهموم، وأخذت روحك في الهرب إلى المجهول! فأنت ساعتها بحاجة إلى أن تصمد إليه ..</p><p>اسم الله «الصمد» سيمدّك بكل ما تحتاجه لتكون قويًّا في هذه الحياة، وتجابه واقعك بشموخ، وتتجاوز عقدك بعزيمة!</p><div class="wisdom-pearl action-callout"><span class="wisdom-badge">✦ عهد جديد</span>ابدأ مع الصمد عهدًا جديدًا، ثم ثق أنّ الغد سيكون أفضل من اليوم .. وبكثير!!</div><h2>في ظلال الصَّمَديّة</h2><p>الصمد اسم كما ترى بالغ الهيبة، قويّ الحروف، شامخ المعنى، قليل الورود والذكر، ذو جلالة خاصّة.</p><p>وكأن الصمود له سبحانه أهم تجليّات الإخلاص في العبادة، فمَن أكثرَ من استحضار معنى الإخلاص في عباداته، أكسب قلبه صفة الرضوخ إلى مولاه والصمود له وعدم الالتجاء إلاّ إليه.</p>` },
        { tag: "الصمد", title: "معنى الصمد وسورة الإخلاص", type: "reading", html: `<p>وها نحن ندلف إلى عالَم الصمديّة لنستلهم شيئًا من معاني الصمد:</p><div class="wisdom-pearl academic-callout"><span class="wisdom-badge">✦ معنى الصمد</span>الصمد هو من تصمد إليه الخلائق، أي تلجأ إليه، هذا من أجلّ معاني هذا الاسم، لذا فسوف نُطوّف بهذا المعنى ..<br/>الصمد هو المقصود في <button type="button" class="term-btn" data-term="الرغائب والنوائب" data-def="الرغائب: العطايا والمطالب العظيمة المرغوب فيها. والنوائب: الشدائد والمصائب النازلة.">الرغائب</button>، المستغاث به عند المصائب، والمفزوع إليه وقت النوائب.</div><p>جاء ذكره في سورة من أعظم سُوَر المصحف، ومن أقصرها، وهي سورة الإخلاص التي تعدل ثلث القرآن الكريم:</p><div class="quran-box" data-role="quran"><p>﴿قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ﴾</p><div class="ayah-source">سورة الإخلاص: ١–٢</div></div><p>يحتاج المخلوق إلى نصر فيقول: يا الله ..</p><p>يحتاج إلى إعانة فيقول: يا الله ..</p><p>يحتاج إلى حفظ فيقول: يا الله ..</p><p>يحتاج إلى هداية فيقول: يا الله ..</p><p>يحتاج إلى لطف فيقول: يا الله ..</p>` },
        { tag: "الصمد", title: "أمواج .. وحاجات الفطرة", type: "reading", html: `<h2>أمواج ..</h2><p>أحاطك بالاحتياجات لتحيط نفسك بأسمائه وصفاته، وهذا معنى الصمديّة.</p><p>في كل لحظات حياتك أنت بحاجة إليه، فإن لم ترجع إليه اختيارًا رجعت إليه اضطرارا.</p><p>المزارع إذا تأخر وقت الحصاد، وقد تعاظمت حاجته للثمر، وصار الماء شحيحًا، نظر إلى السماء وقال: يا الله!</p><p>ركاب السفينة إذا تلاطمت بهم الأمواج، وزعزعت فكرة الموت طمأنينة الحياة في نفوسهم قالوا: يا الله!</p><p>إذا أعلن قائد الطائرة أن عجلاتها رفضت التحرّك ولذلك فسيأخذ جولة على المطار إلى أن تُحل المشكلة، ينسى ركاب الطائرة كل الشخصيات المهمة، ولا يتذكرون إلا الذي بيده ملكوت كل شيء وهو يجير ولا يجار عليه.</p><div class="reflection-card"><div class="reflection-card-title">✦ في لحظة الاضطرار</div><p>وعيناك على رسّام القلب، تنظر إلى تلك الخطوط المتعرّجة ومريضك تخفت أنفاسه، وتتضاءل نبضاته، وتلك الخطوط تأخذ قليلًا قليلًا في الهبوط، لحظتها تنسى اسم الممرضة، ويتبخّر من رأسك وجه الطبيب وتقول في رجاء: يا الله كن معه!</p></div>` },
        { tag: "الصمد", title: "أفكار الزيف وإسلام الحصين", type: "reading", html: `<h2>أفكار الزيف</h2><div class="hadith-box" data-role="hadith"><p>جَاءَ شَيْخٌ أَعْرَابِيٌّ اسْمُهُ الحُصَيْنُ إِلَى رَسُولِ اللهِ ﷺ، فَسَأَلَهُ النَّبِيُّ ﷺ: «كَمْ تَعْبُدُ يَا حُصَيْنُ؟» فَقَالَ: سَبْعَةً، سِتَّةً فِي الأَرْضِ وَوَاحِدٌ فِي السَّمَاءِ، فَسَأَلَهُ النَّبِيُّ ﷺ: «مَنْ لِرَهَبِكَ؟» قَالَ: الَّذِي فِي السَّمَاءِ، قَالَ: «مَنْ لِرَغَبِكَ؟» قَالَ: الَّذِي فِي السَّمَاءِ، فَقَالَ لَهُ النَّبِيُّ ﷺ: «فَاتْرُكِ الَّذِينَ فِي الأَرْضِ وَاعْبُدِ الَّذِي فِي السَّمَاءِ»، فَأَسْلَمَ <button type="button" class="term-btn" data-term="تخريج الحديث (١)" data-def="أخرجه الترمذي في سننه (٣٤٨٣ / ٣٨٢٠ - ١٢/ ٤٥٢)، والحصين هو والد الصحابي الجليل عمران بن حصين رضي الله عنهما.">الحُصَيْنُ(١)</button>!</p><div class="hadith-source">سنن الترمذي</div></div><p>لقد اقتنع بسبب معنى الصمديّة، لأن من تصمد إليه وقت الرهبة والرغبة هو وحده من يستحق أن تسجد له!</p><p>إن الإيمان أسهل فكرة في الوجود، لا تحتاج إلى كتب، ولا إلى فلسفة، ولا إلى سبر وتقسيم، هي كلمة قلها بإخلاص، ثم اتركها لتشتت أفكار الزيف ..</p><p>يختصر القرآن ذلك فيقول:</p><div class="quran-box" data-role="quran"><p>﴿قُلِ اللَّهُ ثُمَّ ذَرْهُمْ فِي خَوْضِهِمْ يَلْعَبُونَ﴾</p><div class="ayah-source">سورة الأنعام: ٩١</div></div><p>كلمة «الله» وحدها .. كفيلة بإسكات أكبر أكاذيب الحياة ..</p><p>في عمق كل إنسان، وداخل كل خليّة، وحول كل شريان أشياء تعرف الله جيّدًا، وتسجد له، وتسبّحه ..</p>` },
        { tag: "الصمد", title: "الكواكب وحاجة القلوب لحبه", type: "reading", html: `<p>إن الكافر وهو كافر إذا سمع القرآن يخضع ..</p><p>ومن قصص السيرة الشهيرة أن رسول الله ﷺ قرأ سورة النجم على مشركي مكّة في المسجد الحرام، وما إن انتهى حتى سجدوا .. كلّهم سجدوا .. حتى أولئك الذين طردوه وآذوه وخططوا لاغتياله سجدوا!</p><p>تلك الأشياء التي في خلاياهم وشرايينهم تفجّرت فيها طاقة إيمانيّة رهيبة فجعلتهم يخرّون للأذقان سجَّدًا ..</p><h2>الكواكب</h2><p>خلق في نفوس عباده حاجة إلى حبّه سبحانه!</p><p>هناك نوع من الحب المقدّس في قلوب العباد لا يشبعه إلا الانحناء له، والطواف ببيته، والوقوف بين يديه، والقيام من النوم لأجله، وبذل المهج في سبيله.</p><p>الحياة بكل تجلياتها همس يقول لك: الذي تبحث عنه على عرشه يسمعك:</p><div class="quran-box" data-role="quran"><p>﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾</p><div class="ayah-source">سورة طه: ٥</div></div><div class="wisdom-pearl"><span class="wisdom-badge">✦ فأين مكوكبها؟</span>امرأة يخلو بها فاجر في إحدى الخلوات فيراودها عن نفسها، ولكنّها تأبى! فيقول حاثًّا لها: لا يرانا إلا الكواكب، فتردّ بشموخ: فأين مكوكبها؟</div>` },
        { tag: "الصمد", title: "أين الله؟! وتنساه ..", type: "reading", html: `<p>أين الله؟!</p><p>إنّه قلب صامد إلى الله، يراقبه، متيقن أنّه عليم خبير سميع بصير محيط!</p><p>وصمودك إليه بقلبك تماما كصمود المصلّي إلى الكعبة ليصلي إليها!</p><div class="wisdom-pearl action-callout"><span class="wisdom-badge">✦ قبلة القلب</span>هكذا يجب أن يكون القلب، يوزّع رغباته في كل الاتجاهات لكن الاتجاه الأمامي يجب أن يكون لله فقط ..<br/>ضع يمين قلبك ما شئت ويساره ما شئت، ولكن أمامه لا تضع إلا مرضاة الله، إلا مراقبة الله، إلا حب الله.</div><h2>وتنساه ..</h2><p>إذا بحثت عن شيء فلم تجده فدعه، وانشغل بالله.</p><p>هو الذي جعل ذلك الشيء يضيع لتصمد إليه وتلتجئ، لتقول: اللهم ردّ عليّ ضالّتي، فيردّها! يريدك أن تنشغل به عن حاجتك، ولكنّك تنشغل بها، وتنساه!!</p>` },
        { tag: "الصمد", title: "كلام ابن تيمية وصمود النملة", type: "reading", html: `<p>ولشيخ الإسلام ابن تيمية رحمه الله كلام بالغ النفاسة في هذا المعنى، فتأمّله بقلبك، ثم اجعله بالقرب من أوجاعك، وكربك، وحاجاتك، يقول:</p><div class="hadith-box" data-role="hadith"><p>«العبد قد تنزل به النازلة فيكون مقصوده طلب حاجته، وتفريج كرباته، فيسعى في ذلك بالسؤال والتضرع، وإن كان ذلك من العبادة والطاعة، ثم يكون في أول الأمر قصده حصول ذلك المطلوب: من الرزق والنصر والعافية مطلقا، ثم الدعاء والتضرع يفتح له من أبواب الإيمان بالله عز وجل ومعرفته ومحبته، والتنعم بذكره ودعائه، ما يكون هو أحب إليه وأعظم قدرا عنده من تلك الحاجة التي همّته، وهذا من رحمة الله بعباده، يسوقهم بالحاجات الدنيوية إلى المقاصد العلية الدينية».</p><div class="hadith-source">شيخ الإسلام ابن تيمية رحمه الله</div></div><p>تنقطع الأمطار، وتصبح الدنيا قاحلة على عهد موسى عليه السلام فيخرج هو وقومه وهم آلاف من الرجال والنساء والولدان، فيرى موسى نملة خرجت رافعة يديها إلى السماء صامدة إلى ربّ السحاب، فعلم موسى أن هذا الصمود، وهذا الذل لن يعقبه إلا هطول السماء بماء منهمر، فقال لقومه: ارجعوا فقد كُفيتم، فعادوا على صوت الرعود، ورذاذ المطر!</p><div class="heart-keepsake-card"><span class="heart-badge">إيقاف المطايا بباب الكريم</span><p>في طفولتي كنت أسمع دعاء لأحد القرّاء فيهزني: «اللهم أوقَفْنا <button type="button" class="term-btn" data-term="مطايانا" data-def="المطايا: جمع مطيّة وهي الراحلة التي يُركب عليها، وإيقاف المطايا بباب الكريم كناية عن الحاجة والافتقار واللجوء التام إلى الله.">مطايانا</button> ببابك .. فلا تطردنا عن جنابك» هذا الإيقاف للمطايا بباب الكريم هو معنى الصمد.</p></div>` },
        { tag: "الصمد", title: "اصمد إليه في البر والبحر", type: "reading", html: `<h2>اصمد إليه</h2><p>يجب أن تعلم أنّه لو لم يأذن للدواء أن يؤدّي مفعوله في جسدك لما ارتفع عنك ذلك المرض، فاصمد إليه أن يشفيَك ..</p><p>يجب أن توقن أنّه لو لم يصرف تلك السيارة المتهوّرة عنك لكنت الآن في عداد الموتى، فاصمد إليه أن يحفظك ..</p><p>يجب أن تتأكّد أنّه لو لم يحطك برعايته عندما ركبت البحر، لكنت الآن طُعمًا لأسماك المحيط، فاصمد إليه أن يكون معك ..</p><p>ولهذا تصمد إليه لترتاح، ليهدأ لُهاثك، لأنّك بدونه تركض وتلهث وتتوتّر.</p><p>أنصت إلى أولئك الذين تعبث بهم سفينة، أو يرون الموت وهو مقبل عليهم، وتعصف بهم رياح التقلّبات سوف تسمعهم بجميع أديانهم يلهجون باسمه: يا الله!</p><div class="quran-box" data-role="quran"><p>﴿هُوَ الَّذِي يُسَيِّرُكُمْ فِي الْبَرِّ وَالْبَحْرِ حَتَّىٰ إِذَا كُنتُمْ فِي الْفُلْكِ وَجَرَيْنَ بِهِم بِرِيحٍ طَيِّبَةٍ وَفَرِحُوا بِهَا جَاءَتْهَا رِيحٌ عَاصِفٌ وَجَاءَهُمُ الْمَوْجُ مِن كُلِّ مَكَانٍ وَظَنُّوا أَنَّهُمْ أُحِيطَ بِهِمْ دَعَوُا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ لَئِنْ أَنجَيْتَنَا مِنْ هَٰذِهِ لَنَكُونَنَّ مِنَ الشَّاكِرِينَ﴾</p><div class="ayah-source">سورة يونس: ٢٢</div></div><p>جعل في داخلك حاجة لأن تقول اسمه، هناك أمن يعمّ كيانك إن قلت يا الله، فإذا لم تقلها اختيارًا، قلتها اضطرارًا، وإن لم تذكرها إيمانًا، ذكرتها قهرًا، وإذا لم تكن كلمتك في الرخاء، كانت صرختك في الشدّة!</p>` },
        { tag: "الصمد", title: "البوصلة واللجوء إلى الله", type: "reading", html: `<h2>البوصلة</h2><div class="reflection-card"><div class="reflection-card-title">✦ وقفة مراجعة</div><p>لماذا ننتظر جائحة تردّنا إليه؟ ومصيبة تذكرنا باسمه؟ وكارثة نعود بها إلى المسجد؟<br/>ألا يستحق أن نخضع ونلتجئ إليه دون جوائح وكوارث ومصائب؟</p></div><p>هل كل ما أعطانا إيّاه من حياة وصحّة وإيمان وأمان وسعادة قليل حتى لا ننكّس رؤوسنا إليه إلا ببليّة تنسينا كل أوهامنا، ولا يبقى في عقولنا معها إلا الله!</p><p>عدّل بوصلة قلبك باتّجاهه ثم سر إليه ولو حبوًا على ركبتيك، ستصل:</p><div class="quran-box" data-role="quran"><p>﴿فَأَيْنَمَا تُوَلُّوا فَثَمَّ وَجْهُ اللَّهِ﴾</p><div class="ayah-source">سورة البقرة: ١١٥</div></div><p>إذا التجأت لفلان من الناس صباحًا قد يغلق بابه دونك في المساء.</p><p>إذا نصرك على زيد قد لا ينصرك على عمرو.</p><p>إذا أعطاك اليوم فسوف يمنعك في الغد.</p>` },
        { tag: "الصمد", title: "فرّغ قلبك من غيره", type: "reading", html: `<p>أما الله .. فلا!</p><div class="quran-box" data-role="quran"><p>﴿هُوَ الْحَيُّ لَا إِلَٰهَ إِلَّا هُوَ فَادْعُوهُ﴾</p><div class="ayah-source">سورة غافر: ٦٥</div></div><p>يعطي بالليل والنهار، ينصرك على الجميع إن كنت مظلوما، لا يغلق بابه، يده <button type="button" class="term-btn" data-term="سحاء" data-def="سحّاء: دائمة الصبّ والعطاء الجزيل لا تغيضها نفقة.">سحاء</button> الليل والنهار، أكرم الأكرمين، لذلك تصمد إليه كل الخلائق، فإذا جرّبت أن تصمد إلى غيره في حاجة رجعت خائبا، ولا بد!</p><p>إذا طلبت غيره قد لا يجيبك، أو قد يجيبك ولكن يتأخر في تلبية طلبك، أو يلبيه ولكن ناقصا، أو يلبيه كاملا لكن مع ملعقة إهانة، وقد لا يهينك ولكنّ نفسك تنكسر له ..</p><h2>فرّغ قلبك من غيره</h2><p>دخلت قديمًا مكتب وكيل إحدى الجامعات وقد كتبت له معروضًا في شأن من شؤون دراستي، ثم شرحت له بعض التفاصيل فقال لي: لا تكثّر (<button type="button" class="term-btn" data-term="هرْج" data-def="الهرْج في العامية: كثرة الكلام والحديث.">هرْج</button>)!</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ بين الخلق والخالق</span>الناس لا يريدونك أن تكثّر من الهرج! ولكن الله يحبّك إن كثّرت من الهرج بين يديه! فهو يحب العبد اللحوح في الدعاء .. فلماذا تشكو لغيره وتتركه؟</div>` },
        { tag: "الصمد", title: "إذا سألت فاسأل الله", type: "reading", html: `<p>يقول النبي ﷺ لابن عباس: «<button type="button" class="term-btn" data-term="إِذَا سَأَلْتَ فَاسْأَلِ اللَّهَ (١)" data-def="أخرجه الترمذي في سننه (٢٥١٦ - ٤/ ٦٦٧).">إِذَا سَأَلْتَ فَاسْأَلِ اللَّهَ(١)</button>» مادام أن هناك حاجة تستحق السؤال؛ فليكن الله هو من تسأله!</p><p>أعجبتني مقولة نقلها أبو حامد الغزالي عن أحد العارفين يقول فيها عن اسم الله الأعظم: فرّغ قلبك من غيره ثم ادعه بأي اسم يجبك ..</p><p>وهذا فحوى معنى الصمد، اجعل في قلبك الله، ثم قل أي شيء من مرضاته سيكون إلهيّ المسحة، وربّانيّ الصبغة ..</p><p>كل عارضٍ يعرض إنّما هو رسالة تقول لك: لديك رب فالتجئ إليه ..</p><p>المرض رسالة لتذلّ له ..</p><p>والفقر برقيّة لتسجد له ..</p><p>والضعف مكالمة تقول لك استجلب القوّة من القويّ ..</p><p>الحياة كلّها تصرخ في وجهك: لديك رب، اصمد إليه!</p><div class="hadith-box" data-role="hadith"><p>وفي حديث ابن عباس سالف الذكر يقول المصطفى ﷺ: «احْفَظِ اللَّهَ يَحْفَظْكَ احْفَظِ اللَّهَ تَجِدْهُ <button type="button" class="term-btn" data-term="احْفَظِ اللَّهَ يَحْفَظْكَ (٢)" data-def="أخرجه الترمذي في سننه (٢٥١٦ - ٤/ ٦٦٧).">تُجَاهَكَ (٢)</button>»</p><div class="hadith-source">سنن الترمذي</div></div><p>أمامك!!</p>` },
        { tag: "الصمد", title: "خطوات الصمود بالقلب والجوارح", type: "reading", html: `<p>احفظه في نفسك وجوارحك وخطراتك، سيكون أمامك بحفظه ومعيّته ونصرته.</p><p>الصمد لا تهدأ قلوب خلقه حتى تضع <button type="button" class="term-btn" data-term="زوّاداتها" data-def="الزوّادة: ما يتزوّد به المسافر في طريقه، والمراد حطام رحال القلوب وحاجاتها عند باب الله.">زوّاداتها</button> عند عتبة مُلكه ..</p><h2>خطوات</h2><div class="step-card"><span class="step-num">١</span><div class="step-content">انظر في أي اتجاه شئت، ولكن اجعل في قلبك عينين لا تنظران إلاّ إلى عظمته!</div></div><div class="step-card"><span class="step-num">٢</span><div class="step-content">تحدّث بكل ما تريد، ولكن اجعل في قلبك لسانًا لا ينطق إلا بذكره!</div></div><div class="step-card"><span class="step-num">٣</span><div class="step-content">استمع إلى الجميع، ولكن اصنع في قلبك سمعًا لا يدرك إلا كلامه!</div></div><div class="step-card"><span class="step-num">٤</span><div class="step-content">امش إلى حيث شئت، ولكن احفر في قلبك خطوات نهايتها عرش الملك!</div></div><p>اصمد إليه بقلبك وروحك وتفكيرك وجسدك وإراداتك وأحلامك وأوهامك ..</p><p>إذا أمسكت قلمًا فتساءل: هل يرضى سبحانه عما سأكتبه في هذه الورقة؟</p>` },
        { tag: "الصمد", title: "منبه القلب وشموخ الصامدين", type: "reading", html: `<p>إذا هممت بكلمة تقولها فتساءل: هل سأقول شيئا يرضيه؟</p><p>إذا وقفت موقفًا تساءل: هل موقفي هذا محبوب عنده أم لا؟</p><div class="wisdom-pearl action-callout"><span class="wisdom-badge">✦ منبّه القلب</span>اصنع منبّها وعلّقه في أعلى قلبك دقاته تقول:<br/><strong>ماذا يريد الله؟ ماذا يريد الله؟ ماذا يريد الله؟</strong></div><p>اصمد إليه في كل حين، وإذا ما استيقظت في نصف الليل فتذكّره، خيالاتك سوداء إذا لم تتذكره، عقلك خراب دون أن يمرّ اسمه على خطراتك، أحلامك مستنقعات فإذا جاء ذكر الحي الذي لا يموت عليها صارت أنهارا وأشجارا وعصافير شادية.</p><h2>شموخ ..</h2><p>إذا علّمت روحك الصمود إليه، فإنّها مع الزمن ستستحي أن تكثر من الطلبات الدنيويّة لأنّها ليست الحيّز الذي خلقك له، كل آمالك أُخروية ..</p><p>قال الخليفة لابن عمر وهو يطوف حول الكعبة سلْني يا ابن عمر، فنظر إليه بشموخ الصامد إلى الله وقال، من أمر الدنيا أم الآخرة؟ فقال أما الآخرة فلله ولكن من شؤون الدنيا، فقال: لم أسأل الدنيا من يملكها فكيف أسألها من لا يملكها؟!</p>` },
        { tag: "الصمد", title: "عزة ابن تيمية وحقيقة الصمود", type: "reading", html: `<p>الصمود لله يحوّلك إلى عظيم، لا يبالي بمُلّاك التراب ..</p><p>الدنيا تخصص لا يقبل عليه الصامدون لله ..</p><p>قال أمير لابن تيمية، سمعنا أنّك تريد ملكنا يا ابن تيمية!</p><p>فرفع ابن تيمية رأسه بشموخ وقال: والله إن ملكك لا يساوي عندي فلسين!</p><p>رجل يعرّض وجهه لله آناء الليل، كيف يذل لقطعة خزف أطراف النهار؟</p><h2>حقيقة ..</h2><div class="wisdom-pearl"><span class="wisdom-badge">✦ معادلة الصمود</span>اللحظة التي تصمد فيها إليه لأجل حاجتك، هي نفسها اللحظة التي تصبح حاجتك ملك يمينك!</div><p>لا عبور لأي رغبة إلا من طريق الله، لا وجود لأي حاجة إلا في ساحة الله، لا إمكانيّة لحدوث شيء إلا بالله، فإنّه وحده الذي لا حول في الوجود ولا قوّة إلا به.</p><p>لا يمكن لخليّة أن تتحرّك ولا لذرة أن تكون ولا لقطرة أن تتبخر ولا لورقة شجر أن تسقط إلا بحوله وقوّته!</p><div class="epigraph-box"><p>لا يستطيع العالم كلّه أن يمسّك بسوء لم يرده الله،<br/>ولا يستطيع العالم كله أن يدفع عنك سوءًا قدّره الله!</p></div>` },
        { tag: "الصمد", title: "تفويض الأمر ودعاء الصمد", type: "reading", html: `<p>إذن فاجعل وجهك إليه، وألجئ ظهرك إليه، وفوّض أمرك إليه ..</p><p>فهو الصمد الذي لم يلد ولم يولد ولم يكن له كفوا أحد ..</p><div class="heart-keepsake-card"><span class="heart-badge">مناجاة الصمد</span><p>اللهم أصمد قلوبنا إليك، واجعلنا لا نطلب غيرك ولا نسأل سواك ولا نستغيث بأحد من خلقك يا الله ..</p></div><div class="ornament">❖ ✦ ❖</div>` },
        { tag: "الحفيظ", title: "اسم الله الحفيظ", type: "opener", html: `<div class="opener"><div class="letter-envelope-header"><span class="letter-seal">✦</span><span class="letter-envelope-title">الاسم الثاني</span></div><h1 class="chapter-opener">الحفيظ</h1></div><div class="epigraph-box"><p>نتذكر فائدة مانع الانزلاق ..<br/>وفائدة كابح السرعة ..<br/>وفائدة البالون الواقي ..<br/>وفائدة حزام الأمان ..<br/>وننسى الله!</p></div>` },
        { tag: "الحفيظ", title: "أيها القلب اطمئن ..", type: "reading", html: `<p>إذا شعرت أن حياتك في خطر، أو أن المرض يهدد صحّتك، أو كان ابنك بعيدًا عنك وقد خشيت عليه من الضياع أو رفقاء السوء، أو أن مالك الذي جمعته قد بات قاب قوسين أو أدنى من التبدد والتلف فاعلم أنّك بحاجة إلى أن تعلم أن من أسماء ربّك سبحانه «الحفيظ» وأنّه ينبغي عليك أن تجدد إيمانك بهذا الاسم العظيم، وأنّه قد جاء الوقت المناسب لتتفكّر فيه وتتأمّل ..</p><p>فهو وحده من يحفظ حياتك، ويحفظ صحّتك، ويحفظ أبناءك، ويحفظ مالك، ويحفظ كل شيء في هذه الحياة!</p><h2>أيها القلب اطمئنّ ..</h2><div class="wisdom-pearl academic-callout"><span class="wisdom-badge">✦ كلام الشيخ السعدي رحمه الله</span>يقول الشيخ السعدي رحمه الله تعالى: «الحفيظ الذي حفظ ما خلقه، وأحاط علمه بما أوجده، وحفظ أولياءه من وقوعهم في الذنوب و<button type="button" class="term-btn" data-term="الهَلَكات" data-def="الهَلَكات: مواطن الهلاك والبوار في الدنيا والآخرة.">الهَلَكات</button>، ولطف بهم في الحركات والسكنات».</div>` },
        { tag: "الحفيظ", title: "حفظ الجهات الست والحواس", type: "reading", html: `<p>منتهى الحفظ عنده، وغاية الرعاية لديه، وأقصى الطمأنينة ستكون وأنت بمعيّته.</p><p>يحفظ عبده؛ لذلك نقول دائمًا: اللهم احفظني من بين يدي ومن خلفي وعن يميني وعن شمالي ومن فوقي وأعوذ بعظمتك أن <button type="button" class="term-btn" data-term="أُغتال من تحتي" data-def="الاغتيال من التحت: الخسف ونحوه من المهلكات المباغتة التي تأتي الإنسان من حيث لا يشعر.">أُغتال من تحتي</button>.</p><p>إنّك تستحفظ الله جهاتك الستّ، إنّك تطلب منه هالة حفظ تحوطك من جميع الجهات، ولا يقدر على ذلك إلا هو!</p><p>يحفظ سمعك وبصرك، لذلك ندعوه في الصباح والمساء أن: اللهمّ عافني في سمعي، اللهم عافني في بصري ..</p><p>ستفقد الجهاز الذي تستطيع به فهم هذا العالم إن فقدت سمعك وبصرك، ستعيش في عزلة سوداء، ستخنقك الدنيا بصمتها!</p><div class="quran-box" data-role="quran"><p>﴿قُلْ أَرَأَيْتُمْ إِنْ أَخَذَ اللَّهُ سَمْعَكُمْ وَأَبْصَارَكُمْ وَخَتَمَ عَلَىٰ قُلُوبِكُم مَّنْ إِلَٰهٌ غَيْرُ اللَّهِ يَأْتِيكُم بِهِ﴾</p><div class="ayah-source">سورة الأنعام: ٤٦</div></div><p>الحفيظ هو من يحفظ سمعك، الذي تسمع به الحرام، ولو شاء لأذهبه في لحظة.</p><p>ويحفظ بصرك الذي تنظر به للحرام، ولو شاء لأذهبه في لحظة.</p>` },
        { tag: "الحفيظ", title: "طرقات الزيغ وثبات العقيدة", type: "reading", html: `<p>يحفظ دينك، لذلك تناجيه في السجود أن: يا مقلّب القلوب والأبصار ثبّت قلبي على دينك.</p><h2>طرقات الزيغ!</h2><p>لو لم يثبّت قلبك على دينه لتناوشتك الشبهات، وتخطّفتك الأهواء!</p><p>علماء أفنوا أعمارهم بين الكتب والمحابر لم يرد الله أن يحفظ عقائدهم: فكفروا به سبحانه، وبعضهم صار مبتدعًا في الدين، وأنت بعلمك القليل ما زلت تسجد له؟ لقد حفظ الحفيظ دينك!</p><div class="did-you-know-card"><span class="did-you-know-badge">✦ عبرة وعظة</span><p>عالم اسمه «عبد الله القصيمي» يؤلّف كتابًا يدافع فيه عن دين الله اسمه «الصراع بين الإسلام والوثنيّة» قيل عنه -مبالغة- إنّه دفع به مهر الجنّة! وأُثني عليه من منبر الحرم، ثم بعد ذلك بسنوات تطرق أصابع الزيغ قلبه -والعياذ بالله- وتبدأ الشبهات تنسج حول أفكاره بيوت الشك! ثم تغدو المسلّمات ممكنات، والحقائق آراء، وتحت تلك الشبهات ومن بين أكوام الضلال يمسك قلمه ويؤلف كتابًا يهاجم فيه الإسلام اسمه: «هذي هي الأغلال»، يقول: إن دين الله <button type="button" class="term-btn" data-term="آصار" data-def="الآصار: جمع إصر، وهو الثقل والعبء الشديد الذي يقيّد صاحبه.">آصار</button> وأغلال وقيود! نعوذ بالله من الخذلان!</p></div>` },
        { tag: "الحفيظ", title: "حفظ الدين وننسى الله!", type: "reading", html: `<div class="wisdom-pearl"><span class="wisdom-badge">✦ لا تغتر بعلمك</span>إن الحفيظ هو من يحفظ دينك، لا مجموعة المعلومات التي في رأسك! لا تغتر بعلمك، ولا بحفظك لكتاب الله، ولا باستظهارك لشيء من سنّة النبي ﷺ، والله ستزيغ إن لم يحفظ الله دينك!!</div><p>هذا «بلعام بن باعوراء» يؤتيه الله اسمه الأعظم، ليدعوه في أي وقت فيستجيب له، فلا يحول هذا الاسم العظيم بينه وبين الزيغ فيهلك في الهالكين.</p><h2>وننسى الله!</h2><p>يحفظ حياتك، لذلك نستودعه سبحانه أحبّتنا عندما نفارقهم ونقول: أستودعك الله الذي لا تضيع ودائعه! يستحيل أن تضيع الودائع التي أسبغ عليها الله حفظه وأحاطها برعايته.</p><p>كلّ حادث ينجو منه صاحبه وراءه حفيظ أنجاه منه، نتذكر فائدة مانع الانزلاق، وفائدة كابح السرعة، وفائدة البالون الواقي، وفائدة حزام الأمان، وننسى الله!</p><p>إذا صفعت الأمواج بعتوّها السفينة، وبلغت القلوب الحناجر، من الذي يحفظ السفينة من أن يبتلعها المحيط؟</p><p>رأيت تسجيلا لسفينة تلعب بها الأمواج، كان منظر من في السفينة وهم يندفعون بعنف من أقصاها إلى أقصاها مؤثرا، لا يملكون شيئًا، حتى التفكير لا يستطيعونه، الشيء الوحيد الممكن بالنسبة لهم هو محاولة التشبّث بأي شيء .. ثم لما انتقلت الكاميرات للخارج .. رأيت السفينة قشة صغيرة في وسط الأمواج العاتية!</p>` },
        { tag: "الحفيظ", title: "السفينة والطائرة في الأمواج", type: "reading", html: `<p>يعلن قائد الطائرة عن وجود عطل في الطائرة فيتحوّل أولئك الذين كان كل واحد منهم في فلك يسبح إلى <button type="button" class="term-btn" data-term="مخبتين" data-def="مخبتين: خاشعين متواضعين منيبين إلى الله بقلوبهم.">مخبتين</button>، الكل يلتجئ إلى الله ويعلن توبته، نسوا آمالهم وأحلامهم وهمومهم وغمومهم وصار الموت هو كل ما يمكن لعقولهم أن تتصوّره!!</p><div class="reflection-card"><div class="reflection-card-title">✦ سؤال يوقظ الغافلين</div><p>من هو الذي أصلح العطل بقدرته كي تنزل الطائرة بسلام ويخرج منها أولئك الذين حوّلهم الخوف إلى أشباح؟</p></div><p>تعرّضت طائرة كنت أحد ركّابها إلى مطبات هوائيّة شديدة، لحظتها فقط استشعرت وبدقّة كِبَر جِرم الطائرة، وكيف أنّها الآن في الجوّ تسبح فوق صحراء ممتدّة، شعرت بشيء فوق الخوف، كيف كنت غافلًا طوال الرحلات التي ركبت فيها الطائرة عن هذه الصورة المفزعة لهذا الجرم الذي يتحرّك في الجوّ بقدرة الله!</p>` },
        { tag: "الحفيظ", title: "المعقبات وحفظ الملائكة", type: "reading", html: `<div class="poetry-stanza"><div class="poetry-shatr">ندعوه في البحر أن ينجيْ سفينتنا</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">فإن وصلنا إلى الشاطي عصيناهُ</div></div><div class="poetry-stanza"><div class="poetry-shatr">ونركب الجوّ في أمن وفي دعة</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">فما سقطنا لأن الحافظ اللهُ</div></div><div class="ornament">❖ ✦ ❖</div><h2>المعقّبات</h2><p>يقول تعالى:</p><div class="quran-box" data-role="quran"><p>﴿لَهُ مُعَقِّبَاتٌ مِّن بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِ يَحْفَظُونَهُ مِنْ أَمْرِ اللَّهِ﴾</p><div class="ayah-source">سورة الرعد: ١١</div></div><p>لأجلك أنت يأمر الحفيظ سبحانه أربعة ملائكة أن يحيطوا بك حتى يحفظوك بأمره من كل ما لم يقدّره عليك.</p><p>كيف لا يكون حفيظا وقد أوكل بك هذا العدد من ملائكته الكرام حتى يصدّوا عنك أي طلقة لم يشأ سبحانه أن تخترق جسدك، وأي صخرة لم يرد سبحانه أن تنهي حياتك، بل وأي بعوضة لم يشأ سبحانه أن تؤذي بشرتك!</p><p>شاهدت وبذهول المقطع الذي تظهر فيه حادثة محاولة اغتيال الشيخ عائض القرني في الفلبين، وكيف أن المجرم وجّه إلى صدر الشيخ عائض ستّ رصاصات من مسافة متر تقريبًا، ولا حائل بين الطلقات والشيخ، والقاتل يبدو أنّه محترف، ولا توجد مقاومة من الشيخ أو من مرافقيه .. ثم يخرج الشيخ من تلك المحاولة الآثمة سليمًا معافى!! وأتذكر كيف أن طلقة واحدة ومن مسافة بعيدة، أودت بحياة الرئيس الأمريكي جون كندي مع أن سيّارته كانت تتحرّك، وحوله الحرس والجنود!</p>` },
        { tag: "الحفيظ", title: "ما بين القوسين ..", type: "reading", html: `<p>ثم يعلن الشيخ أنّه كان قد ذكر الله، وحصّن نفسه بالأدعية!</p><p>هذه الحادثة درس متكامل بل كتاب من عدّة أجزاء في معنى اسم «الحفيظ»!</p><h2>ما بين القوسين ..</h2><p>أتعلم أنّه يحفظك في كل لحظة؟</p><p>بل في كل لحظة يحفظك مئات المرات!!</p><p>كيف؟</p><div class="reflection-card"><div class="reflection-card-title">✦ تأمّل حفظه في هذه اللحظة</div><p>في هذه اللحظة التي تقرأ فيها (ما بين القوسين) حفظ قلبك من التوقّف، وشرايينك من الانسداد، وعقلك من الجنون، وكليتك من الفشل، وأعصابك من التلف، ورأسك من الصداع، ومعدتك من القرحة، وأمعاءك من التهاب القولون، وأعضاءك من الشلل، وعينيك من العمى، وسمعك من الصمم، ولسانك من الخرس، كل هذا وأكثر حفظه في هذه اللحظة، ثم يستمر هذا الحفظ في اللحظة التي تليها، وهكذا ..</p></div>` },
        { tag: "الحفيظ", title: "قارورة .. ومغامرة الشق", type: "reading", html: `<div class="reflection-card"><div class="reflection-card-title">✦ وقفة شكر</div><p>فكم «الحمد لله» ينبغي أن نقولها في اللحظة الواحدة؟</p></div><h2>قارورة ..</h2><p>إذا أوقفتَ سيّارتك في مكان مظلم وخشيت عليها أيدي السُّرَّاق فاستحفظها الحفيظ، فلن يضيّع سبحانه ما استحفظته عليه.</p><p>إذا خرجت من بيتك وخشيت على أطفالك فقل: أستودعكم الله الذي لا تضيع ودائعه، ستعود -بإذن الله- وهم في أحسن حال، لأنّه الحفيظ!</p><p>إذا ألجأتك الظروف أن تترك شيئا ثمينًا في مكان عام أو مكان غير آمن فانزح بقلبك إليه وقل: اللهم احفظه، وثق أنّ عين الله <button type="button" class="term-btn" data-term="ستكلؤه" data-def="تكلؤه: تحرسه وتحفظه وترعاه.">ستكلؤه</button> إلى أن تعود.</p><p>أربعة من الأصدقاء ذهبوا إلى مكان يبعد عن تبوك ستين كيلًا اسمه «نعمة ريط» ثم هبطوا الساعة التاسعة صباحًا سائرين على أقدامهم إلى مكان يُسمّى الشق! والشق هذا شرخ عظيم في قشرة الأرض، الهبوط إليه مغامرة، بل مجازفة بالحياة!</p><p>حبّهم للمغامرة جعلهم ينزلون، وصلوا إلى القاع في نصف ساعة تقريبًا، ثم مكثوا إلى قريب من المغرب في محاولة الصعود إلى السطح! تعلّقوا بالصخور، تزحلقت بهم الانحناءات الملساء، تهشّمت الطبقات الصخريّة تحت أقدامهم، عبروا من أماكن ضيّقة لا تتسع إلا لأصابع الأقدام!!</p>` },
        { tag: "الحفيظ", title: "قارورة الماء في قاع الشق", type: "reading", html: `<p>تعبوا، تشققت أرجلهم، أُنهكوا تمامًا، بلغ بهم العطش مبلغًا عظيمًا، باختصار: رأوا الموت!!</p><p>كانت قلوبهم معلّقة بالله، كانوا متيقنين أن لا حافظ إلا الله، يقول أحدهم (وبشهادة البقيّة) إنّه دعا الله بإلحاح وقد بلغ به العطش حدّ تمنّي الموت، فإذا به، وفي مكان لا يمكن أن يكون قد وطئته قدم إنسان في القريب على الأقل يرى قارورة ماء صحّة! نظيفة، فلم يفرح بالماء الذي تقاسمه مع رفاقه، بل فرح بالله الذي كان معه في تلك اللحظة، علم أن الله الذي أوجد تلك القارورة في تلك اللحظة سينقذهم من تلك الرحلة المميتة.</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ رمز الحفظ الإلهي</span>لم تعد القارورة في ذهنه ترمز للنجاة من الموت، بل ترمز لحفظ الحفيظ سبحانه ..</div><p>وقبيل المغرب وصلوا للسطح وأوجههم سوداء، وثيابهم مشققة، والدماء <button type="button" class="term-btn" data-term="تثعب" data-def="تثعب: تسيل وتتدفق.">تثعب</button> من أرجلهم، وإيمانهم بالله بحجم تلك الجبال التي أحاطت بهم!</p>` },
        { tag: "الحفيظ", title: "أعظم وأكثر وأكبر في الخلق", type: "reading", html: `<div class="poetry-stanza"><div class="poetry-shatr">سهرت أعين ونامت عيونُ</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">في شؤون تكون أو لا تكونُ</div></div><div class="poetry-stanza"><div class="poetry-shatr">إن ربًّا كفاك ما كان بالأمس</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">سيكفيك في غد ما يكونُ</div></div><div class="ornament">❖ ✦ ❖</div><h2>أعظم وأكثر وأكبر</h2><p>ولاسم الحفيظ مع كل مخلوق قصّة، فهو لا يخلق خلقه ثم يتركهم، بل يمدّهم بالسلاح الذي يواجهون به مفاجآت الحياة، يعطي كل مخلوق سيفه الخاص ليخوض حرب الحياة:</p><div class="step-card"><span class="step-num">١</span><div class="step-content">فهو يحفظ بعض الحيوانات بقدرتها على الجري السريع كالغزال والأرنب ..</div></div><div class="step-card"><span class="step-num">٢</span><div class="step-content">ويحفظ بعضها بقرون تبقر بها بطن من يقترب منها بسوء مثل وحيد القرن والجاموس ..</div></div><div class="step-card"><span class="step-num">٣</span><div class="step-content">ويحفظ بعضها بضخامة الجثّة، فتدكدك أعداءها بثقلها مثل الفيل والدب ..</div></div><div class="step-card"><span class="step-num">٤</span><div class="step-content">وبعضها يجعل سلاحها الذي يحفظها به صعقة كهربائية تصيب من يلمسها مثل فانوس البحر!</div></div><div class="step-card"><span class="step-num">٥</span><div class="step-content">وبعض الكائنات حفظها بسموم تكمن في أجسادها كالثعابين والعقارب!</div></div>` },
        { tag: "الحفيظ", title: "يدافع عنك .. وحرب الأولياء", type: "reading", html: `<p>ويحفظ الحرباء بأن جعلها تستطيع أن تغيّر لونها عند الحاجة!</p><p>ويحفظ بعضها بالطيران، وبعضها بالقدرة على المراوغة، والبعض بالتسلّق ..</p><p>هذا شيء من حفظه، وما لا تعلمه البشرية من حفظه سبحانه أعظم وأكثر وأكبر!</p><h2>يدافع عنك ..</h2><p>ومن صور حفظ الله أنّه سبحانه يدافع عن المؤمنين:</p><div class="quran-box" data-role="quran"><p>﴿إِنَّ اللَّهَ يُدَافِعُ عَنِ الَّذِينَ آمَنُوا﴾</p><div class="ayah-source">سورة الحج: ٣٨</div></div><p>تأمّل: إنّه لا يدفع عنهم الشر، بل يدافعه عنهم! وفي هذه إلماحة إلى ضراوة ما سيلاقونه وتعدد أشكاله وتنوّع صوره، ولكن الله أعلم بما <button type="button" class="term-btn" data-term="يوعي أعداؤه" data-def="يوعي أعداؤه: يضمرونه ويجمعونه في صدورهم من المكر والكيد.">يوعي</button> أعداؤه، فيدافعهم ويصدّهم عن أحبابه.</p><div class="hadith-box" data-role="hadith"><p>وفي الحديث القدسي: «مَنْ عَادَى لِي وَلِيًّا فَقَدْ آذَنْتُهُ <button type="button" class="term-btn" data-term="مَنْ عَادَى لِي وَلِيًّا (١)" data-def="أخرجه البخاري في صحيحه (٦٥٠٢ - ٨/ ١٠٥).">بِالحَرْبِ (١)</button>»! تخيّل: حربًا بين عدوّ للدعوة وللحق وللدين، وبين الله!</p><div class="hadith-source">صحيح البخاري</div></div>` },
        { tag: "الحفيظ", title: "في الغار وجندي الرعب", type: "reading", html: `<p>من المنتصر؟ من المهزوم؟ بل من المخذول؟</p><p>إنّه لعباده المؤمنين حفيظ، يحفظهم حفظًا خاصًّا، معه الحب، والرعاية، والرحمة.</p><p>يتجمّع مشركو قريش حول غار فيه رجلان: محمد ﷺ وأبو بكر الصديق رضي الله عنه، والإغراءات المالية تدفعهم لقتلهما، معها الأحقاد الدفينة، والرغبة في حوزة وسام الظفر بأهم شخصية في تلك المدّة ..</p><p>فيتسلل الخوف إلى فؤاد أبي بكر، فينظر إليه صاحبه العظيم ويقول: ما ظنّك باثنين، الله ثالثهما؟</p><p>يا أبا بكر، هل تعتقد أنّنا اثنان؟ كلا، بل نحن ثلاثة!!</p><p>هنا تتشتت المخاوف، تزول الرعدة، يذوب التوجّس:</p><div class="poetry-stanza"><div class="poetry-shatr">وإذا العناية لاحظتك عيونها</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">نم فالمخاوف كلّهنّ أمانُ</div></div><p>ها هم فتية الكهف يلتجئون إليه ويسألونه الهداية فيُلجئهم إلى كهف بلا باب، كهف مفتوح للبشر والهوام والسباع، ولكنّه يريد حفظهم فيلقي عليهم أحد جنوده، إنّه جندي الرعب!! فلا يقترب من الكهف أحد إلا وانتزع الرعب رغبته في التقدّم فتراه يُهرع خائفا:</p><div class="quran-box" data-role="quran"><p>﴿لَوِ اطَّلَعْتَ عَلَيْهِمْ لَوَلَّيْتَ مِنْهُمْ فِرَارًا وَلَمُلِئْتَ مِنْهُمْ رُعْبًا﴾</p><div class="ayah-source">سورة الكهف: ١٨</div></div>` },
        { tag: "الحفيظ", title: "إلقاء الرعب ووديان السباع", type: "reading", html: `<p>أنا وأنت إذا أردنا أن نلقي شيئا ألقينا قلما، أو كتابا، أو صخرة، أما الله فيلقي فيما يلقي أشياء أهم وأغرب وأكبر ..</p><p>يقول سبحانه:</p><div class="quran-box" data-role="quran"><p>﴿سَأُلْقِي فِي قُلُوبِ الَّذِينَ كَفَرُوا الرُّعْبَ﴾</p><div class="ayah-source">سورة آل عمران: ١٥١</div></div><p>لأجل عباده وأوليائه يلقي بالرعب في قلوب الذين كفروا فتنتفض أطرافهم <button type="button" class="term-btn" data-term="فَرَقًا" data-def="فَرَقًا: خوفاً وفزعاً شديداً.">فَرَقًا</button> من أولياء الله!</p><h2>وديان السباع</h2><p>ويحفظك سبحانه بالملائكة، فمن قرأ آية الكرسي قبل أن ينام أوكل الله به مَلَكا يقوم على رأسه يحفظه مما لم يقدّره الله عليه.</p><p>تخشى من ماذا إذا كان الله معك؟</p><p>يجعلك هذا الاسم ترغب في أن ترفع صدرك إلى الأعلى ثقة بالحي الذي لا يموت، تمشي في الظلام، تجوز وديان السباع، تخوض مستنقعات التماسيح، فالحفيظ يحيطك بهالة حفظ تجعل كل هذه الأشياء لعب أطفال تافهة.</p><p>نعم هذا لا يناقض أن تعمل بالأسباب، فقد أُمرنا بذلك، وعمل بها قدوتنا عليه الصلاة والسلام في هجرته ومغازيه وأيامه كلّها، ولكن يبقى السبب سببًا له قدره من الأهمّية، ويبقى الله في قلبك هو العليم، القدير، الحفيظ ..</p>` },
        { tag: "الحفيظ", title: "قصة السميط وسعيد بن جبير", type: "reading", html: `<p>من يقرأ قصّة الشيخ عبد الرحمن السميط رحمه الله في سفره إلى أفريقيا للدعوة ونشر الدين وكيف أنّه خاض المستنقعات والوديان الموحشة في مجاهل القارة السوداء، وجاع وعطش ومرض، ومع ذلك لم يمسسه سوء، بل ظل خمسًا وعشرين سنة في طريقه <button type="button" class="term-btn" data-term="اللاحب" data-def="الطريق اللاحب: الواضح الممتدّ البيّن.">اللاحب</button> الذي اختاره لنفسه، ثم مات في الكويت على السرير! من يقرأ قصّة السميط يعرف معنى الحفيظ ..</p><div class="did-you-know-card"><span class="did-you-know-badge">✦ كرامة أولياء الله</span><p>ذكر البعض مما يستأنس به في هذا السياق مما لا نتحقق دقّته ولكنّه ليس غريبا على عباد الله الصالحين: أن سعيد بن جبير أمسك به جنديان من جند الحجاج، وبينما هم في الطريق إذ نزلت الأمطار وألجأتهم إلى صومعة راهب، فرفض سعيد أن يدخلها رفضا قاطعا تنزّها أن يلج مكانًا يعبد فيه الله على ضلالة، فتركاه في الأسفل وصعدا، فإذا بأسد يقترب من سعيد فيصرخون به من الأعلى أن اهرب، فلا يحرّك سعيد ساكنًا بل يظلّ في عالم من الذكر دافئ، فيقترب الأسد أكثر، ثم يصل إلى سعيد وكأنّه يهمس له همسا ثم ينصرف، والجنديان ينظران بخوف والراهب ينظر بعين أخرى ويقول: هذا وليّ من أولياء الله!</p></div>` },
        { tag: "الحفيظ", title: "أنا الفقير وحادثة السكة", type: "reading", html: `<div class="poetry-stanza"><div class="poetry-shatr">خذوا كل دنياكم واتركوا</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">فؤادي حرا طليقا غريبا</div></div><div class="poetry-stanza"><div class="poetry-shatr">فإني أعظمكم ثروة</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">وإن خلتموني وحيدا سليبا</div></div><p>من الذي جعل الأسد يتوقف في اللحظة الأخيرة، إنّه الحفيظ!</p><h2>أنا الفقير</h2><p>شاهدت في مقطع مروّع عبر اليوتيوب أحدهم يمرّ من على سكّة الحديد مشيًا، والمشكلة أن القطار كان بكل قوّته قادما، ولكنّ الرجل قدَّرَ أنّه سيكون في الجهة الأخرى في الوقت المناسب، هذا هو تقديره ..</p><p>فجأة تعلَق رجله بين حديد السكّة، يحاول أن ينزعها فلا يستطيع والقطار مقبل بسرعة جبّارة، وصوته يملأ ذلك المكان برعب الموت، والرجل يحاول بهلع، يكاد أن يموت قبل أن يصله الموت! ولمّا تكون المسافة بينه وبين القطار أمتارا يأذن الله لحديد السكّة أن يفسح لرجله المجال فتخرج وينتقل إلى الجهة الأخرى في ومضة كان جزء منها سينهي حياته نهاية مأساوية!</p>` },
        { tag: "الحفيظ", title: "الركن الشديد ويا غلام ..", type: "reading", html: `<p>ثق بضعفك، ثق بهزال رأيك، ثق بفقرك، ثم اجعل قلبك معلّقا بالله، وردد:</p><div class="poetry-stanza"><div class="poetry-shatr">أنا الفقير إلى ربّ البريّات</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">أنا المُسيكين في مجموع حالاتي</div></div><p>نبيّ الله لوط عليه السلام يهجم قومه على بيته يريدون أن يخلعوا باب البيت وأن يظفروا بضيوفه، وهم ملائكة، يا له من عار أبديّ أن يظفر فسقة قومك بضيوفك، فقال بكل ضعف:</p><div class="quran-box" data-role="quran"><p>﴿لَوْ أَنَّ لِي بِكُمْ قُوَّةً أَوْ آوِي إِلَىٰ رُكْنٍ شَدِيدٍ﴾</p><div class="ayah-source">سورة هود: ١١ / ٨٠</div></div><div class="hadith-box" data-role="hadith"><p>قال نبيّنا عليه الصلاة والسلام: «يَرْحَمُ اللَّهُ لُوطًا، لَقَدْ كَانَ يَأْوِي إِلَى رُكْنٍ <button type="button" class="term-btn" data-term="يَرْحَمُ اللَّهُ لُوطًا (١)" data-def="أخرجه البخاري في صحيحه (٣٣٧٢ - ٤/ ١٤٧)، ومسلم في صحيحه (١٥١ - ١/ ١٣٣).">شَدِيدٍ (١)</button>».</p><div class="hadith-source">متفق عليه</div></div><div class="poetry-stanza"><div class="poetry-shatr">الزم يديك بحبل الله معتصمًا</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">فإنّه الركن إن خانتك أركان!</div></div><h2>يا غلام ..</h2><p>وقد يحفظك الله أيضا بأعدائك! كيف يكون ذلك؟</p><p>يقال إن لصًّا دخل إلى بيت، وأراد أن يسرق مالًا في إحدى الغرف وقد كان فيها طفل وأبواه، فتسلل اللص إلى الغرفة وحمل الطفلَ ونقله إلى غرفة أخرى فصرخ الطفل فاستيقظ الوالدان مبهوتين، وتساءلا ما الذي أخرج طفلهما فخرجا يبحثان عنه في المنزل، استغل اللص تلك اللحظة ودخل غرفة الأبوين لسرقتها، فجأة انهار سقف الغرفة ودفن اللص!</p>` },
        { tag: "الحفيظ", title: "الحفظ بالأعداء واحفظ الله", type: "reading", html: `<p>ما الذي جاء باللص لينقذ تلك الأسرة من الموت تحت الأنقاض بحيلة كانت عليه لا له! إنّه الحفيظ الذي يحفظ عباده، يحفظهم حتى بأعدائهم!</p><p>ومن أعظم الأسباب التي تستجلب بها حفظ الحفيظ سبحانه أن تحفظه!</p><div class="hadith-box" data-role="hadith"><p>أعد وتأمّل قراءة حديث: «يَا غُلَامُ، إِنِّي أُعَلِّمُكَ كَلِمَاتٍ: احْفَظِ اللَّهَ يَحْفَظْكَ، احْفَظِ اللَّهَ تَجِدْهُ تُجَاهَكَ، تَعَرَّفْ إِلَى اللَّهِ فِي الرَّخَاءِ يَعْرِفْكَ فِي <button type="button" class="term-btn" data-term="يَا غُلَامُ إِنِّي أُعَلِّمُكَ كَلِمَاتٍ (١)" data-def="أخرجه الترمذي في كتاب صفة القيامة والرقائق والورع (٢٥١٦)، وقال: «حسن صحيح»، وأحمد في «مسنده» (٢٦٦٤)، وصححه الشيخ الألباني في كتاب «التوسل» (٣٥).">الشِّدَّةِ (١)</button>»</p><div class="hadith-source">سنن الترمذي ومسند أحمد</div></div><div class="wisdom-pearl action-callout"><span class="wisdom-badge">✦ قاعدة الحفظ</span>احفظ الله، يحفظك الله ..<br/>احفظه في أوامره فقم بها كما أمرك<br/>واحفظه في نواهيه فانته عنها كما نهاك.</div>` },
        { tag: "الحفيظ", title: "اختناق .. ونجاة ذي النون", type: "reading", html: `<h2>اختناق</h2><p>هذا كل ما في الباب، وبعد ذلك اشمخ على مخاوفك وأحزانك، سينجيك الله منها كما أنجى ذا النون بن متّى.</p><p>لا همّ ولا غمّ ولا كرب يقارب هم وغم وكرب ذي النون يونس عليه السلام، في ظلمات ثلاث: ظلمة البحر، وظلمة الليل، وظلمة بطن الحوت، يا لها من حياة بئيسة تلك التي ستقضيها إلى أبد الآبدين في بطن الحوت على تلك الهيئة الكئيبة ..</p><p>ظلام، ضيق، اختناق ..</p><div class="quran-box" data-role="quran"><p>ثم يواجه ذلك السيل من الكروب بكلمة واحدة: «لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ».</p><div class="ayah-source">سورة الأنبياء: ٨٧</div></div><p>فتصعد تلك الأحرف الضعيفة، تخترق ظلمة الحوت، وظلمة البحر، وظلمة الليل، تصعد إلى السماء، يُروى أن الملائكة سمعتها فقالت: يا ربّ، صوت معروف من مكان غير معروف!</p><p>فيجيء الفرج، ويجيء الحفظ، ويجيء العفو، فيلقيه الحوت بالساحل، وينبت عليه الحفيظ شجرة من <button type="button" class="term-btn" data-term="يقطين" data-def="اليقطين: القرع وكل شجر لا ساق له، وكان عريض الورق ظليلاً نافعاً لا يقربه الذباب.">يقطين</button>.</p><p>كلّنا في هذه الحياة ذو النون، والحياة قد التأمت علينا بكروبها، ولن ينجينا منها إلا: «لا إله إلا أنت سبحانك، إني كنت من الظالمين» ..</p>` },
        { tag: "الحفيظ", title: "دعاء الحفظ والفرج", type: "reading", html: `<div class="heart-keepsake-card"><span class="heart-badge">مناجاة الحفيظ</span><p>اللهم احفظنا بحفظك، و<button type="button" class="term-btn" data-term="اكلأنا" data-def="اكلأنا: احرسنا واحفظنا برعايتك الساهرة.">اكلأنا</button> برعايتك، واجعل من بين أيدينا ومن خلفنا وعن أيماننا وعن شمائلنا ومن فوقنا ومن تحتنا حفظًا منك تنجينا به مما نخشى ونحاذر ..</p></div><div class="ornament">❖ ✦ ❖</div>` },
        { tag: "اللطيف", title: "اسم الله اللطيف", type: "opener", html: `<div class="opener"><div class="letter-envelope-header"><span class="letter-seal">✦</span><span class="letter-envelope-title">الاسم الثالث</span></div><h1 class="chapter-opener">اللَّطيف</h1></div><div class="epigraph-box"><p>إذا أراد اللطيف أن يصرف عنك السوء<br/>جعلك لا ترى السوء، أو جعل السوء لا يعرف لك طريقًا،<br/>أو جعلكما تلتقيان وتنصرفان عن بعضكما وما مسّك منه شيء!</p></div>` },
        { tag: "اللطيف", title: "خفي الألطاف", type: "reading", html: `<div class="reflection-card"><div class="reflection-card-title">✦ حين تضيق الأسباب</div><p>هل لديك أمانٍ بعيدة المنال، بينك وبينها أهوال؟<br/>هل أخبرك الأطباء أن لا أمل في شفاء قريبك؟<br/>هل تشعر باليأس لأن ما يمكنك أن تفعله لن يأتي إليك بما تتمنى حصوله؟</p></div><p>إذن تعال معي لنتعرّف إلى اسم الله «اللطيف» والذي ستكتشف إذا ما تأمّلته أن لا مستحيل في هذه الحياة، وأن الله قادر على كل شيء، وأن أحلامك المستحيلة ستغدو ممكنة التحقق إذا ما طرقت باب اللطيف!</p><h2>خفيّ الألطاف</h2><div class="wisdom-pearl academic-callout"><span class="wisdom-badge">✦ اللطيف في اللغة</span>في اللغة: «اللطيف: البَرّ بعباده، المحُسن إلى خلقه بإيصال المنافع إليهم برفق ولطف»، وتقول «لَطَفَ الله لك: أوصل إليك مرادك بلطف»<br/>واللطف أصله خفاء المسلك ودقّة المذهب ..</div>` },
        { tag: "اللطيف", title: "إكرام في خفاء ورياح البشرى", type: "reading", html: `<p>فلن يوصل إليك إحسانه برفق إلا من يصل علمه إلى دقائق الأمور وخفايا النفوس ..</p><p>فالله سبحانه «هو المحسن إلى عباده في خفاء وستر من حيث لا يعلمون، ويسبب لهم أسباب معيشتهم من حيث لا يحتسبون»</p><p>فهو ذو لُطف وخفاء ودقّة في إكرامه وإحسانه، وفي عصمته وهدايته، وفي تقاديره وتصاريفه.</p><p>فمع بالغ قدرته، وعظمة علمه، وبصره بمخلوقاته، إلا أنّه ذو لطف فيما يحوط به العبد من هداية وإكرام وإحسان، لا تفجؤك أفضاله بل يسبقها برياح البشرى، ويهيّئ قلبك لاستقبالها، ثم إذا نزلت بك الأفضال جعل لها من الأسباب التي تسبقها ما تكون بها ممهّدة الوقوع، وكأنّها من محض كسب العبد وهي على الحقيقة إكرام بحت من عظيم المنّ والعطاء.</p><p>وتأتي بلطفه عظائمُ المقادير والتي تستبعدُ أكثر العقول خيالًا وقوعها؛ فيجعلها كائنة حاضرة، كل خيط من ذلك المقدَّر يمسك به قدرٌ من لطفه، فلا تنتبه إلا -وبقريب من المعجزات- قد بات بساحتك! لا تعلم كيف أمكنه أن يحدث، وتتيقّن أنّ حولك وقوّتك أقل من أن تُحدثه، فتنظر إلى السماء وتقول:</p><div class="quran-box" data-role="quran"><p>﴿اللَّهُ لَطِيفٌ بِعِبَادِهِ﴾</p><div class="ayah-source">سورة الشورى: ١٩</div></div>` },
