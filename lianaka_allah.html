        { tag: "اللطيف", title: "نسيم اللطف وبصائر العباد", type: "reading", html: `<h2>نسيم اللطف</h2><div class="step-card"><span class="step-num">١</span><div class="step-content">إذا أراد اللطيف أن ينصرك أمر ما لا يكون سببًا في العادة فكان أعظم الأسباب!</div></div><div class="step-card"><span class="step-num">٢</span><div class="step-content">وإذا أراد اللطيف أن يكرمك جعل من لا ترجو الخير منه هو سبب أعظم العطايا التي تنالك!</div></div><div class="step-card"><span class="step-num">٣</span><div class="step-content">وإذا أراد اللطيف أن يصرف عنك السوء جعلك لا ترى السوء، أو جعل السوء لا يعرف لك طريقًا، أو جعلكما تلتقيان وتنصرفان عن بعضكما وما مسّك منه شيء!</div></div><div class="step-card"><span class="step-num">٤</span><div class="step-content">وإذا أراد اللطيف أن يعصمك من معصية جعلك تبغضها، أو جعلها صعبة المنال منك، أو أوحشك منها، أو جعلك تقدم عليها فيعرض لك عارض يصرفك به عنها!</div></div><p>وعباد الله يرقبون تلك الألطاف من اللطيف، ويبصرونها ببصائرهم وكأنّ كل قضاء ينالهم به بصمة لطف يدركونها وحدهم.</p><p>عندما أراد اللطيف أن يُخرج يوسف عليه السلام من السجن، لم يدكدك جدران السجن، لم يأمر مَلَكًا أن ينزع الحياة من أجساد الظَّلَمَة، لم يأذن لصاعقة من السماء أن تقتلع القفل الحديدي، فقط جعل الملك يرى رؤيا في المنام تكون سببًا خفيًّا لطيفًا يستنقذ به يوسف الصدّيق من أصفاد الظلم!</p>` },
        { tag: "اللطيف", title: "رؤيا الملك وحشرة الأرضة", type: "reading", html: `<p>ولما شاء اللطيف أن يعيد موسى عليه السلام إلى أمّه لم يجعل حربًا تقوم يتزعّمها ثوّار بني إسرائيل ضد طغيان فرعون يعود بعدها المظلومون إلى سابق عهدهم، لا .. بل جعل فم موسى لا يستسيغ حليب المرضعات! بهذا الأمر الخفيّ يعود موسى إلى أمّه بعد أن صار فؤادها فارغًا!</p><p>ولما شاء اللطيف أن يخرج رسولنا عليه الصلاة والسلام ومن معه من عذابات شِعب بني هاشم لم يرسل صيحة تزلزل ظلم قريش، فقط أرسل <button type="button" class="term-btn" data-term="الأرَضَة" data-def="الأرَضَة: دويبة صغيرة بيضاء كالنمل تأكل الخشب والورق، سخرها الله لأكل صحيفة المقاطعة الظالمة.">الأرَضَة</button> تأكل أطراف وثيقة الظلم وعبارات التحالف الخبيث! فيصبحون وقد تكسّرت من الظلم العُرى، بحشرة لا تكاد ترى!!</p><div class="poetry-stanza"><div class="poetry-shatr">لغيرك ما مددت يدا</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">وغيرك لا يفيض ندى</div></div><div class="poetry-stanza"><div class="poetry-shatr">وليس يضيق بابك بي</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">فكيف ترد من قصدا</div></div><div class="poetry-stanza"><div class="poetry-shatr">وركنك لم يزل صمدا</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">فكيف تذود من وردا</div></div><div class="poetry-stanza"><div class="poetry-shatr">ولطفك يا خفيّ اللطف</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">إن عادي (الشرور) عدا</div></div>` },
        { tag: "اللطيف", title: "الصخرة وصرف السوء بلطف", type: "reading", html: `<p>إنّه اللطيف سبحانه، بأيسر الأمور يقدّر أعظم المقادير، وتتمّ إرادته على ما شاء، وعبده غير مدرك بأن شيئًا ما يحدث!</p><h2>الصخرة</h2><p>تنام فيحبّ أن تقوم تصلي بين يديه، فيرسل ريحًا هادئة تحرّك نافذتك، أو طفلًا من أسرتك يمرّ ويحدث ضوضاء بجوار غرفتك، أو حاجة شديدة في شرب شيء من الماء؛ فتستيقظ وتنظر إلى الساعة، وبعد دقائق تكون واقفًا على السجّادة تناجيه ولا تعلم أنّه هو من أيقظك!</p><p>تقود سيارتك في مرتفعات الجبال ثم فجأة ترى من الضرورة أن توقف سيّارتك جانبًا لتتأكد من وجود شيء في درج السيارة (هويّتك أو محفظة نقودك) وبعد ثوانٍ ترى أمامك صخرة عظيمة هابطة من أعلى الجبل لو لم تقف لدكدكتك وسيارتك! فتكمل رحلتك سالمًا، ولا تعلم أنّه هو من أنقذك!</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ لطف العصمة الخفي</span>تخطط لمعصيته، تخرج ليلًا، تفاصيل الخطّة محكمة، فجأة تمرّ سيارة من بعيد، فتشكّ أنت أن أحدهم يراقبك، فتنغّص تلك السيارة المارّة فكرة الذنب لديك؛ فتبرد إرادتك وتعود إلى بيتك، ولا تعلم أنّه هو من صرفك بلطفه عن معصيته!</div>` },
        { tag: "اللطيف", title: "الخفايا والخبايا وعلم اللطيف", type: "reading", html: `<div class="poetry-stanza"><div class="poetry-shatr">وكم لله من لطفٍ خفيّ</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">يدقّ خفاه عن فهم الذكيّ</div></div><div class="poetry-stanza"><div class="poetry-shatr">وكم أمر تساء به صباحا</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">فتأتيك المسرّة في العشيّ</div></div><div class="poetry-stanza"><div class="poetry-shatr">إذا ضاقت بك الأحوال يومًا</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">فثق بالواحد الفرد العليّ</div></div><div class="ornament">❖ ✦ ❖</div><h2>الخفايا والخبايا</h2><p>ولا بد للّطيف أن يكون عليمًا؛ فكيف يكرمك ويمنّ عليك ويهديك بلطفٍ من لا يعلم مكامن هذا اللطف؟</p><p>ولا بد أيضًا أن يكون خالقًا؛ إذ أنّ كمال اللطف يقتضي في بعض الأمور إيجاد ما ليس موجودًا وخلقَه، وها هي أسماء الله وصفاته يشير بعضها إلى بعض، ويقتضي ويستلزم بعضها البعض، يقول تعالى:</p><div class="quran-box" data-role="quran"><p>﴿أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ﴾</p><div class="ayah-source">سورة الملك: ١٤</div></div><p>كيف لا يعلم وقد بلغ من علمه أنْ أخفى عطاءاته فكانت دقيقة الحضور، هادئة النور، باهرة الشعور، كيف لهذا الرب الذي يكرم بخفاء، ويهدي بخفاء، ويصرف بخفاء، ألاّ يعلم كل هذا اللطف الذي يحدثه سبحانه؟</p>` },
        { tag: "اللطيف", title: "رؤيا يوسف ومؤشرات الاستحالة", type: "reading", html: `<div class="wisdom-pearl academic-callout"><span class="wisdom-badge">✦ كلام الشيخ السعدي رحمه الله</span>يقول الشيخ السعدي: «وهو اللطيف الذي أحاط علمه بالسرائر والخفايا، وأدرك البواطن والخبايا»</div><p>وها هي رؤيا من أعظم رؤى البشرية يراها يوسف عليه السلام وهو في حالة تقول كلّ مؤشّراتها الطبيعية باستحالة تحققها! يحكي رؤياه فيقول:</p><div class="quran-box" data-role="quran"><p>﴿إِنِّي رَأَيْتُ أَحَدَ عَشَرَ كَوْكَبًا وَالشَّمْسَ وَالْقَمَرَ رَأَيْتُهُمْ لِي سَاجِدِينَ﴾</p><div class="ayah-source">سورة يوسف: ٤</div></div><p>وتأويل الرؤيا أن أباه وأمّه وإخوته الأحد عشر سيسجدون له إكرامًا وتوقيرًا!!</p><p>جميع المؤشّرات لا تدل على تحقّق مثل هذه الرؤيا!</p><p>فأبوه نبيّ كريم، كبير في السن، جليل في القدر، ولا تفضي معهودات الأمور أن يكرّم الكبير الصغير، والنبي غير النبي، والأب الابن!</p><p>وإخوته يكرهونه فكيف سيسجدون له، بل بلغ من كرههم أن خططوا لقتله، بل إن كرههم دفعهم لإلقائه في البئر، فهذه المؤشرات تقول باستحالة أن يحدث سجودهم له في يوم ما!</p><p>ثم إنّ الأحوال تقلّبت به فصار مرميًّا في بئر، ثم سلعة تباع وتشترى، ثم صار عبدًا في بيت عزيز مصر! وحال العبودية تلك تقضي أيضًا بتأكيد معنى الاستحالة هذه!</p><p>ثم انتقل من كونه عبدا خادما في قصر إلى عبد حبيس في سجن! فبعدت المسافة أكثر بينه وبين تحقق تلك الرؤيا!!</p>` },
        { tag: "اللطيف", title: "تحقق الرؤيا وألطاف اللطيف", type: "reading", html: `<p>ولكنّ اللطيف سبحانه يقدر الأقدار، ويصرّف الأمور، ويخرجه من السجن، ويجعله في منصب رفيع، ثم يقدّر القحط على البلاد، ثم يأتي بإخوته في ثياب الحاجة، وما تزال أقدار اللطيف تلتف لتحقق تلك الرؤيا القديمة؛ فيعجب يوسف لسجود والديه وإخوته ويقول:</p><div class="quran-box" data-role="quran"><p>﴿يَا أَبَتِ هَٰذَا تَأْوِيلُ رُؤْيَايَ مِن قَبْلُ قَدْ جَعَلَهَا رَبِّي حَقًّا﴾</p><div class="ayah-source">سورة يوسف: ١٠٠</div></div><p>وإلا فلولا إرادة ربّه لما تحققت ..</p><div class="quran-box" data-role="quran"><p>﴿وَقَدْ أَحْسَنَ بِي إِذْ أَخْرَجَنِي مِنَ السِّجْنِ وَجَاءَ بِكُم مِّنَ الْبَدْوِ مِن بَعْدِ أَن نَّزَغَ الشَّيْطَانُ بَيْنِي وَبَيْنَ إِخْوَتِي﴾</p><div class="ayah-source">سورة يوسف: ١٠٠</div></div><p>هذا اختصار للطف الذي سيطر على المشهد ثم يضع التوقيع النهائي فيقول: ﴿إِنَّ رَبِّي لَطِيفٌ لِّمَا يَشَاءُ﴾ .. نعم إنّه اللطيف إذا أراد شيئا هيّأ أسبابه بكامل اللطف وتامّ الخفاء، حتى أنّه ليقع ما يستحيل في العادة أن يقع! لأنّه الله اللطيف الخبير.</p>` },
        { tag: "اللطيف", title: "الأحلام البعيدة .. واللطف في الجنين", type: "reading", html: `<h2>الأحلام البعيدة</h2><p>إذا رأيت الأرض صفراء <button type="button" class="term-btn" data-term="بلقعًا" data-def="الأرض البلقع: القفر الخالية من النبات والماء.">بلقعًا</button>، ثم تكوّم السحاب فوقها، ثم تصافعت الرعود ونزل المطر فاهتزت تلك الأرض واخضرّت فلا تقل إن مثل هذا أمر طبيعي، وتدبّر:</p><div class="quran-box" data-role="quran"><p>﴿أَلَمْ تَرَ أَنَّ اللَّهَ أَنزَلَ مِنَ السَّمَاءِ مَاءً فَتُصْبِحُ الْأَرْضُ مُخْضَرَّةً إِنَّ اللَّهَ لَطِيفٌ خَبِيرٌ﴾</p><div class="ayah-source">سورة الحج: ٦٣</div></div><p>مهما تباعدت أحلامك وصار بينك وبينها <button type="button" class="term-btn" data-term="مفاوز" data-def="المفاوز: جمع مفازة وهي الصحراء الواسعة المهلكة البعيدة الأطراف.">مفاوز</button> شاسعة فاللطيف يأتي بها:</p><div class="quran-box" data-role="quran"><p>﴿يَا بُنَيَّ إِنَّهَا إِن تَكُ مِثْقَالَ حَبَّةٍ مِّنْ خَرْدَلٍ فَتَكُن فِي صَخْرَةٍ أَوْ فِي السَّمَاوَاتِ أَوْ فِي الْأَرْضِ يَأْتِ بِهَا اللَّهُ إِنَّ اللَّهَ لَطِيفٌ خَبِيرٌ﴾</p><div class="ayah-source">سورة لقمان: ١٦</div></div><p>فلا تيأس وربّك لطيف لما يشاء.</p><p>تأمّل حبّة الخردل! إنّك لا تكاد تراها إن لم تكن محدّقا فيها: انظر إلى حجمها بالنسبة لكفك، ثم بالنسبة لحجم غرفة مثلا، ثم بيت، ثم قارن حجمها بحيّك، ثم بمدينتك، ثم بدولتك، وبعد ذلك بقارّتك، ثم بالأرض، ثم بالسماوات الفسيحة، ثم ثق: إن أرادها الله فسيأتي بها ﴿إِنَّ اللَّهَ لَطِيفٌ خَبِيرٌ﴾!</p><p>فمن بلغ بلطفه أن يأتي بحبة الخردل من متاهات هذا الكون العظيم، ألا يمكن للطفه أن يقود قدرًا إليك -كل المقدّمات المنظورة لا توصله إليك، ولا تدلّه عليك- بلى والله.</p><p>يصل صاحبي في رحلة شاقة من تبوك إلى حدود الأردن، عنده في صباح الغد محاضرات في جامعة مؤتة يجب عليه حضورها، وفي الحدود وبعد قطعه لمسافة مئة كيلو متر يتذكر أن جواز سفره في بيته! يتكدّر ويقرر العودة وعدم السفر ذلك الأسبوع ..</p>` },
        { tag: "اللطيف", title: "لطف اللحظة الحاسمة", type: "reading", html: `<p>في الغد يقرأ في الصحف عن أنّ بعض طلبة الجامعة -وطلاب الجامعة خليط من جنسيات عديدة- قاموا بأعمال شغب في جامعة مؤتة مما أسفر عن جرحى!</p><p>اللطيف أنساه الجواز، حتى لا يرى الدم، أو حتى لا يصبح الصباح وهو في المستشفى! أو حتى لا يتسلل الخوف إلى قلبه فيترك الدراسة التي كان قد قطع فيها شوطًا كبيرًا!!</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ ألطاف تترى</span>ارقب ألطاف اللطيف، هي ولا شك <button type="button" class="term-btn" data-term="تترى" data-def="تترى: تتوالى وتتابع بعضها إثر بعض.">تترى</button>، في كل قدرٍ لطفٌ ما، وفي كل لحظةٍ ألطافٌ تحوطك من قِبَل اللطيف الخبير.</div><h2>لطف اللحظة الحاسمة</h2><p>انظر لنفسك حينما تدخل الغرفة في اللحظة التي كاد طفلك أن يسقط فيها من على السرير وتساءل: لماذا الآن بالذات دخلت الغرفة؟</p><p>تأمّل ذاتك يوم أن تدخل المطبخ لتشرب الماء فإذا بك تسمع أزيز الكهرباء من فيش الثلاجة مثلًا، فتفصله وأدخنة الحريق كانت في بدايتها وتساءل: ما الذي أدخلك في هذه اللحظة بالذات؟ لماذا لم تتأخر خمس دقائق فقط؟</p>` },
        { tag: "اللطيف", title: "يا خفي الألطاف نجنا", type: "reading", html: `<p>وحتى لو لم تحدث لك مثل هذه التفاصيل، فمن المؤكد أن ما هو قريب منها قد حدث لك، فقط أطلق لذاكرتك العنان، وسوف تتذكر ظلال اللطف وهي تغمر حياتك ..</p><p>وبعد هذا الإبحار الهادئ مع هذا الاسم العظيم، والذي لم نأت إلا على شيء يسير من معناه، وبقي من خبايا معناه ما أتركه لفهمك وتأمّلك ورجوعك لكتب أهل العلم فيه.</p><p>وبعد هذا الإبحار، ألا يستحق هذا اللطيف أن تحبّه؟ أن تتأمّل عطاياه؟ أن تزيد في قلبك من ذكره ومراقبته ورجائه وخوفه؟</p><p>أن تعيش مع هذا الاسم أياما .. تدعوه به، وترقب ألطافه، وتفيض عيناك لرؤية خفيّ هداياته وهداياه؟</p><p>قل في خشوع:</p><div class="heart-keepsake-card"><span class="heart-badge">مناجاة اللطيف</span><p>يا خفيّ الألطاف نجّنا مما نخاف ..<br/>اللهم يا لطيف الطف بنا، والطف لنا، وقدّر لنا من ألطافك الرحيمة ما تقوّم به عوج نفوسنا، وتهدي به ضال قلوبنا، وتجمّل به <button type="button" class="term-btn" data-term="شعث حياتنا" data-def="شعث الحياة: تفرق أمرها واضطراب شؤونها.">شعث حياتنا</button>.</p></div><div class="ornament">❖ ✦ ❖</div>` },
        { tag: "الشافي", title: "اسم الله الشافي", type: "opener", html: `<div class="opener"><div class="letter-envelope-header"><span class="letter-seal">✦</span><span class="letter-envelope-title">الاسم الرابع</span></div><h1 class="chapter-opener">الشَّافي</h1></div><div class="epigraph-box"><p>يشفيك بسبب ..<br/>ويشفيك بأضعف سبب ..<br/>ويشفيك بأغرب سبب ..<br/>ويشفيك بما يُرى أنّه ليس بسبب ..<br/>ويشفيك بلا سبب!</p></div>` },
        { tag: "الشافي", title: "مدخل: في ظلال الشافي", type: "reading", html: `<div class="reflection-card"><div class="reflection-card-title">✦ حين تتعبك الأوجاع</div><p>هل <button type="button" class="term-btn" data-term="رضّتك الأوجاع" data-def="رضّتك الأوجاع: دقّتك وكسّرت قواك بشدة ألمها.">رضّتك</button> الأوجاع؟ وأتعبتك الآلام؟ وأشعرك المرض أن الحياة رماديّة اللون؟<br/>هل كرهت مراجعة الأطباء، وتعبت من السير في ممرات المستشفيات، واختلطت في عقلك أسماء العيادات، بتواريخ المراجعات، بأوجه المرضى؟</p></div><p>إذن ما رأيك أن أطلعك على شيء يغسل روحك من <button type="button" class="term-btn" data-term="أوصابها" data-def="الأوصاب: جمع وَصَب، وهو المرض الدائم والوجع اللازم.">أوصابها</button> وأتعابها؟</p><p>إنّه اسم الله «الشافي» ..</p><p>اسمح لنفسك المنهكة أن تلتقط أنفاسها قليلًا، لتقرأ عن هذا الاسم الرحيم، هذا الاسم الذي ستعلم بعد أن تتفيّأ ظلاله مقدار حاجتك إليه، ومقدار بعدك عنه أيضًا ..</p>` },
        { tag: "الشافي", title: "لا مرض بعد اليوم .. ومعنى الشافي", type: "reading", html: `<h2>لا مرض بعد اليوم</h2><p>الشافي من أسمائه سبحانه التي نحمده عليها، نحمده أن تسمّى بهذا الاسم، وأن اتّصف بصفة الشفاء، وأن كان هو وحده من يشفي ويعافي أجساد عباده، وهو اسم يُفصح عن معناه، ويعكس ظاهره خبايا باطنه.</p><p>والشفاء متعلّق بالمرض ..</p><p>ولأنّ المرض في حياة الإنسان عرض متكرر الحدوث، متنوّع الآلام، متعدد الأشكال، لا تكاد تخلو منه نفس، فمن شُفي من مرض عينه شعر بصداع رأسه، ثم إن سكن صداع رأسه آذته خشونة مفاصله، فإن هدأت تلك الأوجاع أخذته الحمّى، فإن بردت الحمّى ارتفعت التهابات القولون لديه، فإن خفتت هجم عليه عصب الضرس .. وهكذا، لا يكاد يخلو يوم من ألم!</p><p>فإن عمّت العافية جسده، نظر فإذا بأخيه يتأوّه، أو أمّه تبكي، أو ابنه يئنّ، أو حبيبه يتألم ..</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ في محراب رحمته</span>الحياة حقل أمراض، وأوجاع، وتنهّدات، لذلك فقد سمّى الله نفسه بالشافي، لتسجد آلامك في محراب رحمته، وتنكّس أوجاعك رأسها عند عتبة قدرته ..</div><p>المرض فضيحة كبرى تُبتلى بها غطرسة البشر! ذبول مفاجئ يفقد فيه الإنسان ازدهاره! نكسة لحيويّة ذلك <button type="button" class="term-btn" data-term="الهَلوع المَنوع" data-def="الهلوع: شديد الجزع والضجر عند مسّ الضر. والمنوع: البخيل الممسك عند مسّ الخير.">الهَلوع المَنوع</button> ..</p><p>قدّر الله سبحانه وتعالى على هذا الجسد أن تنطفئ نضارته مؤقتًا، حتى يقتنع الإنسان بضعفه، وبأنّه لا حول له ولا قوّة ..</p>` },
        { tag: "الشافي", title: "تيجان الصحة ورسالة المرض", type: "reading", html: `<p>قدّر الله المرض على الإنسان حتى يتذكر شيئًا أشبه ما يكون بهذا المرض، إنه الموت!! فكما أن المرض نهاية الحيوية فكذلك الموت نهاية الحياة.</p><p>أيها الإنسان، إن حقيقتك الموت، وإنّ كل شيء فيك يشبه الموت، نومك موت، مرضك موت، انتقالك إلى مرحلة عمرية موت للمرحلة السابقة، فالشباب موت الطفولة، والكهولة موت الشباب، إنّك أشبه بالموت من الحياة، ومع ذلك فإن الوهم يجعلنا نعتقد أننا مخلّدون ولهذا يصرخ المرض بأجسادنا، أنّها إلى زوال!</p><div class="reflection-card"><div class="reflection-card-title">✦ تيجان الصحة</div><p>وبينما يستلقي ذلك الجسد المنهك على سرير المرض، ينظر إلى الداخلين إليه والخارجين من عنده، وهم يحملون على رؤوسهم تيجان الصحّة والعافية، بينما يحدث ذلك، تستيقظ في داخله ذكريات التراب، فتعمّ كيانه نكهة المقبرة، شعر بذلك أم لم يشعر!</p></div><p>روحك وأنت مريض تكون في اجتماعات مغلقة مع الموتى، وبدايات الانهيار الداخلي تنضح بها عيناك وشفتاك وارتجاف في أطرافك الباردة.</p><p>ها هي الحياة التي في داخلك تلوّح بكفيها مودّعة أولئك الزائرين.</p>` },
        { tag: "الشافي", title: "يشفيك بلا سبب!", type: "reading", html: `<p>ولمّا يأخذ المرض مداه، وتنغسل أنت من الدنيا جيّدًا، يأذن الشافي سبحانه للداء بالانصراف عن جسدك، ويأمر الصحة أن تعاود سيرتها الأولى، فإذا باللون الورديّ يتصعّد على وجنتيك، وتعود ابتسامة أذبلتها أيام <button type="button" class="term-btn" data-term="الرُّحَضَاء" data-def="الرُّحَضاء: عَرَقُ الحُمّى، ويُطلق مجازًا على نوبات الحمى والمرض الشديد.">الرُّحَضَاء</button> ..</p><h2>يشفيك بلا سبب!</h2><div class="step-card"><span class="step-num">١</span><div class="step-content">لأنّه الشافي: يشفيك بسبب ..</div></div><div class="step-card"><span class="step-num">٢</span><div class="step-content">ويشفيك بأضعف سبب ..</div></div><div class="step-card"><span class="step-num">٣</span><div class="step-content">ويشفيك بأغرب سبب ..</div></div><div class="step-card"><span class="step-num">٤</span><div class="step-content">ويشفيك بما يُرى أنّه ليس بسبب ..</div></div><div class="step-card"><span class="step-num">٥</span><div class="step-content">ويشفيك بلا سبب!</div></div><p>يشفي بالأعشاب، ويشفي بالأدوية المفردة والمركّبة، ويشفي بالغذاء، ويشفي بالماء ..</p><p>ومن أغرب ما قرأت أن طفلًا مصابًا بالسل وأمراض أخرى زعم الأطباء أن موته قد شارف، وأذنوا لوالده أن ينقله معه إلى الريف ليستمتع في آخر أيّامه بهواء الريف العليل ومناظر الحقول الطبيعية، وبينما هو يمشي وبيده قطعة كعك باردة إذ لقيه رجل طاعن ونظر إلى عينيه الذابلتين وسأله: هل تريد الحياة يا بُني؟</p>` },
        { tag: "الشافي", title: "الطعام الحي وحكم ملك الملوك", type: "reading", html: `<p>فهزّ رأسه أن نعم، فقال: كيف تحصل على الحياة وأنت تأكل طعامًا ميّتًا؟</p><p>عليك بالطعام الحيّ، اللحوم والخضروات وكل ما خلقه الله في الطبيعة وما زالت حرارة التراب فيه وأثر الحياة عليه!</p><p>يقول الطفل فنزلت نصيحة ذلك الرجل من قلبي منزل التصديق والانصياع، فصرت لا آكل إلا الطعام الحي، الطعام الذي يحمل في داخله حيويّة الحياة النابضة، اللحوم بأنواعها، والخضروات بأشكالها، والخبز الحار قريب العهد من الحقل، والفاكهة الناضرة، يقول: فتحسّنت صحّتي وتورّد جسمي، مما حدا بأبي أن يذهب بي إلى المستشفى وبعد كشوفات وتحاليل فغرت أفواه الأطباء .. المرض لم يعد له وجود!! يحكي هذه القصة نفس الطفل بعد أن كبر وأصبح من أشهر المعالجين بالغذاء في العالم إنّه «جايلورد هاوزر» في كتابه «الغذاء يصنع المعجزات».</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ حكم ملك الملوك</span>نعم حكم عليه الأطباء بالموت، ولكن ملك الملوك لم يحكم عليه بذلك!<br/>نعم أراد الأطباء أن تنتهي حياته في الريف، ولكن الله لم يرد ذلك!</div>` },
        { tag: "الشافي", title: "لا تدري! وأسرار الشفاء", type: "reading", html: `<p>نعم عجز الأطباء عن علاجه، ولكنّ الله لم يعجز ولن يعجز ولا يعجز!</p><h2>لا تدري!</h2><p>من الذي أودع أسرار الشفاء في الخضروات واللحوم وغيرها من النباتات والأشياء التي في متناول أفقر رجال الدنيا؟ إنه الله الشافي سبحانه.</p><p>فلعلّك مصاب بمرض، وأنت لا تدري، وتأكل الطعام الذي فيه شفاؤك وأنت لا تدري، تمرض ويشفيك وأنت لم تعلم أصلا بمرضك ولا بشفائك!!</p><div class="hadith-box" data-role="hadith"><p>وقد يضع سبحانه شفاءه في الماء، وكلّنا يحفظ <button type="button" class="term-btn" data-term="ماء زمزم لما شرب له (١)" data-def="أخرجه ابن ماجه في سننه (٣١٧٨ - ٩/ ٣١١).">«مَاءُ زَمْزَمَ لِمَا شُرِبَ لَهُ»(١)</button> وهو <button type="button" class="term-btn" data-term="طعام طعم وشفاء سقم (٢)" data-def="أخرجه الطبراني في المعجم الصغير (٢٩٥ - ١/ ١٨٦).">«طَعَامُ طُعْمٍ وَشِفَاءُ سُقْمٍ»(٢)</button>، وكم من مريض أضناه المرض فأدمن شرب هذا الماء المبارك فبرئ بإذن الله.</p><div class="hadith-source">سنن ابن ماجه والمعجم الصغير للطبراني</div></div><p>ومن استعرض أحاديث الشفاء وجد كمّا كبيرًا من الأدوية النبويّة، جمع بعضها ابن القيم في كتابه «الطب النبوي» ..</p>` },
        { tag: "الشافي", title: "وعاد النور ..", type: "reading", html: `<p>فمن الأدوية على سبيل المثال لا الحصر: <button type="button" class="term-btn" data-term="القسط البحري والهندي" data-def="القسط: عود يتداوى به، منه الأبيض الحلو (البحري) ومنه الأسود الحار (الهندي)، وفيه نفع عظيم.">القسط البحري والهندي</button>، وألبان البقر، وسمنها، و<button type="button" class="term-btn" data-term="السنا والسنوت" data-def="السنا: نبات معروف للتداوي (السنا المكي). والسنوت: قيل هو العسل أو الشبت أو الكمون.">السنا والسنوت</button>، والحبة السوداء، و<button type="button" class="term-btn" data-term="التلبينة" data-def="التلبينة: حساء يُعمل من دقيق الشعير بنخالته ويُضاف إليه اللبن والعسل، تجمّ الفؤاد وتذهب ببعض الحزن.">التلبينة</button>، وقيام الليل .. وفي كل ذلك أحاديث صحيحة.</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ مفاتيح الشفاء</span>وهو سبحانه يشفي بالصبر، ويشفي بالدعاء، ويشفي بالصدقة، ويشفي بالاستغفار، ويشفي بالتوبة، ويشفي بالرضا، ويشفي بلا شيء!</div><h2>وعاد النور ..</h2><p>دخل علينا في مكتبة الشؤون الدينية في مستشفى الملك عبد العزيز بتبوك والهلع ينسج على وجهه سحابة قاتمة اللون، افتقدنا في تلك اللحظة ابتسامته المشرقة، سألناه؛ فإذا به يقول لنا إنّ ابنه منوّم في الدور العلوي، قد وقع عليه حادث وفقدَ بسببه بصره!!</p><p>يا لهول فجيعتنا، فكيف بفجيعة قلب هذا الأب؟</p><p>قال برجاء: أريد من أحدكم أن يقوم معي ويرقي ابني، علّ الله أن يشفيه ..</p><p>نهض صاحبي على الفور وذهب معه، وبعد ساعة عاد صاحبي وأخبرني أنّه رقاه ثم أمسك بالأب وصبّره وأخبره بحديث <button type="button" class="term-btn" data-term="داووا مرضاكم بالصدقة (١)" data-def="أخرجه الطبراني في المعجم الكبير (١٠١٩٦ - ١٠/ ١٢٨).">«دَاوُوا مَرْضَاكُمْ بِالصَّدَقَةِ»(١)</button> .. قال فأخرج الأب من جيبه خمسمئة ريال وقال له تصدّق بها بنيّة الشفاء عن ابني ..</p>` },
        { tag: "الشافي", title: "داووا مرضاكم بالصدقة", type: "reading", html: `<p>بعد يومين دخل الأب بوجه آخر وطلب من صاحبي مرافقته، عاد صاحبي بعد نصف ساعة تقريبًا متهللًا وقال: أبشّرك، صار يرى شيئًا من نور الغرفة! ثم أخبرني أن الأب أعطاه ألف ريال ليتصدق بها، كان ذلك اليوم نهاية الأسبوع. يوم السبت أخبرني صاحبي أن الأب جاءه وأخذه إلى غرفة ابنه، ولم أصدّق حين قال لي إن ذلك الطفل قد صار يرى كسابق عهده!! لقد عاد بصره، وصار يرى الحياة من جديد ..</p><p>من الذي شفاه؟ من الذي كتب لعينيه الحياة؟ من الذي أعاد ذلك الضياء إلى مقلتيه؟</p><div class="quran-box" data-role="quran"><p>﴿إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَن يَقُولَ لَهُ كُن فَيَكُونُ﴾</p><div class="ayah-source">سورة يس: ٨٢</div></div><p>سبحانه قال لبصره عد، فعاد البصر!</p>` },
        { tag: "الشافي", title: "عُدْ إليه .. واطرق بابه", type: "reading", html: `<h2>عُدْ إليه ..</h2><p>لا يريد منك سوى العودة إليه، أن تتلمّس الطريق المؤدي إليه ..</p><div class="wisdom-pearl action-callout"><span class="wisdom-badge">✦ طريق العودة</span>عد إليه بالرضا، عد إليه بالسجود، عد إليه بالتوبة، عد إليه بالاستغفار، عد إليه بالصدقة، عد إليه بالاعتراف ..<br/>اطرق بابه، ثم ارتقب الشفاء ..</div><p>ليس هناك مستشفى في الدنيا تداويك إذا لم يشأ الله لها ذلك.</p><p>ليس هناك طبيب في العالم يستطيع أن يشخّص مرضك، إلا إذا أراد الله ذلك.</p><p>أحد الأثرياء مصاب بالفشل الكلوي يسافر به أبناؤه إلى مصر لزراعة كلية ..</p><p>فاتفق الأبناء مع أهل فتاة صغيرة في السن على مبلغ مئة ألف ريال سعودي ثمنًا لكليتها، وفي الصباح كان الجميع في المستشفى، فطلب الرجل قُبيل العملية اللقاء بالفتاة التي قررت بيع كليتها له، دخلت إليه في <button type="button" class="term-btn" data-term="خفر" data-def="الخَفَر: شدة الحياء والحشمة.">خفر</button> وحياء، فسألها: ما الذي دعاك إلى أن تبيعي كليتك لشيخ كبير مثلي؟</p><p>فقالت: الحاجة! أسرتي فقيرة، وإخوتي في الجامعة، يجب عليّ أن أفعل شيئًا لأساعدهم!!</p><p>كأنّها صفعته! أيقظته من سبات، نسي معه احتقان الدم الفاسد في جسده، تساءل في نفسه: أيُعقل أن يستغني إنسان عن جزء من جسمه، عن قدْر من حياته لأجل أن يأكل، أن يعيش؟</p>` },
        { tag: "الشافي", title: "قدرة ملك الملوك على الشفاء", type: "reading", html: `<p>طلب على الفور أبناءه؛ فلما دخلوا عليه أمرهم أن يعودوا به إلى السعودية فقد ألغى فكرة الزراعة!!</p><p>وأخبرهم أن مبلغ المئة ألف صدقة منه للفتاة، لا يأخذوا منه ريالا!</p><p>وبعد مقاومة من أبنائه، وغضب من بعضهم، رضخوا لرغبة أبيهم، وبعد عودته إلى السعودية يذهب إلى المستشفى كالعادة للغسيل، وفي فحص دوريّ يكتشف الأطباء وبذهول أن كليته عادت للعمل!</p><div class="heart-keepsake-card"><span class="heart-badge">قدرة الشافي</span><p>قدرة ملك الملوك على الشفاء لا تحتاج إلى مبضع جرّاح، إنّه الملك الذي ينظر من علياء ملكه: فيشفي مريضًا، ويسعد مكروبًا، ويعيد مسافرًا، ويبرئ جريحًا ..</p></div>` },
        { tag: "الشافي", title: "موعد مسبق .. ومستشفى الرحمة", type: "reading", html: `<h2>موعد مسبق</h2><p>يُمرضك لتعود إليه فإذا عدت رفع المرض إذ أنه لم يعد للمرض فائدة!</p><p>يمرضك لتتواضع فإذا تواضعت وذللت رفع عنك المرض لأنه لم يعد للمرض فائدة!</p><p>يمرضك لتشعر بالآخرين فإذا شعرت بهم رفع عنك المرض لأنه لم يعد للمرض فائدة!</p><p>يمرضك ليختبر صبرك ورضاك فإذا صبرت ورضيت رفع المرض لأنه لم يعد للمرض فائدة!</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ بلا موعد مسبق</span>الشافي الذي لن تحتاج إذا أردت الدخول عليه إلى موعد مسبق، وبطاقة تؤهلك للعلاج، وأن تأتي قبل الموعد بربع ساعة على الأقل هو الله!<br/>فقط قل: يا الله، فإذا بأعظم مستشفى إلهي تفتح أبوابها، إنّها مستشفى الرحمة والقدرة واللطف والشفاء ..</div><p>يقول صديقي إنّه سمع تهشّم عظام ذلك الطفل تحت إطارات سيّارته، أوقف السيارة، وحمل الطفل إلى المستشفى وقلبه يرجف، جاء أبو الطفل وجدّه، كان صديقي فاقد الصواب، لم يدر بخلده أنّه سيقتل طفلًا في حياته!!</p><p>كان صوت العظام المتكسّرة يتردد في أذنيه!</p><p>أقبل إليه جدّ الطفل وهدّأ من روعه وأخبره أن ما يكتبه الله سيكون، وسيرضون به ..</p><p>صلى بهم ذلك الجدّ صلاة العشاء في مسجد المستشفى وقرأ «وبشّر الصابرين»، بكى صديقي بحرقة!</p>` },
        { tag: "الشافي", title: "جابر العظام المنكسرة", type: "reading", html: `<p>بعد الصلاة خرج الأطباء وأخبروا الأب والجد أن الأمل في حياة الطفل ضئيل، فهو يعاني من تهشّم فظيع في الجمجمة!!</p><p>صُعق صديقي، عاد خائر القوى إلى بيته، غاب عن العمل أسبوعًا كاملًا، فقدْ كان في صدمة مذهلة.</p><p>لم يكن هناك دواء لذلك الطفل البئيس أعظم من إيمان جدّه ودعوات أمّه ويقين أبيه وتعلّق الجميع بالله ..</p><p>بعد أقلّ من أسبوع زرت بنفسي ذلك الطفل الجميل، فإذا به يضحك ويلعب ويقوم ويتحدّث معنا، صدق الله وأخطأ الأطباء، صدق جابر العظام المنكسرة:</p><div class="quran-box" data-role="quran"><p>﴿مَّا يَفْتَحِ اللَّهُ لِلنَّاسِ مِن رَّحْمَةٍ فَلَا مُمْسِكَ لَهَا﴾</p><div class="ayah-source">سورة فاطر: ٢</div></div><p>من الذي يقدر على أن يلأم تلك العظام المتنافرة؟ ويعيد البسمة إلى ذلك الثغر؟ وينفخ الروح من جديد في جسد انفتحت له أبواب المقبرة؟</p><p>الله وحده من يقدر على ذلك!</p>` },
        { tag: "الشافي", title: "ضع نقطة .. وإذا مرضت فهو يشفين", type: "reading", html: `<h2>ضع نقطة</h2><p>هذا هو أبو الأنبياء إبراهيم عليه السلام، الذي جاء ربّه بقلب سليم، سليم من أي ذرّة شرك قد تعتري قلبًا ضعيفًا، يقولها عليه السلام فيفهم المؤمن الدرس ولا يلتجئ إلا للحي الذي لا يموت:</p><div class="quran-box" data-role="quran"><p>﴿وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ﴾</p><div class="ayah-source">سورة الشعراء: ٨٠</div></div><p>هو وحده، لا أحد سواه يشفيني.</p><div class="wisdom-pearl action-callout"><span class="wisdom-badge">✦ قاعدة اليقين</span>ضع نقطة هنا، لن تحتاج إلى غيره إذا أراد شفاءك، ولن يفيدك غيره إذا لم يرد!</div><p>يرضّ الجدريّ جسد أيوب عليه السلام، تتشتت أسرته، تتبعثر أملاكه، أكثر الناس تفاؤلا يفقد الأمل في شفائه، وهو صابر محتسب! تشتعل الأسقام في جسده وهو منكّس الرأس لمولاه، وبعد سنوات البلاء، <button type="button" class="term-btn" data-term="يندّ من شفتيه" data-def="يندّ من شفتيه: يخرج خفيًّا رقيقًا في حياء وأدب.">يندّ</button> من شفتيه دعاء حيي، دعاء منكّس رأسه بذلة، دعاء ممتلئ باليقين:</p><div class="quran-box" data-role="quran"><p>﴿أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ﴾</p><div class="ayah-source">سورة الأنبياء: ٨٣</div></div><p>فإذا بأبواب السماء تنفتح بالرحمة ..</p><p>وإذا بالأوامر العليا تنزل من فوق السماء السابعة لأجل ذلك المهموم المكروب ..</p><p>تنتهي في ساعة سنوات العذاب، ليأتي عهد الشفاء!</p><p>لماذا تذهب إلى غيره؟ لماذا تلتجئ إلى سواه؟ لماذا تثق بكل هؤلاء الموتى الذين يتحرّكون حولك وتنسى الحي الذي لا يموت؟</p>` },
        { tag: "الشافي", title: "الرضا .. والدواء القريب", type: "reading", html: `<div class="reflection-card"><div class="reflection-card-title">✦ تذكّر أيامك الأولى</div><p>من الذي خدعك وأقنعك أن الشفاء قد يأتي من طريق آخر؟<br/>كيف ضحكَتْ عليك الحياة بهذه السرعة، ونسيت ذلك الذي أخرجك من بطن أمّك دون طبيب، وخلق لك في صدرها رزقًا حسنا، وعلّمك وأنت أجهل ما تكون كيف تزم شفتيك على صدرها لترضع؟ أنسيت الذي خلق الرحمة في قلب تلك الإنسانة لتضمّك؟ وتعتني بك؟</p></div><p>أبهذه السرعة نسيته؟ أهكذا ظننت أنه يمكنك الاستغناء عنه؟؟</p><p>ها هو سبحانه بالمرض يذكّرك بأيامك الأولى، بالمرض يقول لك: عد إليّ، فكما خلقتك من عدم فأنا وحدي الذي أرفع عن جسدك السقم!</p><h2>الرضا</h2><p>قد يكون الدواء أقرب إليك مما تظن!!</p><p>فها هو أيوب عليه السلام يُؤمر أن يضرب برجله الأرض:</p><div class="quran-box" data-role="quran"><p>﴿هَٰذَا مُغْتَسَلٌ بَارِدٌ وَشَرَابٌ﴾</p><div class="ayah-source">سورة ص: ٤٢</div></div><p>لقد كان الدواء بالقرب منه، لم يكن ينقصه إلا مشيئة الله حتى تكتمل أسباب الشفاء، فلما شاء الله، علِم أيوب مكان الدواء فنجع الدواء بإذنه سبحانه.</p>` },
        { tag: "الشافي", title: "رحلة إلى مدينة الرضا", type: "reading", html: `<p>أنت لا تحتاج أن تحجز إلى واشنطن أو باريس أو بكين، فدواؤك إن شاء الله قريب، فقط احجز لقلبك رحلة إلى مدينة الرضا:</p><div class="poetry-stanza"><div class="poetry-shatr">دواؤك فيك وما تشعرُ</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">وداؤك منك وما تبصرُ</div></div><p>إذا رضيت عن الله أرضاك الله ..</p><p>المرض من أقسى اختبارات الرضا، فإذا كانت إجاباتك في هذا الاختبار راضية، كانت النتيجة مُرضية بإذن الله.</p><p>قد يسأل البعض: كيف أرضى بالمرض وفيه الألم المكروه فطرة؟ كيف أرضى بالشيء الذي أكرهه؟</p><div class="wisdom-pearl academic-callout"><span class="wisdom-badge">✦ كلام الإمام ابن القيم رحمه الله</span>يجيب الإمام ابن القيم عن هذا التساؤل قائلًا: «لا تنافي في ذلك، فإنّه يرضى به من جهة إفضائه إلى ما يحب، ويكرهه من جهة تألّمه به، كالدواء الكريه الذي يعلم أن فيه شفاءه، فإنّه يجتمع فيه رضاه به، وكراهته له»</div><div class="hadith-box" data-role="hadith"><p>قل من بين آهاتك ما أمر به نبيّك أمّته أن تقول: «رَضِيتُ بِاللهِ رَبًّا وَبِالإِسْلَامِ دِينًا وَبِمُحَمَّدٍ ﷺ <button type="button" class="term-btn" data-term="رضيت بالله ربا (١)" data-def="أخرجه مسلم في صحيحه (٣٨٦ - ١/ ٢٩٠).">نَبِيًّا» (١)</button>.</p><div class="hadith-source">صحيح مسلم</div></div>` },
        { tag: "الشافي", title: "أنهار الذنوب", type: "reading", html: `<p>قلها بقلبك، بل روّض قلبك على الرضوخ لمعناها، بل اغسله بها غسلًا، فالرضا عن الله فرع عن الرضا بالله .. وإذا رضيت به أرضاك!</p><p>اجعل قلبك يتنفَّس الرضا، اجعله يتلذذ بالرضا، ثم تأمل جسدك، وسترى أمارات الشفاء تدبّ في نواحيه بإذن الله ..</p><p>اجمع يديك واتل اسمه في دعائك ثم امسح على جسدك، يُرجع سبحانه بتلك النفثة أشياء كانت على وشك المغادرة!</p><div class="wisdom-pearl action-callout"><span class="wisdom-badge">✦ عهد جديد مع الشافي</span>اجعل المرض بداية عهد جديد تتعرّف فيه إلى ربّك من خلال اسم الشافي ..</div><h2>أنهار الذنوب</h2><p>لقد مرضت كثيرا في حياتك .. أليس كذلك؟ من شفاك؟ أليس الله؟ لماذا تظن أن هذا المرض بالذات يُعجزه؟ هذا الظن وهذا الإحساس يستحق العقوبة منه، وقد يكون مرضك عقوبة لاعتقادك المريض، انفض المرض عن قلبك أولًا، ثم التجئ بالشافي إلى الشافي يشفِك.</p><p>كل هؤلاء المرضى في المستشفيات ينتظرون الإذن لهم بالشفاء من الشافي سبحانه ..</p><p>ليس هناك آهة إلا ويسمعها، ولا ألم إلا ويعلم موضعه، ولا زفرة إلا ويرى نيرانها في الفؤاد.</p>` },
        { tag: "الشافي", title: "مستشفى السجادة ودعاء الشافي", type: "reading", html: `<p>ثم إذا ما تمّ مراده، ونزفت عبر آهاتك أنهار الذنوب، أمر سبحانه العافية أن تعود فإذا بك تمشي في أرض الله وقد اغتسلتَ من الذنوب!</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ لأنّه الله يشفيك</span>لأنّه الرحيم يشفيك .. لأنّه العليم يشفيك .. لأنّه الحليم يشفيك .. لأنّه القدير يشفيك .. لأنّه الله يشفيك ..<br/>معه ستمسح أرقام وأسماء الأطباء! معه ستنسى مواقع المستشفيات! معه ستلغي مواعيد العيادة!</div><p>ابنِ في غرفتك مستشفى جديدة اسمها السجّادة ..</p><p>واعقد موعدًا مع السجود ..</p><p>وسجّل في قلبك اسما واحدًا: الشافي!</p><div class="heart-keepsake-card"><span class="heart-badge">مناجاة الشافي</span><p>اللهم يا شافي، اكتب شفاءك ورحمتك لكل روح ضعيفة، ولكل جسد منهك، ولكل قلب متعب إنّك سميع الدعاء.</p></div><div class="ornament">❖ ✦ ❖</div>` },
        { tag: "الوكيل", title: "اسم الله الوكيل", type: "opener", html: `<div class="opener"><div class="letter-envelope-header"><span class="letter-seal">✦</span><span class="letter-envelope-title">الاسم الخامس</span></div><h1 class="chapter-opener">الوكيل</h1></div><div class="epigraph-box"><p>أمانيك مع الله حقائق ..<br/>تطلّعاتك واقع معاش ..<br/>رغباتك ستُهدى إليك ..<br/>أشواقك ستهبّ عليك ..</p></div>` },
        { tag: "الوكيل", title: "مدخل: في ظلال الوكيل", type: "reading", html: `<div class="reflection-card"><div class="reflection-card-title">✦ في مهب ريح الحياة</div><p>هل تشعر بضعفك؟ وبأن الدنيا بتفاصيلها أكبر منك، وبأنّك ريشة في مهب ريح الحياة الصاخبة؟<br/>هل تشعر أنّك طائر قُصّ جناحاه فهو خائر القوى، بحاجة إلى مساعدة؟<br/>هل لديك أشياء تخشى عليها، وتريد أن تجعلها في عُهدة من لا تضيع لديه الأشياء؟ سواء كانت هذه الأشياء: أبناء أو مالًا أو صحّة أو حياة؟</p></div><p>إذن: فادلف إلى أنوار اسم الله «الوكيل» ..</p><p>ابدأ بالتعرّف من جديد على هذا الاسم الجليل، غُصْ في أغوار معانيه، أرح نفسك من ضعفها، وقلقها، واستيحاشها بأن تجعلها تتفيّأ ظلال «الوكيل» ..</p>` },
        { tag: "الوكيل", title: "فاتخذه وكيلا .. ومظلة التوكل", type: "reading", html: `<h2>فاتخذه وكيلا ..</h2><p>الوكيل هو الذي لا ينبغي أن تتوكّل إلا عليه، ولا أن تُلجئ ظهرك إلا إليه، ولا أن تضع ثقتك إلا فيه، ولا أن تعلّق آمالك إلا به.</p><p>أيُّ عمل تتوكل على الله فيه انسه تمامًا، لأنّك إن توكلت على الله فهذا يعني أنك وضعت ثقتك في إتمام هذا العمل بمن يملك الأمور كلّها، ومن السماوات والأرض من بعض مربوباته، ومن يجير ولا يجار عليه.</p><p>يقول الحق سبحانه عن نفسه العليّة:</p><div class="quran-box" data-role="quran"><p>﴿رَّبُّ الْمَشْرِقِ وَالْمَغْرِبِ لَا إِلَٰهَ إِلَّا هُوَ فَاتَّخِذْهُ وَكِيلًا﴾</p><div class="ayah-source">سورة المزمل: ٩</div></div><p>يأمرك ربُّ المشرق والمغرب أن تتخذه وكيلا، فماذا بعد هذا من راحة وعز وشموخ وضمان للتوفيق؟ فقط يريدك أن تقول بقلبك: أنت وكيلي يا الله!</p><p>هل هناك غنيّ على وجه الأرض يأمرك ألّا تستعين إلا به؟ وألا تتوكّل إلا عليه؟ وألا تلتجئ إلا له؟ لا وجود لهذا الغنيّ على الإطلاق، لأنّه ليس من طاقة البشر أن يحموك من كلّ شيء ويكفّوا عنك كلّ شيء ويعينوك على كلّ شيء.</p><p>الله وحده من يقول ذلك، ويفعل ذلك، ويقدِر على ذلك!</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ مظلة التوكل</span>التوكّل يقينٌ قلبيٌّ، يحيلك إلى سائرٍ تحت مظلّة عظيمة تقيك من حرّ الهموم، ومطر المكائد، ورياح الدنيا المقلقة .. المحروم وحده هو من لا يقدّر هذه المظلة ومن لا يحاول السير تحتها.</div>` },
        { tag: "الوكيل", title: "التوكل على رب العزة", type: "reading", html: `<p>أعظم الملوك وأجلّ الأرباب سبحانه يأمرك أمرًا أن تتخذه وكيلا؟ أن تضع حاجاتك في فنائه ليقضيها لك هو، أن تلجئ ظهرك إليه حتى يمنع عنك سهام الغدر، أن تفوّض أمرك إليه حتى يتمّ على أكمل حال وأصحّ مثال، والسؤال هو: ما الذي تنتظره؟ ما هو الشيء الآخر الذي يجعلك لا تقبل هذا الفضل؟ من الذي أعطاك أكثر من هذه المزايا؟</p><p>متعلّقون نحن بالتراب لدرجة مخيفة! اقرأ:</p><div class="quran-box" data-role="quran"><p>﴿وَتَوَكَّلْ عَلَى الْعَزِيزِ الرَّحِيمِ ۝ الَّذِي يَرَاكَ حِينَ تَقُومُ ۝ وَتَقَلُّبَكَ فِي السَّاجِدِينَ﴾</p><div class="ayah-source">سورة الشعراء: ٢١٧–٢١٩</div></div><p>ما هو الأمر الكبير والكرب الشديد والهم العظيم الذي سيستعصي على رب العزة؟ العزّة نفسُها هو ربّها، كل عزّة رأيتها أو سمعت بها أو علمتها هو ربّها، فكيف يمكن لكروبك أن تصمد أمام إرادة ربّ العزّة والكبرياء والعظمة؟</p>` },
        { tag: "الوكيل", title: "خطّة سنويّة .. وإياك نستعين", type: "reading", html: `<h2>خطّة سنويّة</h2><p>وأعظم ما تتوكّل على الله فيه هو عبادته، أن تتخلّى وتتبرأ مِن حولِك وقوّتك وتقول بقلبك قبل لسانك: ﴿إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ﴾، فتستعين وتتوكّل وتطلب القوّة منه على أن تعبده.</p><p>لا يُتصوّر أن يأمرك الله أن تعبده، ويأمرك أن تتوكّل عليه، فتتوكّل عليه في أمر العبادة فيخذلك، هذا مما لا يُتصوّر وقوعه، كيف تطلبه أن تعبده مع كمال حبّه لهذه العبادة ثم لا يعينك؟ فقط أكثر من الكلمات النبوية الكريمة:</p><div class="hadith-box" data-role="hadith"><p>«اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ <button type="button" class="term-btn" data-term="اللهم أعني على ذكرك (١)" data-def="أخرجه أبو داود في سننه (١٥٢٤ - ١/ ٥٦١)، والنسائي في سننه (١٣٠٣ - ٣/ ٥٣).">عِبَادَتِكَ» (١)</button>.</p><div class="hadith-source">سنن أبي داود والنسائي</div></div><p>هل قلتُ أكثِرْ منها؟ إذن أنا أعتذر، لا تُكثر منها فحسب، بل اجعلها ضمن جدولك اليومي، وخطّتك السنويّة، وأهداف حياتك!</p><div class="step-card"><span class="step-num">١</span><div class="step-content">لأنه إذا لم يعنك على ذلك، فليس هناك قوّة ستعينك ..</div></div><div class="step-card"><span class="step-num">٢</span><div class="step-content">لأنّه إذا لم يعنك على ذلك، فلن تفعل شيئا من ذلك!</div></div><div class="step-card"><span class="step-num">٣</span><div class="step-content">لأنه إذا لم يعنك على ذلك فقد خسرت الدنيا والآخرة!</div></div><div class="wisdom-pearl academic-callout"><span class="wisdom-badge">✦ كلام ابن القيم عن شيخ الإسلام</span>يقول ابن القيم: «قال شيخ الإسلام ابن تيمية قدس الله روحه تأملت أنفع الدعاء فإذا هو سؤال العون على مرضاته ثم رأيته في الفاتحة في إياك نعبد وإياك نستعين» ..</div>` },
        { tag: "الوكيل", title: "دواء الرياء والكبر .. وانكسر له", type: "reading", html: `<div class="wisdom-pearl academic-callout"><span class="wisdom-badge">✦ دواء الرياء والكبر</span>ويقول أيضًا: «القلب يعرض له مرضان عظيمان إن لم يتداركهما العبد تراميا به إلى التلف ولا بد وهما الرياء والكبر فدواء الرياء بإياك نعبد ودواء الكبر بإياك نستعين ..<br/>وكثيرا ما كنت أسمع شيخ الإسلام ابن تيمية قدس الله روحه يقول: إياك نعبد تدفع الرياء! وإياك نستعين تدفع الكبرياء».</div><p>أرأيت الصلاة التي فرغت للتوّ من أدائها، والله لو لم يعنك عليها لما أديتها ..</p><h2>انكسر له ..</h2><p>وهو رحيم، فقط أنزل حوائجك ببابه، فقط اجعل قلبك منكسرًا وكأنّه <button type="button" class="term-btn" data-term="مُخبت" data-def="المُخبت: الخاشع المطمئن المتواضع لله سبحانه.">مُخبت</button> تحت العرش، ولو لم تدْعه، الرحيم سبحانه يريد هذه الحالة الخاشعة منك، وبعدها ثق بأنه سيقضي حوائجك، ويرفع مرضك، ويخلق الابتسامة على ثغرك.</p><p>أمانيك مع الله حقائق .. تطلّعاتك واقع معاش .. رغباتك ستُهدى إليك ..</p>` },
        { tag: "الوكيل", title: "الركن الوثيق وحفظ الوكيل", type: "reading", html: `<p>أشواقك ستهبّ عليك ..</p><div class="quran-box" data-role="quran"><p>﴿وَتَوَكَّلْ عَلَى الْعَزِيزِ الرَّحِيمِ ۝ الَّذِي يَرَاكَ حِينَ تَقُومُ﴾</p><div class="ayah-source">سورة الشعراء: ٢١٧–٢١٨</div></div><p>الذي قمت للصلاة له، والذي مرّغت جبهتك له، والذي نكّست رأسك له، هو الأحق أن تعلّق حاجاتك به، أن توكل إليه أمر شفائك، أن يكون هو ملجأك من مخاوفك، أن تجعله سبحانه المعين على تحقيق أحلامك:</p><div class="poetry-stanza"><div class="poetry-shatr">فالزم يديك بحبل الله معتصمًا</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">فإنّه الركن إن خانتك أركانُ</div></div><p>امرأة صالحة قرر ابنُها أن يكمل دراسته في الخارج، وكانت تسمع عن الضياع والانحلال الذي ينغمس فيه (بعض) من يذهب للدراسة في تلك الديار، ولكنّها كانت مغلوبة على أمرها، أمور كثيرة أجبرتها على الرضوخ، فعلمت أن الله هو القادر على حفظ ولدها، فجعلت جزءا من صلاتها دعاء لولدها بالحفظ، عاد الولد من دراسته وقد صار من أهل المسجد وقيام الليل والأمر بالمعروف والنهي عن المنكر! عاد وقد اكتسب قيما لم تكن لديه من قبل! كيف نتخيّل أن الوكيل سبحانه سيترك الابن للضياع؟ وأمّهُ تتضرّع إليه أن احفظه يا رب، أن توكّلت عليك فلا تخذلني في ابني!</p>` },
        { tag: "الوكيل", title: "الدموع المبتسمة!", type: "reading", html: `<h2>الدموع المبتسمة!</h2><p>لو قال لك أحد ملوك الدنيا، وكّلني في أن أنتزع حقّك من فلان الظالم، فقط وكّلني، هل سيراودك شكّ في أن حقّك لن يصل إليك؟ أنت تحتاج إلى توقيع من أحد معاوني الملك حتى يجعل ذلك الظالم يعيد إليك حقّك وهو يرتجف، فكيف إن كان التوقيع من الملك، فكيف إن لم يكن توقيعًا بل قياما بالمهمّة من جهته؟</p><p>الآن دع ذلك الملك ومعاونه، وتأمّل:</p><div class="quran-box" data-role="quran"><p>﴿وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ﴾</p><div class="ayah-source">سورة الفرقان: ٥٨</div></div><p>لقد طاشت الآن كل صور الحاجات في نفسك، أليس كذلك؟ لم يعد للخوف وجود، ولا للتردد مكان، ولا للاحتمالات سبب!!</p><div class="heart-keepsake-card"><span class="heart-badge">عوض الوكيل</span><p>الله سيحوّل جميع مشاكلك إلى حلول، وكل آلامك إلى عافية، وكل أحلامك إلى واقع، وكل دموعك إلى ابتسامات ..</p></div><p>حتى لو متّ، فالحي الذي لا يموت، سيعيد حقّك لأبنائك من بعدك، لا تنشغل في لحظة وجعك وغمرة آهاتك بأبنائك من بعدك، فالحيّ الذي تموت أنت ولا يموت هو سيكون لهم، سيكون معهم، سيرأف بحالهم، سيُسعدهم، سيجعل حياتَهم أفضل منها وأنت معهم، لأنّه الحي الذي لا يموت ..</p>` },
        { tag: "الوكيل", title: "أكسجين الحياة", type: "reading", html: `<h2>أكسجين الحياة</h2><p>حتى لو لم يظلمك أحد، توكّل عليه!</p><p>ليس التوكّل منجاة من ظلم الظالمين! وإعانة على عمل معيّن فحسب!</p><p>التوكّل هو أكسجين حياتك، هل تستطيع العيش بلا أكسجين؟</p><p>توكّل على الله في صحّتك .. أوكِلْ أمر نبضات قلبك وحركة أعضائك وتدفق دمائك في شرايينك وانتقال الطعام داخل جسدك إلى الله.</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ بإذن الوكيل</span>لو لم يأذن الله لجفنك أن يغمض لاحترقت عينك جفافًا!<br/>لو لم يأذن الله للسانك أن يذوق لبهتت الحياة في نظرك!<br/>لو لم يأذن الله لجلدك أن يحسّ لتقطعتَ دون أن تشعر!</div><p>توكّل عليه سبحانه في صلاح أبنائك ..</p><p>كم قد رأيتَ ورأيتُ أبناء تربّوا في المساجد ثم ألحدوا، والعياذ بالله؟</p>` },
        { tag: "الوكيل", title: "الحياة جحيم بدونه ..", type: "reading", html: `<p>وأبناء صرف عليهم الآباء المال والرعاية ثم ضاعوا!</p><p>وأبناء أحاطهم اهتمام إخوانهم الكبار ثم انحرفوا!</p><div class="reflection-card"><div class="reflection-card-title">✦ دعاء الوالد المتوكل</div><p>الله وحده الذي يعلم مكان الهداية في قلب ابنك، ادعه أن يملأه إيمانا، توكّل عليه، قل له بخضوع: يا رب، هذا ابني، وأنت ربّي وربّه فاهده إليك ودلّه عليك وأعنّي على تربيته ..<br/>يا رب أنا لن أحسن أن آمره بالصلاة ما لم تعنّي .. وهو لن يحسن أن يصلّي ما لم تعنه .. فأعنّا على ذكرك وشكرك وحسن عبادتك ..</p></div><h2>الحياة جحيم بدونه ..</h2><p>توكّل عليه في سعادة حياتك، فالحياة جحيم بلا الله!!</p><p>يقولون: امدح زوجتك، حدّثها عن التفاصيل حتى تخلب لبّها، ابتسم لها، عاملها بلطف بهذا كلّه ستكسب قلبها، وحبّها!</p><p>نعم كل هذا صحيح، ولكن قبل ذلك وبعده وأثناءه قل: يا رب أصلح لي زوجي ..</p><p>استعن به، توكل عليه، ادعه قائلا: كل ابتساماتي لزوجتي لا فائدة منها إن لم تشأ أنت ذلك.</p>` },
        { tag: "الوكيل", title: "محبة الله للمتوكلين", type: "reading", html: `<p>تضرّع إليه قائلا: قلبُها بيدك لا بيدي فأودِم بيننا وأصلحنا يا رب لبعضنا.</p><p>الله يريدك أن تعترف أنك ضعيف محدود القوّة متواضع الإمكانيات، وأنّه وحده القوي العزيز العظيم، إذا فعلت ذلك فقد أنهيت ثلاثة أرباع التوكل، إذا فعلت ذلك كل الأشياء من حولك تتحوّل، صدقني: تتحوّل!</p><p>دعك من حاجاتك وأحلامك وهمومك، دعنا نتخيّل أنك إنسان بلا حاجات وبلا أحلام وبلا هموم وبلا أمراض، أنت تحتاج أن تتوكّل عليه ليحبّك؟ ألست تريده أن يحبّك؟</p><div class="quran-box" data-role="quran"><p>﴿إِنَّ اللَّهَ يُحِبُّ الْمُتَوَكِّلِينَ﴾</p><div class="ayah-source">سورة آل عمران: ١٥٩</div></div><p>إن معنى أن يحب اللهُ العبدَ معنى لا يمكن لمن لديه أدنى رهافة أن يمرّ عليه دون أن يخفق له فؤاده حنينًا ورغبةً وشوقًا، الله الذي لا إله إلا هو يحبّك، هذا سبب كاف جدًّا أن تسعى إلى التعلّق بالوكيل سبحانه وأن تتوكل عليه وأن تحب هذا الاسم الدال على هذه الصفة العظمى.</p>` },
        { tag: "الوكيل", title: "حسبي الله ونعم الوكيل", type: "reading", html: `<h2>حسبي الله</h2><p>يأتي بعض الناس ليثبطوك، لينقلوا لك شيئا من الواقع البشع، ليهزّوا يقينك الداخلي، ليلعبوا بأحاسيسك، ليأمروك أن تخشى أن تخاف أن تتضعضع أن تغيّر موقفك أو تحرف وجهة مبادئك، في تلك اللحظة اغسل قلبك بالإيمان وقل: حسبي الله ونعم الوكيل، لحظتها ستنقلب بنعمة من الله وفضل ولن يمسّك سوء! اقرأ بتدبّر:</p><div class="quran-box" data-role="quran"><p>﴿الَّذِينَ قَالَ لَهُمُ النَّاسُ إِنَّ النَّاسَ قَدْ جَمَعُوا لَكُمْ فَاخْشَوْهُمْ فَزَادَهُمْ إِيمَانًا وَقَالُوا حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ ۝ فَانقَلَبُوا بِنِعْمَةٍ مِّنَ اللَّهِ وَفَضْلٍ لَّمْ يَمْسَسْهُمْ سُوءٌ﴾</p><div class="ayah-source">سورة آل عمران: ١٧٣–١٧٤</div></div><p>أما إصابة السوء لك فلا شك أنّها لن تصيبك، ولكن حتى المسّ الذي كنت تظن أنك لن تنجو من بعضه، لن يمسّك، لن يلمس جلدك قرح، لن ينغز قلبك ندم بإذنه سبحانه!!</p><p>اقرأ بقلب:</p><div class="quran-box" data-role="quran"><p>﴿وَتَوَكَّلْ عَلَى اللَّهِ وَكَفَىٰ بِاللَّهِ وَكِيلًا﴾</p><div class="ayah-source">سورة الأحزاب: ٣</div></div><p>إذا توكّلت على الله فلا تعتقد أن المسألة تتعلّق بأنك لم تجد غيره لتتوكل عليه، لا أبدا، أنت تتوكل على أعظم ما يمكن أن يتوكل عليه مخلوق.</p><p>البعض يقول: ليس لنا إلا الدعاء! عجيب! وهل هناك قوّة أعظم من الشيء الذي ليس معك غيره؟</p><p>الدعاء هو من مظاهر التوكّل، الدعاء هو تيقّن قلبي قبل أن يكون كلمات صوتية بأنّه المستطيع سبحانه كل شيء، وهذا هو التوكّل في أوضح صُوَره!</p>` },
        { tag: "الوكيل", title: "أعظمكم ثروة .. وسبب مقنع", type: "reading", html: `<p>الذي يقول: فلان ليس له إلا الله، قل له: وكفى بالله وكيلا، ونعم بالله، وماذا ينقصه إذا كان معه ملك الملوك ورب المشرق والمغرب؟</p><div class="poetry-stanza"><div class="poetry-shatr">خذوا كل دنياكُمُ واتركوا</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">فؤاديَ حُرًّا طليقًا غريبا</div></div><div class="poetry-stanza"><div class="poetry-shatr">فإنّيَ أعظمُكم ثروةً</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">وإن خِلتموني وحيدًا سليبا</div></div><div class="ornament">❖ ✦ ❖</div><h2>سبب مقنع</h2><p>أتدري لماذا يكفي أن تتوكل على الله؟ هناك سبب مقنع جدًّا، هو كونه سبحانه يملك السماوات والأرض:</p><div class="quran-box" data-role="quran"><p>﴿وَلِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَكَفَىٰ بِاللَّهِ وَكِيلًا﴾</p><div class="ayah-source">سورة النساء: ١٣٢</div></div><p>هذا الذي تخشاه أليس من سكان هذه الأرض؟ إذن هو لله، والله سبحانه هو المتحّكم فيه؟</p><p>هذا المرض الذي هدّك ولم تجد علاجه، أليس في الأرض؟ إذن هو مِلكٌ لله، وهو سبحانه القادر على أن يأمره أن يغادر جسدك!</p>` },
        { tag: "الوكيل", title: "خالق كل شيء .. واحذر", type: "reading", html: `<p>هذه الكروب والهموم والغموم والأتعاب والانشغالات أليست في الأرض؟ إذن توكل على من له هذه الأرض، ومن فيها، حتى يزيل بكلمة واحدة منه كل كروبك وهمومك وأتعابك.</p><p>ولأنه سبحانه خالق كل شيء فهو القادر على عمل أي شيء، لذلك نتوكل عليه:</p><div class="quran-box" data-role="quran"><p>﴿اللَّهُ خَالِقُ كُلِّ شَيْءٍ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ وَكِيلٌ﴾</p><div class="ayah-source">سورة الزمر: ٦٢</div></div><div class="wisdom-pearl"><span class="wisdom-badge">✦ تأمّل</span>حسبنا الله ونعم الوكيل .. أي ليس لنا إلا الله، ثم هو نعم الوكيل، فليس هناك وكيل أعظم منه أو أجل منه أو أرجى منه.</div><h2>احذر ..</h2><p>احذر أن تتخذ وكيلا غيره، احذر أن تلتجئ إلى سواه، سوف يصيبك الوهن، سوف تغزوك الوساوس، سوف يتعلق قلبك بشُعَب الدنيا، قال سبحانه:</p><div class="quran-box" data-role="quran"><p>﴿أَلَّا تَتَّخِذُوا مِن دُونِي وَكِيلًا﴾</p><div class="ayah-source">سورة الإسراء: ٢</div></div><p>يحرم عليك أن تبحث عن غيره وهو الموجود، أن تتّكِل على غيره وهو الحي، أن تلتجئ إلى غيره وهو <button type="button" class="term-btn" data-term="المُقيت" data-def="المُقيت: الحفيظ القدير الذي يوصل إلى كل موجود ما به قوامه وقوته.">المُقيت</button>.</p><p>ولأنه سميع عليم تتوكل عليه، فسوف يسمع كل شيء يدور في الخفاء، ويعلم كل أمر يحاك في الظلام، فكيف تتوكل على غيره، وغيرُه لا يمكنه أن يسمع ذلك أو يعلم ذلك؟</p>` },
        { tag: "الوكيل", title: "ومن يتوكل على الله فهو حسبه", type: "reading", html: `<div class="quran-box" data-role="quran"><p>﴿وَتَوَكَّلْ عَلَى اللَّهِ إِنَّهُ هُوَ السَّمِيعُ الْعَلِيمُ﴾</p><div class="ayah-source">سورة الأنفال: ٦١</div></div><p>هذا الظالم الذي يؤذيك، إنما هو مخلوق لهذا الرب الذي يحميك! فتوكل عليه يردّ سبحانه أذاه، وقل بكل عزة:</p><div class="quran-box" data-role="quran"><p>﴿إِنِّي تَوَكَّلْتُ عَلَى اللَّهِ رَبِّي وَرَبِّكُم مَّا مِن دَابَّةٍ إِلَّا هُوَ آخِذٌ بِنَاصِيَتِهَا﴾</p><div class="ayah-source">سورة هود: ٥٦</div></div><p>إذا كان الشيطان وهو ذو الجنود والعساكر، والقوّة التي أعطاه الله إياها على الوسوسة والتخويف بل والتلبّس وغير ذلك، لا يستطيع التوصّل إلى المتوكّل: ﴿إِنَّهُ لَيْسَ لَهُ سُلْطَانٌ عَلَى الَّذِينَ آمَنُوا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ﴾ فكيف بمدير في العمل أو جار سوء أو أمير أو وزير؟</p><p>تذكر:</p><div class="quran-box" data-role="quran"><p>﴿وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ﴾</p><div class="ayah-source">سورة الطلاق: ٣</div></div><p>لن تحتاج أحدا أبدًا إذا وثقتَ به وتوكلت عليه وجعلته هو المعين لك في شؤونك.</p><p>هو حسبك وكافيك ورادّ السوء عنك .. أنت إن لم تحطك رعاية الله من كل جانب هلكت! الحياة مزرعة مليئة بالأمراض والأتعاب والأشباح والخطط والمؤامرات، وبدون رعاية الله ستبتلعك هذه الأفاعي!!</p>` },
        { tag: "الوكيل", title: "أشياء تهددك", type: "reading", html: `<p>لا أخوّفك، هذه الحقيقة!</p><p>قل: يا الله توكلت عليك ..</p><p>هل قلتها بقلبك؟ الآن ابتسم، كل تلك الأفاعي انتهت!</p><h2>أشياء تهددك</h2><p>إذا خرجت من البيت ينتظرك في الخارج:</p><p>حادث أليم يقع لك، أو هبّة هواء تمرضك، أو حفرة تقع فيها، أو شخص بذيء يشتمك، أو إنسان حقود يحسدك، أو موظّف معقّد يتعبك، أو بائع غشاش يخسّرك، ولكن قل عندما تخرج ما أوصاك به نبيّك الكريم:</p><div class="hadith-box" data-role="hadith"><p>«بِسْمِ اللهِ تَوَكَّلْتُ عَلَى اللهِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَضِلَّ أَوْ أُضَلَّ أَوْ أَزِلَّ أَوْ أُزَلَّ أَوْ أَظْلِمَ أَوْ أُظْلَمَ أَوْ أَجْهَلَ أَوْ يُجْهَلَ <button type="button" class="term-btn" data-term="بسم الله توكلت على الله (١)" data-def="أخرجه أبو داود في سننه (٥٠٩٦ - ٤/ ٤٨٦).">عَلَيَّ» (١)</button></p><div class="hadith-source">سنن أبي داود</div></div><p>الآن اخرج مستنشقا التوفيق والتيسير بإذن الله، كل تلك المخاوف لا وجود لها ..</p><p>وإذا نمت ألجئ ظهرك إليه وفوّض أمرك إليه رغبة ورهبة إليه ..</p><p>في كل حين وفي كل لحظة تذكر، هناك رب أمرك أن تتوكّل عليه، وأنت تحتاجه، لا تفرّط في هذه الفرصة، وهذه الهديّة، وهذه الميزة أبدا.</p>` },
        { tag: "الوكيل", title: "اللهم اجعلنا متوكلين عليك", type: "reading", html: `<div class="heart-keepsake-card"><span class="heart-badge">مناجاة الوكيل</span><p>اللهم اجعلنا متوكلين عليك، ملتجئين إليك، اغمرنا بالإيمان بك، واجعل هذا الإيمان يغسلنا من التعلّق بكل ما هو دونك يا رب ..</p></div><div class="ornament">❖ ✦ ❖</div>` },
        { tag: "الشكور", title: "اسم الله الشكور", type: "opener", html: `<div class="opener"><div class="letter-envelope-header"><span class="letter-seal">✦</span><span class="letter-envelope-title">الاسم السادس</span></div><h1 class="chapter-opener">الشَّكور</h1></div><div class="epigraph-box"><p>مع كرم الله تتغيّر المسائل الحسابية!!<br/>لأنّه كرم لا يخضع للمعادلات الحسابية، بل للفضل الإلهي!!</p></div>` },
        { tag: "الشكور", title: "أزاهير القلب وظلال الشكور", type: "reading", html: `<div class="reflection-card"><div class="reflection-card-title">✦ في مملكة النكران</div><p>من المؤكّد أنه قد سبق وأسديت لأحدهم معروفًا ثم تنكّر لك؟ نسِيك مباشرة! لم ينعكس ذلك المعروف على صفحات وجهه! بقي مقطّبًا كما كان!<br/>تجربة مؤلمة ولا شك ..</p></div><p>الحياة مليئة بهؤلاء الذين لا يعرفون كلمة: شكرًا .. ولا يتقنون النطق بعبارة: أحسن الله إليك، وتعتبر الابتسامة لديهم من علم الغيب!</p><p>دعهم، فعمرك أقصر من أن تضيّعه في لومهم، أو التفكّر في مملكة النُّكران التي قرروا العيش فيها! وانصرف إلى «الشكور» سبحانه، لتحيي أزاهير قلبك التي حطّمها هؤلاء ..</p><div class="wisdom-pearl action-callout"><span class="wisdom-badge">✦ عش مع الشكور</span>عش مع الشكور، تأمّل ظلال هذا الاسم العظيم، امسح تجعّدات الحياة المتعبة بمعاني هذا الاسم الجليل ..</div>` },
        { tag: "الشكور", title: "إذا أعطاك أدهشك ..", type: "reading", html: `<h2>إذا أعطاك أدهشك ..</h2><p>سبحانه يشكر عبده على ما قدّم من عمل صالح .. وكلمة «عمل صالح» لا حدود لها، تكاد لعظمتها واتساعها تملأ ما بين السماوات والأرض!</p><p>فهو سبحانه يأمرك بهذا العمل الصالح الذي فيه صلاح دنياك وآخرتك فإذا عملته، يكون سبحانه هو المستحق لشكرك لدلالتك عليه، وتيسيره لك، وإصلاح حالك به، أليس كذلك؟ ولكنه بكرمه هو من يشكرك عليه!</p><p>فهل في الكرم مثل هذا؟ وهل في الجود قريب من هذا؟ كيف يشكرك؟</p><p>هذا سؤال تفنى الأعمار دون الإجابة عنه ..</p><p>فكما أن ذاته سبحانه لا تدركها الأبصار، فإن أسماءه وصفاته لا تدرك كيفيتها ومنتهى علمها العقول.</p><p>ومع ذلك فلنا من باب التفكر والتدبر أن نسيح مع هذا الاسم العظيم نستجلي ظلاله في حياتنا ..</p><p>فمن شكره سبحانه:</p><div class="step-card"><span class="step-num">١</span><div class="step-content">يغفر الذنوب ويستر العيوب ..</div></div><div class="step-card"><span class="step-num">٢</span><div class="step-content">يوفي الحسنات ويعظم الأجور ..</div></div>` },
        { tag: "الشكور", title: "مسألة حسابية", type: "reading", html: `<div class="step-card"><span class="step-num">٣</span><div class="step-content">يعطي الصحة والعافية، والأبناء، والمال، والحياة الهانئة ..</div></div><div class="step-card"><span class="step-num">٤</span><div class="step-content">يرزقك الذكر الحسن والسمعة الطيبة ..</div></div><div class="step-card"><span class="step-num">٥</span><div class="step-content">يستجيب دعواتك، ويشعرك بقربه، ويؤنسك به ..</div></div><div class="step-card"><span class="step-num">٦</span><div class="step-content">يشفيك من أسقام مات غيرك بمثلها ..</div></div><div class="step-card"><span class="step-num">٧</span><div class="step-content">ويرفع عنك بلايا تضعضعت نفوس غيرك بأقل منها ..</div></div><div class="step-card"><span class="step-num">٨</span><div class="step-content">يهديك إلى الحق، وقد ضل الكثير عنه .. ويثبتك على الهداية، وقد زاغت عنها أفئدة من هم أذكى منك وأعلم منك وأقدم في الإسلام منك!</div></div><h2>مسألة حسابيّة</h2><p>اقرأ وتخيّل:</p><div class="quran-box" data-role="quran"><p>﴿مَّثَلُ الَّذِينَ يُنفِقُونَ أَمْوَالَهُمْ فِي سَبِيلِ اللَّهِ كَمَثَلِ حَبَّةٍ أَنبَتَتْ سَبْعَ سَنَابِلَ فِي كُلِّ سُنبُلَةٍ مِّائَةُ حَبَّةٍ﴾</p><div class="ayah-source">سورة البقرة: ٢٦١</div></div><p>هل انتهت؟ لا: ﴿وَاللَّهُ يُضَاعِفُ لِمَن يَشَاءُ﴾ سبحانك!</p><p>حبّة في العمل تتحوّل بفضله وبكرمه وبشكره لك إلى سبعمئة حبّة في الأجر والثواب.</p><p>كيف: واحد يساوي سبعمئة! تعمل صالحًا يستحق أجرًا مثله، فيأجرك الله مثله سبعمئة مرّة، ويضاعف لمن يشاء!</p>` },
        { tag: "الشكور", title: "واذكر في الكتاب", type: "reading", html: `<div class="wisdom-pearl"><span class="wisdom-badge">✦ الفضل الإلهي</span>مع كرم الله تتغيّر المسائل الحسابية!! لأنّه كرم لا يخضع للمعادلات الحسابية، بل للفضل الإلهي!!<br/>سبحانه! إذا أعطاك أدهشك، وإذا أكرمك أذهلك .. ومن ذا الذي لم يعطه العظيم ويكرمه الكريم؟ نحن في كل لحظة من حياتنا بل في كل جزء من اللحظة نستقبل ما لا يمكن إحصاؤه من العطايا والهبات!</div><h2>واذكر في الكتاب</h2><p>هؤلاء أنبياؤه عملوا الصالحات وجاهدوا لتبليغ كلماته، فشكرهم بأن أعلى ذكرهم وجعلهم قدوات يُقتدى بهم وخلّد قصصهم وعبرهم في أعظم كتبه، وحمى أعراضهم فلم يبح لأحد أن يستنقص من قدرهم أو أن يسيء الظن بهم، وغير ذلك من شكره لهم سبحانه وتعالى.</p><p>ولذكرهم في كتابه مزية أستشعرها دائما!</p><p>عبد من العبيد، خلقه الله بقدرته، لم يكن شيئا مذكورا، ثم يقول عنه:</p><div class="quran-box" data-role="quran"><p>﴿وَاذْكُرْ فِي الْكِتَابِ إِبْرَاهِيمَ إِنَّهُ كَانَ صِدِّيقًا نَّبِيًّا﴾</p><div class="ayah-source">سورة مريم: ٤١</div></div>` },
        { tag: "الشكور", title: "نعم العبد .. وشكر الله لنبيه ﷺ", type: "reading", html: `<div class="quran-box" data-role="quran"><p>﴿وَاذْكُرْ فِي الْكِتَابِ مُوسَىٰ إِنَّهُ كَانَ مُخْلَصًا﴾<br/>﴿وَاذْكُرْ فِي الْكِتَابِ إِسْمَاعِيلَ إِنَّهُ كَانَ صَادِقَ الْوَعْدِ﴾<br/>﴿وَاذْكُرْ فِي الْكِتَابِ إِدْرِيسَ﴾</p><div class="ayah-source">سورة مريم: ٥١، ٥٤، ٥٦</div></div><p>﴿إِنَّا وَجَدْنَاهُ صَابِرًا﴾ توقف قليلا، أكمل الآن: ﴿نِّعْمَ الْعَبْدُ﴾ الملك العظيم يقول عن عبد من عبيده: نعم العبد!! يا الله، ما أعظم كرمه إذا أراد أن يكرم!</p><p>وإذا نظرت إلى شكره سبحانه لنبيّنا محمد عليه الصلاة والسلام وكيف أنه قسم له رحمته ﴿أَهُمْ يَقْسِمُونَ رَحْمَتَ رَبِّكَ﴾ واختصه برسالته ﴿اللَّهُ أَعْلَمُ حَيْثُ يَجْعَلُ رِسَالَتَهُ﴾ وكان معه في جميع أدوار حياته ﴿وَاللَّهُ يَعْصِمُكَ مِنَ النَّاسِ﴾ وجمله بأجمل الأخلاق ﴿وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ﴾.</p><p>بل انظر كيف أنّه قرن اسمه باسمه في الأذان وفي الشهادة، قال حسّان:</p><div class="poetry-stanza"><div class="poetry-shatr">وضم الإله اسم النبي إلى اسمه</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">إذا قال في الخمس المؤذن أشهد</div></div><div class="poetry-stanza"><div class="poetry-shatr">وشقّ له من اسمه ليجلّه ...</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">فذو العرش محمود وهذا محمّد</div></div>` },
        { tag: "الشكور", title: "مثقال الذرة", type: "reading", html: `<p>وهؤلاء الصحابة الذين بذلوا أرواحهم وأعمارهم وأموالهم نصرة للدين شكرهم بأن جعل الكلام فيهم من علامات النفاق، ورضي عنهم، وضاعف أجر أعمالهم وعدّلهم جميعا بلا استثناء، وجعلهم خير القرون، وقال فيهم:</p><div class="quran-box" data-role="quran"><p>﴿لَّقَدْ رَضِيَ اللَّهُ عَنِ الْمُؤْمِنِينَ إِذْ يُبَايِعُونَكَ تَحْتَ الشَّجَرَةِ﴾</p><div class="ayah-source">سورة الفتح: ١٨</div></div><p>وقال: ﴿وَكُلًّا وَعَدَ اللَّهُ الْحُسْنَىٰ﴾، والأحاديث في فضل عمومهم وأعيانهم أشهر وأظهر من أن تذكر، وكل هذا شيء من شكر الله لما قاموا به من تصديق وجهاد وبذل.</p><h2>مثقال الذرّة</h2><p>فكما يشكر الكريم من عمل معروفًا، فكذلك سبحانه وله المثل الأعلى يشكر شكرًا يليق بكرمه وبعزّته وعظمته، شكرا لا كالشكر، فهو شكور لأن الشكر الواحد منه أعظم من كل شكر، وهو شكور لأن العمل الواحد منك يشكره المرة تلو الأخرى، وهو الشكور لأنّه يشكر العمل الكبير والعمل الصغير بشرط أن يكون خالصا صوابا، فهو لا يشكر الأعمال العظيمة فقط بل حتى مثقال الذرة منك يشكره وينمّيه:</p><div class="quran-box" data-role="quran"><p>﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ﴾</p><div class="ayah-source">سورة الزلزلة: ٧</div></div><p>فقد أدخل امرأة الجنّة بشق تمرة، وبغيًّا بأن سَقَتْ كلبا، وثالثًا كل حياته ذنوب فأمر أبناءه أن يحرقوه ويذروه بعد موته خوفًا من أن يعذّبه الله، فأدخله الجنة بأن خاف منه، ورابعًا ليس له إلا حسنة واحدة لأنّه تصدق بها على صاحبه، وخامسًا قتل مئة نفس! لأنّه هاجر إليه ..</p>` },
        { tag: "الشكور", title: "ثواب المتصدق وقصة بناء المسجد", type: "reading", html: `<div class="hadith-box" data-role="hadith"><p>ومن شُكره سبحانه أن يعجّل بثواب المتصدق، فيرزقه بركة ويغدق عليه من نعمه، يخبرنا عليه الصلاة والسلام «إِنَّ اللهَ يَقْبَلُ صَدَقَةَ عَبْدِهِ بِيَمِينِهِ وَيُرَبِّيهَا كَمَا يُرَبِّي أَحَدُكُمْ <button type="button" class="term-btn" data-term="إن الله يقبل صدقة عبده بيمينه (١)" data-def="أخرجه البخاري في صحيحه (١٤١٠ - ٢/ ١٠٨)، ومسلم في صحيحه (١٠١٤ - ٢/ ٧٠٢). الفَلُوّ: المهر الصغير إذا فُطم.">فَلُوَّهُ» (١)</button>، وهذا من شكره وفرحه سبحانه بطاعة عبده!</p><div class="hadith-source">متفق عليه</div></div><p>يخبرني أحد سكّان المنطقة الشرقية قبل عشر سنوات عندما كنّا واقفين عند متجر شهير عن قصة ذاك المتجر، يقول: كان صاحبه موظّفًا عاديًّا يجمع من مرتّباته، وتجمّع زوجته من مرتّباتها كي يبنوا بيت العمر كما يقال، ولمّا شارف المبلغ أن يُجمع صلّى الزوج في مسجد وسمع كلمة من أحد الدعاة حث فيها على بناء المساجد وأنّه «مَنْ بَنَى لِلَّهِ مَسْجِدًا وَلَوْ كَمَفْحَصِ قَطَاةٍ بَنَى اللَّهُ لَهُ بَيْتًا فِي <button type="button" class="term-btn" data-term="من بنى لله مسجدا (٢)" data-def="أخرجه ابن ماجه في سننه (٧٨٧ - ٢/ ٤٩٨). ومفحص القطاة: الموضع الذي تبيض فيه القطاة على صغره.">الْجَنَّةِ» (٢)</button> وقعت تلك الكلمة من الرجل موقعها، فانصرف من ليلته إلى زوجته وأخبرها بنيّته أن يجعل كامل المبلغ في مسجد يبنيه، فإذا بزوجته تدفع له مالها عن طيب خاطر وتطلبه أن تشاركه في مشروع المسجد!</p><p>لك أن تتخيّل كيف تغيّر خطّتك التي بذلت لأجلها عرق سنين في ليلة! ويكون ذلك التغيير لله عز وجل ونابعًا من قلب حيّ يريد الله والدار الآخرة!</p>` },
        { tag: "الشكور", title: "التجارة مع الشكور الحميد", type: "reading", html: `<p>يقول صاحبي: بعد بناء المسجد أخذوا في الجمع من جديد ولعلّ فكرة التجارة قد طرأت على عقل الزوج فافتتح متجرًا صغيرًا، فإذا بالزبائن يأتون من كل مكان وإذا بالأموال تمطر عليه فوسّع الرجل متجره ثم بعد مدّة فتح له فرعًا ثم الثاني والثالث، يقول صاحبي: والآن له في المنطقة الشرقية فقط ثلاثة عشر فرعًا، وهذا الكلام قبل عشر سنوات، سبحان الشكور، سبحان من لا يخسر أبدًا من يتاجر معه.</p><p>لقيت رجلا قال لي إن اسمه فلان بن فلان الرحيلي، فقلت له ممازحًا: هل أنت صاحب محطّات الرحيلي الشهيرة في مدينة جِدّة؟</p><p>فقال لي: لا، ولكنّه قريبي!</p><div class="did-you-know-card"><span class="did-you-know-badge">✦ بركة الصدقة والإحسان</span><p>ثم قال سأخبرك بقصّة الرحيلي هذا، كان في بداية حياته كثير الصدقة على الفقراء، وكان يعول الأيتام، وكان محسنًا على بعض أهله إحسانًا زائدًا، ثم فتح الله عليه فكانت له هذه المحطّة وغيرها من الأعمال التجاريّة الناجحة، هذا ما يعمله الشكور الحميد سبحانه.</p></div>` },
        { tag: "الشكور", title: "أنفق .. أنفق عليك", type: "reading", html: `<h2>أَنفِق .. أُنفِق عليك</h2><div class="hadith-box" data-role="hadith"><p>يقول عليه الصلاة والسلام: <button type="button" class="term-btn" data-term="ما نقص مال من صدقة (١)" data-def="أخرجه الترمذي في سننه (٢٤٩٥ - ٩/ ١١١).">«مَا نَقَصَ مَالٌ مِنْ صَدَقَةٍ»(١)</button>، يجب علينا أن نؤمن بهذا الكلام إيمانًا عميقًا، وهذا ربّنا يقول في الحديث القدسي: «يَا عَبْدِي أَنْفِقْ أُنْفِقْ <button type="button" class="term-btn" data-term="يا عبدي أنفق أنفق عليك (٢)" data-def="أخرجه البخاري في صحيحه (٤٦٨٤ - ٦/ ٧٣)، ومسلم في صحيحه (٩٣٣ - ٢/ ٦٩٠).">عَلَيْكَ» (٢)</button> فإذا وضعت ريالا في كفّ فقير فثق أن الله سيضع لك من فضله ما يوازي بل ويفوق ذلك الريال صحّة ورضا وعطاء وفضلا.</p><div class="hadith-source">سنن الترمذي والصحيحان</div></div><p>طالب جامعي فقير سمع وهو يسير لصلاة الجمعة رجلا يهتف بقرب صندوق التبرعات ويحث الناس قائلا: عبدي أَنفِقْ أُنفق عليك، فتش جيبه فإذا بثروته كلها خمسة ريالات، فأخرجها وأودعها صندوق التبرعات، كان في قلبه صوت اليقين يقول: لقد أنفقتُ يا ربي بفقري، فأنفق عليّ بغناك! في المساء زار أخاه فأخبره هذا الأخ (دون أن يعلم بحاله) أن جمعية مالية قد حلت في حسابه وهو لا يحتاجها كلها، وبعد ممانعة استقطع منها ألفين وأعطاها صاحبنا .. لقد أنفق الله عليه!</p><p>قرأت قديمًا في إحدى المجلات قصة كتبتها صاحبتها: أن سائلا طرق بابهم في صباح يوم فأخرجت من محفظتها آخر مئة ريال وأعطتها ذلك السائل ..</p>` },
        { tag: "الشكور", title: "وافعلوا الخير ..", type: "reading", html: `<p>وكانت روحها تهمس: يا الله العشرة أضعاف، العشرة أضعاف ..</p><p>دخلت المطبخ وصنعت فطورا لها ولزوجها، استيقظ الزوج وجلس على المائدة وبينما هو يتناول طعام الإفطار إذ به يتذكر ويقول: هناك على تلك الطاولة ظرف لكِ استلمته البارحة من البريد، قامت الزوجة لترى ما في الظرف، فإذا به شيك بنكي أجرة مقالة كتبتها في إحدى الصحف ومن العجيب أنّها كانت: ألف ريال عدًّا ونقدا!!!</p><h2>وافعلوا الخير ..</h2><p>وإنّي أعيذك أن تكون تعلّقاتك وإراداتك كلها دنيويّة، فكثير من الجزاء يدّخره الله لك أحوج ما تكون إليه في الآخرة ..</p><p>ومن أوضح صور الشكر الرباني هو ما اقترن ببر الوالدين من تيسير في العيش وتوفيق في جميع الشؤون، حتى كأن النجاح في الحياة حصر على أصحاب البرّ، يمكنك أن تستعرض من تعرفهم من الناجحين، ستجد بر الوالدين جامعا مشتركا بينهم، ولا بد!</p><p>يقول سبحانه:</p><div class="quran-box" data-role="quran"><p>﴿وَافْعَلُوا الْخَيْرَ﴾</p><div class="ayah-source">سورة الحج: ٧٧</div></div>` },
        { tag: "الشكور", title: "صنيعك النبيل لا يضيع", type: "reading", html: `<p>ومهما كان هذا الخير صغيرا، فإن الشكور يشكره ﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ﴾ لا بد أن يرى جزاءه!</p><p>ومع أن الذرة لا تكاد تُرى إلا أنك إن فعلت خيرا بقدرها فإنّك ستراه يوم القيامة ينتظرك، ليبهجك به سبحانه ويربط على قلبك في يوم يجعل الولدان شيبا ..</p><div class="reflection-card"><div class="reflection-card-title">✦ جزاء الإحسان الخفي</div><p>عندما تحرص أن تطفئ نور سيارتك عند إشارة المرور حتى لا تزعج من هم في الشارع المقابل، قد لا يعلمون بمقصدك، بل حتى لا ينتبهون لفعلك، لكن احذر أن تظن أن الشكور لن يكافئك، كيف؟ لا يهم، من الممكن أن مرضا كان سيخطف بصرك، أو حادثًا كان سيتلف سيارتك، أو مشكلة كنت ستقع فيها وقاك الله منها شكرا لك على صنيعك النبيل.</p></div><div class="step-card"><span class="step-num">١</span><div class="step-content">حرصك على فتح الباب ليلًا بلطف حتى لا تزعج النائمين ..</div></div><div class="step-card"><span class="step-num">٢</span><div class="step-content">انتظارك وأنت ممسك باب المسجد لكبير في السن حتى يدخل ..</div></div><div class="step-card"><span class="step-num">٣</span><div class="step-content">تفاديك أن تدهس قطة عابرة .. ابتسامتك لطفل .. ترتيبك لغرفة في منزلكم ..</div></div>` },
        { tag: "الشكور", title: "اسكت .. بل مات على الخير كله!", type: "reading", html: `<div class="step-card"><span class="step-num">٤</span><div class="step-content">دعاؤك لمسلم مات، بسبب أنك متيقن أن لا قريب له يدعو له ..</div></div><div class="step-card"><span class="step-num">٥</span><div class="step-content">إغلاق صنبور ماء كان غير محكم الإغلاق .. رفعك غصنا ملقى على الطريق ..</div></div><p>كل هذا من الخير ﴿وَافْعَلُوا الْخَيْرَ﴾ ..</p><h2>اسكت ..</h2><p>ومن أجلّ وأحسن الخير أن تمسك المصحف لتلاوة وِردك، ثم تقع عينك، بل يقع قلبك على خير يحثك الله على فعله فتضمر في نفسك ألا ينقضي يومك ذلك إلا وقد أتيت منه ما استطعت، إنك بذلك تفعل أعظم ما يمكنك فعله، إنك تفعل الشيء الذي لم ينزل الله القرآن إلا لتفعله!</p><p>أمّا إن سألت عن أعظم خير يمكنك فعله، فهو أن تسلم وجهك لله! أن تحيا مسلما، وتعبد الله مسلما، وتعامل الناس مسلما، وتنظر وتتكلم وتشعر مسلما، ثم تموت مسلما!</p><div class="wisdom-pearl academic-callout"><span class="wisdom-badge">✦ كلام الإمام أحمد رحمه الله</span>سئل الإمام أحمد: من مات على الإسلام والسنة، مات على خير؟ فقال لسائله: اسكت، بل مات على الخير كله!</div><p>يقول سبحانه:</p><div class="quran-box" data-role="quran"><p>﴿وَمَا تُقَدِّمُوا لِأَنفُسِكُم مِّنْ خَيْرٍ تَجِدُوهُ عِندَ اللَّهِ﴾</p><div class="ayah-source">سورة البقرة: ١١٠</div></div>` },
        { tag: "الشكور", title: "صنائع المعروف .. وإلى أين؟", type: "reading", html: `<p>أي خير تقدّمه لنفسك، ستجد أن الشكور الحفيظ حفظه ونمّاه فتأتي يوم القيامة تجده عنده موفورًا قد عُظّم وبات أكبر من يوم أن فعلته!</p><div class="quran-box" data-role="quran"><p>﴿وَمَا تُقَدِّمُوا لِأَنفُسِكُم مِّنْ خَيْرٍ تَجِدُوهُ عِندَ اللَّهِ هُوَ خَيْرًا وَأَعْظَمَ أَجْرًا﴾<br/>﴿وَمَا يَفْعَلُوا مِنْ خَيْرٍ فَلَن يُكْفَرُوهُ﴾</p><div class="ayah-source">سورة المزمل: ٢٠ / سورة آل عمران: ١١٥</div></div><div class="hadith-box" data-role="hadith"><p>وفي الأثر الضعيف المتن الحسن المعنى: «صَنَائِعُ الْمَعْرُوفِ تَقِي مَصَارِعَ <button type="button" class="term-btn" data-term="صنائع المعروف تقي مصارع السوء (١)" data-def="أخرجه الطبراني في المعجم الكبير (٨٠١٤ - ٨/ ٢٦١).">السُّوءِ» (١)</button> وهذا من شكره، فلم يضيّع صنيعك الحسن بل سيجعله وقاء لك عن أن تموت ميتة سيئة!</p><div class="hadith-source">المعجم الكبير للطبراني</div></div><p>لذلك فشعور أنّه سبحانه الشكور وأنّ الخير كلّه منه يجعل العبد على ثقة بربّه محسنا الظن به سبحانه.</p><h2>إلى أين؟</h2><p>قيل لأعرابي: إنّك تموت! فقال: ثم إلى أين؟ قيل: إلى الله! فقال: كيف أكره أن أقدِم على الذي لم أر الخير إلا منه؟</p><p>شعور عظيم ورجاء بالله كبير ذلك الذي يملأ فؤاد هذا الأعرابي، يقرّه عليه القرآن الكريم حين يقول الحق سبحانه:</p><div class="quran-box" data-role="quran"><p>﴿وَمَا بِكُم مِّن نِّعْمَةٍ فَمِنَ اللَّهِ﴾</p><div class="ayah-source">سورة النحل: ٥٣</div></div>` },
        { tag: "الشكور", title: "انتشال", type: "reading", html: `<p>كل شيء؟ نعم كل شيء يحوطك من الصحة والمال والراحة والتيسير والرضا هو منه:</p><div class="quran-box" data-role="quran"><p>﴿وَكَانَ فَضْلُ اللَّهِ عَلَيْكَ عَظِيمًا﴾</p><div class="ayah-source">سورة النساء: ١١٣</div></div><p>تعبده ستين أو سبعين سنة، أكثرها دون التكليف أو نوم أو في عمل المباحات، ومع ذلك يكافئك عنها بجنّة عرضها السماوات والأرض، تسكنها الأبد كله!</p><p>فإن كان سبحانه يعطي لا على شيء، فكيف إذا كان هناك شيء؟ كيف إذا فرقت بينك وبين بقيّة عباده الذين يرزقهم ويتحبب إليهم بالنعم بأن عملت صالحًا يرضاه، عند ذلك لا يجوز لك أن تعتقد أن لن يكرمك الكريم ويشكرك الشكور ويحمدك الحميد سبحانه.</p><h2>انتشال</h2><p>ثلاثة يلجئهم المطر إلى غار فيصبحون وقد أطبقت صخرة عظيمة بابه فلا يستطيعون الخروج، فيبتهلون ويتوسلون إلى الله بصالح أعمالهم، فيكون شكره لهم سبحانه بأن يجعل مكافأة العمل أو جزءا من مكافأة العمل جزءا من تفريج ذلك الكرب وزحزحة تلك الصخرة العظيمة، وما إن انتهى ثالثهم حتى انفرجت الصخرة وخرجوا يمشون في الشمس!</p><p>يبذل عيسى عليه السلام عمره له سبحانه، منذ أن نطق كلمته الأولى في المهد وهو عبد لله، فيتآمر ضدّه شرار بني إسرائيل ليقتلوه، فيكون شكره له سبحانه من أغرب الشكر، رفعه إليه! هكذا انتشله من بؤرة الهم والمكائد والقلق، وجعله في سماواته يعيش مع ملائكته وخيار خلقه ..</p>` },
        { tag: "الشكور", title: "مع الله في ربح دائم", type: "reading", html: `<div class="wisdom-pearl action-callout"><span class="wisdom-badge">✦ ربح دائم</span>إنك مع الله في ربح دائم .. والله هو القادر على انتشالك مما أنت فيه، أعلم جيدا أن لديك من الهموم والكروب ما لا يتناسب مع النجاة منها إلا لفظة (انتشال)، اعمل الخير، لينتشلك الله به، كما كان تسبيح يونس سبب انتشاله من بطن الحوت.</div><p>إنّك تتاجر مع ذي الكرم المتناهي وذي الشكر المتناهي وذي الفضل المتناهي.</p><p>ليست هناك احتماليّة خسارة في سوقٍ اللهُ من يسيّر أمرها، فكن معه ثم ارقب أفضاله وشكره .. لن يتركك، ثق بذلك، لن تسجد لله سجدة إلا ويشكرك عليها شكرا يليق به وبكرمه، فقط كن معه.</p><div class="heart-keepsake-card"><span class="heart-badge">مناجاة الشكور</span><p>اللهم أوزعنا أن نشكر نعمك .. واجعلنا لك ذاكرين، ولنعمك شاكرين .. واهدنا لأعمال تجزل لنا عليها الشكر يا شكور يا حميد.</p></div><div class="ornament">❖ ✦ ❖</div>` },
        { tag: "الجبار", title: "اسم الله الجبار", type: "opener", html: `<div class="opener"><div class="letter-envelope-header"><span class="letter-seal">✦</span><span class="letter-envelope-title">الاسم السابع</span></div><h1 class="chapter-opener">الجبَّار</h1></div><div class="epigraph-box"><p>كلّما انطفأ حلم خلق الله لك حُلما أجمل ..<br/>وكلّما بهتت في قلبك ذكرى صنع الله لك ذكرى أروع!</p></div>` },
        { tag: "الجبار", title: "قلبك المهشم .. كيف تهشم؟", type: "reading", html: `<div class="reflection-card"><div class="reflection-card-title">✦ ضمادات لروحك المنكسرة</div><p>هل هشّمتك الظروف؟ وتواطأت ضدّك الكروب؟ وتكالبت عليك الأزمات؟<br/>هل غيّر الفقر ملامحك؟ وأجدبت الأمراض حقولك؟ وجعلك اليُتم تبدو ضئيلًا؟ وأحاطت بك النظرات المُهينة؟</p></div><p>روحك المنكسرة، قلبك المهشّم، أنفاسك الضعيفة تحتاج إلى من يجبر التهشّم والضعف والانكسار؟ لماذا لا تتعرّف على اسم «الجبّار» لتجبّر بمعانيه الرحيمة كسورك؟ وتضمّد بظلاله جروحك؟ وتهدّئ بنسائمه عواصف روحك الهوجاء؟</p><h2>قلبك المهشّم .. كيف تهشّم؟</h2><p>من معاني اسم الجبّار: الذي يجبر أجساد وقلوب عباده.</p><p>فالعيش في كنف الإله يمدّنا بمراهم الصحة، وضمادات السعادة، ومسكّنات الأوجاع، ومضادّات الهموم.</p><p>فهو سبحانه علم أن كسورًا ستعتري عباده في أبدانهم وقلوبهم وحياتهم، كسورًا تترك ندوبها على جباههم، وآثارها على أرواحهم، لذلك تولّى جبرها برحمته، وسمّى نفسه بالجبّار، ليعلّم عباده أنّه هو القادر على جبرها فيلتجئون إليه.</p>` },
        { tag: "الجبار", title: "ضمادات الرحمة ومجبرات الود", type: "reading", html: `<p>انكسارات الحياة عديدة:</p><p>حادث تتكسّر فيه العظام، إهانة تتحطّم منها النفس، فقر تنحني معه الروح، مرض تنهار عنده القوى، عقدة تحاصر الطُّموح، <button type="button" class="term-btn" data-term="رُهاب" data-def="الرُّهاب: الخوف الشديد المستمر من مواقف أو أشياء معينة.">رُهاب</button> يخنق عفويّتك، كُره تتمرّد معه أحاسيسك، ظروف تجعلك تنكّس رأسك!</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ مجبّرات الود</span>وبقدر هذه الانكسارات تتفتّح أبواب السماء بضمادات الرحمة ومجبّرات الودّ!</div><div class="step-card"><span class="step-num">١</span><div class="step-content">كم من يتيم تكسّر نفسه نظرة صاحبه المتغطرس، ولولا الجبّار لتحطّمت نفسه للأبد.</div></div><div class="step-card"><span class="step-num">٢</span><div class="step-content">وكم من ضعيف صفعته الحياة بيد أحد الأقوياء، لولا الجبّار لظلّ منحني الرأس طول الحياة.</div></div><div class="step-card"><span class="step-num">٣</span><div class="step-content">وكم من فقير أذلّته كلمة قالها له أحد الأثرياء، لولا الجبّار لبقيت تلك الكلمة وصمة يعيّر بها طيلة عمره.</div></div><p>يجبر الكسير، ويساعد الضعيف، ويرفع من شأن الصغير، ويقدّم المتأخر، تضمّد رحماته جراح النفوس ..</p>` },
        { tag: "الجبار", title: "واجبرني", type: "reading", html: `<p>نعرف نحن أشخاصًا عانوا من شدّة آبائهم ومع ذلك خرجوا غاية في الرحمة!</p><p>عانوا من سخرية أقرانهم، ومع ذلك صاروا متميّزين ناجحين!</p><p>عانوا من الأنيميا، والسل، وحساسية الصدر، وكبروا فصاروا أصحاء أقوياء!</p><p>أين تلك العقد، وأين آثار تلك الأمراض؟ لقد جُبرت، لقد أذهبتها ضمادات الرحمة، لقد قدّر الجبار أن تختفي ..</p><h2>واجبرني</h2><div class="hadith-box" data-role="hadith"><p>شُرع لنا أن نقول بين السجدتين: «اللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَعَافِنِي وَارْزُقْنِي <button type="button" class="term-btn" data-term="اللهم اغفر لي وارحمني (١)" data-def="أخرجه الترمذي في سننه (٢٨٤ - ٢/ ٧٦)، وابن ماجه في سننه (٨٩٨ - ١/ ٢٩٠).">وَاجْبُرْنِي» (١)</button>.</p><div class="hadith-source">سنن الترمذي وابن ماجه</div></div><p>(واجبرني)! وكأننا نتكسّر في اليوم كثيرًا فنحتاج أن يجبرنا الله كثيرا!</p><p>قبل حوالي ثماني عشرة سنة ماتت ابنة أختي الوحيدة بين يديها، صرخت صرخة اختناق سمعتُها من الغرفة المجاورة، كانت الصرخة الأخيرة! فدخلتُ على أمّها قبيل الفجر وفي قلبها من الحزن والانكسار ما نمّت عيناها وتنهداتها به، فأرشدتها إلى الدعاء الوارد «اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي، وَأَخْلِفْ لِي خَيْرًا <button type="button" class="term-btn" data-term="اللهم أجرني في مصيبتي (١)" data-def="أخرجه مسلم في صحيحه (٩١٨ - ٢/ ٦٣١).">مِنْهَا» (١)</button> فقالت ذلك الدعاء وصوتها يتهدّج من وقع المصيبة، فارتفعت كلماتها المنكسرة إلى من يجبر قلوب عباده فعوّضها عن ابنتها اليوم ببنين وبنات رزقها الله برّهم وأفضل عليها وعلينا من عطاءاته.</p>` },
        { tag: "الجبار", title: "أخلف لي خيرا منها .. واحلل عقدة من لساني", type: "reading", html: `<div class="wisdom-pearl action-callout"><span class="wisdom-badge">✦ نداء الجبر</span>إذا التهبت نفسك، إذا احترقت أحلامك، إذا تصدّع بنيان روحك فقل: يا الله ..</div><h2>واحلل عقدة من لساني</h2><p>في العام الفائت التقيت طالبًا لديه عُقدة في لسانه، لا يكاد ينطق بكلمة دون أن يعيدها عدّة مرات! أمسكته ونصحته ألّا يسجد سجدة لله إلا ويدعو: واحلل عقدة من لساني يفقهوا قولي ..</p><p>التقيته هذه السنة فإذا به كأفصح ما يكون، سألته -وقد نسيت نصيحتي- عن السبب، فقال: دعاء واحلل عقدة من لساني!</p><p>لقد حلّ الجبار تلك العقدة ..</p>` },
        { tag: "الجبار", title: "سجادة تقضي على الهموم .. ويحبك مبتسما", type: "reading", html: `<p>إنّه الجبّار، ما من أسى إلا وهو رافعه، وما من مرض إلا وهو شافيه، وما من بلاء إلا وهو كاشفه ..</p><p>تتزاحم الآلام في قلب العبد حتى ما يظن أنّ لها كاشفة، فإذا بالجبّار يجبر ذلك القلب، وبعد أشهر ينسى العبد كل آلامه وأوجاعه لأن الله لم يذهبها فحسب، بل جبر المكان الذي حطّمته، فعاد كأن لم يتهشّم بالأمس!</p><p>يجبر القلوب والعظام والنفوس ويقدر أن تتداوى الجراح، وتُكفكَف الدموع سبحانه.</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ سجادة نحو القبلة</span>إذا رضّتك الهموم، وغشيتك الكروب .. فلا تطل البكاء، سجّادة توجّهها إلى القبلة، تقضي على تلك الهموم والكروب في لحظات بإذن الله!</div><h2>يحبك مبتسمًا</h2><p>جلس بانكسار بعد صلاة المغرب يستغفر الله، جيبه خاوٍ إلا من ريالات لا تصنع أمام احتياجات الحياة شيئًا، يكاد الناظر إليه من بعيد يدرك مدى <button type="button" class="term-btn" data-term="الفاقة" data-def="الفاقة: الفقر والحاجة الشديدة.">الفاقة</button>، وكميّة الخدوش المتناثرة في نفسه، ولكن الجبّار كان ينظر إليه من أعلى سماواته، فما كتب عليه تلك الليلة أن ينام إلا وقد سدّ فاقته بما لم يكن يتوقّعه أو يتخيّله!</p>` },
        { tag: "الجبار", title: "العربة .. وجبر الكسور", type: "reading", html: `<p>يحبّك سبحانه مبتسمًا، فيصنع من جميل أقداره ما يعين ثغرك على <button type="button" class="term-btn" data-term="الافترار" data-def="الافترار: التبسّم الحسن حتى تبدو مقدمات الأسنان.">الافترار</button>، ويجعل الابتسامة تطرد ملامح الكرب عن وجهك.</p><div class="reflection-card"><div class="reflection-card-title">✦ كن يد الله الجابرة</div><p>إذا رأيت منكسرًا فاجبر كسره، كن أنت الذي يستخدمك الله لجبر الكسور، لا تنم وجارُك جائع، لا تضحك وأخوك يبكي، لا تنعم بدفء بيتك وهناك من هدهدت رياح الشتاء أبدانهم الضعيفة.</p></div><h2>العربة ..</h2><p>يقول صاحبي: رأيت عجوزًا تدفع عربة بقرب الحرم مليئة بالحاجيّات، كانت السنوات قد شقّقت جلدها بما فيه الكفاية، رأى فيها أمّه، فبكى كل شيء فيه، وكان آخر ما بكى عيناه، أخرج كل ما في جيبه ودسّه في يدِها ونفسُه تكاد تسقط من الحزن على تلك المسكينة ..</p><p>يقول: لم يدُر في خَلَدي أني أتكرّم عليها، أو أن الشكور الحميد سيشكرني، كنت فقط أرتق شرخًا جلبته صورتها المنكسرة في نفسي، ولم أفلح!</p><p>لم يمض ذلك الشهر إلا وأضخم مبلغ يحصل عليه في حياته مودع في حسابه البنكيّ!</p>` },
        { tag: "الجبار", title: "شرف جبر القلوب المنكسرة", type: "reading", html: `<p>لن يدعك الله تجبر كسور الضعفاء ثم لا يشكرك، فهو الشكور الحميد ..</p><div class="poetry-stanza"><div class="poetry-shatr">كن بلسمًا إن كان (حالك) <button type="button" class="term-btn" data-term="أرقما" data-def="الأرقم: الحية الخبيثة، والمراد: إن كان دهرك أو حالك مؤذياً شاقاً فكن أنت بلسماً شافياً.">أرقما</button></div><div class="poetry-ornament">✦</div><div class="poetry-shatr">وحلاوة إن صار غيرك علقما</div></div><p>كن النافذة التي يتسلل منها الهواء الشفيف على النفوس التي خنقتها أدخنة الحياة الصعبة، تخلّق بخلق الجبر، كن اليد العليا.</p><div class="step-card"><span class="step-num">١</span><div class="step-content">يزور النبي ﷺ اليهودي المريض!</div></div><div class="step-card"><span class="step-num">٢</span><div class="step-content">يكنس أبو بكر رضي الله عنه بيت العمياء ويطبخ لها طعامها!</div></div><div class="step-card"><span class="step-num">٣</span><div class="step-content">يموت عبد الله بن المبارك فيفقد الفقراء تلك الأرزاق التي كانت توضع عند أبوابهم قبيل الفجر، فيعلمون بعد موته أنّها منهُ!</div></div><div class="step-card"><span class="step-num">٤</span><div class="step-content">يموت أحد خصوم ابن تيمية فيبشّرونه بذلك، فيغضب ويذهب مباشرة إلى أهله وأبنائه فيعزيهم ويقول لهم: أنا كوالدكم، لا تحتاجون شيئًا إلا وأخبرتموني!</div></div><p>كانوا منشغلين بالمهمّة العظيمة، مهمّة جبر القلوب المنكسرة، كان الله يستخدمهم لذلك الشرف العظيم ..</p>` },
        { tag: "الجبار", title: "٨٣ ريالا و٨٣ درجة!", type: "reading", html: `<h2>٨٣</h2><p>أخبرني صاحبي وقد كان طالبًا في جامعة أم القرى أنّه وفي طريقه إلى الجامعة لقي معتمرًا يسأله عن مركز الشرطة، أخبره صاحبي أنّه مستعجل فموعد مادّة النقد قد شارف على البدء والتي كان الأسبوع القادم هو موعد الاختبار (الصعب) فيها، ومع ذلك فقد أركبه ليقرّبه من وجهته، وفي السيارة أخبره أنه وقبل ثلاثة أيام فقد في الحرم محفظته وجوّاله وجواز سفره وكل ما يثبت شخصيّته، أصبح مجهول الهُويّة، لا يستطيع الأكل ولا المبيت ولا التواصل مع أحد! قال ذلك المعتمر لصاحبي: لقد تعبت -وعند هذه الكلمة بالذات أجهش بالبكاء- ثلاثة أيام وأنا أتكفف الناس وأنام في الشوارع .. كان منكسرًا بدرجة كبيرة!</p><p>يقول صاحبي إنّه واساه، وذكّره بالله، وقال له: إنّ الله لم يُفقدك هذه الأشياء في الحرم حتى تذل لغيره، فقط اسجد له واطلبه وسوف يحبوك، ثم أعطاه ثلاثة وثمانين ريالًا، هي كل ما وجده في جيبه، وأنزله وقد رأى ملامح الابتسامة على ثغره ..</p><div class="did-you-know-card"><span class="did-you-know-badge">✦ الجزاء من جنس العمل (٨٣ = ٨٣)</span><p>بعد أسبوعين ظهرت درجة اختبار مادّة النقد والذي لم يحلّ فيه أي فقرة لصعوبته، وقد وطّن نفسه على الرسوب فيها لأنه يستحق فيها الصفر! فإذا بها ثلاث وثمانين درجة من مئة! عدد الريالات التي أعطاها ذلك المعتمر باتت عدد الدرجات التي نالها في الاختبار! بلا زيادة ولا نقصان!!</p></div>` },
        { tag: "الجبار", title: "حجرة الخادم .. وخزائن الملك", type: "reading", html: `<p>نعم، أشياء كلّما حاولت أن تنكر وجودها، ظهرت بشكل أوضح وأصرح، كلما قررت ألا تسمعها صرخت بصوت أكثر إذهالا وإدهاشًا، إنّه الله يا صاحبي إنه الله ..</p><p>لمّا استعمله الله في جبر كسر ذلك المعتمر شكره ..</p><div class="ornament">❖ ✦ ❖</div><h2>حجرة الخادم</h2><div class="wisdom-pearl action-callout"><span class="wisdom-badge">✦ بساحة الإله الأكرم</span>إذا طرقوا أبواب الملوك، فاطرق أنت باب الملك الأعظم ..<br/>إذا وقفوا بذل بساحة أمير، فقف أنت بساحة الإله الأكرم ..<br/>إذا سافروا من مستشفى إلى مستشفى، فقم بالليل وقل: يا الله ..</div><p>بيده مفاتيح الفرج، الشفاء له خزينة عظيمة القدْر والحجم، أتعلم أين هي تلك الخزينة؟ إنها عند الله!</p><div class="quran-box" data-role="quran"><p>﴿وَإِن مِّن شَيْءٍ إِلَّا عِندَنَا خَزَائِنُهُ﴾</p><div class="ayah-source">سورة الحجر: ٢١</div></div><p>السعادة كذلك لها خزينة، الأمان أيضًا، والراحة، والرضا، أتترك من بيده ملكوت كل شيء، وتنصرف إلى عبد لا يملك لنفسه نفعًا ولا ضرًّا ولا موتًا ولا حياة ولا نشورا؟</p>` },
        { tag: "الجبار", title: "الحلم .. والذكرى", type: "reading", html: `<div class="reflection-card"><div class="reflection-card-title">✦ بين الملك والخادم</div><p>كم هو مضحك أن يترك زائر ملِك من ملوك الدنيا الانشغال بالحديث مع الملك ليدخل إلى حجرة الخادم ويتحدّث إليه!</p></div><p>نحن نفعل ما هو أكثر إضحاكًا من هذا حين نترك مناجاة ملك الدنيا والآخرة سبحانه وطلبه ما نريد ونذهب في رحلة علاجيّة إلى واشنطن أو إنجلترا ونعود بعد أشهر معنا الخيبة والخسارة!</p><p>والكلام ليس عن طلب العلاج، فهو مشروع، بل عن التعلّق بالمخلوق، ونسيان الخالق ..</p><h2>الحلم .. والذكرى</h2><p>عش أياما مع الجبّار، أمِرّ معانيه الجليلة على جروحك، اجعلها البلسم لعذابات روحك، أيقظ بها أزاهير الفرح في نفسك، اصنع بتأملاتك فيها شمس حياة تقضي على الخواء الذي كنت تعيشه.</p><p>ينزل رسولنا ﷺ من الطائف محمّلا بقدر عظيم من الحزن والحرقة والانكسار، بعد أن أدمى السفهاء عقبيه الشريفتين بالحجارة، يراه ملك الملوك، ملك الدنيا والآخرة، يراه حبيبه سبحانه، يرى قلبه المكتظ بالآهات، فيرسل جبريل ومعه ملك الجبال، لينهي تلك الحُرَق، يرسله في مهمّة خاصة، مهمّة تتعلق بدكدكة الجبال الراسية!</p>` },
        { tag: "الجبار", title: "جبر كسر الأنبياء", type: "reading", html: `<div class="hadith-box" data-role="hadith"><p>فينظر ملك الجبال إلى النبي ﷺ وهو في أحزانه التي جعلته يمشي من الطائف فلا يفيق إلا بقرن الثعالب، فيقول: أمرني الله أن أمتثل لأمرك يا محمد، فإن شئت أن أطبق عليهم <button type="button" class="term-btn" data-term="الأخشبين (١)" data-def="الأخشبان: جبلان عظيمان بمكة (أبو قبيس وقعيقعان). وأصل القصة أخرجه البخاري في صحيحه (٣٢٣١ - ٤/ ١١٥)، ومسلم في صحيحه (١٧٩٥ - ٣/ ١٤٢٠).">الأخشبين فعلت!(١)</button></p><div class="hadith-source">متفق عليه</div></div><p>إذا أراد أن يجبر كسرك، أهْلَكَ مدينة بأكملها لأجلك!</p><p>ولكنّ محمدًا عليه الصلاة والسلام يستأني بهم ويعفو عنهم ..</p><p>عندما لذعت السخرية بسياطها الحارقة قلب نوح، نظر إلى السماء ودعا ربّه:</p><div class="quran-box" data-role="quran"><p>﴿أَنِّي مَغْلُوبٌ فَانتَصِرْ﴾</p><div class="ayah-source">سورة القمر: ١٠</div></div><p>ففتح الملك سبحانه أبواب السماء بماء منهمر، أغرق الكرة الأرضية لأجل نوح عليه السلام!!</p><p>هل يستطيع غير الله أن يجبر كسور الروح بمثل هذا؟</p><p>بعض الأشخاص يظنون أن من مهماتهم تدميرك، السخرية بك، إظهارك بحجم صغير جدًّا أمام رفاقك! ولولا الجبّار لطحنتك مكائدهم ..</p>` },
