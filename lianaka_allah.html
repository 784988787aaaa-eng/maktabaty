        { tag: "الجبار", title: "فنجان قهوة!", type: "reading", html: `<div class="heart-keepsake-card"><span class="heart-badge">صنع الجبار</span><p>يدخلون إلى عينيك ليسرقوا أجمل أحلامك .. ويتسللون إلى قلبك ليمسحوا أروع ذكرياتك! وكلّما انطفأ حلم خلق الله لك حلما أجمل، وكلّما بهتت في قلبك ذكرى صنع الله لك ذكرى أروع!</p></div><h2>فنجان قهوة!</h2><p>وقد زوّد الجبار حياتنا بمجبّرات ومضمّدات وأدوية، نعلم بعضها، ونجهل أكثرها خلقها وأودعها في كونه لأجلك، حتى تبتسم، وتعيش حياة كريمة، حتى تتفرّغ لعبادته.</p><p>تلتئم جروحنا عندما نتناول الدواء الناجع لها، وعندما نأكل الطعام الصحّي، وعندما نشرب الماء النقي.</p><p>تصحّ أرواحنا لمّا نرى الابتسامة على أوجه الآخرين، وحين نشعر بأكفّهم تربت على أكتافنا، وعندما نسمع الكلمة الطيبة.</p><p>نتجاوز عقدنا عندما نصادف قلبًا ينبض بحبّنا، ويدا تمتدّ لمساعدتنا، وفنجان قهوة نرتشفه بمعيّة من نحب.</p><p>هناك أشياء تلتئم داخلنا عندما ننظر للطبيعة الجميلة، ونسمع خرير الماء، ونحدّق في العصفور وهو يُطعم فراخه.</p>` },
        { tag: "الجبار", title: "كن ساجدا", type: "reading", html: `<p>الصلاة تردم هوّة اليأس في أرواحنا، وسبحان ربي العظيم تخلق فرحًا نجد طعمه في ألسنتنا، وسبحان ربي الأعلى تحلّق بنا حول العرش.</p><p>دعوات الوالدة دفء في شتاء الحياة، وزيارة الصديق متعة في صخب العيش، وسؤال الجار عنك يلوّن لوحة نفسك الرماديّة.</p><p>عصير البرتقال يجبرك على الابتسامة، وقطعة الحلوى التذاذ خاص، والحمّام الدافئ شعور بانحسار الأتعاب.</p><p>الحياة مليئة بالمجبّرات، وربنا يريدنا أن نسعد، أن نبتسم، أن نحيا حياة جميلة.</p><h2>كن ساجدًا</h2><p>ما الذي يبطّئك عن الله؟</p><p>ما الذي يجعلك تتأخر عن الانضمام لركب <button type="button" class="term-btn" data-term="الأوّاهين الأوّابين" data-def="الأوّاه: كثير التضرع والدعاء والخشوع لله. والأوّاب: كثير الرجوع والتوبة إلى الله.">الأوّاهين الأوّابين</button>، الذين يرتّلون كلامه في جوف الليل؟</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ سجود الفطرة</span>شكل الجنين في بطن أمه قريب جدا من شكل الساجد لله!<br/>فكن في حياتك ساجدًا كما كنت في بطن أمك، يكفيك الله رزقك ويجعل أضيق الأماكن أهنأها، ويحيطك برحمته.</div>` },
        { tag: "الجبار", title: "يا جابر المنكسرين اجبر كسري", type: "reading", html: `<p>كن ساجدًا بقلبك، وإن رفعت رأسك.</p><p>قل بنبضاتك: سبحان ربي الأعلى، وإن كنت ضاحك الثغر.</p><p>اهمس بشرايينك: يا جابر المنكسرين اجبر كسري، ثم تأمّل في المعجزة وهي تشكّل روحك من جديد!</p><div class="heart-keepsake-card"><span class="heart-badge">مناجاة الجبار</span><p>اللهم اجبر كسر قلوبنا، وكسر أرواحنا، وكسر أجسادنا، إنّك على كل شيء قدير.</p></div><div class="ornament">❖ ✦ ❖</div>` },
        { tag: "الهادي", title: "اسم الله الهادي", type: "opener", html: `<div class="opener"><div class="letter-envelope-header"><span class="letter-seal">✦</span><span class="letter-envelope-title">الاسم الثامن</span></div><h1 class="chapter-opener">الهادي</h1></div><div class="epigraph-box"><p>لا يهديك لأنّك فلان بن فلان، بل لأنّه شاء أن يهديك!</p><div class="quran-box" data-role="quran"><p>﴿يَهْدِي مَن يَشَاءُ إِلَىٰ صِرَاطٍ مُّسْتَقِيمٍ﴾</p><div class="ayah-source">سورة البقرة: ١٤٢</div></div></div>` },
        { tag: "الهادي", title: "دفء .. ويوقف جيوش الحيرة", type: "reading", html: `<div class="reflection-card"><div class="reflection-card-title">✦ حين تأكلك الحيرة</div><p>هل أكلتك الحيرة؟ هل تشعر أن عقلك أعجز من أن يحدد لك الصواب من الخطأ، هل عُرضت عليك وظيفتان لا تدري أيّهما أنسب لك؟ هل تزاحمت في عقلك مميزات فتاتين لا تدري أيهما تتزوّج؟ بل هل تعبت من درب الضياع وتريد أن يمنّ الله عليك بأن يدلّك إلى طريق النور والهداية؟</p></div><p>أنت إذن مهيّأ لبداية عهد جديد مع اسم الله «الهادي» ..</p><p>أنت تحتاج أن تتعرّف إلى هذا الاسم العظيم، أن تسترشد الهادي سبحانه ليوقف في نفسك جيوش الحيرة، ويهديك إلى الصراط المستقيم!</p><h2>دفء</h2><div class="wisdom-pearl academic-callout"><span class="wisdom-badge">✦ أصل الهداية</span>الهداية أصلها اللغوي يدل على الميل، وكأنّ الهداية ميل عن الخطأ إلى الصواب وعن الضلالة إلى الرشد وعن التيه إلى الجادّة.</div><p>فهو سبحانه يهديك، فيحرف مسارك عن الضلالة إلى الرشد، وعن الغواية إلى الطريق الأقوم.</p>` },
        { tag: "الهادي", title: "يهديك .. ويهدي إليك!", type: "reading", html: `<p>وكما أنّه يهديك، فكذلك يهدي إليك!</p><p>فيوصل الأشياء التي بها قوام حياتك إليك: يوصل الماء إلى الأرض التي تقطنها، ويوصل الغذاء إلى المكان الذي تعيش فيه، ويوصل الهواء إلى رئتيك ..</p><p>وهو يهدي جميع خلقه هدايات متعددة بحسبهم وبحسب أحوالهم:</p><p>فالأعمى هدايته أن يسير على الطريق، وهداية الأصمّ أن يفهم ما يقال، وهداية العاجز أن يصل إلى مبتغاه ..</p><p>هداية الطفل أن يبعده عمّا يضرّه ..</p><p>وهداية <button type="button" class="term-btn" data-term="العجماوات" data-def="العجماوات: البهائم والحيوانات والطيور التي لا تفصح بالكلام.">العجماوات</button> أن يغرز في نفوسها ما فيه قوام حياتها، فتعلم مصالحَها فتأتيها، وتعلم مضارّها فتجتنبها، وتعلم المخاطر فتقاومها.</p><div class="step-card"><span class="step-num">١</span><div class="step-content">يهدي التائهين في الصحاري .. ويهدي القارئ إلى موضع المعلومة ..</div></div><div class="step-card"><span class="step-num">٢</span><div class="step-content">ويهدي المكتشف إلى الاختراع .. ويهدي المجتهد إلى دليل المسألة ..</div></div>` },
        { tag: "الهادي", title: "ليست صدفة!", type: "reading", html: `<div class="step-card"><span class="step-num">٣</span><div class="step-content">ويهدي الداعية إلى الأسلوب الأسلم .. ويهدي الأب إلى الطريقة المثلى في نصح ابنه ..</div></div><h2>ليست صُدفة!</h2><p>يهديك بما تظنّه صُدفة: يهديك بآية تسمعها في صلاة، ويهديك برؤيا تراها، ويهديك بنصيحة عابرة، ويهديك بكلمة تقع عينك عليها في كتاب، ويهديك بتأمّل، ويهديك بومضة غير مسبوقة بتفكير، ويهديك بظروف تدفعك إلى الصواب، ويهديك بالخوف، ويهديك بالحب، ويهديك بالموت!</p><p>أما سماع القرآن فأصل الهدايات، ومن أعظم ما جعله الله سببا لهداية عباده، فقد ضمّن فيه كل أسباب الهداية والرشد، قال تعالى:</p><div class="quran-box" data-role="quran"><p>﴿إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ﴾</p><div class="ayah-source">سورة الإسراء: ٩</div></div><p>فيستحيل على عالمٍ عاملٍ بما في القرآن أن يصاب بزيغ أو انحراف أو نكوص!</p><p>وقصّة إسلام عمر بن الخطاب معروفة، فقد دخل على أخته والشرّ يتطاير من عينيه فلمّا قرأ في صحيفة معها أوّلَ سورة طه، سجد قلبه في محراب الإيمان ولم يرفع حتى مات رضي الله عنه ..</p><p>تُرى ما هو الشعور الذي شعر به؟ وما هو اليقين الذي نزل قلبه في تلك الساعة؟ وكم في القرآن من هدايات غضضنا عنها طرف التدبّر، وكم فيه من إرشادات انقفلت عنها قلوبنا؟</p>` },
        { tag: "الهادي", title: "لا .. ولا", type: "reading", html: `<h2>لا .. ولا</h2><p>ومن أشكال الهداية أن ترى رؤيا فيها شفاؤك أو تحذير لك أو إرشاد، يقال إن أحدَهم كان مريضًا فرأى في منامه أن علاجه في «لا» و«لا»، فذهب إلى شيخ يسأله فقال لا أدري ولكنّي أختم القرآن كل يومين، فأمهلني لعلّي أجد شيئًا في القرآن أعبّر به رؤياك، وبعد يومين جاءه وقال له شفاؤك في زيت الزيتون، قال تعالى في سورة النور:</p><div class="quran-box" data-role="quran"><p>﴿يُوقَدُ مِن شَجَرَةٍ مُّبَارَكَةٍ زَيْتُونَةٍ لَّا شَرْقِيَّةٍ وَلَا غَرْبِيَّةٍ يَكَادُ زَيْتُهَا يُضِيءُ﴾</p><div class="ayah-source">سورة النور: ٣٥</div></div><p>فهذه هداية برؤيا.</p><p>ومن أنواع الهداية التي تشبه الهداية بالرؤى لما فيها من معنى الاستنباط والاستدلال بالشبيه على شبيهه .. الاستشفاء بعمل طاعات لها صفة قريبة من حال المرض!!</p><p>جاء رجل إلى أحد العلماء يشتكي الاستسقاء وهو مرض تتجمّع بسببه السوائل في جسم الإنسان وقد يودي بحياته، فأوصاه أن يحفر بئرًا ويوقفها، فحفر البئر فبرئ بإذن الله!</p><p>رأى هذا العالمُ تشابهًا بين انحباس السوائل في الجسد وانحباس الماء في الأرض، فظنّ أن هذه الطاعة (حفر بئر)</p>` },
        { tag: "الهادي", title: "الاستشفاء بالطاعات والهداية بالتأمل", type: "reading", html: `<p>مشابهة لحال المرض، وأن الشفاء قد يكون فيها ..</p><p>أحد الزملاء يخبرني أنّه دَهس ابنة أخيه ذات العامين بسيارته (الجيب) وهو ذاهب إلى الصلاة دون أن يدري، فهُرع بها والدها إلى المستشفى والموت يلوح بين عينيها، والأطباء يخبرونه بأنّ نسبة موتها ثمانون في المئة!</p><p>فاتّصل ابن عمّ لهم بزميلي مستخبرًا وناصحًا، وأوصاه بسرعة ذبح شاة والتصدق بلحمها بنيّة الشفاء! ففعل ما أوصاه به ابن عمّه فلم يأت الفجر إلا وقد أخرجت تلك الطفلة من العناية الفائقة!!</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ تناسب عجيب</span>هدى الله سبحانه ابن العم إلى تناسب ما بين اللحم المتصدّق به، ولحم الطفلة المتهتّك، فكان الشفاء من الله أصدق من توقعات الأطباء!!</div><p>أما الهداية بنصيحة عابرة: فيقال إنّ مغنّيا كان حسن الصوت مرّ به أحد الصالحين فقال له: ما أجمل صوتك، يا ليته تَغنّى بالقرآن، فتاب ذلك الرجل من حينه!</p><p>والهداية بالنصيحة أوسع وأوضح من أن نمثّل لها ..</p><p>وقد يهديك بالتأمّل، ومن أوضح شواهد هذه الهداية قصّة سيدنا إبراهيم عليه السلام والذي عندما جَنَّ عليه الليل رأى كوكبًا، والقصّة معروفة فهنا تأمّلات في آيات الكون سببت هداية ويقينًا له عليه الصلاة والسلام.</p>` },
        { tag: "الهادي", title: "قبس من نور", type: "reading", html: `<h2>قبس من نور</h2><p>يبصر من عليائه التائهين، يرى هضاب الضياع وقد التفت من حول أرواحهم، فيشعل لهم في الليل قبسًا من نوره، فيرون به الطريق! ويصِلون إلى الجادّة.</p><p>لا يهديك لأنّك فلان بن فلان، بل لأنّه شاء أن يهديك! ﴿يَهْدِي مَن يَشَاءُ إِلَىٰ صِرَاطٍ مُّسْتَقِيمٍ﴾ فتعرّض بإصلاحك قلبك إلى تلك المشيئة الغالية.</p><p>قد يهديك ثم لا تقوم بواجب تلك الهداية من شكر وعمل بمقتضاها فيسلبها منك، مثل ذلك الرجل الذي آتاه الله آياته:</p><div class="quran-box" data-role="quran"><p>﴿فَانسَلَخَ مِنْهَا فَأَتْبَعَهُ الشَّيْطَانُ فَكَانَ مِنَ الْغَاوِينَ﴾</p><div class="ayah-source">سورة الأعراف: ١٧٥</div></div><p>وقد يهديك فتشكره وتعمل بمقتضى الهداية فيمنّ عليك بهداية أخرى فتشكره وتعمل بمقتضاها ثم يفضل عليك بهداية ثالثة ورابعة، ويجعل حياتك هدايات يمسك بعضها ببعض ..</p>` },
        { tag: "الهادي", title: "بوصلة ضائعة", type: "reading", html: `<p>فهؤلاء فتية الكهف هداهم بأن جعلهم مؤمنين، ثم هداهم أيضًا بأن جعلهم صابرين على إيمانهم، ثم هداهم بأن دلّهم على طريق النجاة، ثم هداهم بأن هيأ لهم حالًا أنجاهم بها؛ بأن ضرب على آذانهم في الكهف سنين عددا، قال عنهم سبحانه:</p><div class="quran-box" data-role="quran"><p>﴿إِنَّهُمْ فِتْيَةٌ آمَنُوا بِرَبِّهِمْ وَزِدْنَاهُمْ هُدًى﴾</p><div class="ayah-source">سورة الكهف: ١٣</div></div><h2>بوصلة ضائعة</h2><p>في وسط الصحراء المظلمة، لا تعلم أين تتوجّه، وعدم معرفتك هذه تعني الموت المحتّم، لأنّك بلا زاد ولا راحلة، وفجأة تجد شعورًا ملحًّا يأمرك أن تتجه إلى اتجاه معيّن، ليس لديك معرفة بالنجوم، وبوصلتك ضائعة، ورفاقك سبقوك! فتتجه إلى ذلك الاتجاه، وبعد تلاعب كثبان الصحراء بك، وإذ بعينيك تلمحان بصيص نور، إنّهم رفاقك هناك، في آخر نقطة من الحياة ينتظرونك بلهفة!</p><p>الآن حدّثني عن ذلك الشعور؟ ما هي المعادلة التي جعلته يبزغ في تلك اللحظة؟ ولماذا جاء؟ وكيف كان دقيقًا إلى هذه الدرجة؟</p><div class="reflection-card"><div class="reflection-card-title">✦ وميض الهداية الداخلي</div><p>لقد كان الله في تلك اللحظة يبصر اضطراب الرعب في قلبك، لقد كان يسمع <button type="button" class="term-btn" data-term="وجيف فؤادك" data-def="الوجيف: خفقان القلب واضطرابه الشديد.">وجيف فؤادك</button>، لقد علم تمثّل الموت عطشًا في نفسك، فأذِنَ لوميض داخليّ أن يشتعل لتحس بالطريق، وتصل بسلام.</p></div>` },
        { tag: "الهادي", title: "وإذا العناية لاحظتك عيونها", type: "reading", html: `<p>لا تتعلّق بحرفيّة التجربة، فقد لا تكون عشتها، ولكنّك ولا شك عشت أنت أو من تعرفه أجواء قريبة من تلك الأجواء، والسؤال الأهم من جميع التفاصيل: من الذي قذف الهداية في روح قلقة، محتاجة إلى بصيص؟</p><p>إنّه الهادي سبحانه ..</p><div class="poetry-stanza"><div class="poetry-shatr">وإذا العناية لاحظتك عيونها</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">نم فالحوادث كلهنّ أمانُ</div></div><p>وفي وسط تلاعب الموج بسفينتك، يأمر الريح فتكون شماليّة في تلك الساعة لأنّ جزيرة النجاة في الجنوب منك ستتمزّق أشرعة سفينتك لولا تلك الرياح التي قدّرها الهادي سبحانه.</p><p>يخرج ابن تيمية من بين البيوت وقد ازدحمت الأقوال في رأسه حول تفسير آية، يقرأ عنها عشرات التفاسير، فلا تخلصه تلك التفاسير من ضوضاء الحيرة، فيمرّغ وجهه بالتراب ويبكي ويقول: «يا معلّم داوود علمني ويا مفهّم سليمان فهّمني» فيعود وقد تحددت الأقوال الراجحة في عقله بنور الهداية الربانيّة!</p><div class="poetry-stanza"><div class="poetry-shatr">إذا لم يكن عون من الله للفتى</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">فأوّل ما يقضي عليه اجتهادهُ</div></div><div class="ornament">❖ ✦ ❖</div>` },
        { tag: "الهادي", title: "ثم هدى", type: "reading", html: `<h2>ثم هدى</h2><p>وهدايته سبحانه لا تختص بالبشر بل هو يهدي جميع خلقه، قال جلّ من قائل:</p><div class="quran-box" data-role="quran"><p>﴿قَالَ رَبُّنَا الَّذِي أَعْطَىٰ كُلَّ شَيْءٍ خَلْقَهُ ثُمَّ هَدَىٰ﴾</p><div class="ayah-source">سورة طه: ٥٠</div></div><p>يصف الشيخ محمد راتب النابلسي شيئًا من هذه الهدايات فيقول: «يتجه سمك السلمون من سواحل الأطلسي إلى مصبات الأنهار في أمريكا، ويضع بيوضه ويعود، بعد أشهر تخرج الأسماك الصغيرة وتتجه مباشرة إلى حيث أمّهاتها؟ على بعد مئات الكيلوات! لا تضيع طريقها، من الذي هداها إلى الطريق؟ إنه الهادي سبحانه!</p><p>أحدهم رأى قنفذًا يأكل أفعى ميّتة ثم يتوجّه إلى نبتة فيأكل منها ورقة، ثم يعود للأفعى فيقضم ثم للنبتة فيأكل، أراد ذلك الشخص أن يعلم سر تلك النبتة فاقتلعها، عاد القنفذ ليأكل ورقة من النبتة فلم يجدها فلبث يسيرا ثم مات!</p><p>من الذي هدى هذا القنفذ إلى أن تلك النبتة تحمل خاصيّة مضادّة للسم الموجود في جسم الأفعى؟ إنه الله جل جلاله» ..</p><p>يهجم الذئب على الغزال فتحني الغزال رأسها لينغرز قرنها في رقبة الذئب، من الذي أعلمها أن فوق رأسها سكينًا حادة، ومن الذي جعلها تعلم أنها بذلك الفعل ستنجو؟ إنه الهادي سبحانه ..</p>` },
        { tag: "الهادي", title: "المستنقع", type: "reading", html: `<p>رأيت في طفولتي قطّتنا وأبناءها حديثي الولادة يزحفون إليها عُميًا، ثم يغرسون رؤوسهم في بطنها ويتحسسون بأفواههم حتى يجدون ثديها ويبدؤون بشرب الحليب، من الذي أخبر تلك الكائنات عديمة الخبرة والمعرفة أنها بذلك ستعيش وبدونه ستموت؟ إنه الهادي سبحانه ..</p><h2>المستنقع</h2><p>ومن أعظم هداياته إعادة خلقه إليه، ودلالة التائهين عليه، وفتح أبواب التوبة لمن أذبل أرواحهم خريف <button type="button" class="term-btn" data-term="الحوبة" data-def="الحوبة: الإثم والذنب والمعصية.">الحوبة</button>.</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ عهد مضيء مع الهادي</span>يخرج في ظلام الليل، ليعصي ملك الملوك، كل جوارحه مندفعة للوصول إلى وحل المعصية، ولكن الله في تلك اللحظة الحاسمة يأمر الهداية أن تصل إلى قلبه قبل أن يصل هو إلى المستنقع، فإذا بكل ما بناه من أحلام سوداء ينهار فجأة، وتيّار فظيع يرجف به، كل شيء يتطاير من حوله، هناك شعور بكر وطئ للتوّ ساحته، يلتفت إلى جهة أخرى، ليست جهة المستنقع إنّها جهة تطلّ من بين منحنياتها منارة المسجد، فيبدأ عهدًا مضيئًا مع الهادي سبحانه.</div>` },
        { tag: "الهادي", title: "ورقة!", type: "reading", html: `<h2>ورقة!</h2><div class="wisdom-pearl"><span class="wisdom-badge">✦ أسباب الهداية</span>إذا أراد هدايتك، جعل ورقة ملقاة على الأرض تعيدك إليه!</div><p>مما يذكر أن رجلا كان يترنَّح في سكك مدينته مخمورًا، فرأى بعينين أذبلتهما الخمرة ورقة ملقاة، كُتب عليها اسم الله، فاعتصر فؤاده حبًّا وحزنًا، وقال باكيًا: اسم الله على الأرض! فحمل تلك الورقة وذهب إلى بيته فنظّفها وعطّرها وقبّلها ورفعها، ثم نام ليسمع هاتفًا يقول له: رفعتَ اسمي؟ وعزّتي لأرفعنّ اسمك، فإذا به يستيقظ على الهداية تملأ قلبه، ويتحوّل من رجل لا هدف له من هذه الحياة إلى رجل من الصالحين المعروفين في التاريخ!!</p><p>وإذا أراد هدايتك أسمعك صوتًا يقول لك: اتق الله، فيستيقظ فؤادك!</p><p>فهذا أحد الثلاثة الذين أطبق عليهم الغار في القصّة النبويّة الشهيرة، يحضّر من وقت بعيد للفجور بابنة عمّه، وتسوقها الأقدار إليه في حاجة فيبتزّها، وقبل لحظات من بدئه لمراده البشع، إذ بها تقول: اتق الله ولا تفضّن الخاتم إلا بحقّه، فينهض فزِعًا، لم تدع «اتق الله» في قلبه شهوة إلا وسحقتها!</p>` },
        { tag: "الهادي", title: "حبل النجاة", type: "reading", html: `<h2>حَبْل النجاة</h2><p>تكون في غمرة النسيان فيذكّرك به، تكون في حومة المعصية فيوقظك، تكون في وسط المستنقع فيطهّرك، تكون في داخل الجب فيدلّي إليك حبلًا ..</p><p>يهديك بحبّ يغمر فؤادك، أو بخوف يزعزع استقرارك، أو بمرض يذلّ كبرياءك، أو بحاجة ترغم أنفك، أو بفقر ينقض ظهرك، أو بخواء يعذّب روحك.</p><div class="reflection-card"><div class="reflection-card-title">✦ طريق الأنوار</div><p>يعيدك إليه، إلى طريق الأنوار، يجعلك من روّاد المسجد بعد أن كنت تنظر إليه من بعيد ولا تنالك هداياته من قريب، يعلّم يديك كيف تمسكان بالمصحف بعد سنين طويلة من الهجر والصدود، يرطّب لسانك بذكره بعد أن كنت تترنّم بأغانٍ تافهة!</p></div><p>تخرج من بيتك قاصدًا مسجدًا وفجأة تغيّر الطريق إلى مسجد آخر، بعد الصلاة تسمع كلمة يلقيها أحد الدعاة تغيّر شيئًا كان مستقرًّا في قرارة نفسك! يغيّر طريقتك أو حتى طريقك ..</p><p>والعبد صاحب الروح المرهفة يستنبط هدايات الله سبحانه، ويعلم أن الكون مربوب له سبحانه، وأن الله سبحانه قد يهديه بأي شيء في كونه، وقد يضلّه والعياذ بالله بأي شيء في كونه!</p>` },
        { tag: "الهادي", title: "اللهم ارزقنا هداية من عندك", type: "reading", html: `<p>ولن يضل سبحانه إلا من أغلق قلبه عن الهدى ودين الحق.</p><p>إذن: ضياع هذه الحياة إن لم تأتك الهداية من عنده ..</p><p>أتذكر مثال صحراء التيه آنفة الذكر، إن ضياعنا عن طريقه سبحانه، عن المسجد، عن الله أكبر، عن اللهم أنت السلام ومنك السلام، أعظم فظاعة من تيه الصحراء، وسنكون بذلك في غربة أقسى من غربة الطائر الذي فقد سربه في فصل الشتاء، فقررت الثلوج أن تبتلع أحلامه المحلّقة!</p><div class="heart-keepsake-card"><span class="heart-badge">مناجاة الهادي</span><p>اللهم ارزقنا هداية من عندك تنتشلنا من صحراء التيه، وتوصلنا إليك، وتدخلنا بها جنّة عرضها السماوات والأرض.</p></div><div class="ornament">❖ ✦ ❖</div>` },
        { tag: "الغفور", title: "اسم الله الغفور", type: "opener", html: `<div class="opener"><div class="letter-envelope-header"><span class="letter-seal">✦</span><span class="letter-envelope-title">الاسم التاسع</span></div><h1 class="chapter-opener">الغفور</h1></div><div class="epigraph-box"><p>الذنوب ستفسد عليك حياتك،<br/>ستقهر روحك، ستجعل الماء ذا نكهة غير مستساغة،<br/>والطعام غير هنيء، والليل وحشة، والنهار ملل ..</p></div>` },
        { tag: "الغفور", title: "أزيز التائبين ونداؤهم", type: "reading", html: `<div class="reflection-card"><div class="reflection-card-title">✦ عالم الأنس والمغفرة</div><p>إذا كنت قد تعبت من ذنوبك وخطاياك، وشعرت أن شؤمها قد نغّص عليك حياتك، وأن ظلامًا وقتامة قد أطفأت في عينيك بهجة أيامك ولياليك، وأنّك ما عدت تستلذ بصلاتك، ودعائك، وعبادتك؛ فاعلم أنّ الوقت قد حان لتدلف إلى عالم الأنس والمغفرة، متلمّسًا معاني الغفران والتجاوز في اسم الله «الغفور» ..</p></div><p>أنت الآن بحاجة إلى أن تفهم معنى المغفرة، وكيف أنّ ربّك غفور وغفّار، ومدى حاجتك لهذه المغفرة في جميع أدوار حياتك ..</p>` },
        { tag: "الغفور", title: "السجن .. وهل تعلم؟", type: "reading", html: `<h2>السجن</h2><p>بلاء الروح بالذنب أعظم بكثير من بلاء الجسد بالمرض، روحك تئنّ تحت وطأة العصيان، نعم قد يكون جسدك استلذّ لحظة المعصية، ولكن روحك تجأر إلى الله!</p><p>تخيّل أنّك في سجن ضيّق عرض كل جدار فيه متر واحد فقط، ما مقدار الاختناق الذي ستشعر به؟</p><p>الذنوب تجعل روحك في سجن شبيه بهذا السجن! إنّها تحيط بك ﴿وَأَحَاطَتْ بِهِ خَطِيئَتُهُ﴾ وتجعل روحك تختنق.</p><p>لو لم يكن هناك جنّة ولا نار، الذنوب وحدها جحيم، وحميم، وعذاب أليم!</p><div class="wisdom-pearl"><span class="wisdom-badge">✦ تصدّع جدران السجن</span>فإذا علمنا أنّ من أسمائه سبحانه الغفور والغفّار والعفوّ وأن من صفاته أنّه يغفر الذنوب، تبدأ جدران ذلك السجن الضيّق تتصدّع.</div><h2>هل تعلم؟</h2><p>بالله قل: أستغفر الله ..</p><p>لا تقلها، فقط تأمّل فيها: أستغفر الله ..</p><p>هل هناك ما هو أجمل من هذه الكلمة التي إن قلتها من قلبك تتناثر جميع الوساوس والهواجس والمخاوف؟</p><p>هل تعلم أن كل مصيبة من مرض أو هم أو حزن أو ألم هي بسبب معاصيك؟ اقرأ:</p><div class="quran-box" data-role="quran"><p>﴿وَمَا أَصَابَكُم مِّن مُّصِيبَةٍ فَبِمَا كَسَبَتْ أَيْدِيكُمْ وَيَعْفُو عَن كَثِيرٍ﴾</p><div class="ayah-source">سورة الشورى: ٣٠</div></div>` },
        { tag: "الغفور", title: "وغدراتي؟", type: "reading", html: `<div class="reflection-card"><div class="reflection-card-title">✦ داء الذنوب ودواء الاستغفار</div><p>لقد أصابتنا الغيبة والكذب والغش والحسد والاحتقار والعقوق والنظر إلى الحرام وتأخير الواجبات بقدر كبير من الآلام والهموم والأوجاع.</p></div><p>نذهب لنسكب ماء وجوهنا بحثا عمّن يقرضنا شيئًا من المال، ولعلّ تلك الحاجة إلى المال سببها ذنب اقترفناه، ولو قلنا: أستغفر الله بانكسار، لما احتجنا أن ننكسر لدى خلق الله!</p><p>نبحث عن راق لنخبره عن الضيقة التي نشعر بها، والخوف الذي نغّص حياتنا، والتغيّرات النفسيّة التي نشعر بها، ولعل ما أصابنا كان بسبب معصية ارتكبناها، ولو قلنا: أستغفر الله بقلب حيّ، بقلب تائب منيب ما احتجنا إلى كل ذلك!</p><h2>وغَدَراتي؟</h2><p>لم تظهر لي صفة المغفرة ماثلة وبارزة كما ظهرت لي وأنا أقلّب أوراق السيرة النبويّة:</p><p>عمر بن الخطاب يفتن المسلمين عن دينهم، يمسك السوط بيده القوية ويلهب به ظهر جاريته ثم لما يتعب ينزل السوط ويقول: ما تركتك إلا <button type="button" class="term-btn" data-term="ملالة" data-def="الملالة: السآمة والضجر والتعب.">ملالة</button>!</p><p>كان المسلمون يعتقدون أن إسلام حمار الخطاب أقرب إلى المعقول من إسلام عمر! لشدّة عداوته للإسلام، وكرهه لهذا الدين، ثم يفتح له الغفور أبواب التوبة ليصبح: عمر الفاروق!</p>` },
        { tag: "الغفور", title: "الفاروق وسيف الله المسلول", type: "reading", html: `<p>والسياط التي كان يحرق بها ظهور عبيده وإمائه؟ أين ذهبت؟ لقد غفرها الله!</p><p>خالد بن الوليد يصعد على جبل الرماة في غزوة أحد ويُقتل بسببه عبد الله بن جبير وصحبه الذين كانوا على جبل الرماة رضي الله عنهم، بل يكون السبب في أعظم هزيمة يُمنى بها الجيش الإسلامي بقيادة النبي ﷺ، ويكون السبب في أن يُجرح نبي الله ويشجّ رأسه وتكسر <button type="button" class="term-btn" data-term="رباعيّته" data-def="الرباعية: السن التي بين الثنية والناب. والمغفر: زرد من الدرع يُلبس تحت البيضة على الرأس.">رباعيّته</button> وتدخل حِلَق المِغفَر في وجهه الشريف.</p><div class="hadith-box" data-role="hadith"><p>يكون السبب في أن يدمى وجه النبي ﷺ وقد قال عليه الصلاة والسلام: «اشْتَدَّ غَضَبُ اللَّهِ عَلَى قَوْمٍ دَمَّوا وَجْهَ <button type="button" class="term-btn" data-term="اشتد غضب الله على قوم دموا وجه رسوله (١)" data-def="أخرجه أحمد في مسنده (٢٦٠٩ - ٤/ ٣٦٩).">رَسُولِهِ» (١)</button></p><div class="hadith-source">مسند الإمام أحمد</div></div><p>ولكن الله ينزل:</p><div class="quran-box" data-role="quran"><p>﴿لَيْسَ لَكَ مِنَ الْأَمْرِ شَيْءٌ أَوْ يَتُوبَ عَلَيْهِمْ أَوْ يُعَذِّبَهُمْ فَإِنَّهُمْ ظَالِمُونَ﴾</p><div class="ayah-source">سورة آل عمران: ١٢٨</div></div><p>ويكون خالد ممن تاب عليهم وغفر لهم!!</p><p>يسلم، فيغفر له الغفور، يمسح سبحانه كل تلك <button type="button" class="term-btn" data-term="الطوام" data-def="الطوام: الدواهي والخطايا العظام.">الطوام</button> .. ويتحوّل من السبب الأهم في هزيمة المسلمين في غزوة أحد إلى: سيف الله المسلول!</p>` },
        { tag: "الغفور", title: "وغدراتك وفجراتك!", type: "reading", html: `<p>وتلك الدماء الزكية التي سفكها؟ وحلق المغفر؟ والدماء النبويّة الطاهرة؟ كل ذلك غفره الله!</p><div class="hadith-box" data-role="hadith"><p>رجل يأتي إلى رسول الله ﷺ، يئنّ قلبه مما اقترفه من آثام، فيقول: «أَرَأَيْتَ رَجُلًا عَمِلَ الذُّنُوبَ كُلَّهَا، فَلَمْ يَتْرُكْ مِنْهَا شَيْئًا، وَهُوَ فِي ذَلِكَ لَمْ يَتْرُكْ حَاجَةً وَلَا دَاجَةً إِلَّا أَتَاهَا، فَهَلْ لَهُ مِنْ تَوْبَةٍ؟ قَالَ رَسُولُ الرَّحْمَةِ: فَهَلْ أَسْلَمْتَ؟ قَالَ: أَمَّا أَنَا فَأَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَنَّكَ رَسُولُ اللَّهِ. قَالَ: نَعَمْ، تَفْعَلُ الْخَيْرَاتِ وَتَتْرُكُ السَّيِّئَاتِ، فَيَجْعَلُهُنَّ اللَّهُ لَكَ خَيْرَاتٍ كُلَّهُنَّ! قَالَ: وَغَدَرَاتِي؟ وَفَجَرَاتِي؟ قَالَ: وَغَدَرَاتُكَ <button type="button" class="term-btn" data-term="وغدراتي وفجراتي (١)" data-def="أخرجه الطبراني في المعجم الكبير (٧٢٣٥ - ٧/ ٣١٤). والحاجة والداجة: إتباع، أي لم يترك صغيرة ولا كبيرة من الذنوب إلا أتاها.">وَفَجَرَاتُكَ!!» (١)</button></p><div class="hadith-source">المعجم الكبير للطبراني</div></div>` },
        { tag: "الغفور", title: "هل نسيت؟ .. وفرح الله بتوبة عبده", type: "reading", html: `<h2>هل نسيت؟</h2><p>لماذا تعتقد أن ذنبك أعظم شيء في الوجود؟ هل نسيت أنّه الغفور الودود؟</p><p>هل نسيت أنّه يفرح بتوبتك؟</p><p>رأى الصحابة امرأة مذعورة في السبي تبحث عن ولدها، فلمّا رأته ضمّته وقبّلته حبا وشوقا وخوفا، فتعجّب الصحابة من</p><div class="hadith-box" data-role="hadith"><p>هذا الحب وهذا الفرح، فقال النبي ﷺ: «اللهُ أَشَدُّ فَرَحًا بِتَوْبَةِ عَبْدِهِ مِنْ هَذِهِ <button type="button" class="term-btn" data-term="الله أشد فرحا بتوبة عبده (١)" data-def="أخرجه مسلم في صحيحه (٢٧٤٤ - ٤/ ٢١٠٣).">بِوَلَدِهَا» (١)</button>!</p><div class="hadith-source">صحيح مسلم</div></div><p>ما الذي تنتظره؟ قل أستغفر الله الآن ..</p><div class="wisdom-pearl action-callout"><span class="wisdom-badge">✦ صرخة الاستغفار</span>قلها بقلبك وروحك ولسانك، حتى ذنوبك التي تريد أن تقنعك أنّ المغفرة مستحيلة عليها اجعلها تقول: أستغفر الله، رغمًا عنها، اصرخ بأستغفر الله في وجدانك، وأقسم من خلال صرختك تلك أنّ الغفور سيغفر لك، ليس لأنّك صرخت، بل لأنّه الغفور الودود.</div><p>أبو سفيان بن حرب، صفوان بن أميّة، عكرمة بن أبي جهل، عمرو بن العاص وغيرهم كثير، كانت ذنوبهم: شركًا بالله، ومحاربة للدين، وقتلًا للصحابة، ثم يغمرهم الغفور الرحيم بمغفرته ليكونوا صحابة! أتدري ماذا تعني كلمة (صحابة)؟ الصحابة تعني أفضل البشر بعد الأنبياء!</p><p>انظر ماذا فعلت المغفرة بعكرمة أو بصفوان أو بغيرهما؟ لقد حوّلته من: قاتل للصحابة؟ إلى: صحابي جليل!</p><p>الإحساس بالذنوب وهي تحيط بك يجعل روحك تئنّ، وأفكارك تميل إلى اللون الأسود، وكلماتك متوتّرة جدًا، فإذا ما اقتربتْ منها: أستغفر الله احترق الأنين والسواد والتوتّر.</p>` },
        { tag: "الغفور", title: "طوبى لمن وجد في كتابه استغفارا كثيرا", type: "reading", html: `<h2>طوبى ..</h2><p>يغفر سبحانه بـ: أستغفر الله ..</p><p>ويغفر سبحانه بالتوبة:</p><div class="quran-box" data-role="quran"><p>﴿إِلَّا الَّذِينَ تَابُوا مِن بَعْدِ ذَٰلِكَ وَأَصْلَحُوا فَإِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ﴾</p><div class="ayah-source">سورة آل عمران: ٨٩</div></div><p>ويغفر سبحانه بالحسنات: ﴿إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ﴾</p><div class="hadith-box" data-role="hadith"><p>ويغفر بالبلاء: «مَا يَزَالُ الْبَلَاءُ بِالْمُؤْمِنِ فِي نَفْسِهِ وَوَلَدِهِ وَمَالِهِ حَتَّى يَلْقَى اللَّهَ تَعَالَى وَمَا عَلَيْهِ <button type="button" class="term-btn" data-term="ما يزال البلاء بالمؤمن (١)" data-def="أخرجه الترمذي في سننه (٢٣٩٩ - ٤/ ٦٠٢).">خَطِيئَةٌ» (١)</button> ..</p><div class="hadith-source">سنن الترمذي</div></div><p>أتعلم ما الذي ينبغي أن تكثر منه في هذه الحياة؟ ألّا تملّ من ترداده؟ إنّه الاستغفار!! قال نبيك عليه الصلاة والسلام:</p><div class="hadith-box" data-role="hadith"><p>«طُوبَى لِمَنْ وَجَدَ فِي كِتَابِهِ اسْتِغْفَارًا <button type="button" class="term-btn" data-term="طوبى لمن وجد في كتابه استغفارا كثيرا (٢)" data-def="أخرجه ابن ماجه في سننه (٣٨١٨ - ٢/ ١٢٥٤).">كَثِيرًا» (٢)</button> ..</p><div class="hadith-source">سنن ابن ماجه</div></div><p>ستفرح فرحا خالدا بالأعداد الكبيرة لأستغفر الله في صحيفتك .. ستصرخ بأعلى صوت ﴿هَاؤُمُ اقْرَءُوا كِتَابِيَهْ﴾ ..</p>` },
        { tag: "الغفور", title: "لا تقنطوا ..", type: "reading", html: `<p>ستجد في <button type="button" class="term-btn" data-term="عرصات يوم القيامة" data-def="العرصات: الساحات الفسيحة الواسعة التي يقف فيها الخلائق للحساب يوم القيامة.">عرصات</button> يوم القيامة أصدقاءك فتفتح لهم كتابك المليء بالاستغفار وتقول: انظروا، لقد استجاب الله لهذه الاستغفارات الكثيرة فغفر لي!</p><p>لذلك فقد شُرع الاستغفار ليس بعد الذنب فقط! بل وبعد الطاعة!!</p><p>ألست تقول بعد الصلاة: أستغفر الله أستغفر الله أستغفر الله؟ حتى طاعاتك مليئة بالنقص الذي لا يرتقه إلا الاستغفار.</p><h2>لا تقنطوا ..</h2><p>الغفور سمّى نفسه بالغفور لأنّك بلا مغفرة ستحترق، ستلتهمك الغصص، ستشعر بالاختناق الحقيقي، ستدمن البكاء.</p><p>إذا ظننت أن ذنبك أعظم، وأن الشيخ الذي استفتيته في ذنبك لم يتصوّر بعدُ التفاصيل السوداء لتلك الخطيئة العظيمة، وأنّه أجابك على غير سؤالك، اسمع لربّك الذي يعلم كل ذنب سيقترفه عباده من لدن آدم وحتى قيام الساعة، يعلم بتفاصيل تلك الذنوب وخطواتها وشناعة أمرها:</p><div class="quran-box" data-role="quran"><p>﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ﴾</p><div class="ayah-source">سورة الزمر: ٥٣</div></div>` },
        { tag: "الغفور", title: "أعظم مشيئة!", type: "reading", html: `<p>هل انتهت الوساوس الآن؟ الذي قال هذا الكلام يعلم عندما أنزل القرآن أنك في يوم كذا ستذنب ذنب كذا ومع ذلك قال لك: ﴿يَغْفِرُ الذُّنُوبَ جَمِيعًا﴾ وذنبك لا شك من هذه الذنوب التي ليست أكبر من غفران الله ولا أعظم من رحمته سبحانه.</p><p>المهم هو أن تسبق (أستغفر الله) بالإقلاع عن الذنب، أن تتوقّف: ﴿فَإِنِ انتَهَوْا فَإِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ﴾.</p><p>كيف تقول: اغفر لي خطئي، وأنت عاكف على الخطأ؟ كيف تُمِسح معصيتك ثم تعود لكتابتها من جديد؟ توقّف .. لتصبح (أستغفر الله) صادقة، تستحق أن تُفتح لها أبواب السماء.</p><h2>أعظم مشيئة!</h2><p>الله سبحانه شاء لك أشياء كثيرة:</p><p>شاء وجودك فوُجدت، وشاء صحّتك فصرت صحيحا معافى، وشاءك عاقلا وها أنت تعقل ما تقرأ وتسمع، ولكن أتعلم ما هي أعظم مشيئة قد يمنّ الله بها عليك؟</p><p>- أن يغفر لك!!</p><div class="quran-box" data-role="quran"><p>﴿وَلِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ يَغْفِرُ لِمَن يَشَاءُ وَيُعَذِّبُ مَن يَشَاءُ وَاللَّهُ غَفُورٌ رَّحِيمٌ﴾</p><div class="ayah-source">سورة آل عمران: ١٢٩</div></div>` },
        { tag: "الغفور", title: "حال المغفور لهم", type: "reading", html: `<p>ما أعظمها من مشيئة هذه التي تجعلك مؤهلًا لدخول الجنّة برحمة الرحيم سبحانه!</p><div class="step-card"><span class="step-num">١</span><div class="step-content">المغفور لهم تنزل بهم الأمراض كغيرهم، ولكنّها لا تسلب ابتساماتهم ..</div></div><div class="step-card"><span class="step-num">٢</span><div class="step-content">المغفور لهم تصيبهم الضوائق المالية كغيرهم، ولكنّها لا تنكّس رؤوسهم ..</div></div><div class="step-card"><span class="step-num">٣</span><div class="step-content">المغفور لهم تدمع عيونهم، ولكنّهم لا ييأسون من <button type="button" class="term-btn" data-term="رَوح الله" data-def="رَوْح الله: فرجه ورحمته ورجاؤه.">رَوح الله</button> أبدا ..</div></div><p>ثم دع الهموم والأوجاع والأمراض جانبا:</p><p>المغفور لهم ينامون بالليل في طمأنينة، لأن أغرب توقّع هو أن يموتوا؟ وماذا لو ماتوا؟ إنّهم بلا ذنوب تجعل الموت شبحا مرعبًا!</p><p>بالله اقرأ، بل استشعر:</p><div class="quran-box" data-role="quran"><p>﴿وَمَن يَعْمَلْ سُوءًا أَوْ يَظْلِمْ نَفْسَهُ ثُمَّ يَسْتَغْفِرِ اللَّهَ يَجِدِ اللَّهَ غَفُورًا رَّحِيمًا﴾</p><div class="ayah-source">سورة النساء: ١١٠</div></div><p>ألست مشتاقا لأن تجد الله غفورا رحيما؟ استغفره إذن!!</p>` },
        { tag: "الغفور", title: "الأجمل .. ولا تندهش!", type: "reading", html: `<h2>الأجمل ..</h2><p>الغفور عَلِم أن الذنوب ستفسد عليك حياتك، ستقهر روحك، ستجعل الماء ذا نكهة غير مستساغة، والطعام غير هنيء، والليل وحشة، والنهار ملل، والأقارب جحيم، والأصدقاء شكوك، وتفاصيل الحياة وهم، والنوم اختناق، والوحدة بكاء، فقال لك:</p><div class="quran-box" data-role="quran"><p>﴿أَفَلَا يَتُوبُونَ إِلَى اللَّهِ وَيَسْتَغْفِرُونَهُ﴾</p><div class="ayah-source">سورة المائدة: ٧٤</div></div><p>أليس هذا أجمل بحالهم؟ ألم يملّوا الكُرُبات التي بعضها فوق بعض؟ ألم يشتاقوا للابتسام الذي يخرج من القلب؟ إذن لماذا لا يستغفرونه؟</p><h2>لا تندهش!</h2><div class="wisdom-pearl"><span class="wisdom-badge">✦ كرم الغفور</span>والغفور يغفر دائمًا، ويغفر بكرم، ويغفر ما لا يغفره البشر، ويغفر بإدهاش!</div><p>يغفر دائمًا:</p><p>فيغفر ما بين الصلاة والصلاة وما بين العمرة والعمرة وما بين رمضان ورمضان وما بين الحج والحج إذا ما اجتُنبت الكبائر!</p><p>فصارت بذلك حياة العبد كلها ما بين مغفرة ومغفرة، وعفو وعفو، وتجاوز وتجاوز!</p>` },
        { tag: "الغفور", title: "يغفر بكرم ويغفر بإدهاش", type: "reading", html: `<p>تخيّل: تصلّي الفجر، ثم تذهب إلى عملك فتندّ منك تجاوزات وذنوب -دون الكبائر- ثم تحسن الوضوء لصلاة الظهر وتصلي صلاة تامّة فما تقول: السلام عليكم ورحمة الله إلا وقد انغسلتَ من ذنوبك كلّها، وهكذا صلاة بعد صلاة! ماذا كنّا سنفعل لو لم يكن ربّنا غفورًا؟</p><div class="step-card"><span class="step-num">١</span><div class="step-content"><strong>ويغفر بكرم:</strong> فيغفر كل الذنوب بصيام يوم واحد في السنة! ويغفر كل الذنوب بأن تقول: سبحان الله وبحمده .. مئة مرّة! أي في دقيقتين تتساقط عنك ذنوب سبعين سنة! أفي الكرم مثل هذا؟</div></div><div class="step-card"><span class="step-num">٢</span><div class="step-content"><strong>ويغفر ما لا يغفره البشر:</strong> فيغفر ذنوب بغيّ كل حياتها ذنوب ومعاصٍ بأن سقت كلبًا ماء!</div></div><div class="step-card"><span class="step-num">٣</span><div class="step-content"><strong>ويغفر بإدهاش:</strong> فمن ذلك ما حصل لمن حضر غزوة بدر فقد اطّلع عليهم ربّهم وقال لهم: اعملوا ما شئتم فقد غفرت لكم!</div></div><p>كل الذنوب التي عملوها أو سيعملونها: مغفورة!</p>` },
        { tag: "الغفور", title: "حارثة بن سراقة والفردوس الأعلى", type: "reading", html: `<div class="hadith-box" data-role="hadith"><p>وكان ممن اطّلع الله عليه في غزوة بدر حارثة بن سراقة، غلام خرج معهم مساعدًا لا مقاتلًا، فكان في المعركة من النظّارة الذين يشاهدون المعركة من بعيد، فقام إلى حوض الماء ليشرب فأتاه <button type="button" class="term-btn" data-term="سهم غَرْب (١)" data-def="سهم غَرْب: سهم طائش لا يُدرى راميه. والحديث أخرجه البخاري في صحيحه (٢٨٠٩ - ٤/ ٢٠).">سهم غَرْب (طائش)</button> أصاب نحره فقضى عليه، فلما عاد النبي ﷺ إلى المدينة استقبلته أم حارثة فقالت له: يَا نَبِيَّ اللهِ أَلَا تُحَدِّثُنِي عَنْ حَارِثَةَ فَإِنْ كَانَ فِي الجَنَّةِ صَبَرْتُ، وَإِنْ كَانَ غَيْرَ ذَلِكَ اجْتَهَدْتُ عَلَيْهِ فِي البُكَاءِ، فَقَالَ النَّبِيُّ ﷺ: «يَا أُمَّ حَارِثَةَ إِنَّهَا جِنَانٌ فِي الجَنَّةِ، وَإِنَّ ابْنَكِ أَصَابَ الفِرْدَوْسَ الأَعْلَى»(١).</p><div class="hadith-source">صحيح البخاري</div></div><div class="wisdom-pearl academic-callout"><span class="wisdom-badge">✦ كلام الحافظ ابن كثير رحمه الله</span>قال ابن كثير: وفي هذا تنبيه عظيم على فضل أهل بدر، فإن هذا الذي لم يكن في <button type="button" class="term-btn" data-term="بُحيحة القتال" data-def="بُحيحة القتال وحومة الوغى: وسط المعركة ومعظمها وشدتها.">بُحيحة</button> القتال، ولا في حومة الوغى، بل كان من النظّارة من بعيد، وإنما أصابه سهم غرب، وهو يشرب من الحوض، ومع هذا أصاب بهذا الموقف الفردوس الأعلى ... فما ظنّك بمن كان واقفًا في نحر العدو».</div>` },
        { tag: "الغفور", title: "ابدأ عهدًا جديدًا مع الغفور", type: "reading", html: `<h2>ابدأ ..</h2><p>ابدأ عهدا جديدا مع اسم الغفور، افرح لأنّه يغفر الذنوب، وسارع في الاستغفار، وطلب هذه المغفرة باتباع أوامره واجتناب نواهيه:</p><div class="quran-box" data-role="quran"><p>﴿قُلْ إِن كُنتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ اللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ وَاللَّهُ غَفُورٌ رَّحِيمٌ﴾</p><div class="ayah-source">سورة آل عمران: ٣١</div></div><div class="heart-keepsake-card"><span class="heart-badge">مناجاة الغفور</span><p>اللهم اغفر ذنوبنا كلها، دقها وجلّها، أولها وآخرها، واجعلنا ممن يجدون في صحائفهم استغفارا كثيرا.</p></div><div class="ornament">❖ ✦ ❖</div>` },
        { tag: "الاسم العاشر", title: "القريب", type: "opener", html: `<div class="opener"><div class="letter-envelope-header"><span class="letter-seal">✦</span><span class="letter-envelope-title">الاسم العاشر</span></div><h1 class="chapter-opener">القريب</h1></div><div class="epigraph-box"><p>قال لي صديقي مرّة قبل أن يخرج من زيارتي في غرفتي بإسكان الجامعة: اكتب لي في هذه الورقة كلمة لأقرأها وأنا عائد إلى غرفتي، فكتبت له: إنّه يراك الآن .. أخبرني فيما بعد أنّه فُجع بها!!</p></div>` },
        { tag: "القريب", title: "مدخل: القريب .. ويا الله!", type: "reading", html: `<div class="reflection-card"><div class="reflection-card-title">✦ في ليالي الوحشة</div><p>أتشعر بالوحشة؟ هل خذلك صديقك الحميم؟ هل تحسّ أن بينك وبين أعز الناس حجابًا مستورًا، فلم يعد يفهمك كما كان من ذي قبل؟ هل روحك تئنّ شوقًا إلى حبيب تبثّ إليه <button type="button" class="term-btn" data-term="لواعجها" data-def="لواعج الشوق والحزن: حرقته وتوقّده في الصدر.">لواعجها</button>؟</p></div><p>ما رأيك أن تدع هذا الحبيب، وذلك الصديق، وتنصرف إلى الذي لا يجفو من أتاه مقتربًا؟</p><p>الله الذي هو أقرب إليك من حبل الوريد، والذي ستغدو حياتك أنسًا وسعادة معه، له اسم عظيم، موغل في الجمال، مكلل بالبهاء، اسم «القريب» .. فلنتعرّف على معاني هذا الاسم لنستشعر قربه منا، ولنتذوّق طعم مناجاته في ليالي الوحشة ..</p><h2>يا الله!</h2><p>في الوقت الذي يريدك أن تعلم أنّه على العرش استوى، يريدك أن تتيقّن أنّه أقرب إليك من حبل الوريد!</p><p>يسمع كلماتك، ويرى أفعالك، ولا تخفى عليه منك خافية.</p>` },
        { tag: "القريب", title: "اربعوا على أنفسكم .. ومن أجلك", type: "reading", html: `<div class="hadith-box" data-role="hadith"><p>دخل الرسول ﷺ المسجد فإذا بصحابته الكرام يدعون ربّهم بأصوات جهيرة مرتفعة، فقال: «<button type="button" class="term-btn" data-term="ارْبَعُوا عَلَى أَنْفُسِكُمْ (١)" data-def="اربعوا على أنفسكم: ارفقوا بها وخفضوا أصواتكم. والحديث أخرجه البخاري في صحيحه (٤٢٠٥ - ٥/ ١٣٣)، ومسلم في صحيحه (٢٧٠٤ - ٤/ ٢٠٧٦).">ارْبَعُوا عَلَى أَنْفُسِكُمْ</button>، فَإِنَّكُمْ لَا تَدْعُونَ أَصَمَّ وَلَا غَائِبًا، إِنَّكُمْ تَدْعُونَ سَمِيعًا قَرِيبًا»(١).</p><div class="hadith-source">متفق عليه</div></div><p>بمجرّد أن ينتهي العبد من الدعاء إذ بالإجابة تلوح، لأنّه قريب بدرجة لا يتصوّرها العقل!</p><div class="did-you-know-card"><span class="did-you-know-badge">✦ إبراهيم بن أدهم</span><p>تضيع دابّة أحدهم فيمشي مبهوتًا فيراه إبراهيم بن أدهم فيسأله فيقول: ضاعت دابّتي، فيقف إبراهيم ويقول: يا الله، لن أمشي خطوة حتى تعيد لهذا دابّته، فإذا بها تظهر من منحنى الطريق!</p></div><h2>من أجلك ..</h2><p>يخبرني صاحبي أنّه دخل المسجد وما زال أثر ماء الوضوء في أذنيه فاتّجه إلى الصف الأول مقابل جهاز التكييف مما جعل الهواء البارد يدخل إلى أذنيه على أثر الماء، بعد ساعة شعر ببداية ألم في أذنه، لم يفتح شفتيه وإنما قال بقلبه: يا الله، كان ذلك من أجلك، فإذا بالألم يرتفع هكذا بدون مقدّمات وبلا تدرّج!</p>` },
        { tag: "القريب", title: "أُبيّ بن كعب .. ودبيب النملة", type: "reading", html: `<p>أيّ قرب هذا الذي يعلم معه ما تحدّث به نفسك دون أن تحرّك به شفتيك؟</p><p>وأقرب ما تكون إليه وأنت ساجد، تتمتم بـ(سبحان ربي الأعلى)، فإذا بالسماوات تنفتح لتمتمتك، وإذا بالجبار يسمعك!</p><p>لا تتوهم أنّه بعيد، أو أنّه تخفى عليه منك خافية ..</p><div class="hadith-box" data-role="hadith"><p>يخرج رسول الله ﷺ في جوف الليل، ويذهب ليطرق باب أُبيّ بن كعب، فيخرج أُبيّ، فإذا برسول الله يخبره: أمرني الله أن أقرأ عليك الفاتحة، يقول أُبيّ بذهول: <button type="button" class="term-btn" data-term="وسمّاني؟ (١)" data-def="أخرج القصة البخاري في صحيحه (٤٩٦٠ - ٦/ ١٧٥)، ومسلم في صحيحه (٧٩٩ - ١/ ٥٥٠).">وسمّاني</button>؟ فيقول نعم، فيبكي أُبيّ!(١)</p><div class="hadith-source">متفق عليه</div></div><h2>دبيب النملة ..</h2><p>قريب من جميع خلقه، يراهم ويحميهم .. كيف يكون قيّوما على خلقه لو لم يكن قريبا منهم؟ كيف يكون ربًّا، إلا وهو قريب؟</p><div class="wisdom-pearl academic-callout"><span class="wisdom-badge">✦ تنزيه وتحقيق عقدي</span>وقربه سبحانه وتعالى قرب علم وقرب سمع وقرب بصر وقرب إحاطة، لا قرب ذات، لأنّ ذاته العليّة منزّهة عن مثل هذا القرب.</div>` },
        { tag: "القريب", title: "الثلث الأخير من الليل .. وقد سمع الله", type: "reading", html: `<div class="hadith-box" data-role="hadith"><p>من قربه أنّه ينزل كما صحّ عن نبيّنا محمد عليه الصلاة والسلام في الثلث الأخير من الليل إلى السماء الدنيا فيقول: «<button type="button" class="term-btn" data-term="هَلْ مِنْ سَائِلٍ (١)" data-def="أخرجه مسلم في صحيحه (٧٥٨ - ١/ ٥٢٢).">هَلْ مِنْ سَائِلٍ فَأُعْطِيَهُ</button>، هَلْ مِنْ دَاعٍ فَأُجِيبَهُ، هَلْ مِنْ مُسْتَغْفِرٍ فَأَغْفِرَ لَهُ»(١)</p><div class="hadith-source">صحيح مسلم</div></div><p>ومن قربه أنّه: يسمع دبيب النملة السوداء على <button type="button" class="term-btn" data-term="الصفاة الصمّاء" data-def="الصفاة الصمّاء: الصخرة الملساء الصلبة التي لا شق فيها.">الصفاة الصمّاء</button>، في الليلة الظلماء.</p><p>يقول تعالى:</p><div class="quran-box" data-role="quran"><p>﴿وَمَا تَسْقُطُ مِن وَرَقَةٍ إِلَّا يَعْلَمُهَا﴾</p><div class="ayah-source">سورة الأنعام: ٥٩</div></div><p>تخيّل عدد الأشجار، ثم عدد أوراقها، تخيّلها وهي تتناثر في فصل الخريف، يعلمها كلّها: يعلم عددها وأشكالها وأنواعها وكل شيء يخصّها!</p><p>تأتي امرأة تجادل في زوجها، وعائشة رضي الله عنها في طرف البيت تقول إنها تسمع كلمة وتغيب عنها كلمة، وبعد ذلك الجدل ينزل جبريل على محمد ﷺ أن:</p><div class="quran-box" data-role="quran"><p>﴿قَدْ سَمِعَ اللَّهُ قَوْلَ الَّتِي تُجَادِلُكَ فِي زَوْجِهَا وَتَشْتَكِي إِلَى اللَّهِ وَاللَّهُ يَسْمَعُ تَحَاوُرَكُمَا إِنَّ اللَّهَ سَمِيعٌ بَصِيرٌ﴾</p><div class="ayah-source">سورة المجادلة: ١</div></div><p>يا له من قرب عجيب، وعلم عظيم، وسمع محيط، وبصر نافذ ..</p>` },
        { tag: "القريب", title: "يراك الآن!", type: "reading", html: `<h2>يراك الآن!</h2><p>مُدّ يدك الآن، أمددتها؟ لقد رآها! يجب أن تؤمن بذلك!</p><div class="did-you-know-card"><span class="did-you-know-badge">✦ رسالة قصيرة</span><p>قال لي صديقي مرّة قبل أن يخرج من زيارتي في غرفتي بإسكان الجامعة: اكتب لي في هذه الورقة كلمة لأقرأها وأنا عائد إلى غرفتي، فكتبت له: إنّه يراك الآن، أخبرني فيما بعد أنّه فُجع بها!!</p></div><p>قربه يخيفك، يجب أن يخيفك .. وقربه يؤنسك، يجب أن يؤنسك .. وقربه يدفئك، يجب أن يدفئك .. وقربه يجعلك شجاعًا شامخًا بطلًا ..</p><p>استمع إليه وهو يهدّئ من رَوع موسى عليه السلام عندما أعلن خوفه من الذهاب إلى فرعون فقال له:</p><div class="quran-box" data-role="quran"><p>﴿إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَىٰ﴾</p><div class="ayah-source">سورة طه: ٤٦</div></div><p>هذا يكفي، كونه معهما أكبر حماية لهما ..</p><p>لأنه معهما يجب ألا يخافا من فرعون، يجب أن يكونا شجاعين بطلين شامخين.</p><div class="wisdom-pearl academic-callout"><span class="wisdom-badge">✦ معيّة الله في العقيدة</span>ومما قُرّر في كتب العقيدة أن لله معيّتين: معيّةً خاصة بأهل ولايته، وهي معيّة محبّة ونصرة وتوفيق، ومعيّة عامّة لجميع خلقه، وهي معيّة علم وسمع وبصر وإحاطة.</div>` },
        { tag: "القريب", title: "المعية الخاصة .. وابتسم", type: "reading", html: `<p>فكانت معيّته لموسى وهارون معيّة خاصة تقتضي النصرة والتوفيق، فكيف يخافان وقد وعدهما الله بنصرته وتوفيقه لهما؟</p><p>وكل من قام بما قام به موسى وهارون من الأمر بالمعروف والنهي عن المنكر على علم وهدى ستكون له معيّة من الله تعالى بحسب الإيمان الذي في قلبه وبحسب امتثاله لأمر ربه، لذلك فإن كل آمر بالحق ناهٍ عن الباطل تجد فيه من القوّة والشجاعة والثبات والتوفيق ما يجعلك تكاد تجزم أن المعيّة الخاصّة تحوطه وتؤيّده.</p><h2>ابتسم ..</h2><p>ومن أجلّ الآيات وأكثرها أنسًا في هذا الباب قول الحق:</p><div class="quran-box" data-role="quran"><p>﴿الَّذِي يَرَاكَ حِينَ تَقُومُ ۝ وَتَقَلُّبَكَ فِي السَّاجِدِينَ﴾</p><div class="ayah-source">سورة الشعراء: ٢١٨-٢١٩</div></div><p>فما هو مقدار الأنس الذي ستشعر به وأنت تقول: الله أكبر مصليًا لله .. إذا أخبرك سبحانه أن رؤية خاصّة ستستحقّها بهذا العمل، لأنه سبحانه يرى كل الخلق، الذي يقوم والذي لا يقوم، فدل هذا على أنّ رؤية القائم لله في صلاته رؤية خاصّة لا عامّة: رؤية فيها الحب والقبول والإجابة والمغفرة ..</p>` },
        { tag: "القريب", title: "ما أذن الله لشيء .. وأقرب إليك من حبل الوريد", type: "reading", html: `<p>قل مثل ذلك عن الحديث الذي في البخاري، قال رسول الله ﷺ:</p><div class="hadith-box" data-role="hadith"><p>«مَا أَذِنَ اللَّهُ لِشَيْءٍ مَا أَذِنَ لِنَبِيٍّ حَسَنِ الصَّوْتِ <button type="button" class="term-btn" data-term="يَتَغَنَّى بِالقُرْآنِ (١)" data-def="أخرجه البخاري في صحيحه (٧٤٨٢ - ٩/ ١٤١)، ومسلم في صحيحه (٧٩٢ - ١/ ٥٤٥).">يَتَغَنَّى بِالقُرْآنِ يَجْهَرُ بِهِ</button>»(١) والأذَن الاستماع ..</p><div class="hadith-source">متفق عليه</div></div><div class="wisdom-pearl academic-callout"><span class="wisdom-badge">✦ كلام الحافظ ابن كثير رحمه الله</span>يقول ابن كثير: «ومعناه أن الله تعالى ما استمع لشيء كاستماعه لقراءة نبي يجهر بقراءته ويحسنها، وذلك أنه يجتمع في قراءة الأنبياء طيب الصوت لكمال خلقهم وتمام الخشية، وذلك هو الغاية في ذلك، وهو سبحانه وتعالى يسمع أصوات العباد كلهم برهم وفاجرهم، كما قالت عائشة رضي الله عنها: «سبحان الذي وسع سمعه الأصوات» ولكن استماعه لقراءة عباده المؤمنين أعظم، كما قال تعالى: ﴿وَمَا تَكُونُ فِي شَأْنٍ وَمَا تَتْلُو مِنْهُ مِن قُرْآنٍ وَلَا تَعْمَلُونَ مِنْ عَمَلٍ إِلَّا كُنَّا عَلَيْكُمْ شُهُودًا إِذْ تُفِيضُونَ فِيهِ﴾ الآية، ثم استماعه لقراءة أنبيائه أبلغ».</div><p>إذا صفعتك المخاوف فابتسم، وتذكّر قربه منك سبحانه .. فكل الأشياء التي تخاف منها، ليست أقرب إليك منه!</p><p>وإذا التأمت حولك الخطوب فتفاءل! وشتتها بفكرة أنّه أقرب إليك من حبل الوريد!</p>` },
        { tag: "القريب", title: "سبحانك!", type: "reading", html: `<p>مما يذكره بعض الوعّاظ قديمًا: أن أحدهم كان مسافرًا في الصحراء فإذا بقاطع طريق حاملا سيفه يريد قتله، قال له: خذ مالي، فقال: لا، أريد أن أقتلك ثم آخذ مالك، فاستأذنه في ركعتين فأذن له: قال نسيت كل القرآن ولم أذكر إلا:</p><div class="quran-box" data-role="quran"><p>﴿أَمَّن يُجِيبُ الْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ السُّوءَ﴾</p><div class="ayah-source">سورة النمل: ٦٢</div></div><p>رددتها وما أنهيت الصلاة إلا وفارس لا أدري من أين ظهر يضرب ذلك الرجل ضربة بسيفه يطير منها رأسه!</p><h2>سبحانك!</h2><p>إنّه القريب، فقط حرّك شفتيك بذكره، تتفتّح أبواب السماوات لصوتك.</p><p>كان يونس عليه السلام في بطن الحوت ينادي:</p><div class="quran-box" data-role="quran"><p>﴿لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ﴾</p><div class="ayah-source">سورة الأنبياء: ٨٧</div></div><p>فكان الصوت الضعيف المنطلق من الظلمات الثلاث يخترق أجواز الفضاء لتسمعه ملائكة السماوات فتقول للرب سبحانه: «صوت معروف، من مكان غير معروف»!</p><div class="hadith-box" data-role="hadith"><p>يقول الله في الحديث القدسي: «<button type="button" class="term-btn" data-term="مَنْ ذَكَرَنِي فِي نَفْسِهِ (١)" data-def="أخرجه البخاري في صحيحه (٧٤٠٥ - ٩/ ١٢١)، ومسلم في صحيحه (٢٦٧٥ - ٤/ ٢٠٦١).">مَنْ ذَكَرَنِي فِي نَفْسِهِ</button>، ذَكَرْتُهُ فِي نَفْسِي، وَمَنْ ذَكَرَنِي فِي مَلَإٍ، ذَكَرْتُهُ فِي مَلَإٍ خَيْرٍ مِنْهُمْ»(١) لأنّه قريب .. فقط قل يا الله، يكون الرد بأن يَذكُرَ اسمك!</p><div class="hadith-source">حديث قدسي - متفق عليه</div></div>` },
        { tag: "القريب", title: "وصلت إليه ..", type: "reading", html: `<p>ما أجلّ أن تتخيّل أن ملك الملوك هذه اللحظة يقول اسمك! يقول: عبدي فلان بن فلان ذكرني!</p><p>الدنيا كلّها تافهة، لا تساوي مثل هذا التخيّل ..</p><div class="hadith-box" data-role="hadith"><p>وقربه هذا يزيد، فبالتوبة والإنابة والطاعات تزيد قربًا منه يقول في الحديث القدسي: «إِذَا تَقَرَّبَ مِنِّي شِبْرًا تَقَرَّبْتُ مِنْهُ <button type="button" class="term-btn" data-term="إِذَا تَقَرَّبَ مِنِّي شِبْرًا (١)" data-def="أخرجه البخاري في صحيحه (٧٤٠٥ - ٩/ ١٢١)، ومسلم في صحيحه (٢٦٧٥ - ٤/ ٢٠٦١).">ذِرَاعًا</button>، وَإِذَا تَقَرَّبَ مِنِّي ذِرَاعًا تَقَرَّبْتُ مِنْهُ بَاعًا»(١) فكل محاولة اقتراب منك إليه بالطاعة يعقبها اقتراب منه إليك بالقَبول والأفضال والنعم والعطايا والهبات.</p><div class="hadith-source">حديث قدسي - متفق عليه</div></div><h2>وصلت إليه ..</h2><p>ومن معاني قربه أنّه يريك في كل شيء من حولك معنى يذكّرك به:</p><p>فترى حكمته في دقّة تركيب مخلوقاته .. وترى قدرته في رفع سماواته بلا عمد .. وترى رحمته في إنزال المطر وإنبات الشجر .. وترى عظمته في شموخ الجبال ..</p>` },
        { tag: "القريب", title: "وفي كل شيء له آية", type: "reading", html: `<p>وترى عذابه في البراكين والزلازل والكوارث ..</p><p>يقول تعالى:</p><div class="quran-box" data-role="quran"><p>﴿سَنُرِيهِمْ آيَاتِنَا فِي الْآفَاقِ وَفِي أَنفُسِهِمْ حَتَّىٰ يَتَبَيَّنَ لَهُمْ أَنَّهُ الْحَقُّ﴾</p><div class="ayah-source">سورة فصلت: ٥٣</div></div><p>إذا أبصرت شيئا بعينيك فبصرك يذكرك بالبصير سبحانه .. وإذا سمعت همسا في دجى الليالي فسمعك يذكرك بالسميع سبحانه .. وإذا علمت شيئا من خفي العلم فعلمك يذكرك بالعليم سبحانه ..</p><div class="poetry-stanza"><div class="poetry-shatr">وفي كل شيء له آية</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">تدلّ على أنّه الواحد</div></div><div class="did-you-know-card"><span class="did-you-know-badge">✦ حكمة طفل</span><p>ذات مرّة كنت جالسًا مع مجموعة من الأبناء أحدثهم عن التفكر في خلق الله، فقال أحدهم: «إذا تفكّرتَ في مخلوقاته وصلتَ إليه»!! توقفت مندهشًا، شعرت أن هذا الطفل يفهم هذه المعاني أكثر منّا، وأنّه ينبغي أن أستمع إليه أكثر من أن يستمع إليّ!</p></div><p>قريب لا تحتاج حتى تصل إليه إلّا أن يخطر ببالك، أن تشعر بقربه، أن تحسّ بأنّه يراك، ثم تقول: يا الله ..</p>` },
        { tag: "القريب", title: "إذا سألوك ..", type: "reading", html: `<h2>إذا سألوك ..</h2><div class="quran-box" data-role="quran"><p>﴿وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ﴾</p><div class="ayah-source">سورة البقرة: ١٨٦</div></div><p>أي شخص يسألك عن الله فأوّل شيء تصف ربّك به هو أنّه قريب منه! النفوس مفطورة على عدم استعدادها لعبادة رب بعيد، لا يسمع دعاءها، ولا يرى حاجاتها، فمن أهم الصفات التي تبتدر بها الذي يريد التعرّف إلى الله أن تخبره أن ربّه «قريب» هكذا علّمك سبحانه أن تخبر عنه!</p><p>وهذا القرب علاوة على أنه يجعلك تحبّه، وتأنس به، وتخشاه، إلا أنه فوق ذلك يجعلك تدمن على استغفاره والتوبة إليه، فالقريب من جهة يستحق أن يُستغفر ويتاب إليه لأنّه بقربه اطلع على كل غدراتك وفجراتك، ومن جهة أخرى فهو قريب قربًا يجعل استغفارك وتوبتك ناجعة، فلن يغفر لك إلا من سمع استغفارك ولن يتوب عليك إلا من علم توبتك، فهو القريب المجيب، وبعد هذا تأمل قوله سبحانه:</p><div class="quran-box" data-role="quran"><p>﴿فَاسْتَغْفِرُوهُ ثُمَّ تُوبُوا إِلَيْهِ إِنَّ رَبِّي قَرِيبٌ مُّجِيبٌ﴾</p><div class="ayah-source">سورة هود: ٦١</div></div><div class="wisdom-pearl"><span class="wisdom-badge">✦ حياء من القريب</span>ومن نوادر التعابير التي تصيبك بالحياء من القريب سبحانه قول أحدهم: «ألا يستحق أن تحبّه؟ في اللحظة التي تغلق الباب على نفسك حتى تعصيَه، يُدخل لك الأكسجين من تحت الباب حتى لا تموت»!</div>` },
        { tag: "القريب", title: "من بين الأدخنة ..", type: "reading", html: `<p>وهذا القرب يقابله محاولة تقرّب من العبد إليه سبحانه:</p><div class="quran-box" data-role="quran"><p>﴿أُولَٰئِكَ الَّذِينَ يَدْعُونَ يَبْتَغُونَ إِلَىٰ رَبِّهِمُ الْوَسِيلَةَ أَيُّهُمْ أَقْرَبُ﴾</p><div class="ayah-source">سورة الإسراء: ٥٧</div></div><p>إنّه مضمار المسارعة، والمسابقة، والتي لا يكون قصارى رغبة العبد فيه أن يكون قريبًا بل أن يكون الأقرب!</p><h2>من بين الأدخنة ..</h2><p>وفي أجواء المحن التي تعيشها الأمة، ومن بين أدخنة الحروب المهلكة التي تمسّ أفئدة المؤمنين <button type="button" class="term-btn" data-term="باللأواء" data-def="اللأواء: الشدة والضيق والمحنة.">باللأواء</button>، يحتاج المؤمن هناك إلى ثلاث مستويات معرفية متعلّقة باسم القريب:</p><div class="step-card"><span class="step-num">١</span><div class="step-content"><strong>الأول:</strong> معرفة قربه سبحانه إيمانًا ويقينًا، ليريح نفسه من عناء الصراخ والاستنجاد بالبشر، فرب البشر قريب شهيد مطّلع، فيجد في القرآن آية تقول له بكل وضوح: ﴿إِنَّهُ سَمِيعٌ قَرِيبٌ﴾، فيلقي عند أعتابها حُرقات روحه المكلومة، وكل ما سبق يصب في خانة هذا المستوى المهم.</div></div><div class="step-card"><span class="step-num">٢</span><div class="step-content"><strong>الثاني:</strong> ومن بين لهيب القهر، ورؤية تفاصيل الشتات، وتهدّم البيوت، وموت الأنفس، وهلاك الثمرات، يريد رحمة، يبحث عن رحمة، يتمنى رحمة تنهي عذابات خذلان الإخوة، وطعنات الغدر المتوالية، فيقف عند قول الحق سبحانه: ﴿إِنَّ رَحْمَتَ اللَّهِ قَرِيبٌ مِّنَ الْمُحْسِنِينَ﴾ </div></div>` },
        { tag: "القريب", title: "ألا إن نصر الله قريب", type: "reading", html: `<p>يا الله! إذن ليس بين ذلك المجاهد المغوار الذي نذر روحه للجبار إلا ستار شفيف تلوح من خلفه <button type="button" class="term-btn" data-term="مخايل الإحسان" data-def="مخايل الشيء: علاماته وبوادره ودلائله.">مخايل الإحسان</button>، فقط يحتاج أن يجاهد في الأرض بطريقة ملائكية يشعر فيها أنّه يرى الله! فإن لم يكن يرى الله فإن الله يراه، فلا يطلق رصاصة إلا ولديه جواب عن لماذا وكيف ومتى أطلقها! ولا يزال العبد ينتقل من إحسان إلى إحسان، وتكون في المقابل رحمة الله أقرب إليه من غيره، حتى تغشاه الرحمة من كل مكان، تنتزعه من أدخنة الموت إلى سحائب الرضا.</p><div class="step-card"><span class="step-num">٣</span><div class="step-content"><strong>الثالث:</strong> وتطول الأيام، وتتوالى الزفرات، وتشتد البلاءات، ويُحكم الحصار من كل مكان، وعند ذلك تطلّ روح المجاهد على آية ثالثة يقول فيها الحق: ﴿أَلَا إِنَّ نَصْرَ اللَّهِ قَرِيبٌ﴾ فكما أنّه قريب سبحانه من عباده، وكما أن رحمته أيضًا قريبة من المحسنين منهم، يأتي النصر القريب من جند الله ﴿وَإِنَّ جُندَنَا لَهُمُ الْغَالِبُونَ﴾ فيربط الله بذلك على قلوب أضناها الانتظار، وأرهقها الاصطبار، فينتظرون هذا النصر القريب من ليل أو نهار.</div></div>` },
        { tag: "القريب", title: "الله .. ومناجاة القريب", type: "reading", html: `<h2>الله ..</h2><div class="poetry-stanza"><div class="poetry-shatr">الله .. واضطربت دموعي خشية</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">ارحم أنين الحبّ في دمعاتي</div></div><div class="poetry-stanza"><div class="poetry-shatr">الله .. والتهب الفؤاد حرائقًا</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">ارحم لهيب الحبّ في نبَضاتي</div><div class="poetry-shatr">الله .. واندفعت حروفي لهفة</div><div class="poetry-ornament">✦</div><div class="poetry-shatr">ارحم شعور الحبّ في أبياتي ..</div></div><p>وبعد هذه السياحة التفكرية في اسم الله القريب، أسأل الله أن يجعلنا ممن يستحضر قربه، ويعمل وفق ما يمليه هذا الاسم الأعظم من معاني الذل والإخبات والمراقبة والخشية، وطلب الرحمة والنصرة منه وحده ..</p><div class="heart-keepsake-card"><span class="heart-badge">مناجاة القريب</span><p>اللهم يا قريبا ممن دعاك ورجاك، اكتب لنا قُربًا من رحمتك وهدايتك، قُربًا تؤنسنا به، وتذهب عن أرواحنا وعثاءها، وتدخلنا به الجنّة.</p></div><div class="ornament">❖ ✦ ❖</div>` },
        { tag: "الخاتمة", title: "الخاتمة", type: "reading", html: `<div class="opener"><div class="letter-envelope-header"><span class="letter-seal">✦</span><span class="letter-envelope-title">مسك الختام</span></div><h1 class="chapter-opener">الخاتمة</h1></div><p class="drop-cap">وبعد .. فقد عرفتَ شيئا عن بعض أسمائه .. فعليكَ أن تتزوّد بمعرفة المزيد عنها وعن غيرها .. وأن تجعلها نبراس حياتك، وهداية قلبك، ونور أيامك .. لتحوز على سعادة الدنيا والآخرة ..</p><div class="heart-keepsake-card"><span class="heart-badge">رجاء المؤلف</span><p>ولي رجاء: إن خفف هذا الكتاب عنك ألمًا، أو رسم على ثغرك ابتسامة، أو غيّر حالك إلى الأحسن فلا تنس كاتبه، ومن أفاده، ومن أعانه، ووالديهم وجميع المسلمين من دعوة بظهر الغيب ..</p><p style="margin-top:0.6rem;">وصلى الله وسلم على سيدنا محمد ..</p></div><div class="author-signature">علي جابر الفيفي</div><div class="ornament">❖ ✦ ❖</div>` },
        { tag: "المحتويات", title: "فهرس الكتاب (١) — المقدمة والصمد", type: "reading", html: `<h2>المحتويات (١ / ٦)</h2><div class="book-table-wrap"><table class="book-table"><thead><tr><th>الموضوع</th><th>الصفحة</th></tr></thead><tbody><tr class="toc-row" onclick="window.goToPage(0)"><td>غلاف الكتاب</td><td class="toc-page-num">١</td></tr><tr class="toc-row" onclick="window.goToPage(1)"><td>الإهداء</td><td class="toc-page-num">٢</td></tr><tr class="toc-row" onclick="window.goToPage(2)"><td>استفتاح: لأنك الله</td><td class="toc-page-num">٣</td></tr><tr class="toc-row" onclick="window.goToPage(3)"><td><strong>مُقدّمة</strong></td><td class="toc-page-num">٤</td></tr><tr class="toc-row" onclick="window.goToPage(6)"><td><strong>الصَّمَد</strong></td><td class="toc-page-num">٧</td></tr><tr class="toc-row" onclick="window.goToPage(7)"><td>في ظلال الصَّمَديّة</td><td class="toc-page-num">٨</td></tr><tr class="toc-row" onclick="window.goToPage(9)"><td>أمواج ..</td><td class="toc-page-num">١٠</td></tr><tr class="toc-row" onclick="window.goToPage(10)"><td>أفكار الزيف</td><td class="toc-page-num">١١</td></tr><tr class="toc-row" onclick="window.goToPage(11)"><td>الكواكب</td><td class="toc-page-num">١٢</td></tr><tr class="toc-row" onclick="window.goToPage(12)"><td>وتنساه ..</td><td class="toc-page-num">١٣</td></tr><tr class="toc-row" onclick="window.goToPage(14)"><td>اصمد إليه</td><td class="toc-page-num">١٥</td></tr><tr class="toc-row" onclick="window.goToPage(15)"><td>البوصلة</td><td class="toc-page-num">١٦</td></tr><tr class="toc-row" onclick="window.goToPage(16)"><td>فرّغ قلبك من غيره</td><td class="toc-page-num">١٧</td></tr><tr class="toc-row" onclick="window.goToPage(18)"><td>خطوات</td><td class="toc-page-num">١٩</td></tr><tr class="toc-row" onclick="window.goToPage(19)"><td>شموخ ..</td><td class="toc-page-num">٢٠</td></tr><tr class="toc-row" onclick="window.goToPage(20)"><td>حقيقة ..</td><td class="toc-page-num">٢١</td></tr></tbody></table></div>` },
        { tag: "المحتويات", title: "فهرس الكتاب (٢) — الحفيظ واللطيف", type: "reading", html: `<h2>المحتويات (٢ / ٦)</h2><div class="book-table-wrap"><table class="book-table"><thead><tr><th>الموضوع</th><th>الصفحة</th></tr></thead><tbody><tr class="toc-row" onclick="window.goToPage(22)"><td><strong>الحفيظ</strong></td><td class="toc-page-num">٢٣</td></tr><tr class="toc-row" onclick="window.goToPage(23)"><td>أيها القلب اطمئنّ ..</td><td class="toc-page-num">٢٤</td></tr><tr class="toc-row" onclick="window.goToPage(25)"><td>طرقات الزيغ!</td><td class="toc-page-num">٢٦</td></tr><tr class="toc-row" onclick="window.goToPage(26)"><td>وننسى الله!</td><td class="toc-page-num">٢٧</td></tr><tr class="toc-row" onclick="window.goToPage(28)"><td>المعقّبات</td><td class="toc-page-num">٢٩</td></tr><tr class="toc-row" onclick="window.goToPage(29)"><td>ما بين القوسين ..</td><td class="toc-page-num">٣٠</td></tr><tr class="toc-row" onclick="window.goToPage(30)"><td>قارورة ..</td><td class="toc-page-num">٣١</td></tr><tr class="toc-row" onclick="window.goToPage(32)"><td>أعظم وأكثر وأكبر</td><td class="toc-page-num">٣٣</td></tr><tr class="toc-row" onclick="window.goToPage(33)"><td>يدافع عنك ..</td><td class="toc-page-num">٣٤</td></tr><tr class="toc-row" onclick="window.goToPage(35)"><td>وديان السباع</td><td class="toc-page-num">٣٦</td></tr><tr class="toc-row" onclick="window.goToPage(37)"><td>أنا الفقير</td><td class="toc-page-num">٣٨</td></tr><tr class="toc-row" onclick="window.goToPage(38)"><td>يا غلام ..</td><td class="toc-page-num">٣٩</td></tr><tr class="toc-row" onclick="window.goToPage(40)"><td>اختناق</td><td class="toc-page-num">٤١</td></tr><tr class="toc-row" onclick="window.goToPage(42)"><td><strong>اللَّطيف</strong></td><td class="toc-page-num">٤٣</td></tr><tr class="toc-row" onclick="window.goToPage(43)"><td>خفيّ الألطاف</td><td class="toc-page-num">٤٤</td></tr><tr class="toc-row" onclick="window.goToPage(45)"><td>نسيم اللطف</td><td class="toc-page-num">٤٦</td></tr><tr class="t       };
      resetTargets();
      requestAnimationFrame(() => { resetTargets(); setTimeout(resetTargets, 16); });
    }

    function closeTermPopover() {
      if (termPopover) termPopover.classList.remove("open");
      activePageArticle.querySelectorAll(".term-btn.active-term").forEach(b => b.classList.remove("active-term"));
    }
    if (termPopoverClose) termPopoverClose.addEventListener("click", closeTermPopover);

    activePageArticle.addEventListener("click", function(e) {
      const btn = e.target.closest(".term-btn");
      if (!btn) { closeTermPopover(); return; }
      e.stopPropagation();
      const term = btn.getAttribute("data-term") || btn.textContent || "بيان المعنى";
      const def = btn.getAttribute("data-def") || "";
      if (!def) return;
      activePageArticle.querySelectorAll(".term-btn.active-term").forEach(b => b.classList.remove("active-term"));
      btn.classList.add("active-term");
      termPopoverTitle.textContent = "✦ " + term.trim();
      termPopoverBody.textContent = def.trim();
      termPopover.classList.add("open");
    });

    function animateHorizontalFlip(direction) {
      if (!pageCanvas || !direction) return;
      pageCanvas.classList.remove("flip-next", "flip-prev");
      void pageCanvas.offsetWidth;
      pageCanvas.classList.add(direction > 0 ? "flip-next" : "flip-prev");
    }

    function renderPage(index, highlightQuery, flipDirection) {
      const total = BOOK_DATA.pages.length;
      if (index < 0) index = 0;
      if (index >= total) index = total - 1;
      const dir = flipDirection !== undefined ? flipDirection : (index > currentPageIndex ? 1 : (index < currentPageIndex ? -1 : 0));
      currentPageIndex = index; window.currentPageIndex = index; window.currentPage = index;
      window.__maktabatiLastSavedPage = index; window.__maktabatiFallbackPage = index;
      closeTermPopover(); bookStage.scrollTop = 0; if (pageCanvas) pageCanvas.scrollTop = 0; window.scrollTo(0, 0); forceResetScrollToTop();
      const page = BOOK_DATA.pages[index];
      activePageArticle.innerHTML = page.html;
      if (dir !== 0) animateHorizontalFlip(dir);
      pageCounter.textContent = (index + 1) + " / " + total;
      btnPrevPage.disabled = (index === 0);
      btnNextPage.disabled = (index === total - 1);

      if (page.type === "cover" || page.type === "opener" || index === 0 || activePageArticle.querySelector("h1")) {
        runningHeader.hidden = true;
      } else {
        const cleanTag = (page.tag || "").trim();
        const cleanTitle = (page.title || "").trim();
        const isSameAsBook = !cleanTitle || cleanTitle === (BOOK_DATA.title || "").trim();
        const pageH2 = activePageArticle.querySelector("h2");
        const h2Text = pageH2 ? (pageH2.textContent || "").trim() : "";
        const effectiveTitle = (cleanTitle && cleanTitle !== h2Text && !isSameAsBook) ? cleanTitle : "";
        const headerLabel = (cleanTag && effectiveTitle && cleanTag !== effectiveTitle) ? (cleanTag + " • " + effectiveTitle) : (effectiveTitle || cleanTag);
        if (headerLabel && headerLabel !== (BOOK_DATA.title || "").trim()) {
          runningHeader.hidden = false;
          runningHeaderTag.textContent = headerLabel;
        } else {
          runningHeader.hidden = true;
        }
      }

      bookmarkBtn.classList.toggle("bookmarked", savedBookmarks.includes(index));
      if (highlightQuery) applyCalmPageSearchHighlight(highlightQuery);
      else forceResetScrollToTop();
      try { localStorage.setItem(STORAGE_PREFIX + "last_page", String(index)); } catch (e) {}
      if (window.MaktabatiBridge && window.MaktabatiBridge.onPageChanged) {
        window.MaktabatiBridge.onPageChanged(index + 1, total);
      }
    }

    window.goToPage = function(idx) { renderPage(idx); };
    window.nextPage = function() {
      const now = Date.now();
      if (window.__maktabatiLastPageTurnAt && (now - window.__maktabatiLastPageTurnAt) < 200) return;
      if (currentPageIndex < BOOK_DATA.pages.length - 1) {
        window.__maktabatiLastPageTurnAt = now;
        renderPage(currentPageIndex + 1, null, 1);
      }
    };
    window.prevPage = function() {
      const now = Date.now();
      if (window.__maktabatiLastPageTurnAt && (now - window.__maktabatiLastPageTurnAt) < 200) return;
      if (currentPageIndex > 0) {
        window.__maktabatiLastPageTurnAt = now;
        renderPage(currentPageIndex - 1, null, -1);
      }
    };

    window.__maktabatiSetFluidZoom = function(zoomPct) {
      const pct = Math.max(60, Math.min(250, Math.round(Number(zoomPct) || 100)));
      currentZoomPct = pct;
      const scale = pct / 100;
      const root = document.documentElement;
      root.style.setProperty("--reader-font", (21 * scale).toFixed(1) + "px");
      root.style.setProperty("--reader-font-size", pct + "%");
      root.style.setProperty("--font-scale", String(scale));
      if (zoomPctLabel) zoomPctLabel.textContent = pct + "%";
      try { localStorage.setItem("maktabati_fluid_zoom_pct", String(pct)); } catch (e) {}
    };
    if (btnZoomIn) btnZoomIn.addEventListener("click", () => window.__maktabatiSetFluidZoom(currentZoomPct + 10));
    if (btnZoomOut) btnZoomOut.addEventListener("click", () => window.__maktabatiSetFluidZoom(currentZoomPct - 10));
    if (zoomPctLabel) zoomPctLabel.addEventListener("click", () => window.__maktabatiSetFluidZoom(100));

    (function initTouchGestures() {
      if (!bookStage) return;
      let startX = 0, startY = 0, startTime = 0, isPinching = false, initialPinchDist = 0, initialPinchZoom = 100;
      const getTouchDist = (t1, t2) => Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      bookStage.addEventListener("touchstart", function(e) {
        if (e.touches.length === 2) {
          isPinching = true; initialPinchDist = getTouchDist(e.touches[0], e.touches[1]); initialPinchZoom = currentZoomPct;
        } else if (e.touches.length === 1) {
          isPinching = false; startX = e.touches[0].clientX; startY = e.touches[0].clientY; startTime = Date.now();
        }
      }, { passive: true });
      bookStage.addEventListener("touchmove", function(e) {
        if (isPinching && e.touches.length === 2 && initialPinchDist > 20) {
          window.__maktabatiSetFluidZoom(initialPinchZoom * (getTouchDist(e.touches[0], e.touches[1]) / initialPinchDist));
        }
      }, { passive: true });
      bookStage.addEventListener("touchend", function(e) {
        if (isPinching) { if (e.touches.length < 2) isPinching = false; return; }
        if (!e.changedTouches || e.changedTouches.length !== 1) return;
        const target = e.target;
        if (target && target.closest(".book-table-wrap, .term-btn, .term-popover, button, input")) return;
        const dx = e.changedTouches[0].clientX - startX, dy = e.changedTouches[0].clientY - startY, dt = Date.now() - startTime;
        if (dt < 550 && Math.abs(dx) > 68 && Math.abs(dx) > Math.abs(dy) * 1.85) {
          if (dx > 0) window.nextPage(); else window.prevPage();
        }
      }, { passive: true });
    })();

    bookmarkBtn.addEventListener("click", function() {
      const idx = currentPageIndex;
      if (savedBookmarks.includes(idx)) savedBookmarks = savedBookmarks.filter(i => i !== idx);
      else savedBookmarks.push(idx);
      try { localStorage.setItem(STORAGE_PREFIX + "bookmarks", JSON.stringify(savedBookmarks)); } catch (e) {}
      bookmarkBtn.classList.toggle("bookmarked", savedBookmarks.includes(idx));
    });

    let tocBuilt = false;
    function buildTocPanel() {
      if (tocBuilt) return;
      const parts = [];
      if (Array.isArray(BOOK_DATA.toc) && BOOK_DATA.toc.length > 0) {
        for (let i = 0; i < BOOK_DATA.toc.length; i++) {
          const item = BOOK_DATA.toc[i];
          const targetIdx = Math.max(0, (Number(item.page) || 1) - 1);
          const cls = item.isPart ? "toc-item toc-part" : "toc-item";
          parts.push(`<div class="${cls}" onclick="window.goToPage(${targetIdx}); tocPanel.classList.remove('open');"><span>${item.title}</span><small dir="ltr">${targetIdx + 1}</small></div>`);
        }
      } else {
        let lastSig = "";
        for (let idx = 0; idx < BOOK_DATA.pages.length; idx++) {
          const p = BOOK_DATA.pages[idx];
          const cleanTag = (p.tag || "").trim();
          const cleanTitle = (p.title || ("صفحة " + (idx + 1))).trim().slice(0, 45);
          const sig = (cleanTag + "|" + cleanTitle).toLowerCase();
          const isOpener = (p.type === "opener" || p.type === "cover" || idx === 0);
          if (idx > 0 && !isOpener && sig === lastSig) continue;
          lastSig = sig;
          const cls = isOpener ? "toc-item toc-part" : "toc-item";
          const showTag = cleanTag && cleanTag !== cleanTitle && !cleanTitle.startsWith(cleanTag);
          const label = showTag ? (cleanTag + " • " + cleanTitle) : cleanTitle;
          parts.push(`<div class="${cls}" onclick="window.goToPage(${idx}); tocPanel.classList.remove('open');"><span>${label}</span><small dir="ltr">${idx + 1}</small></div>`);
        }
      }
      tocPanelList.innerHTML = parts.join("");
      tocBuilt = true;
    }

    tocBtn.addEventListener("click", function() { buildTocPanel(); tocPanel.classList.add("open"); });
    tocClose.addEventListener("click", function() { tocPanel.classList.remove("open"); });
    tocPanel.addEventListener("click", function(e) { if (e.target === tocPanel) tocPanel.classList.remove("open"); });

    searchOpen.addEventListener("click", function() { searchPanel.classList.add("open"); setTimeout(() => searchInput.focus(), 80); });
    searchClose.addEventListener("click", function() { searchPanel.classList.remove("open"); });
    searchPanel.addEventListener("click", function(e) { if (e.target === searchPanel) searchPanel.classList.remove("open"); });
    searchClearBtn.addEventListener("click", function() { searchInput.value = ""; searchClearBtn.hidden = true; executeBookSearch(); searchInput.focus(); });

    function normalizeArabicWithMap(text) {
      if (!text) return { normalized: "", map: [] };
      const tashkeelRegex = /[\u064B-\u065F\u0670\u06D6-\u06EDـ]/;
      let normalized = ""; const map = [];
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (tashkeelRegex.test(ch)) continue;
        let c = ch;
        if (c === "أ" || c === "إ" || c === "آ") c = "ا";
        else if (c === "ى") c = "ي";
        else if (c === "ة") c = "ه";
        normalized += c.toLowerCase(); map.push(i);
      }
      return { normalized, map };
    }

    function extractPagePlainText(html) {
      if (!html) return "";
      return html.replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/&quot;/g, "\"").replace(/&apos;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
    }

    searchInput.addEventListener("input", function() {
      searchClearBtn.hidden = (searchInput.value.trim().length === 0);
      executeBookSearch();
    });

    function executeBookSearch() {
      const rawQuery = searchInput.value.trim();
      if (!rawQuery || rawQuery.length < 2) {
        searchStatus.textContent = "اكتب كلمة للبحث في جميع صفحات الكتاب...";
        searchResults.innerHTML = ""; return;
      }
      const qNorm = normalizeArabicWithMap(rawQuery).normalized;
      const hits = [];
      for (let i = 0; i < BOOK_DATA.pages.length; i++) {
        const page = BOOK_DATA.pages[i];
        const plain = extractPagePlainText(page.html);
        const { normalized, map } = normalizeArabicWithMap(plain);
        let searchPos = 0, matchCount = 0;
        while (true) {
          const matchIdx = normalized.indexOf(qNorm, searchPos);
          if (matchIdx === -1) break;
          matchCount++;
          if (matchCount <= 2) {
            const startOrig = map[matchIdx] || 0;
            const endNorm = matchIdx + qNorm.length - 1;
            const endOrig = (map[endNorm] !== undefined ? map[endNorm] + 1 : startOrig + rawQuery.length);
            const snippetStart = Math.max(0, startOrig - 40), snippetEnd = Math.min(plain.length, endOrig + 40);
            const prefix = (snippetStart > 0 ? "..." : "") + plain.substring(snippetStart, startOrig);
            const matchText = plain.substring(startOrig, endOrig);
            const suffix = plain.substring(endOrig, snippetEnd) + (snippetEnd < plain.length ? "..." : "");
            hits.push({ pageIndex: i, pageNumber: i + 1, title: page.title || ("صفحة " + (i + 1)), tag: page.tag || "", snippet: prefix + `<mark class="search-hit-mark">${matchText}</mark>` + suffix });
          }
          searchPos = matchIdx + Math.max(1, qNorm.length);
          if (hits.length >= 40) break;
        }
        if (hits.length >= 40) break;
      }
      if (hits.length === 0) {
        searchStatus.textContent = `لا توجد نتائج مطابقة لـ «${rawQuery}»`;
        searchResults.innerHTML = "";
      } else {
        searchStatus.textContent = `تم العثور على ${hits.length} نتيجة:`;
        searchResults.innerHTML = hits.map(hit => `<div class="search-result" onclick="selectSearchResult(${hit.pageIndex}, '${rawQuery.replace(/['"\\]/g, "")}')"><div class="search-result-head"><strong>${hit.tag ? hit.tag + " • " : ""}${hit.title}</strong><span class="search-result-page">${hit.pageNumber}</span></div><small>${hit.snippet}</small></div>`).join("");
      }
    }

    window.selectSearchResult = function(pageIndex, query) {
      searchPanel.classList.remove("open");
      renderPage(pageIndex, query);
    };

    function applyCalmPageSearchHighlight(query) {
      if (!query || query.length < 2) return;
      const { normalized: qNorm } = normalizeArabicWithMap(query);
      function traverse(node) {
        if (node.nodeType === 3) {
          const text = node.nodeValue;
          const { normalized, map } = normalizeArabicWithMap(text);
          const idx = normalized.indexOf(qNorm);
          if (idx !== -1) {
            const startOrig = map[idx], endNorm = idx + qNorm.length - 1;
            const endOrig = map[endNorm] !== undefined ? map[endNorm] + 1 : startOrig + query.length;
            const span = document.createElement("span");
            if (startOrig > 0) span.appendChild(document.createTextNode(text.substring(0, startOrig)));
            const mark = document.createElement("mark");
            mark.className = "page-search-highlight"; mark.textContent = text.substring(startOrig, endOrig);
            span.appendChild(mark);
            if (endOrig < text.length) span.appendChild(document.createTextNode(text.substring(endOrig)));
            node.parentNode.replaceChild(span, node);
            mark.scrollIntoView({ behavior: "smooth", block: "center" });
            return true;
          }
        } else if (node.nodeType === 1 && node.childNodes && !["SCRIPT", "STYLE", "BUTTON"].includes(node.tagName)) {
          for (let i = 0; i < node.childNodes.length; i++) {
            if (traverse(node.childNodes[i])) return true;
          }
        }
        return false;
      }
      traverse(activePageArticle);
    }

    window.__maktabatiSetThemeMode = function(mode) {
      const m = String(mode || "").toUpperCase();
      const root = document.documentElement;
      if (m === "NIGHT" || m === "DARK") {
        root.setAttribute("data-theme", "night");
        root.style.colorScheme = "dark";
      } else if (m === "SEPIA") {
        root.setAttribute("data-theme", "sepia");
        root.style.colorScheme = "light";
      } else {
        root.setAttribute("data-theme", "original");
        root.style.colorScheme = "light";
      }
      try { localStorage.setItem("maktabati_theme_mode", m); } catch (e) {}
    };

    document.addEventListener("DOMContentLoaded", function() {
      try {
        const savedTheme = localStorage.getItem("maktabati_theme_mode");
        if (savedTheme) window.__maktabatiSetThemeMode(savedTheme);
        else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          window.__maktabatiSetThemeMode("NIGHT");
        }
      } catch (e) {}
      try { const savedZoom = localStorage.getItem("maktabati_fluid_zoom_pct"); if (savedZoom) window.__maktabatiSetFluidZoom(savedZoom); } catch (e) {}
      let startPage = 0;
      try { const lp = localStorage.getItem(STORAGE_PREFIX + "last_page"); if (lp !== null) startPage = parseInt(lp, 10) || 0; } catch (e) {}
      renderPage(startPage, null, 0);
    });
  </script>
</body>
</html>
