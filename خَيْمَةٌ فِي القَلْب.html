function chapterTitleAt(index) {
  for (let n = index; n >= 0; n--) {
    const item = BOOK_DATA.pages[n];
    if (item.type === "chapter-opener") return item.title || item.chapterNumber || "";
    if (item.type === "reading" && item.chapterTag) return item.chapterTag;
  }
  return "";
}

function isSectionOpening(index, page) {
  if (!page.sectionTitle) return false;
  const previous = BOOK_DATA.pages[index - 1];
  return !previous || previous.type !== "reading" || previous.sectionTitle !== page.sectionTitle;
}

function updateRunningHeader(index, page) {
  const header = $("runningHeader");
  const label = $("runningHeaderText");
  const visible = page.type === "reading" || page.type === "chapter-opener";
  const title = chapterTitleAt(index);
  header.hidden = !visible || !title;
  label.textContent = title;
}

// =========================================================================
// محرك التطبيع والبحث العربي الشامل (تجاهل التشكيل، تطابق الهمزات والألفات والتاء المربوطة والياء)
// =========================================================================
const ARABIC_DIACRITICS_RE = /[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g;

function normalizeArabicChar(ch) {
  if (ch >= "\u064B" && ch <= "\u065F") return "";
  if (ch === "\u0670" || ch === "\u0640" || (ch >= "\u0610" && ch <= "\u061A") || (ch >= "\u06D6" && ch <= "\u06ED")) return "";
  if (ch === "أ" || ch === "إ" || ch === "آ" || ch === "ٱ") return "ا";
  if (ch === "ؤ") return "و";
  if (ch === "ئ" || ch === "ى") return "ي";
  if (ch === "ة") return "ه";
  return ch.toLowerCase();
}

function normalizeArabicWithMap(rawStr) {
  const src = String(rawStr || "");
  let normStr = "";
  const map = [];
  let prevWasSpace = false;
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (/\s/.test(ch)) {
      if (!prevWasSpace && normStr.length > 0) {
        normStr += " ";
        map.push(i);
        prevWasSpace = true;
      }
      continue;
    }
    const n = normalizeArabicChar(ch);
    if (!n) continue;
    prevWasSpace = false;
    for (let k = 0; k < n.length; k++) {
      normStr += n[k];
      map.push(i);
    }
  }
  if (normStr.endsWith(" ")) {
    normStr = normStr.slice(0, -1);
    map.pop();
  }
  return { normStr, map, src };
}

const norm = s => normalizeArabicWithMap(s).normStr;

function resolveOrigEndIndex(src, startOrigIdx) {
  let end = startOrigIdx + 1;
  while (end < src.length && ARABIC_DIACRITICS_RE.test(src[end])) {
    ARABIC_DIACRITICS_RE.lastIndex = 0;
    end++;
  }
  ARABIC_DIACRITICS_RE.lastIndex = 0;
  return end;
}

function highlightMatchInVocalizedText(rawText, normQuery) {
  if (!normQuery) return esc(rawText);
  const { normStr, map, src } = normalizeArabicWithMap(rawText);
  const pos = normStr.indexOf(normQuery);
  if (pos < 0) return esc(src);
  const origStart = map[pos];
  const lastNormIdx = Math.min(map.length - 1, pos + normQuery.length - 1);
  const origEnd = resolveOrigEndIndex(src, map[lastNormIdx]);
  return esc(src.slice(0, origStart)) +
    '<mark class="search-hit-mark">' + esc(src.slice(origStart, origEnd)) + '</mark>' +
    esc(src.slice(origEnd));
}

function buildSnippetWithHighlight(rawText, normQuery) {
  const { normStr, map, src } = normalizeArabicWithMap(rawText);
  const pos = normStr.indexOf(normQuery);
  if (pos < 0) return null;
  const origStart = map[pos];
  const lastNormIdx = Math.min(map.length - 1, pos + normQuery.length - 1);
  const origEnd = resolveOrigEndIndex(src, map[lastNormIdx]);

  let sliceStart = Math.max(0, origStart - 52);
  let sliceEnd = Math.min(src.length, origEnd + 78);
  if (sliceStart > 0) {
    const spaceAfter = src.indexOf(" ", sliceStart);
    if (spaceAfter > 0 && spaceAfter < origStart) sliceStart = spaceAfter + 1;
  }
  if (sliceEnd < src.length) {
    const spaceBefore = src.lastIndexOf(" ", sliceEnd);
    if (spaceBefore > origEnd) sliceEnd = spaceBefore;
  }

  const prefix = sliceStart > 0 ? "… " : "";
  const suffix = sliceEnd < src.length ? " …" : "";
  const before = esc(src.slice(sliceStart, origStart));
  const matched = esc(src.slice(origStart, origEnd));
  const after = esc(src.slice(origEnd, sliceEnd));

  return {
    snippetHtml: prefix + before + '<mark class="search-hit-mark">' + matched + '</mark>' + after + suffix,
    dedupKey: normStr.slice(Math.max(0, pos - 20), Math.min(normStr.length, pos + normQuery.length + 20))
  };
}

function applyCalmPageSearchHighlight(normQuery) {
  if (!normQuery) return;
  const canvas = $("pageCanvas");
  if (!canvas) return;
  const walker = document.createTreeWalker(canvas, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const pTag = node.parentElement && node.parentElement.tagName;
      if (pTag === "SCRIPT" || pTag === "STYLE" || pTag === "BUTTON" || pTag === "MARK") return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const textNodes = [];
  while (walker.nextNode()) textNodes.push(walker.currentNode);

  let firstMark = null;
  for (let i = 0; i < textNodes.length; i++) {
    const tNode = textNodes[i];
    const raw = tNode.nodeValue;
    const { normStr, map, src } = normalizeArabicWithMap(raw);
    const pos = normStr.indexOf(normQuery);
    if (pos < 0) continue;

    const origStart = map[pos];
    const lastNormIdx = Math.min(map.length - 1, pos + normQuery.length - 1);
    const origEnd = resolveOrigEndIndex(src, map[lastNormIdx]);

    const frag = document.createDocumentFragment();
    if (origStart > 0) frag.appendChild(document.createTextNode(src.slice(0, origStart)));
    const mark = document.createElement("mark");
    mark.className = "page-search-highlight";
    mark.textContent = src.slice(origStart, origEnd);
    frag.appendChild(mark);
    if (origEnd < src.length) frag.appendChild(document.createTextNode(src.slice(origEnd)));
    if (tNode.parentNode) {
      tNode.parentNode.replaceChild(frag, tNode);
      if (!firstMark) firstMark = mark;
    }
  }
  if (firstMark && typeof firstMark.scrollIntoView === "function") {
    setTimeout(() => {
      try { firstMark.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {}
    }, 45);
  }
}

let activeHighlightQuery = "";

function renderCurrentPage() {
  const i = Math.max(0, Math.min(BOOK_DATA.pages.length - 1, state.page));
  state.page = i;
  const p = BOOK_DATA.pages[i];
  updateRunningHeader(i, p);
  const out = buildSinglePageMarkup(p, i);
  $("pageCanvas").innerHTML = out;
  $("pageCounter").textContent = (i + 1) + " / " + BOOK_DATA.pages.length;
  $("prevBtn").disabled = i === 0;
  $("nextBtn").disabled = i === BOOK_DATA.pages.length - 1;
  const isBm = state.bookmarks.includes(i);
  $("bookmarkBtn").textContent = isBm ? "★" : "☆";
  $("bookmarkBtn").classList.toggle("bookmarked", isBm);
  $("bookmarkBtn").setAttribute("aria-pressed", String(isBm));
  saveState();
  try { if (window.MaktabatiBridge && window.MaktabatiBridge.onPageChanged) window.MaktabatiBridge.onPageChanged(i + 1, BOOK_DATA.pages.length); } catch (e) {}
  $("bookStage").scrollTop = 0;
  if (activeHighlightQuery) {
    applyCalmPageSearchHighlight(activeHighlightQuery);
  }
}

function goToPage(index, highlightQuery) {
  activeHighlightQuery = typeof highlightQuery === "string" ? highlightQuery : "";
  state.page = Math.max(0, Math.min(BOOK_DATA.pages.length - 1, index));
  renderCurrentPage();
  closePanels();
}
function nextPage() { goToPage(state.page + 1, ""); }
function prevPage() { goToPage(state.page - 1, ""); }
window.goToPage = goToPage;
window.nextPage = nextPage;
window.prevPage = prevPage;

$("nextBtn").onclick = nextPage;
$("prevBtn").onclick = prevPage;

function openPanel(id) {
  document.querySelectorAll(".overlay").forEach(x => {
    if (x.id !== id) x.classList.remove("open");
  });
  const panelEl = $(id);
  if (!panelEl) return;
  panelEl.classList.add("open");
  if (id === "searchPanel") {
    const input = $("searchInput");
    if (input) {
      setTimeout(() => {
        try { input.focus(); } catch (e) {}
      }, 30);
    }
  }
}
function closePanels() {
  document.querySelectorAll(".overlay").forEach(x => x.classList.remove("open"));
}
$("tocOpen").onclick = e => {
  if (e && e.stopPropagation) e.stopPropagation();
  openPanel("tocPanel");
};
$("searchOpen").onclick = e => {
  if (e && e.stopPropagation) e.stopPropagation();
  openPanel("searchPanel");
};
document.querySelectorAll(".closePanel").forEach(b => {
  b.onclick = e => {
    if (e && e.stopPropagation) e.stopPropagation();
    closePanels();
  };
});
document.querySelectorAll(".overlay").forEach(o => {
  o.addEventListener("click", e => {
    if (e.target === o) closePanels();
  });
});

$("bookmarkBtn").onclick = () => {
  const i = state.page;
  state.bookmarks = state.bookmarks.includes(i) ? state.bookmarks.filter(n => n !== i) : [...state.bookmarks, i];
  saveState();
  renderCurrentPage();
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b) {
    e.stopPropagation();
    const targetPage = Number(b.dataset.go);
    const searchQuery = b.hasAttribute("data-search-hit") ? norm($("searchInput").value.trim()) : "";
    goToPage(targetPage, searchQuery);
  }
});

let searchTimer;
function pageBlocksForSearch(p) {
  const blocks = [];
  const pushUnique = txt => {
    const s = personalizeText(txt).trim();
    if (s && !blocks.includes(s)) blocks.push(s);
  };
  [p.title, p.subtitle, p.author, p.sectionTitle, p.epigraph, p.quote, p.caption, p.pullquote, p.content, p.text].forEach(pushUnique);
  (p.paragraphs || []).forEach(pushUnique);
  (p.afterParagraphs || []).forEach(pushUnique);
  return blocks;
}

function pageHeadingLabel(p, idx) {
  const ch = p.chapterTag || (p.chapterNumber ? "الباب " + p.chapterNumber : "");
  const sec = p.sectionTitle || p.title || "";
  if (ch && sec && ch !== sec) return ch + " — " + sec;
  return sec || ch || ("صفحة " + (idx + 1));
}

function executeBookSearch() {
  const rawInput = $("searchInput").value || "";
  const clearBtn = $("searchClearBtn");
  const statusEl = $("searchStatus");
  const resultsEl = $("searchResults");

  if (clearBtn) clearBtn.hidden = rawInput.length === 0;
  const q = norm(rawInput.trim());

  if (!q) {
    activeHighlightQuery = "";
    if (statusEl) statusEl.textContent = "ابحثي في كامل محتوى الكتاب (" + BOOK_DATA.pages.length + " صفحات) مع التشكيل أو بدونه.";
    resultsEl.innerHTML = "";
    return;
  }

  const hits = [];
  const seenPageKeys = new Set();

  BOOK_DATA.pages.forEach((p, pageIdx) => {
    const blocks = pageBlocksForSearch(p);
    for (let b = 0; b < blocks.length; b++) {
      const snip = buildSnippetWithHighlight(blocks[b], q);
      if (snip) {
        const pageDedupKey = pageIdx + "::" + snip.dedupKey;
        if (!seenPageKeys.has(pageDedupKey)) {
          seenPageKeys.add(pageDedupKey);
          hits.push({
            i: pageIdx,
            label: pageHeadingLabel(p, pageIdx),
            snippetHtml: snip.snippetHtml
          });
        }
      }
    }
  });

  if (hits.length > 0) {
    if (statusEl) statusEl.textContent = "تم العثور على " + hits.length + " نتيجة في صفحات الكتاب:";
    resultsEl.innerHTML = hits.slice(0, 100).map(h =>
      '<button type="button" class="search-result" data-go="' + h.i + '" data-search-hit="1">' +
        '<div class="search-result-head">' +
          '<strong>✿ ' + esc(h.label) + '</strong>' +
          '<span class="search-result-page">صفحة ' + (h.i + 1) + '</span>' +
        '</div>' +
        '<small>' + h.snippetHtml + '</small>' +
      '</button>'
    ).join("");
  } else {
    if (statusEl) statusEl.textContent = "لم يتم العثور على مطابقات لعبارة البحث.";
    resultsEl.innerHTML = '<p class="empty">لا توجد نتائج مطابقة.</p>';
  }
}

$("searchInput").addEventListener("input", () => {
  const rawInput = $("searchInput").value || "";
  if ($("searchClearBtn")) $("searchClearBtn").hidden = rawInput.length === 0;
  clearTimeout(searchTimer);
  if (!rawInput.trim()) {
    executeBookSearch();
    return;
  }
  if ($("searchStatus")) $("searchStatus").textContent = "جاري البحث...";
  searchTimer = setTimeout(executeBookSearch, 90);
});

if ($("searchClearBtn")) {
  $("searchClearBtn").onclick = e => {
    if (e && e.stopPropagation) e.stopPropagation();
    $("searchInput").value = "";
    activeHighlightQuery = "";
    executeBookSearch();
    renderCurrentPage();
    try { $("searchInput").focus(); } catch (err) {}
  };
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    closePanels();
    return;
  }
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  if (e.key === "ArrowRight") { document.documentElement.dir === "rtl" ? nextPage() : prevPage(); }
  else if (e.key === "ArrowLeft") { document.documentElement.dir === "rtl" ? prevPage() : nextPage(); }
});

let touchX = 0, touchY = 0, singleFingerGesture = false;
const stage = $("bookStage");
stage.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) { singleFingerGesture = false; return; }
  if (e.target && e.target.closest && e.target.closest(".overlay, .panel, button, input")) {
    singleFingerGesture = false;
    return;
  }
  const t = e.touches[0];
  touchX = t.clientX;
  touchY = t.clientY;
  singleFingerGesture = true;
}, { passive: true });
stage.addEventListener("touchmove", e => {
  if (e.touches.length !== 1) singleFingerGesture = false;
}, { passive: true });
stage.addEventListener("touchcancel", () => { singleFingerGesture = false; }, { passive: true });
stage.addEventListener("touchend", e => {
  if (!singleFingerGesture || e.changedTouches.length !== 1) { singleFingerGesture = false; return; }
  const t = e.changedTouches[0], dx = t.clientX - touchX, dy = t.clientY - touchY;
  singleFingerGesture = false;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 55) return;
  if (Math.abs(dx) > Math.abs(dy) * 1.25) {
    if (dx > 0) nextPage(); else prevPage();
  }
}, { passive: true });

state.page = Math.max(0, Math.min(BOOK_DATA.pages.length - 1, Number(state.page) || 0));
state.bookmarks = state.bookmarks.filter(i => i >= 0 && i < BOOK_DATA.pages.length);
applyPrefs();
renderCurrentPage();
setTimeout(() => {
  renderToc();
  let warmIdx = 0;
  function warmBatch() {
    const end = Math.min(BOOK_DATA.pages.length, warmIdx + 8);
    for (let k = warmIdx; k < end; k++) {
      buildSinglePageMarkup(BOOK_DATA.pages[k], k);
    }
    warmIdx = end;
    if (warmIdx < BOOK_DATA.pages.length) setTimeout(warmBatch, 20);
  }
  warmBatch();
}, 16);
</script>
