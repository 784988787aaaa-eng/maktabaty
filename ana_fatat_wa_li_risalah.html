<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="theme-color" content="#FAF6F0"/>
  <meta name="color-scheme" content="light"/>
  <meta name="author" content="إصدارات مكتبتي الفاخرة — كتيب تربوي إيماني للفتيات"/>
  <meta name="description" content="أنا فتاة ولي رسالة — رحلة إلى أعماق الذات... من معرفة النفس إلى بناء الشخصية وصناعة الأثر."/>
  <title>🌸 أَنَا فَتَاةٌ وَلِي رِسَالَة — رِحْلَةٌ إِلَى أَعْمَاقِ الذَّات</title>

  <style>

:root {
  --bg-primary: #FAF6F0;
  --bg-secondary: #FFFDF9;
  --bg-soft-rose: #FCF2F5;
  --bg-soft-sage: #EFF5F0;
  --bg-pearl-gold: #FDF7EC;
  
  --accent-rose: #BD6B80;
  --accent-rose-dark: #732E41;
  --accent-rose-light: #D98C9F;
  --accent-sage: #6B856E;
  --accent-sage-dark: #445946;
  --accent-gold: #C69A4E;
  --accent-gold-soft: rgba(198,154,78,0.22);
  
  --text-primary: #38272C;
  --text-secondary: #6B565C;
  --line: rgba(189,107,128,0.18);
  --border-ornate: rgba(198,154,78,0.32);
  --paper-edge: #DDD1C4;
  
  --shadow-card: 0 16px 42px rgba(92,35,51,0.07);
  --reader-font: 21px;
  --reader-font-size: 100%;
  --font-scale: 1;
  
  --font-body: "Noto Naskh Arabic", "Amiri", serif;
  --font-headings: "Aref Ruqaa", "Amiri", serif;
  --font-chapter-titles: "Reem Kufi", "Noto Kufi Arabic", sans-serif;
  --font-quotes: "Amiri", "Noto Naskh Arabic", serif;
  --font-interface: "Noto Sans Arabic", "IBM Plex Sans Arabic", sans-serif;
  --font-numbers: "Noto Sans Arabic", "IBM Plex Sans Arabic", sans-serif;
  --reader-family: var(--font-body);
  
  color-scheme: light;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

html, body, .app {
  touch-action: pan-y !important;
}

button, input, select, textarea {
  touch-action: manipulation;
  font: inherit;
}

#bookStage, .panel {
  touch-action: pan-y;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-body);
}

body {
  overflow: hidden;
}

.app {
  height: 100vh;
  max-height: 100vh;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: linear-gradient(155deg, var(--bg-primary), #F7EDE7 55%, var(--bg-soft-rose) 100%);
}

.top-bar {
  height: 58px;
  min-height: 58px;
  flex: 0 0 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 3vw, 22px);
  gap: 10px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--line);
  z-index: 10;
  box-shadow: 0 3px 14px rgba(92,35,51,0.05);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  color: var(--accent-rose-dark);
  font-family: var(--font-interface);
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand-gem {
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  background: linear-gradient(135deg, var(--accent-rose), var(--accent-rose-dark));
  font-size: 16px;
  box-shadow: 0 3px 9px rgba(189,107,128,0.28);
}

.tools {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
}

.icon-btn, .nav-btn {
  border: 1px solid var(--line);
  background: var(--bg-primary);
  color: var(--accent-rose-dark);
  border-radius: 12px;
  min-width: 40px;
  min-height: 40px;
  padding: 6px 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-interface);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background .18s, border-color .18s, transform .15s;
}

.icon-btn svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.1;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

.icon-btn:active, .nav-btn:active {
  transform: scale(0.97);
}

.icon-btn:focus-visible, .nav-btn:focus-visible, .primary-btn:focus-visible, .toc-item:focus-visible {
  outline: 3px solid var(--accent-gold);
  outline-offset: 2px;
}

.icon-btn.bookmarked {
  background: var(--bg-pearl-gold);
  color: var(--accent-gold);
  border-color: var(--accent-gold);
}

.running-header {
  height: 36px;
  min-height: 36px;
  flex: 0 0 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 2px 14px;
  background: var(--accent-rose-dark);
  color: #FAF4EF;
  border-bottom: 2px solid var(--accent-gold);
  font-family: var(--font-interface);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .02em;
  text-align: center;
}

.running-header[hidden] {
  display: none;
}

.running-header-mark {
  color: #E6C88B;
  font-size: 12px;
}

.book-stage {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: clamp(10px, 2.7vw, 22px) clamp(9px, 2vw, 16px) 18px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  scrollbar-width: thin;
  scrollbar-color: rgba(189,107,128,0.28) transparent;
}

.page-canvas {
  width: 100%;
  max-width: 760px;
  min-height: 100%;
  height: auto;
  margin: 0 auto;
  padding: clamp(20px, 4.4vw, 38px) clamp(18px, 5vw, 44px) clamp(28px, 5vw, 44px);
  position: relative;
  background: var(--bg-secondary);
  border: 1px solid var(--paper-edge);
  border-radius: 18px;
  box-shadow: var(--shadow-card);
  display: block;
  overflow: visible;
}

.page-canvas:before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid rgba(198,154,78,0.18);
  border-radius: 12px;
  pointer-events: none;
}

.page {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 100%;
  font-family: var(--font-body);
  font-size: var(--reader-font);
  line-height: 2.05;
  overflow-wrap: break-word;
  word-wrap: break-word;
  animation: pageIn .22s ease both;
}

@keyframes pageIn {
  from { opacity: .45; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--accent-rose-dark);
  background: var(--bg-soft-rose);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 5px 16px;
  font-family: var(--font-interface);
  font-size: .61em;
  font-weight: 700;
  letter-spacing: .025em;
  margin: 0 auto 16px;
}

h1, h2, h3, p {
  margin-top: 0;
  max-width: 100%;
}

h1 {
  font-family: var(--font-headings);
  font-size: 1.62em;
  line-height: 1.55;
  color: var(--accent-rose-dark);
  margin: 0 0 16px;
  font-weight: 700;
}

h2 {
  font-family: var(--font-headings);
  font-size: 1.2em;
  line-height: 1.65;
  color: var(--accent-rose);
  margin: 0 0 14px;
  font-weight: 700;
}

h3 {
  font-family: var(--font-headings);
  font-size: 1.02em;
  color: var(--accent-sage-dark);
  margin: 20px 0 9px;
  font-weight: 700;
}

p {
  font-family: var(--font-body);
  margin: 0 0 1.02em;
  text-align: justify;
  white-space: normal;
  overflow-wrap: break-word;
  hyphens: none;
}

.reading p:not(.subtitle):not(.no-indent) {
  text-indent: 1.15em;
}

.cover-page {
  min-height: clamp(520px, 72vh, 820px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  isolation: isolate;
  padding: clamp(28px, 6vw, 54px) 14px;
  background: radial-gradient(ellipse at 50% 38%, #FFFFFF 0%, #FFF8F9 52%, #F6ECE5 100%);
  border: 1.5px solid rgba(198,154,78,0.36);
  border-radius: 14px;
  overflow: hidden;
}

.cover-page:before, .cover-page:after {
  content: "";
  position: absolute;
  z-index: -1;
  border: 1px solid rgba(198,154,78,0.28);
  border-radius: 46% 46% 14px 14px;
  width: 78%;
  height: 80%;
  top: 10%;
  left: 11%;
  pointer-events: none;
}

.cover-page:after {
  width: 71%;
  height: 73%;
  top: 13.5%;
  left: 14.5%;
  border-color: rgba(189,107,128,0.22);
  border-style: dashed;
}

.cover-art-svg {
  width: min(58%, 230px);
  height: auto;
  margin: 0 auto 16px;
  filter: drop-shadow(0 8px 16px rgba(115,46,65,0.14));
}

.cover-page .eyebrow {
  margin-bottom: 16px;
  background: rgba(255,255,255,0.85);
}

.cover-page h1 {
  font-family: var(--font-headings);
  font-size: clamp(2.1em, 7.5vw, 3.2em);
  line-height: 1.38;
  letter-spacing: .005em;
  color: var(--accent-rose-dark);
  margin: 0 0 12px;
  text-shadow: 0 2px 0 rgba(255,255,255,0.7);
}

.cover-page .subtitle {
  font-family: var(--font-body);
  font-size: 1.02em;
  line-height: 1.95;
  color: var(--text-secondary);
  max-width: 88%;
  margin: 0 auto 14px;
  text-align: center;
}

.cover-page .author {
  font-family: var(--font-interface);
  font-size: .68em;
  line-height: 1.8;
  color: var(--text-secondary);
  margin: 6px 0 24px;
  max-width: 90%;
}

.primary-btn {
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 99px;
  background: linear-gradient(135deg, var(--accent-rose), var(--accent-rose-dark));
  color: #fff;
  padding: 11px 28px;
  font-family: var(--font-interface);
  font-size: .7em;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 7px 18px rgba(115,46,65,0.22);
  transition: transform .18s, box-shadow .18s;
}

.primary-btn:active {
  transform: scale(0.97);
}

.ornament {
  color: var(--accent-gold);
  letter-spacing: .32em;
  font-size: .8em;
  margin: 16px 0;
  text-align: center;
}

.quran-box {
  margin: 18px 0;
  padding: 16px 20px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--bg-soft-rose), var(--bg-pearl-gold));
  border: 1px solid var(--accent-gold-soft);
  border-right: 4px solid var(--accent-rose);
  font-family: var(--font-quotes);
  text-align: center;
  box-shadow: 0 4px 14px rgba(92,35,51,0.04);
}

.quran-box p {
  font-family: var(--font-quotes);
  font-size: 1.15em;
  line-height: 2.1;
  color: var(--accent-rose-dark);
  margin: 0 0 6px;
  text-align: center;
}

.quran-box .ayah-source {
  font-family: var(--font-interface);
  font-size: .7em;
  color: var(--accent-gold);
  font-weight: 700;
}

.hadith-box {
  margin: 18px 0;
  padding: 15px 18px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--bg-soft-sage), var(--bg-secondary));
  border: 1px solid rgba(107,133,110,0.24);
  border-right: 4px solid var(--accent-sage);
  font-family: var(--font-quotes);
  text-align: center;
}

.hadith-box p {
  font-family: var(--font-quotes);
  font-size: 1.1em;
  line-height: 2.05;
  color: var(--accent-sage-dark);
  margin: 0 0 6px;
  text-align: center;
}

.hadith-box .hadith-source {
  font-family: var(--font-interface);
  font-size: .68em;
  color: var(--accent-sage-dark);
  font-weight: 700;
}

.wisdom-pearl {
  margin: 18px 0;
  padding: 15px 18px;
  border-radius: 12px;
  background: var(--bg-pearl-gold);
  border: 1px solid var(--accent-gold-soft);
  border-right: 3px solid var(--accent-gold);
  font-family: var(--font-quotes);
  font-size: .98em;
  line-height: 1.95;
}

.wisdom-badge {
  display: block;
  font-family: var(--font-interface);
  font-size: .63em;
  font-weight: 700;
  color: var(--accent-gold);
  margin-bottom: 6px;
}

.interactive-box {
  margin: 18px 0;
  padding: 16px 18px;
  border-radius: 14px;
  background: var(--bg-soft-rose);
  border: 1.5px solid var(--line);
}

.interactive-box h3 {
  color: var(--accent-rose-dark);
  margin-top: 0;
  margin-bottom: 12px;
}

.field-group {
  margin-bottom: 12px;
}

.field-group label {
  display: block;
  font-family: var(--font-interface);
  font-size: .74em;
  font-weight: 700;
  color: var(--accent-rose-dark);
  margin-bottom: 4px;
}

.field-input, .field-textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: #FFF;
  color: var(--text-primary);
  font-family: var(--font-interface);
  font-size: .8em;
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}

.field-textarea {
  min-height: 72px;
  resize: vertical;
  line-height: 1.7;
}

.field-input:focus, .field-textarea:focus {
  border-color: var(--accent-rose);
  box-shadow: 0 0 0 3px rgba(189,107,128,0.16);
}

.opener {
  min-height: clamp(440px, 65vh, 720px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 28px 12px;
  position: relative;
}

.opener:before {
  content: "";
  position: absolute;
  inset: 6% 6%;
  border: 1px solid var(--accent-gold-soft);
  border-radius: 46% 46% 14px 14px;
  pointer-events: none;
}

.chapter-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--accent-gold);
  background: var(--bg-pearl-gold);
  border: 1px solid var(--accent-gold-soft);
  border-radius: 99px;
  padding: 6px 22px;
  font-family: var(--font-chapter-titles);
  font-size: .7em;
  font-weight: 700;
  margin-bottom: 18px;
}

.opener h1 {
  font-family: var(--font-chapter-titles);
  font-size: clamp(1.65em, 5.2vw, 2.3em);
  line-height: 1.65;
  max-width: 90%;
  margin: 0 auto 16px;
  color: var(--accent-rose-dark);
}

.opener .subtitle {
  font-family: var(--font-body);
  font-size: .98em;
  line-height: 1.95;
  color: var(--text-secondary);
  max-width: 86%;
  margin: 0 auto 14px;
  text-align: center;
}

.toc-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 14px;
}

.toc-item {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: start;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 14px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-interface);
  font-size: .74em;
  line-height: 1.6;
  cursor: pointer;
  transition: border-color .18s, transform .15s;
}

.toc-item:active {
  transform: scale(0.99);
}

.toc-item.toc-part {
  font-family: var(--font-chapter-titles);
  background: var(--bg-soft-rose);
  border-color: var(--accent-rose-light);
  font-weight: 700;
  color: var(--accent-rose-dark);
  margin-top: 6px;
}

.toc-item small {
  color: var(--accent-gold);
  font-family: var(--font-numbers);
  font-variant-numeric: tabular-nums;
  font-size: .78em;
  font-weight: 700;
  white-space: nowrap;
  background: var(--bg-secondary);
  padding: 2px 8px;
  border-radius: 99px;
  border: 1px solid var(--accent-gold-soft);
}

.bottom-nav-dock {
  min-height: 66px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 14px calc(env(safe-area-inset-bottom, 8px) + 8px);
  background: var(--bg-secondary);
  border-top: 1px solid var(--line);
  box-shadow: 0 -4px 16px rgba(92,35,51,0.045);
  z-index: 4;
}

.nav-btn {
  min-width: 94px;
  border-radius: 12px;
  background: var(--accent-rose-dark);
  color: #fff;
  border-color: var(--accent-rose-dark);
  font-family: var(--font-interface);
  font-size: 12px;
  padding: 9px 15px;
}

.nav-btn:disabled {
  opacity: .35;
  cursor: default;
}

.page-counter {
  font-family: var(--font-numbers);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
  background: var(--bg-primary);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 6px 14px;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 45;
  background: rgba(77,28,42,0.42);
  backdrop-filter: blur(3px);
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 12px;
}

#searchPanel.overlay {
  align-items: flex-start;
  padding-top: 64px;
  padding-bottom: 76px;
}

.overlay.open {
  display: flex;
}

.panel {
  width: min(100%, 650px);
  max-height: min(78vh, 680px);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: var(--bg-secondary);
  border: 1px solid var(--paper-edge);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 20px 60px rgba(77,28,42,0.22);
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  padding-bottom: 11px;
  border-bottom: 1px solid var(--line);
}

.panel-head h2 {
  margin: 0;
  color: var(--accent-rose-dark);
  font-family: var(--font-interface);
  font-size: 16px;
  font-weight: 700;
}

.search-bar-wrap {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

#searchInput {
  width: 100%;
  min-height: 46px;
  padding: 10px 14px 10px 42px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-interface);
  font-size: 14px;
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}

#searchInput:focus {
  border-color: var(--accent-rose);
  box-shadow: 0 0 0 3px rgba(189,107,128,0.16);
}

.search-clear-btn {
  position: absolute;
  inset-inline-end: 8px;
  top: 50%;
  transform: translateY(-50%);
  min-width: 30px;
  min-height: 30px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg-secondary);
  color: var(--accent-rose);
  font-family: var(--font-interface);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 2px 8px;
}

.search-clear-btn[hidden] {
  display: none;
}

.search-status {
  font-family: var(--font-interface);
  font-size: 12px;
  color: var(--text-secondary);
  margin: 4px 2px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.search-result {
  width: 100%;
  display: block;
  text-align: start;
  padding: 12px 14px;
  margin: 8px 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-interface);
  cursor: pointer;
  transition: border-color .18s, background .18s;
}

.search-result:hover, .search-result:focus-visible {
  border-color: var(--accent-rose);
  background: var(--bg-soft-rose);
}

8 -14, -8 -14, -12 -6 Z\" fill=\"#E8B8C8\"/>\n    <circle cx=\"0\" cy=\"4\" r=\"11\" fill=\"#BD6B80\"/>\n    <circle cx=\"0\" cy=\"4\" r=\"6\" fill=\"#732E41\"/>\n    <polygon points=\"0,-2 2,2 6,4 2,6 0,10 -2,6 -6,4 -2,2\" fill=\"#FAF6F0\"/>\n  </g>\n  \n  <defs>\n    <radialGradient id=\"coverRoseGlow\" cx=\"50%\" cy=\"45%\" r=\"50%\">\n      <stop offset=\"0%\" stop-color=\"#FFFFFF\"/>\n      <stop offset=\"65%\" stop-color=\"#FCF2F5\"/>\n      <stop offset=\"100%\" stop-color=\"#F6ECE5\"/>\n    </radialGradient>\n  </defs>\n</svg>\n\n  <h1>أَنَا فَتَاةٌ وَلِي رِسَالَة</h1>\n  <div class=\"subtitle\">رِحْلَةٌ إِلَى أَعْمَاقِ الذَّات... مِنْ مَعْرِفَةِ النَّفْسِ إِلَى بِنَاءِ الشَّخْصِيَّةِ وَصِنَاعَةِ الأَثَر</div>\n  <div class=\"ornament\">❖ ❖ ❖</div>\n  <div class=\"author\">إِعْدَادٌ وَصِيَاغَةٌ تَرْبَوِيَّةٌ وِجْدَانِيَّة • الإِصْدَارُ الأَوَّل</div>\n  <button class=\"primary-btn\" onclick=\"window.goToPage(1)\">ابدئي رحلتكِ المباركة 🌸</button>\n</div>\n"}, {"tag": "الإهداء", "title": "إلى الفتاة التي تبحث عن ذاتها", "type": "reading", "html": "\n<div class=\"eyebrow\">إِهْدَاءٌ مِنَ القَلْب</div>\n<h1>إِلَى كُلِّ فَتَاةٍ تَحْمِلُ فِي قَلْبِهَا حُلْماً...</h1>\n<div class=\"ornament\">❀ ❀ ❀</div>\n\n<p>إلى التي تبحث عن ذاتها وسط ضجيج الحياة، وتحاول أن تفهم نفسها، وتكتشف قدراتها، وتبني شخصيتها، وتجد الطريق الذي يليق برسالتها النبيلة.</p>\n\n<p>إلى الفتاة التي ربما سمعت كثيراً عما ينبغي أن تكون عليه، لكنها تحتاج إلى من يأخذ بيدها بحب ورفق، لتكتشف بنفسها ما تستطيع أن تكونه من خير وإحسان.</p>\n\n<p>إلى الفتاة التي تتعثر أحياناً، وتضعف أحياناً، وتشعر أن الطريق طويل وشاق، لكنها لا تزال تحاول بصدق وعزيمة.</p>\n\n<div class=\"wisdom-pearl\">\n  <span class=\"wisdom-badge\">همسة الإهداء</span>\n  هذا الكتاب لكِ... لتعرفي أن قيمتكِ ليست رهينة إعجاب الناس، وأن مستقبلكِ لا تصنعه الأمنيات وحدها، بل يصنعه قربكِ من الله، ووعيكِ برسالتكِ، واستثماركِ لنعم الله فيكِ.\n</div>\n\n<div class=\"interactive-box\" style=\"margin-top: 24px;\">\n  <h3 style=\"margin-bottom: 6px;\">🌸 ركن القارئة المباركة</h3>\n  <p style=\"font-size: .88em; margin-bottom: 10px;\">اكتبي اسمكِ الكريم لنخاطبكِ به في صفحات الكتاب:</p>\n  <div style=\"display: flex; gap: 8px;\">\n    <input id=\"readerNameInput\" class=\"field-input\" type=\"text\" placeholder=\"اكتبي اسمكِ هنا (مثال: مريم، سارة، فاطمة)...\" oninput=\"saveReaderName(this.value)\"/>\n    <button class=\"primary-btn\" style=\"padding: 6px 16px; font-size: .75em;\" onclick=\"alertSavedName()\">حفظ</button>\n  </div>\n</div>\n"}, {"tag": "الفهرس", "title": "فهرس محطات الرحلة", "type": "reading", "html": "\n<div class=\"eyebrow\">دَلِيلُ الرِّحْلَة</div>\n<h1>فِهْرِسُ مَحَطَّاتِ الكِتَاب</h1>\n<p style=\"text-align: center; color: var(--text-secondary); font-size: .9em;\">عشرة أبواب تأخذكِ خطوة بخطوة إلى صناعة الأثر وبناء الذات</p>\n\n<div class=\"toc-list\">\n  <div class=\"toc-item\" onclick=\"window.goToPage(3)\"><span>المقدمة: قبل أن تبدئي الرحلة</span><small>صفحة ٤</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(5)\"><span>الباب الأول: أنا لستُ فتاة عادية</span><small>صفحة ٦</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(11)\"><span>الباب الثاني: أنا أعرف لماذا خُلقت</span><small>صفحة ١٢</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(16)\"><span>الباب الثالث: علاقتي بالله سر قوتي</span><small>صفحة ١٧</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(22)\"><span>الباب الرابع: أحب نفسي وأبنيها</span><small>صفحة ٢٣</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(28)\"><span>الباب الخامس: عقلي ثروتي</span><small>صفحة ٢٩</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(34)\"><span>الباب السادس: شخصيتي هويتي</span><small>صفحة ٣٥</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(40)\"><span>الباب السابع: قلبي أمانة</span><small>صفحة ٤١</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(46)\"><span>الباب الثامن: أنوثتي وكرامتي وهويتي</span><small>صفحة ٤٧</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(52)\"><span>الباب التاسع: أنا صانعة أثر</span><small>صفحة ٥٣</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(58)\"><span>الباب العاشر: خطتي لحياة تستحق</span><small>صفحة ٥٩</small></div>\n  <div class=\"toc-item\" onclick=\"window.goToPage(64)\"><span>الخاتمة وميثاق الفتاة صاحبة الرسالة</span><small>صفحة ٦٥</small></div>\n  <div class=\"toc-item\" onclick=\"window.goToPage(67)\"><span>الملاحق العملية وتحدي الثلاثين يوماً</span><small>صفحة ٦٨</small></div>\n</div>\n"}, {"tag": "المقدمة", "title": "قبل أن تبدئي الرحلة (١)", "type": "reading", "html": "\n<div class=\"eyebrow\">المُقَدِّمَة</div>\n<h1>قَبْلَ أَنْ تَبْدَئِي الرِّحْلَة</h1>\n<div class=\"ornament\">❖ ❖ ❖</div>\n\n<p>يا ابنتي المباركة <span class=\"reader-name-slot\"></span>...</p>\n\n<p>هل جلستِ يوماً مع نفسكِ، بعيداً عن الهاتف، وبعيداً عن أحاديث الناس وضجيج منصات التواصل، وسألتِها بصدق وهدوء:</p>\n\n<p><strong>من أنا حقاً؟ ما الذي أريده من حياتي؟ ما الذي أستطيع تقديمه للعالم؟ هل أسير في الطريق الذي أتمناه؟ وهل أعيش بما يرضي الله تعالى عني؟</strong></p>\n\n<p>ربما مرت عليكِ أيام كثيرة دون أن تتوقفي لتطرحي هذه الأسئلة العميقة؛ أيام تتشابه، وساعات تمضي، وأحلام تتراكم في الخيال، ومهام تؤجل إلى الغد، وأوقات تستهلكها أشياء عابرة لا تضيف إلى عقلكِ ولا إلى روحكِ شيئاً حقيقياً.</p>\n\n<p>وربما وجدتِ نفسكِ أحياناً تقارنين حياتكِ بحياة غيركِ، وتنظرين إلى إنجازاتهم الظاهرة ومظاهرهم، ثم تنسين أن لكل إنسان رحلة متفردة خطها الله له بحكمة بالغة.</p>\n"}, {"tag": "المقدمة", "title": "قبل أن تبدئي الرحلة (٢)", "type": "reading", "html": "\n<div class=\"eyebrow\">المُقَدِّمَة</div>\n<h2>طَرِيقُ الوَعْيِ وَالإِصْلاَحِ المُسْتَمِرّ</h2>\n\n<p>اليوم نريد أن نبدأ بطريقة مختلفة؛ نريد أن نقترب من أنفسنا، لا لننغلق عليها في أنانية، بل لنعرف كيف نستثمرها فيما ينفع ديننا ومجتمعنا وأمتنا.</p>\n\n<p>نريد أن نبني فتاة تعرف ربها، وتفهم دينها، وتقدر ذاتها، وتحترم عقلها، وتضبط مشاعرها، وتحسن علاقاتها، وتخطط لمستقبلها بوعي وثقة.</p>\n\n<div class=\"quran-box\">\n  <p>﴿إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّىٰ يُغَيِّرُوا مَا بِأَنْفُسِهِمْ﴾</p>\n  <div class=\"ayah-source\">[الرعد: ١١]</div>\n</div>\n\n<p>هذه الرحلة ليست دعوة إلى المثالية؛ فلا أحد يعيش بلا أخطاء، ولا أحد يبلغ الكمال. إنها دعوة إلى الوعي، والسعي، والمراجعة، والتعلم، والإصلاح المستمر.</p>\n\n<div class=\"wisdom-pearl\">\n  <span class=\"wisdom-badge\">قاعدة الانطلاق</span>\n  تذكري دائماً: أنتِ لا تحتاجين إلى أن تصبحي إنسانة أخرى، بل تحتاجين إلى أن تكتشفي أفضل ما فيكِ، وأن تعملي على تنميته، وأن تصلحي ما يحتاج إلى إصلاح. هيا بنا نبدأ...\n</div>\n"}, {"tag": "الباب الأول", "title": "أنا لست فتاة عادية", "type": "opener", "html": "\n<div class=\"opener\">\n  <div class=\"chapter-number\">البَابُ الأَوَّل</div>\n  <h1>أَنَا لَسْتُ فَتَاةً عَادِيَّة</h1>\n  <div class=\"subtitle\">من معرفة النفس واكتشاف الكنوز الداخلية إلى التصالح الصادق مع الذات</div>\n  <div class=\"ornament\">❀ ❀ ❀</div>\n  <div class=\"wisdom-pearl\" style=\"max-width: 86%;\">\n    «أنتِ لستِ رقماً عابراً في هذا الوجود؛ بل إنسانة كرمها خالقها وحملها أمانة الإعمار والنفع.»\n  </div>\n</div>\n"}, {"tag": "الباب الأول", "title": "الفصل الأول: من أنا؟", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الأَوَّل • الفَصْلُ الأَوَّل</div>\n<h1>مَنْ أَنَا؟</h1>\n\n<p>قبل أن تعرفي ماذا تريدين أن تصبحي، عليكِ أن تتعرفي إلى الفتاة التي أنتِ عليها الآن. من أنتِ؟ ما الأشياء التي تحبينها بصدق؟ ما المبادئ التي تؤمنين بها؟ ما الأمور التي تتقنينها؟ وما الجوانب التي تحتاج منكِ إلى رعاية وتطوير؟</p>\n\n<p>إن معرفة الذات ليست أن تجلسي لتعددي مميزاتكِ فقط، بل أن تنظري إلى نفسكِ بصدق وتجرد: تعرفين مواطن قوتكِ فتشكرين الله عليها، وتعترفين بجوانب ضعفكِ فتسعين في إصلاحها، وتفهمين مشاعركِ واحتياجاتكِ.</p>\n\n<div class=\"quran-box\">\n  <p>﴿وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ﴾</p>\n  <div class=\"ayah-source\">[الإسراء: ٧٠]</div>\n</div>\n\n<p>هذا التكريم الرباني أصل عظيم تتذكرينه دائماً: كرامتكِ الإنسانية ثابتة، لا تمنحها لكِ تعليقات الناس وإعجابهم، ولا يسلبونها منكِ بانتقادهم.</p>\n\n<p>أنتِ إنسانة لكِ عقل وروح ومشاعر وقدرات، ولستِ مجرد مظهر، أو درجات دراسية، أو رأي عابر يقوله الآخرون عنكِ. لا تنتظري أن يخبركِ الآخرون من أنتِ؛ ابدئي أنتِ باكتشاف نفسكِ.</p>\n"}, {"tag": "الباب الأول", "title": "بطاقة التعرف إلى الذات", "type": "exercise", "html": "\n<div class=\"eyebrow\">تَطْبِيقٌ عَمَلِيّ</div>\n<h2>بِطَاقَةُ التَّعَرُّفِ إِلَى الذَّات</h2>\n<p style=\"font-size: .88em; color: var(--text-secondary);\">املئي هذه البطاقة بصدق، وتأملي إجاباتكِ بهدوء (تُحفظ تلقائياً في جهازكِ):</p>\n\n<div class=\"interactive-box\">\n  <div class=\"field-group\">\n    <label>ثلاث صفات جميلة أعتز بها في شخصيتي:</label>\n    <input class=\"field-input\" type=\"text\" placeholder=\"١. الصدق، الرحمة، حُسن الإنصات...\" id=\"self_trait_1\" oninput=\"saveField(this.id, this.value)\"/>\n  </div>\n  <div class=\"field-group\">\n    <label>أشياء وأنشطة أجد فيها راحتي وشغفي:</label>\n    <input class=\"field-input\" type=\"text\" placeholder=\"القراءة، الكتابة، الترتيب، مساعدة الآخرين...\" id=\"self_hobbies\" oninput=\"saveField(this.id, this.value)\"/>\n  </div>\n  <div class=\"field-group\">\n    <label>مهارات أتقنها حالياً:</label>\n    <input class=\"field-input\" type=\"text\" placeholder=\"التصميم، الإلقاء، تنظيم الوقت...\" id=\"self_skills\" oninput=\"saveField(this.id, this.value)\"/>\n  </div>\n  <div class=\"field-group\">\n    <label>مهارات جديدة أرغب في تعلمها:</label>\n    <input class=\"field-input\" type=\"text\" placeholder=\"لغة أجنبية، البرمجة، إدارة الأمور المالية...\" id=\"self_learn\" oninput=\"saveField(this.id, this.value)\"/>\n  </div>\n  <div class=\"field-group\">\n    <label>أكثر جانب شخصي يحتاج إلى تطوير وإصلاح:</label>\n    <input class=\"field-input\" type=\"text\" placeholder=\"علاج التسويف، ضبط الانفعال، إدارة وقت الشاشة...\" id=\"self_improve\" oninput=\"saveField(this.id, this.value)\"/>\n  </div>\n</div>\n"}, {"tag": "الباب الأول", "title": "الفصل الثاني: قيمتي لا يحددها الآخرون", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الأَوَّل • الفَصْلُ الثَّانِي</div>\n<h1>قِيمَتِي لاَ يُحَدِّدُهَا الآخَرُون</h1>\n\n<p>كم من فتاة أفسدت فرحتها بكلمة عابرة! وكم من فتاة تراجعت عن حلم نافع لأنها سمعت من يقلل من قدرتها أو يسخر من همتها!</p>\n\n<p>إن جعل قيمتكِ مرتبطة بمدح الناس وإعجابهم يجعلكِ أسيرة دائمة لتقلب أمزجتهم وآرائهم؛ إن أثنوا عليكِ شعرتِ بأنكِ عظيمة، وإن انتقدوكِ شعرتِ بأنكِ بلا قيمة. وهذا ميزان مرهق وظالم لنفسكِ.</p>\n\n<p>استمعي إلى النصيحة الصادقة النافعة، وتقبلي النقد البنّاء الذي يبصركِ بعيوبكِ، لكن لا تجعلي كل تعليق حكماً نهائياً على مستقبلكِ أو كرامتكِ.</p>\n\n<div class=\"wisdom-pearl\">\n  <span class=\"wisdom-badge\">ميزان الوعي</span>\n  هناك فرق عظيم بين أن تخطئي وبين أن تكوني فاشلة؛ وهناك فرق بين أن تحتاجي إلى تطوير مهاراتكِ وبين أن تكرهي نفسكِ. التواضع أن تعرفي قدر نفسكِ دون تعالٍ، والثقة أن تعترفي بما وهبكِ الله دون غرور.\n</div>\n\n<div class=\"interactive-box\">\n  <label style=\"font-weight: 700; color: var(--accent-rose-dark); font-size: .85em;\">وقفة تأمل شخصية: هل جعلتِ إعجاب الآخرين هدفاً لكِ يوماً؟ اكتبي ما تريدين تحرير قلبكِ منه:</label>\n  <textarea class=\"field-textarea\" id=\"self_liberation\" placeholder=\"اكتبي خواطركِ هنا بصراحة...\" oninput=\"saveField(this.id, this.value)\"></textarea>\n</div>\n"}, {"tag": "الباب الأول", "title": "الفصل الثالث: اكتشفي كنوزك الداخلية", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الأَوَّل • الفَصْلُ الثَّالِث</div>\n<h1>اكْتَشِفِي كُنُوزَكِ الدَّاخِلِيَّة</h1>\n\n<p>كل إنسانة تحمل في داخلها حزمة من الاستعدادات والقدرات التي أودعها الله فيها؛ لكن كثيراً من هذه المواهب تظل حبيسة لأن صاحبتها لم تخض التجربة، أو خافت من الفشل، أو انشغلت بمراقبة نجاحات غيرها.</p>\n\n<p>اسألي نفسكِ بوعي: ما الأمور التي أتعلمها بسرعة؟ ما الأشياء التي يستشيرني الآخرون فيها؟ ما الأعمال التي أشعر بالبركة والبهجة حين أنجزها؟</p>\n\n<div class=\"interactive-box\">\n  <h3 style=\"margin-bottom: 8px;\">🗺️ خريطة مواهبي واستثمارها</h3>\n  <div class=\"field-group\">\n    <label>الموهبة الأولى وكيف أنميها:</label>\n    <input class=\"field-input\" id=\"talent_1\" placeholder=\"مثال: الكتابة والتعبير -> قراءة كتاب أسبوعياً والتدريب...\" oninput=\"saveField(this.id, this.value)\"/>\n  </div>\n  <div class=\"field-group\">\n    <label>الموهبة الثانية وكيف أنميها:</label>\n    <input class=\"field-input\" id=\"talent_2\" placeholder=\"مثال: التصميم والتنظيم -> دراسة دورة تطبيقية وتطبيقها...\" oninput=\"saveField(this.id, this.value)\"/>\n  </div>\n  <div class=\"field-group\">\n    <label>الموهبة الثالثة وكيف أنميها:</label>\n    <input class=\"field-input\" id=\"talent_3\" placeholder=\"مثال: تعليم الأطفال -> إعداد دروس مبسطة وتطبيقها...\" oninput=\"saveField(this.id, this.value)\"/>\n  </div>\n</div>\n\n<p style=\"font-size: .9em; color: var(--text-secondary);\">تذكري دائماً: الموهبة بذرة صغيرة؛ لا تثمر ثمارها اليانعة إلا بالسقاية، والتدريب المستمر، والصبر، والانضباط.</p>\n"}, {"tag": "الباب الأول", "title": "الفصل الرابع: تصالحي مع ذاتك", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الأَوَّل • الفَصْلُ الرَّابِع</div>\n<h1>تَصَالَحِي مَعَ ذَاتِك</h1>\n\n<p>قد تحملين في ذاكرتكِ مواقف لم تكوني راضية عنها، أو قرارات تمنيتِ لو أنكِ اتخذتِ غيرها، أو ذنوباً تشعرين بالندم على اقترافها. لكن تذكري دائماً: الماضي ليس سجناً مؤبداً!</p>\n\n<p>إن أخطأتِ فاعترفي بضعفكِ البشري، واستغفري ربكِ، وأصلحي ما تستطيعين إصلاحه، وتعلمي من الدرس حتى لا يتكرر. إياكِ أن تحولي الندم إلى سياط تجلدين بها روحكِ ليل نهار فيقعدكِ ذلك عن العمل.</p>\n\n<div class=\"quran-box\">\n  <p>﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنْفُسِهِمْ لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا﴾</p>\n  <div class=\"ayah-source\">[الزمر: ٥٣]</div>\n</div>\n\n<div class=\"wisdom-pearl\">\n  <span class=\"wisdom-badge\">رسالة التصالح</span>\n  سامحي نفسكِ على ما تعلمتِ منه وتجاوزتِه، ولا تسامحيها على التمادي في الخطأ دون محاولة جادة للإصلاح. التوبة ميلاد متجدد لكل قلب صادق.\n</div>\n"}, {"tag": "الباب الثاني", "title": "أنا أعرف لماذا خُلقت", "type": "opener", "html": "\n<div class=\"opener\">\n  <div class=\"chapter-number\">البَابُ الثَّانِي</div>\n  <h1>أَنَا أَعْرِفُ لِمَاذَا خُلِقْت</h1>\n  <div class=\"subtitle\">من عبثية التيه إلى وضوح البوصلة واكتشاف الرسالة والنجاح الحقيقي</div>\n  <div class=\"ornament\">❀ ❀ ❀</div>\n  <div class=\"wisdom-pearl\" style=\"max-width: 86%;\">\n    «أعظم لحظة في حياة الإنسان حين يدرك لماذا جاء إلى هذا الوجود، وما الأثر الذي سيرحل ويتركه خلفه ناصعاً.»\n  </div>\n</div>\n"}, {"tag": "الباب الثاني", "title": "الفصل الأول: وجودي ليس عبثاً", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الثَّانِي • الفَصْلُ الأَوَّل</div>\n<h1>وُجُودِي لَيْسَ عَبَثاً</h1>\n\n<p>تخيلي إنساناً يعيش سنوات طويلة يدرس، ويكد، ويجمع الأموال، ويلاحق الأمنيات، ثم لا يتوقف لحظة واحدة ليسأل نفسه: إلى أين أمضي؟ ولماذا أفعل كل هذا؟</p>\n\n<p>إن الحياة أعظم من أن تكون مجرد سلسلة رتيبة من المهام، وأشرف من أن تختزل في البحث عن المتعة الفانية أو كسب ثناء الناس. لقد خلقنا الله تعالى لعبادته وحده، وجعل لنا في هذه الأرض رسالة إعمار وإصلاح وإحسان.</p>\n\n<div class=\"quran-box\">\n  <p>﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ﴾</p>\n  <div class=\"ayah-source\">[الذاريات: ٥٦]</div>\n</div>\n\n<p>والعبادة في ديننا مفهوم واسع رحيب لا ينحصر في المحراب فقط؛ بل كل عمل صالح تنوين به وجه الله، وتخدمين به خلقه، هو عبادة تُثابين عليها: دراستكِ، بركِ بوالديكِ، إتقانكِ لمهنتكِ، وحتى ابتسامتكِ في وجه أختكِ.</p>\n"}, {"tag": "الباب الثاني", "title": "الفصل الثاني: ما رسالتي في الحياة؟", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الثَّانِي • الفَصْلُ الثَّانِي</div>\n<h1>مَا رِسَالَتِي فِي الحَيَاة؟</h1>\n\n<p>الرسالة هي المعنى العميق الذي توجهين سفينة حياتكِ نحوه، والقيم التي تدافعين عنها، والخير الذي تصنعينه فيمن حولكِ. ليست الرسالة بالضرورة منصباً سياسياً أو شهرة واسعة بين الناس.</p>\n\n<p>قد تكون رسالتكِ أن تكوني معلمة مخلصة تبني أجيالاً واعية، أو طبيبة رحيمة تداوي جراح المتألمين، أو أماً صالحة تخرج قادة للأمة، أو باحثة تطور نفعاً للناس. المهم أن يكون سعيكِ موصولاً برضا الله ونفع عباده.</p>\n\n<div class=\"interactive-box\">\n  <h3 style=\"margin-bottom: 8px;\">✍️ صياغة جملة رسالتي</h3>\n  <div class=\"field-group\">\n    <label>أريد أن أكون فتاة تمتاز بـ:</label>\n    <input class=\"field-input\" id=\"mission_identity\" placeholder=\"الإيمان، الصدق، العلم، والأثر النافع...\" oninput=\"saveField(this.id, this.value)\"/>\n  </div>\n  <div class=\"field-group\">\n    <label>وأريد أن أتعلم وأتقن:</label>\n    <input class=\"field-input\" id=\"mission_learn\" placeholder=\"العلوم الشرعية، تخصصي الأكاديمي، مهارات التواصل...\" oninput=\"saveField(this.id, this.value)\"/>\n  </div>\n  <div class=\"field-group\">\n    <label>وأريد أن يكون أثري في الحياة سبباً في:</label>\n    <input class=\"field-input\" id=\"mission_impact\" placeholder=\"تفريج كرب، نشر فضيلة، وإصلاح في أسرتي ومجتمعي...\" oninput=\"saveField(this.id, this.value)\"/>\n  </div>\n</div>\n"}, {"tag": "الباب الثاني", "title": "الفصل الثالث: كيف أكتشف هدفي؟", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الثَّانِي • الفَصْلُ الثَّالِث</div>\n<h1>كَيْفَ أَكْتَشِفُ هَدَفِي؟</h1>\n\n<p>لا تتوقعي أن تجدي هدف حياتكِ مكتوباً في ورقة تسقط عليكِ في يوم واحد! اكتشاف الهدف رحلة نمو مستمرة تجمع بين التجربة والملاحظة والاستشارة.</p>\n\n<p>سيري وفق هذه الخطوات السبع المحكمة:</p>\n\n<div class=\"step-card\"><div class=\"step-num\">١</div><div class=\"step-content\"><strong>اكتشفي اهتماماتكِ:</strong> ما القضايا التي تشغلكِ وتتمنين حلها؟</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٢</div><div class=\"step-content\"><strong>تعرفي على قدراتكِ:</strong> ما المهارات التي تملكينها بالفطرة أو الممارسة؟</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٣</div><div class=\"step-content\"><strong>اقرئي ووسعي مدارككِ:</strong> طالعي تجارب وسير الصالحات والناجحات.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٤</div><div class=\"step-content\"><strong>جربي ميادين جديدة:</strong> لا تحكمي على شيء قبل خوض تجربته.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٥</div><div class=\"step-content\"><strong>استشيري أهل الحكمة:</strong> اسألي من يجمع بين الصلاح والخبرة.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٦</div><div class=\"step-content\"><strong>حددي أولويات مرحلتكِ:</strong> ما الأهم لكِ الآن في هذا العمر؟</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٧</div><div class=\"step-content\"><strong>ابدئي بخطوات ملموسة:</strong> قسّمي الهدف الكبير إلى مهام يومية صغيرة.</div></div>\n"}, {"tag": "الباب الثاني", "title": "الفصل الرابع: النجاح الذي يستحق", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الثَّانِي • الفَصْلُ الرَّابِع</div>\n<h1>النَّجَاحُ الَّذِي يَسْتَحِقّ</h1>\n\n<p>ليس النجاح الحقيقي أن تصلي إلى أرفع الدرجات الدنيوية وتخسري صلتكِ بربكِ؛ وليس النجاح أن تحققي شهرة واسعة على حساب عفتكِ وكرامتكِ وصحتكِ النفسية.</p>\n\n<p>النجاح المتزن الصادق هو أن تسعي إلى التفوق فيما ينفعكِ وينفع الناس، مع المحافظة التامة على دينكِ وقيمكِ ومبادئكِ، وأن تجعلي كل إنجاز سبباً للتواضع والشكر، لا للتكبر والخيلاء.</p>\n\n<div class=\"wisdom-pearl\">\n  <span class=\"wisdom-badge\">رسالة الباب الثاني</span>\n  لا تعيشي بلا غاية، ولا تجعلي غايتكِ فقط أن تكوني أفضل من فلانة أو علانة؛ بل اجعلي غايتكِ أن تكوني أقرب إلى الله، وأصدق في خدمته، وأثقل ميزاناً يوم تلقينه.\n</div>\n"}, {"tag": "الباب الثالث", "title": "علاقتي بالله سر قوتي", "type": "opener", "html": "\n<div class=\"opener\">\n  <div class=\"chapter-number\">البَابُ الثَّالِث</div>\n  <h1>عَلاَقَتِي بِاللَّهِ سِرُّ قُوَّتِي</h1>\n  <div class=\"subtitle\">سكينة المعرفة، حلاوة الصلاة، ربيع القرآن، والنهوض عند الفتور والضعف</div>\n  <div class=\"ornament\">❀ ❀ ❀</div>\n  <div class=\"wisdom-pearl\" style=\"max-width: 86%;\">\n    «إذا استند القلب إلى الحي القيوم، هانت أمامه كل الصعاب، وأشرقت في جنباته أنوار الطمأنينة واليقين.»\n  </div>\n</div>\n"}, {"tag": "الباب الثالث", "title": "الفصل الأول: أعرف ربي فأطمئن", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الثَّالِث • الفَصْلُ الأَوَّل</div>\n<h1>أَعْرِفُ رَبِّي فَأَطْمَئِنّ</h1>\n\n<p>يا فتاة الإسلام المباركة... قبل أن تبحثي عن الأمان في كلام الناس، أو تبحثي عن القوة في إعجابهم، ابحثي عنها في صلتكِ العميقة بالخالق جل وعلا.</p>\n\n<p>اعرفي ربكِ بأسمائه الحسنى وصفاته العلى: تأملي رحمته التي وسعت كل شيء، وعلمه الذي لا يعزب عنه مثقال ذرة، وحكمته البالغة فيما يقدر ويقضي، ولطفه الخفي بكِ في كل لحظة.</p>\n\n<div class=\"quran-box\">\n  <p>﴿وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ﴾</p>\n  <div class=\"ayah-source\">[البقرة: ١٨٦]</div>\n</div>\n\n<p>حين يستقر في يقينكِ أن الله يراكِ، ويسمع نجواكِ، ويعلم صدق سعيكِ، فلن تشعري بالوحشة أبداً، ولن تكوني مضطرة إلى أن تحملي هموم الحياة وحدكِ.</p>\n"}, {"tag": "الباب الثالث", "title": "الفصل الثاني: الصلاة موعدي مع الله", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الثَّالِث • الفَصْلُ الثَّانِي</div>\n<h1>الصَّلاَةُ مَوْعِدِي مَعَ اللَّه</h1>\n\n<p>إياكِ أن تجعلي الصلاة آخر ما تفكرين فيه وسط زحام يومكِ؛ فالصلاة ليست واجباً ثقيلاً يؤدى على عجل ليفرغ الإنسان منه، بل هي أعظم محطة استراحة يتزود منها القلب بالسكينة والنور.</p>\n\n<p>حين تقفين في صلاتكِ، تذكري أنكِ بين يدي ملك الملوك، تناجينه بكلامه، وتسألينه من واسع فضله، وتسجدين له خضوعاً وحباً.</p>\n\n<div class=\"hadith-box\">\n  <p>«أَحَبُّ الأَعْمَالِ إِلَى اللَّهِ أَدْوَمُهَا وَإِنْ قَلَّ»</p>\n  <div class=\"hadith-source\">متفق عليه</div>\n</div>\n\n<div class=\"interactive-box\">\n  <h3 style=\"margin-bottom: 6px;\">🕌 خطتي لتحسين صلاتي وخشوعي</h3>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"pray_time\" onchange=\"saveCheck(this.id, this.checked)\"/><span>المحافظة على الصلاة في أول وقتها دون تأخير.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"pray_wudu\" onchange=\"saveCheck(this.id, this.checked)\"/><span>إسباغ الوضوء واستحضار نيته المباركة.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"pray_phone\" onchange=\"saveCheck(this.id, this.checked)\"/><span>إبعاد الهاتف وتصفية الذهن قبل تكبيرة الإحرام.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"pray_tadabbur\" onchange=\"saveCheck(this.id, this.checked)\"/><span>تدبر معاني الفاتحة والآيات والتسبيح في الركوع والسجود.</span></div>\n</div>\n"}, {"tag": "الباب الثالث", "title": "الفصل الثالث: القرآن ربيع قلبي", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الثَّالِث • الفَصْلُ الثَّالِث</div>\n<h1>القُرْآنُ رَبِيعُ قَلْبِي</h1>\n\n<p>القرآن العظيم ليس كتاباً نضعه زينة على الرفوف، ولا مجرد حروف نمر عليها دون وعي أو تدبر؛ إنه كتاب هداية ونور وشفاء لما في الصدور، نتعلم منه أسرار الحياة وموازين الفلاح.</p>\n\n<div class=\"quran-box\">\n  <p>﴿كِتَابٌ أَنْزَلْنَاهُ إِلَيْكَ مُبَارَكٌ لِيَدَّبَّرُوا آيَاتِهِ وَلِيَتَذَكَّرَ أُولُو الْأَلْبَابِ﴾</p>\n  <div class=\"ayah-source\">[ص: ٢٩]</div>\n</div>\n\n<p>اجعلي لنفسكِ ورداً قرآنياً يومياً ثابتاً لا تفرطين فيه مهما تكاثرت عليكِ الشواغل، ولو كان صفحة واحدة بتأنٍ وتفسير ميسر.</p>\n\n<div class=\"interactive-box\">\n  <h3 style=\"margin-bottom: 8px;\">📖 تحدي التدبر القرآني الشخصي</h3>\n  <div class=\"field-group\">\n    <label>وردي اليومي الثابت المفضل لدي:</label>\n    <input class=\"field-input\" id=\"quran_wird\" placeholder=\"مثال: حزب يومي، أو ٤ صفحات مع التفسير...\" oninput=\"saveField(this.id, this.value)\"/>\n  </div>\n  <div class=\"field-group\">\n    <label>سورة عقدتُ العزم على تدبرها هذا الشهر:</label>\n    <input class=\"field-input\" id=\"quran_surah\" placeholder=\"مثال: سورة مريم، سورة النور، سورة الحجرات...\" oninput=\"saveField(this.id, this.value)\"/>\n  </div>\n</div>\n"}, {"tag": "الباب الثالث", "title": "الفصل الرابع: ماذا أفعل عندما أضعف؟", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الثَّالِث • الفَصْلُ الرَّابِع</div>\n<h1>مَاذَا أَفْعَلُ عِنْدَمَا أَضْعُف؟</h1>\n\n<p>قد تمر عليكِ أيام تشعرين فيها بالفتور، وتثقل عليكِ بعض الطاعات، وتضعف همتكِ؛ وهذا أمر يعتري كل إنسان. لكن الخطر يكمن في أن تجعلي الفتور المؤقت سبباً للانقطاع التام!</p>\n\n<p>إذا ضعفتِ فلا تيأسي: عودي فوراً إلى مصلاكِ، واستغفري ربكِ، وافتحي مصحفكِ، وأكثري من الاستغفار، واختاري عملاً يسيراً تداومين عليه حتى تعود شعلة القلب للإيقاد.</p>\n\n<div class=\"quran-box\">\n  <p>﴿لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ﴾</p>\n  <div class=\"ayah-source\">[الزمر: ٥٣]</div>\n</div>\n\n<div class=\"wisdom-pearl\">\n  <span class=\"wisdom-badge\">بلسم الفتور</span>\n  لا تنتظري هطول الحماس حتى تعودي إلى الله؛ فالطاعة الصادقة جهاد وصبر، ومن جاهد نفسه في الله هداه سبحانه سبل السكينة والثبات.\n</div>\n"}, {"tag": "الباب الثالث", "title": "الفصل الخامس: الخلوة الصادقة مع الله", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الثَّالِث • الفَصْلُ الخَامِس</div>\n<h1>الخَلْوَةُ الصَّادِقَةُ مَعَ اللَّه</h1>\n\n<p>خصصي في كل أسبوع وقتاً هادئاً تجلسين فيه وحدكِ مع الله: تراجعين فيه حساباتكِ، وتستغفرين من زلاتكِ، وتشكرينه على آلائه ونعمه التي لا تعد ولا تحصى.</p>\n\n<p>اطرحي على نفسكِ هذه الأسئلة الستة بصدق وتجرد:</p>\n\n<div class=\"interactive-box\">\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"review_pray\" onchange=\"saveCheck(this.id, this.checked)\"/><span>هل صلاتي تؤدى بخشوع وحضور قلب؟</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"review_tongue\" onchange=\"saveCheck(this.id, this.checked)\"/><span>هل حفظتُ لساني من الغيبة والنميمة والقيل والقال؟</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"review_justice\" onchange=\"saveCheck(this.id, this.checked)\"/><span>هل سلم الناس من ظني وكلامي ولم أظلم أحداً؟</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"review_parents\" onchange=\"saveCheck(this.id, this.checked)\"/><span>هل أديتُ حق والديّ بالبر والرحمة والإحسان؟</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"review_thanks\" onchange=\"saveCheck(this.id, this.checked)\"/><span>ما النعمة العظمى التي تحتاج مني إلى شكر متجدد؟</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"review_action\" onchange=\"saveCheck(this.id, this.checked)\"/><span>ما العمل الإيماني الذي أحتاج إلى تحسينه هذا الأسبوع؟</span></div>\n</div>\n"}, {"tag": "الباب الرابع", "title": "أحب نفسي وأبنيها", "type": "opener", "html": "\n<div class=\"opener\">\n  <div class=\"chapter-number\">البَابُ الرَّابِع</div>\n  <h1>أُحِبُّ نَفْسِي وَأَبْنِيهَا</h1>\n  <div class=\"subtitle\">التقدير الصحي للذات، التحرر من فخ المقارنة، وفن التعامل مع العثرات</div>\n  <div class=\"ornament\">❀ ❀ ❀</div>\n  <div class=\"wisdom-pearl\" style=\"max-width: 86%;\">\n    «حب الذات الصادق ليس أنانية ولا تعالياً، بل رعاية أمانة أودعها الله بين جنبيكِ لتصلحيها وتجعليها منارة خير.»\n  </div>\n</div>\n"}, {"tag": "الباب الرابع", "title": "الفصل الأول: التقدير الصحي للذات", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الرَّابِع • الفَصْلُ الأَوَّل</div>\n<h1>التَّقْدِيرُ الصِّحِّيُّ لِلذَّات</h1>\n\n<p>أن تحترمي نفسكِ لا يعني أن تري نفسكِ فوق الناس؛ وأن تعترفي بقدراتكِ لا يعني أن تنكري فضل الله ومنته عليكِ في كل خطوة.</p>\n\n<p>التقدير الصحي للذات هو أن تعاملي نفسكِ بإنصاف: تدركين كرامتكِ وحقوقكِ، وتعرفين حدودكِ، وتتقبلين ضعفكِ البشري، وتسعين في التطور الدائم دون جلد أو احتقار لنفسكِ.</p>\n\n<p>لا تربطي قيمتكِ أبداً بشكل جسدكِ، أو ماركة ثيابكِ، أو عدد متابعيكِ، أو تصفيق العابرين؛ فكل هذه قشور زائلة تتغير في لحظة، أما كرامتكِ وجوهركِ فيقومان على إيمانكِ، وعقلكِ، ونقائكِ، وأخلاقكِ.</p>\n"}, {"tag": "الباب الرابع", "title": "الفصل الثاني: لا تقارني رحلتك برحلة غيرك", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الرَّابِع • الفَصْلُ الثَّانِي</div>\n<h1>لاَ تُقَارِنِي رِحْلَتَكِ بِرِحْلَةِ غَيْرِك</h1>\n\n<p>قد ترين في محيطكِ فتاة تسبقكِ في دراسة، أو تملك موهبة تلفت الأنظار، أو حققت إنجازاً تمنيتِ لو كان لكِ؛ فافرحي لها بصدق ونقاء، واستلهمي من نجاحها، وإياكِ والحسد أو احتقار ذاتكِ.</p>\n\n<p>أنتِ لا ترين إلا الظاهر المعروض، ولا تعلمين ما تحمله النفوس من أوجاع وابتلاءات. المقارنة العادلة الوحيدة هي أن تنظري إلى نفسكِ اليوم وتقارنيها بنفسكِ بالأمس:</p>\n\n<div class=\"wisdom-pearl\">\n  <span class=\"wisdom-badge\">ميزان النمو الشخصي</span>\n  هل أصبحتِ اليوم أكثر علماً مما كنتِ؟ هل تحسن خلقكِ؟ هل صرتِ أكثر صبراً وانضباطاً؟ هل اقتربتِ خطوة من أهدافكِ؟ إن كان الجواب نعم، فأنتِ في قمة النجاح والتقدم، فلا تلتفتي!\n</div>\n"}, {"tag": "الباب الرابع", "title": "الفصل الثالث: كيف أتعامل مع أخطائي؟", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الرَّابِع • الفَصْلُ الثَّالِث</div>\n<h1>كَيْفَ أَتَعَامَلُ مَعَ أَخْطَائِي؟</h1>\n\n<p>الخطأ قدر بشري لا ينفك عن أحد؛ لكن تكراره بعناد وتبرير هو الذي يحول الزلة إلى عادة مدمرة. عندما تقعين في الخطأ، اتبعي هذه القواعد الست الحكيمة:</p>\n\n<div class=\"step-card\"><div class=\"step-num\">١</div><div class=\"step-content\"><strong>الاعتراف دون مراوغة:</strong> كوني شجاعة واعترفي بالخطأ لنفسكِ دون اختلاق مبررات واهية.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٢</div><div class=\"step-content\"><strong>الاعتذار الراقي:</strong> إذا تضرر أحد من تصرفكِ فبادري بالاعتذار الصادق.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٣</div><div class=\"step-content\"><strong>إصلاح الآثار:</strong> اجتهدي في جبر ما انكسر قدر وسعكِ.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٤</div><div class=\"step-content\"><strong>فهم السبب الجذري:</strong> لماذا حدث ذلك؟ وما الباب الذي دخل منه الخطأ؟</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٥</div><div class=\"step-content\"><strong>وضع حواجز حماية:</strong> صممي إجراءً يمنع تكرار الموقف في المستقبل.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٦</div><div class=\"step-content\"><strong>إغلاق ملف اللوم:</strong> لا تحولي الخطأ إلى وسم دائم يلاحقكِ مدى الحياة.</div></div>\n"}, {"tag": "الباب الرابع", "title": "الفصل الرابع: الثقة المتزنة بالنفس", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الرَّابِع • الفَصْلُ الرَّابِع</div>\n<h1>الثِّقَةُ المُتَّزِنَةُ بِالنَّفْس</h1>\n\n<p>الثقة الحقيقية ليست ادعاء معرفة كل شيء، بل الاستعداد الدائم للتعلم والتواضع؛ وليست الثقة علو الصوت في كل مجلس، بل معرفة متى تتحدثين بحكمة ومتى تصغين بأدب.</p>\n\n<p>كيف تبنين ثقتكِ المتزنة كل يوم؟</p>\n\n<div class=\"interactive-box\">\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"conf_learn\" onchange=\"saveCheck(this.id, this.checked)\"/><span>أتعلم باستمرار وأوسع دائرة معارفي.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"conf_promise\" onchange=\"saveCheck(this.id, this.checked)\"/><span>أفي بوعودي لنفسي وللآخرين مهما صغرت.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"conf_resp\" onchange=\"saveCheck(this.id, this.checked)\"/><span>أتحمل كامل المسؤولية عن قراراتي وسلوكي.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"conf_fear\" onchange=\"saveCheck(this.id, this.checked)\"/><span>أواجه مخاوفي بالتدرج والثقة في معية الله.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"conf_stop\" onchange=\"saveCheck(this.id, this.checked)\"/><span>أتوقف عن التماس رضا الجميع ومطاردة الاستحسان.</span></div>\n</div>\n"}, {"tag": "الباب الرابع", "title": "الفصل الخامس: أنا أستطيع أن أتغير", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الرَّابِع • الفَصْلُ الخَامِس</div>\n<h1>أَنَا أَسْتَطِيعُ أَنْ أَتَغَيَّر</h1>\n\n<p>إياكِ أن تقولي: «هذه طبيعتي ولن أتغير!»؛ فالعادات تكتسب بالممارسة، والمشاعر تهذب بالوعي، والطباع ترتقي بالمجاهدة والصبر.</p>\n\n<div class=\"step-card\"><div class=\"step-num\">✦</div><div class=\"step-content\"><strong>إذا كنتِ كثيرة التأجيل:</strong> ابدئي فوراً بمهمة صغيرة لمدة خمس دقائق فقط دون انقطاع.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">✦</div><div class=\"step-content\"><strong>إذا كنتِ تخافين الحديث:</strong> تدربي على التعبير عن رأيكِ في محيطكِ الأسري الآمن.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">✦</div><div class=\"step-content\"><strong>إذا كنتِ سريعة الغضب:</strong> تدربي على الصمت والتنفس العميق قبل إصدار أي حكم.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">✦</div><div class=\"step-content\"><strong>إذا كنتِ مشتتة الذهن:</strong> قنني وقت الهاتف واجعلي بيئة عملكِ نظيفة ومنظمة.</div></div>\n\n<div class=\"interactive-box\">\n  <label style=\"font-weight: 700; color: var(--accent-rose-dark); font-size: .85em;\">صفة قررتُ تغييرها اليوم، والخطوة العملية الأولى للبدء:</label>\n  <input class=\"field-input\" id=\"habit_change_plan\" placeholder=\"مثال: الاستيقاظ مبكراً -> وضع المنبه بعيداً عن السرير...\" oninput=\"saveField(this.id, this.value)\"/>\n</div>\n"}, {"tag": "الباب الخامس", "title": "عقلي ثروتي", "type": "opener", "html": "\n<div class=\"opener\">\n  <div class=\"chapter-number\">البَابُ الخَامِس</div>\n  <h1>عَقْلِي ثَرْوَتِي</h1>\n  <div class=\"subtitle\">شغف القراءة، بناء الفكر الناقد، إدارة الوقت، ومهارات المستقبل</div>\n  <div class=\"ornament\">❀ ❀ ❀</div>\n  <div class=\"wisdom-pearl\" style=\"max-width: 86%;\">\n    «العقل زينة الإنسان وبوابته إلى النفع؛ وفتاة تقرأ وتبني وعيها هي شمس تضيء درب أسرتها وأمتها.»\n  </div>\n</div>\n"}, {"tag": "الباب الخامس", "title": "الفصل الأول: كوني فتاة تقرأ", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الخَامِس • الفَصْلُ الأَوَّل</div>\n<h1>كُونِي فَتَاةً تَقْرَأ</h1>\n\n<p>هناك فرق شاسع بين فتاة تمضي الساعات الطوال تستهلك ما يلقيه الآخرون في وسائل التواصل، وبين فتاة تقتطع من يومها وقتاً لتغذية عقلها بقراءة نافعة واعية.</p>\n\n<p>القراءة تصقل فكركِ، وتوسع آفاقكِ، وترتقي بلسانكِ، وتمنحكِ تجارب أجيال سبقتكِ. اجعلي لكِ مكتبة شخصية مباركة تضم هذه العناوين المختارة:</p>\n\n<div class=\"interactive-box\">\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"book_saadi\" onchange=\"saveCheck(this.id, this.checked)\"/><span><strong>تفسير السعدي (تيسير الكريم الرحمن):</strong> لفهم وتدبر آيات القرآن.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"book_nawawi40\" onchange=\"saveCheck(this.id, this.checked)\"/><span><strong>الأربعون النووية للإمام النووي:</strong> معالم الدين وقواعد الإيمان.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"book_riyad\" onchange=\"saveCheck(this.id, this.checked)\"/><span><strong>رياض الصالحين للإمام النووي:</strong> تهذيب الأخلاق والعبادات.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"book_raheeq\" onchange=\"saveCheck(this.id, this.checked)\"/><span><strong>الرحيق المختوم لصفي الرحمن المباركفوري:</strong> في السيرة النبوية العطرة.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"book_fawaid\" onchange=\"saveCheck(this.id, this.checked)\"/><span><strong>الفوائد لابن قيم الجوزية:</strong> لطائف التدبر وتزكية الروح.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"book_ghazali\" onchange=\"saveCheck(this.id, this.checked)\"/><span><strong>جدد حياتك لمحمد الغزالي:</strong> ربط الدين بالحياة والتفكير الإيجابي.</span></div>\n</div>\n"}, {"tag": "الباب الخامس", "title": "الفصل الثاني: العلم يصنع الفرق", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الخَامِس • الفَصْلُ الثَّانِي</div>\n<h1>العِلْمُ يَصْنَعُ الفَرْق</h1>\n\n<p>إياكِ أن تحصري مفهوم العلم في الشهادة الدراسية التي تعلق على الجدار؛ فالعلم الحقيقي هو ما غير نظرتكِ للحياة، وهذب سلوككِ، وعلمكِ كيف تعبدين الله على بصيرة وكيف تنفعين خلقه.</p>\n\n<p>أتقني تخصصكِ، واكتسبي المهارات التي يحتاج إليها مجتمعكِ، وتعلمي كيف تبحثين وتستوثقين قبل أن تتكلمي أو تنشري. العلم الذي لا يصحبه عمل يبقى حجة على صاحبه، أما العلم النافع فيرفع قدركِ في الدنيا والآخرة.</p>\n\n<div class=\"wisdom-pearl\">\n  <span class=\"wisdom-badge\">نور البصيرة</span>\n  ليست العبرة بكثرة ما تجمعين من معلومات؛ بل بعمق ما تفهمين، وصدق ما تطبقين، وجمال ما تورثينه في نفوس الآخرين من هدى ونفع.\n</div>\n"}, {"tag": "الباب الخامس", "title": "الفصل الثالث: كيف أبني فكري؟", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الخَامِس • الفَصْلُ الثَّالِث</div>\n<h1>كَيْفَ أَبْنِي فِكْرِي؟</h1>\n\n<p>لا تكوني كالإسفنجة التي تمتص كل سائل يعرض عليها دون تمييز! في زمن السيولة الفكرية، تحتاج الفتاة إلى حصانة عقلية وتفكير ناقد أصيل يحمي هويتها وقيمها.</p>\n\n<p>كلما صادفكِ رأي أو منشور أو فكرة، اسألي نفسكِ هذه الأسئلة الخمسة:</p>\n\n<div class=\"step-card\"><div class=\"step-num\">١</div><div class=\"step-content\"><strong>من قائل هذه المعلومة؟</strong> وهل هو متخصص موثوق أم مجرد متكلم عابر؟</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٢</div><div class=\"step-content\"><strong>ما دليله وبرهانه؟</strong> هل استند إلى أصل محكم أم مجرد هوى وظن؟</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٣</div><div class=\"step-content\"><strong>هل يوافق ثوابت ديني وقيمي؟</strong> الميزان الحاكم هو الوحي المعصوم.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٤</div><div class=\"step-content\"><strong>ما الهدف والغاية من هذا الطرح؟</strong> ومن المستفيد من انتشاره؟</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٥</div><div class=\"step-content\"><strong>هل الصورة كاملة؟</strong> ابحثي عن الزوايا الغائبة قبل الحكم.</div></div>\n"}, {"tag": "الباب الخامس", "title": "الفصل الرابع: إدارة الوقت", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الخَامِس • الفَصْلُ الرَّابِع</div>\n<h1>إِدَارَةُ الوَقْتِ هِيَ إِدَارَةُ العُمْر</h1>\n\n<p>الوقت ليس ساعات تمر على عقارب الساعة، بل هو أنفاسكِ وعمركِ ورأس مالكِ الحقيقي الذي إن ضاع فلن يعود أبداً.</p>\n\n<div class=\"hadith-box\">\n  <p>«نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ: الصِّحَّةُ وَالفَرَاغُ»</p>\n  <div class=\"hadith-source\">رواه البخاري</div>\n</div>\n\n<p>نموذج مقترح ليوم متوازن مبارك:</p>\n\n<div class=\"interactive-box\">\n  <div style=\"font-size: .88em; line-height: 1.8;\">\n    <p>🌅 <strong>الفجر:</strong> الصلاة في وقتها، أذكار الصباح، ورد القرآن، وانطلاقة بنشاط.</p>\n    <p>☀️ <strong>الصباح:</strong> الدراسة، العمل، وإنجاز المهام التي تحتاج إلى تركيز ذهني عالٍ.</p>\n    <p>🌤️ <strong>الظهر:</strong> صلاة الظهر، قسط راحة خفيف، وتغذية متوازنة.</p>\n    <p>🌇 <strong>العصر:</strong> تنمية المهارات، القراءة، والرياضة أو الحركة البدنية.</p>\n    <p>🌙 <strong>المغرب:</strong> صلة الرحم، الجلوس مع الأسرة، وإنجاز الواجبات المنزلية.</p>\n    <p>🌌 <strong>العشاء:</strong> صلاة العشاء والوتر، مراجعة إنجازات اليوم، والنوم المبكر.</p>\n  </div>\n</div>\n"}, {"tag": "الباب الخامس", "title": "الفصل الخامس: مهارات تصنع مستقبلي", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الخَامِس • الفَصْلُ الخَامِس</div>\n<h1>مَهَارَاتٌ تَصْنَعُ مُسْتَقْبَلِي</h1>\n\n<p>استثمري سنوات شبابكِ في تعلم مهارات تبقى معكِ وتبني استقلالكِ وثقتكِ ونفعكِ للمجتمع:</p>\n\n<div class=\"step-card\"><div class=\"step-num\">١</div><div class=\"step-content\">مهارة التواصل الراقي والحوار الفعال.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٢</div><div class=\"step-content\">الكتابة والتعبير وصياغة الأفكار.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٣</div><div class=\"step-content\">إدارة الوقت والمهام والانضباط الذاتي.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٤</div><div class=\"step-content\">استخدام التقنية والذكاء الاصطناعي بوعي وأمان.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٥</div><div class=\"step-content\">البحث والتحقق والتدقيق المعرفي.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٦</div><div class=\"step-content\">التفكير وحل المشكلات والتخطيط العملي.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٧</div><div class=\"step-content\">لغة ثانية تفتح لكِ نوافذ العلم والدعوة.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٨</div><div class=\"step-content\">الإدارة المالية الشخصية وثقافة الادخار.</div></div>\n\n<div class=\"interactive-box\">\n  <label style=\"font-weight: 700; color: var(--accent-rose-dark); font-size: .85em;\">المهارة التي سأبدأ في تعلمها هذا الشهر ومصدرها:</label>\n  <input class=\"field-input\" id=\"skill_monthly_focus\" placeholder=\"اسم المهارة + الدورة أو الكتاب + ساعتان أسبوعياً...\" oninput=\"saveField(this.id, this.value)\"/>\n</div>\n"}, {"tag": "الباب السادس", "title": "شخصيتي هويتي", "type": "opener", "html": "\n<div class=\"opener\">\n  <div class=\"chapter-number\">البَابُ السَّادِس</div>\n  <h1>شَخْصِيَّتِي هُوِيَّتِي</h1>\n  <div class=\"subtitle\">قوة الشخصية المتزنة، بهاء الحياء، فن الحوار، والحدود الصحية والصحبة الصالحة</div>\n  <div class=\"ornament\">❀ ❀ ❀</div>\n  <div class=\"wisdom-pearl\" style=\"max-width: 86%;\">\n    «الجمال الحقيقي للشخصية أن تجمع الفتاة بين عزة النفس ولين الجانب، وقوة الحجة وعذوبة اللسان.»\n  </div>\n</div>\n"}, {"tag": "الباب السادس", "title": "الفصل الأول: قوة الشخصية ليست قسوة", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ السَّادِس • الفَصْلُ الأَوَّل</div>\n<h1>قُوَّةُ الشَّخْصِيَّةِ لَيْسَتْ قَسْوَة</h1>\n\n<p>تخطئ بعض الفتيات حين يظنن أن قوة الشخصية تقتضي رفع الصوت، أو التعنت في الرأي، أو رفض الاعتذار، أو الرد الجاف على كل كلمة. هذا تشوه للمفهوم وضعف متستر بالقسوة!</p>\n\n<p>قوة الشخصية الحقيقية تنبع من معرفتكِ لمبادئكِ، وثباتكِ على قيمكِ، وقدرتكِ على التعبير عن رأيكِ بأدب واحترام بالغين، وتحملكِ الكامل لمسؤولية أفعالكِ.</p>\n\n<div class=\"wisdom-pearl\">\n  <span class=\"wisdom-badge\">معادلة الشخصية الراقية</span>\n  أن تكوني لطيفة لا يعني أن تكوني مهزومة أو مستباحة الحقوق؛ وأن تكوني حازمة لا يعني أن تكوني فظة أو قاسية. كوني قوية في الحق، رحيمة في التعامل، واضحة في مواقفكِ دون ضجيج.\n</div>\n"}, {"tag": "الباب السادس", "title": "الفصل الثاني: الحياء والثقة", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ السَّادِس • الفَصْلُ الثَّانِي</div>\n<h1>الحَيَاءُ وَالثِّقَة</h1>\n\n<p>الحياء خلق الإسلام الرفيع، وهو تاج جمال الفتاة المسلمة. وهو بريء تماماً من الضعف أو الخوف أو التنازل عن الحق أو العجز عن النطق بالصواب.</p>\n\n<div class=\"hadith-box\">\n  <p>«الحَيَاءُ لاَ يَأْتِي إِلاَّ بِخَيْرٍ»</p>\n  <div class=\"hadith-source\">متفق عليه</div>\n</div>\n\n<p>يمكنكِ أن تكوني فتاة شديدة الحياء وفي الوقت ذاته واثقة من خطاكِ، متواضعة لله لكنها ذات همة تناطح السحاب، مهذبة الألفاظ وحازمة في رفض المنكر والابتذال.</p>\n"}, {"tag": "الباب السادس", "title": "الفصل الثالث: فن الحوار", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ السَّادِس • الفَصْلُ الثَّالِث</div>\n<h1>فَنُّ الحِوَارِ الرَّاقِي</h1>\n\n<p>الحوار ليس معركة لتسجيل النقاط والانتصار للنفس؛ بل وسيلة للتفاهم وتوضيح الرؤى وتقريب القلوب. عندما تتحاورين مع أي إنسان، التزمي بهذه الآداب السبعة:</p>\n\n<div class=\"step-card\"><div class=\"step-num\">١</div><div class=\"step-content\"><strong>الإنصات الواعي:</strong> استمعي لتفهمي ما يقال، لا لتردي فقط.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٢</div><div class=\"step-content\"><strong>عدم المقاطعة:</strong> دعي المتكلم يكمل فكرته باحترام.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٣</div><div class=\"step-content\"><strong>انتقاء الكلمات:</strong> اختاري اللفظ الألطف والأبين.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٤</div><div class=\"step-content\"><strong>احترام المخالف:</strong> ناقشي الفكرة وابتعدي عن نقد الشخص.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٥</div><div class=\"step-content\"><strong>الاعتراف بقلة العلم:</strong> قولي «لا أعلم» إن كنتِ لا تعرفين.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٦</div><div class=\"step-content\"><strong>سرعة الاعتذار:</strong> إن بدرت منكِ زلة فسارعي لجبرها.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٧</div><div class=\"step-content\"><strong>رد الإساءة بالإحسان:</strong> ارفضي الباطل دون أن تسقطي في مستنقع الإساءة.</div></div>\n"}, {"tag": "الباب السادس", "title": "الفصل الرابع: كيف أضع حدوداً صحية؟", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ السَّادِس • الفَصْلُ الرَّابِع</div>\n<h1>كَيْفَ أَضَعُ حُدُوداً صِحِّيَّة؟</h1>\n\n<p>من حقكِ الشرعي والنفسي أن تحمي خصوصيتكِ، وأن ترفضي ما يتعارض مع قيمكِ ومبادئكِ، وأن تبتعدي عن كل علاقة تستنزف طاقتكِ أو تدفعكِ إلى معصية.</p>\n\n<p>ليس مطلوباً منكِ أن تقولي «نعم» لكل طلب حتى تكسبين حب الناس؛ فـ«نعم» التي تقال على حساب دينكِ وراحتكِ ثمنها باهظ جداً!</p>\n\n<div class=\"interactive-box\">\n  <h3 style=\"margin-bottom: 8px;\">💬 عبارات راقية لوضع الحدود:</h3>\n  <p>• «أعتذر، هذا الأمر لا يناسب قناعاتي ومبادئي.»</p>\n  <p>• «أفضل عدم مشاركة هذه المعلومة الشخصية، مع احترامي لكِ.»</p>\n  <p>• «أحتاج وقتاً للتفكير قبل إعطاء جواب نهائي.»</p>\n  <p>• «أقدر رأيكِ، لكنني لستُ مرتاحة لهذا التصرف.»</p>\n</div>\n"}, {"tag": "الباب السادس", "title": "الفصل الخامس: اختاري صديقاتك بعناية", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ السَّادِس • الفَصْلُ الخَامِس</div>\n<h1>اخْتَارِي صَدِيقَاتِكِ بِعِنَايَة</h1>\n\n<p>الصداقة ليست بكثرة المتابعين والأسماء المحفوظة في الهاتف؛ بل بوجود أرواح نقية تعينكِ على طاعة الله وتأخذ بيدكِ إلى الفلاح.</p>\n\n<div class=\"hadith-box\">\n  <p>«المَرْءُ عَلَى دِينِ خَلِيلِهِ، فَلْيَنْظُرْ أَحَدُكُمْ مَنْ يُخَالِلُ»</p>\n  <div class=\"hadith-source\">رواه أبو داود والترمذي</div>\n</div>\n\n<p>اختاري الصديقة التي:</p>\n<div class=\"step-card\"><div class=\"step-num\">🌸</div><div class=\"step-content\">تذكركِ بالله وتعينكِ على الصلاة وتفرح لقربكِ من الطاعة.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">🌸</div><div class=\"step-content\">تحفظ سركِ وتذب عن عرضكِ في غيابكِ.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">🌸</div><div class=\"step-content\">تفرح لنجاحكِ بصدق دون غيرة، وتنصحكِ برفق إن أخطأتِ.</div></div>\n<p style=\"font-size: .9em; color: var(--text-secondary); text-align: center;\">وكوني أنتِ أيضاً تلك الصديقة الوفية الصالحة لمن يصاحبكِ.</p>\n"}, {"tag": "الباب السابع", "title": "قلبي أمانة", "type": "opener", "html": "\n<div class=\"opener\">\n  <div class=\"chapter-number\">البَابُ السَّابِع</div>\n  <h1>قَلْبِي أَمَانَة</h1>\n  <div class=\"subtitle\">فهم المشاعر، التعامل مع الحزن والغضب والخذلان، وبلوغ السلام الداخلي</div>\n  <div class=\"ornament\">❀ ❀ ❀</div>\n  <div class=\"wisdom-pearl\" style=\"max-width: 86%;\">\n    «القلب ملك الجوارح؛ إذا صلح بطمأنينة الإيمان والرضا، استقامت كل أركان الحياة.»\n  </div>\n</div>\n"}, {"tag": "الباب السابع", "title": "الفصل الأول: افهمي مشاعرك", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ السَّابِع • الفَصْلُ الأَوَّل</div>\n<h1>افْهَمِي مَشَاعِرَك</h1>\n\n<p>المشاعر موجات طبيعية تعتري النفس البشرية: فرح، حزن، خوف، غيرة، توتر، حماس؛ ووجود الشعور في صدركِ لا يعني أبداً أنكِ سيئة، لكن المحك هو كيف تفهمينه وتتعاملين معه بحكمة.</p>\n\n<p>إياكِ أن تتخذي قراراً مصيرياً وأنتِ في فورة الغضب، وإياكِ أن تفسري كل موقف على أنه استهداف شخصي لكِ. اسألي نفسكِ دائماً:</p>\n\n<div class=\"step-card\"><div class=\"step-num\">١</div><div class=\"step-content\">ما الذي أشعر به بدقة في هذه اللحظة؟ (تسمية الشعور نصف الحل).</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٢</div><div class=\"step-content\">ما الموقف أو الفكرة التي أوقدت هذا الشعور؟</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٣</div><div class=\"step-content\">ما الذي أحتاجه الآن لتهدأ نفسي؟ (وضوء، مشي، حديث مع حكيمة).</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٤</div><div class=\"step-content\">ما التصرف الأرقى والأكثر حكمة وموافقة لشرع الله؟</div></div>\n"}, {"tag": "الباب السابع", "title": "الفصل الثاني: حين تحزنين", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ السَّابِع • الفَصْلُ الثَّانِي</div>\n<h1>حِينَ تَحْزَنِين</h1>\n\n<p>يا بنيتي... ليس مطلوباً منكِ أن تتصنعي الابتسامة طوال الوقت، ولا أن تتظاهري بأن كل شيء على ما يرام وأنتِ تتألمين في داخلكِ؛ فالحزن عاطفة بشرية بكى منها خير البشر صلى الله عليه وسلم حين فاضت عيناه رحمة.</p>\n\n<p>عندما يطرق الحزن باب قلبكِ:</p>\n<div class=\"step-card\"><div class=\"step-num\">✦</div><div class=\"step-content\">امنحي نفسكِ وقتاً هادئاً لتفريغ المشاعر والتحدث مع الله في سجود طويل.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">✦</div><div class=\"step-content\">شاركي من تثقين بحكمتها وديانتها من والدتكِ أو مربيتكِ.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">✦</div><div class=\"step-content\">دوني مشاعركِ في أوراق لتتضح أبعاد المشكلة أمامكِ.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">✦</div><div class=\"step-content\">حافظي على طعامكِ ونومكِ وحركتكِ، ولا تستسلمي للعزلة القاتمة.</div></div>\n\n<div class=\"wisdom-pearl\">\n  <span class=\"wisdom-badge\">تنبيه تربوي ونفسي</span>\n  إذا استمر الحزن لأسابيع وأعاق دراستكِ ونومكِ ونشاطكِ، فلا تترددي في طلب مساعدة مختصة نفسية مؤهلة؛ فطلب العلاج والرعاية أخذ بالأسباب المشروعة وليس ضعفاً في الإيمان.\n</div>\n"}, {"tag": "الباب السابع", "title": "الفصل الثالث: حين تغضبين", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ السَّابِع • الفَصْلُ الثَّالِث</div>\n<h1>حِينَ تَغْضَبِين</h1>\n\n<p>الغضب نار تلتهب في الصدر، تدفع الإنسان إلى كلمات قاسية وقرارات طائشة يندم عليها دهراً طويلاً بعد أن تنطفئ ثورته.</p>\n\n<div class=\"hadith-box\">\n  <p>«لاَ تَغْضَبْ»</p>\n  <div class=\"hadith-source\">رواه البخاري (كررها النبي ﷺ مراراً لمن استوصاه)</div>\n</div>\n\n<p>تدربي على خطة الإطفاء النبوية الخماسية:</p>\n<div class=\"step-card\"><div class=\"step-num\">١</div><div class=\"step-content\"><strong>الصمت التام:</strong> عودي لسانكِ ألا ينطق بحرف واحد في أول لحظات الغضب.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٢</div><div class=\"step-content\"><strong>الاستعاذة بالله:</strong> قولي بقلبكِ ولسانكِ: «أعوذ بالله من الشيطان الرجيم».</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٣</div><div class=\"step-content\"><strong>تغيير الهيئة:</strong> إن كنتِ واقفة فاجلسي، وإن كنتِ جالسة فاضطجعي.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٤</div><div class=\"step-content\"><strong>الوضوء بالماء البارد:</strong> فإن الماء يطفئ لهيب الغضب.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٥</div><div class=\"step-content\"><strong>تأجيل النقاش:</strong> قولي بهدوء: «سنتحدث في هذا الأمر لاحقاً بعد أن نهدأ».</div></div>\n"}, {"tag": "الباب السابع", "title": "الفصل الرابع: حين يخذلك أحد", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ السَّابِع • الفَصْلُ الرَّابِع</div>\n<h1>حِينَ يَخْذُلُكِ أَحَد</h1>\n\n<p>أشد الآلام وطأة على القلب الرقيق أن يأتيه الجفاء أو الخذلان من صديقة وثق بها، أو قريبة انتظر منها الدعم والوفاء. إذا مررتِ بهذا الموقف فتذكري:</p>\n\n<p><strong>أولاً:</strong> ليس كل من خالف توقعاتكِ عدواً يتربص بكِ؛ فالبشر يعتريهم القصور والضعف والنسيان وسوء التقدير.</p>\n\n<p><strong>ثانياً:</strong> انتهاء علاقة معينة لا يعني أنكِ فشلتِ أو أنكِ غير جديرة بالحب والاحترام؛ بل قد يكون صرفاً إلهياً حكيماً لشر لم تكوني تعلمينه.</p>\n\n<p><strong>ثالثاً:</strong> سامحي في قلبكِ لوجه الله لتتحرري من سموم الحقد، ولكن ضعي الحدود الواعية التي تحفظ كرامتكِ وتمنع تكرار الأذى.</p>\n"}, {"tag": "الباب السابع", "title": "الفصل الخامس: السلام الداخلي", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ السَّابِع • الفَصْلُ الخَامِس</div>\n<h1>السَّلاَمُ الدَّاخِلِيّ</h1>\n\n<p>السلام الداخلي ليس انعدام المشكلات في الحياة؛ بل هو القدرة على خوض أمواجها بسكينة ورضا ويقين بأن كل ما يقدره الله هو الخير المحض.</p>\n\n<div class=\"quran-box\">\n  <p>﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾</p>\n  <div class=\"ayah-source\">[الرعد: ٢٨]</div>\n</div>\n\n<p>أبواب السلام الثمانية لقلبكِ:</p>\n<div class=\"step-card\"><div class=\"step-num\">١</div><div class=\"step-content\">اليقين التام بعدل الله ورحمته في قضائه وقدره.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٢</div><div class=\"step-content\">المداومة على ذكر الله والدعاء في كل آن.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٣</div><div class=\"step-content\">إغلاق باب المقارنات والتطلع لما في أيدي الآخرين.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٤</div><div class=\"step-content\">العفو عن الزلات وتصفية الصدور من الشحناء.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٥</div><div class=\"step-content\">ترتيب شؤون الحياة وإبعاد الفوضى.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٦</div><div class=\"step-content\">العناية بصحة الجسد والنوم الهادئ الكافي.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٧</div><div class=\"step-content\">بذل المعروف ومساعدة المحتاجين دون مقابل.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">٨</div><div class=\"step-content\">الرضا بما قسم الله مع مواصلة السعي والإحسان.</div></div>\n"}, {"tag": "الباب الثامن", "title": "أنوثتي وكرامتي وهويتي", "type": "opener", "html": "\n<div class=\"opener\">\n  <div class=\"chapter-number\">البَابُ الثَّامِن</div>\n  <h1>أُنُوثَتِي وَكَرَامَتِي وَهُوِيَّتِي</h1>\n  <div class=\"subtitle\">الاعتزاز بالهوية، بهاء الحياء والعفة، الجمال الشامل، والطموح الراقي</div>\n  <div class=\"ornament\">❀ ❀ ❀</div>\n  <div class=\"wisdom-pearl\" style=\"max-width: 86%;\">\n    «الأنوثة في ميزان الإسلام وقار، ورقة، وحياء، وحضور إيجابي يبني الحياة دون ابتذال أو انسحاق.»\n  </div>\n</div>\n"}, {"tag": "الباب الثامن", "title": "الفصل الأول: أعتز بكوني مسلمة", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الثَّامِن • الفَصْلُ الأَوَّل</div>\n<h1>أَعْتَزُّ بِكَوْنِي مُسْلِمَة</h1>\n\n<p>هويتكِ الإسلامية ليست ثوباً تلبسينه في المسجد وتخلعينه خارجه؛ بل هي جوهر وجودكِ، وبوصلة فكركِ، وسر عزتكِ وكرامتكِ في هذا الوجود.</p>\n\n<p>كوني معتزة بدينكِ، فخورة بحجابكِ وعفتكِ، مدركة لحكمة تشريعاته التي صانت المرأة ورفعت مكانتها وكرمتها بنتاً وأختاً وزوجة وأماً ومربية.</p>\n\n<div class=\"wisdom-pearl\">\n  <span class=\"wisdom-badge\">عزة الإيمان</span>\n  لا تجعلي التزامكِ مجرد مظهر تقليدي؛ بل اجعليه عقيدة تنبض في الصدر، وخلقاً يتجلى في المعاملات، ورحمة تسع الجميع، وصدقاً في كل قول وفعل.\n</div>\n"}, {"tag": "الباب الثامن", "title": "الفصل الثاني: الحياء جمال", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الثَّامِن • الفَصْلُ الثَّانِي</div>\n<h1>الحَيَاءُ جَمَالٌ وَبَهَاء</h1>\n\n<p>الحياء هو الزينة التي لا تبلى، والنور الذي يضفي على ملامح الفتاة هيبة ووقاراً ومحبة في قلوب الصالحين والصالحات.</p>\n\n<p>الحياء ليس ضعفاً ولا تردداً ولا انسحاباً من ميادين العلم والإبداع؛ بل هو السياج الحصين الذي يحمي جوهركِ من أن يبتذل، ويحفظ صوتكِ وكلماتكِ وأفعالكِ في أبهى وأرفع مقام.</p>\n\n<p>كوني جريئة في طلب المعرفة النافعة، واثقة في قول الحق، عفيفة في خطاكِ وحركاتكِ، حريصة على ما يرضي الله تعالى عنكِ في السر والعلن.</p>\n"}, {"tag": "الباب الثامن", "title": "الفصل الثالث: جمالي أوسع من مظهري", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الثَّامِن • الفَصْلُ الثَّالِث</div>\n<h1>جَمَالِي أَوْسَعُ مِنْ مَظْهَرِي</h1>\n\n<p>من الجميل أن تعتني الفتاة بمظهرها وأناقتها ونظافتها وحسن ثيابها؛ فهذا من الفطرة السليمة والذوق الراقي الذي يحبه الله تعالى، لكن الخلل يقع حين تختزل قيمتها كلها في مقاييس المظهر الخارجي!</p>\n\n<p>هناك جمال في عفة لسانكِ وطيب كلامكِ، وجمال في رحمة قلبكِ بوالديكِ وإخوتكِ، وجمال في اتساع عقلكِ وحكمتكِ، وجمال في وقاركِ واعتزازكِ بحجابكِ.</p>\n\n<div class=\"wisdom-pearl\">\n  <span class=\"wisdom-badge\">الحقيقة الغائبة</span>\n  لا تقارني شكلكِ بصور المنصات المصقولة بالمؤثرات والعدسات الزائفة؛ فمعظمها أقنعة لا تمت للواقع بصلة. جمالكِ الحقيقي هو نتاج طهارة قلبكِ وصدق روحكِ.\n</div>\n"}, {"tag": "الباب الثامن", "title": "الفصل الرابع: العناية بنفسي", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الثَّامِن • الفَصْلُ الرَّابِع</div>\n<h1>العِنَايَةُ الشَّامِلَةُ بِنَفْسِي</h1>\n\n<p>جسدكِ ونفسكِ أمانة عندكِ من الله تعالى، وحسن رعايتهما عبادة وشكر للمنعم سبحانه. احرصي على هذه الأركان الثمانية:</p>\n\n<div class=\"interactive-box\">\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"care_hygiene\" onchange=\"saveCheck(this.id, this.checked)\"/><span><strong>النظافة التامة:</strong> السواك، والتطيب في البيت، وحسن الهندام.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"care_food\" onchange=\"saveCheck(this.id, this.checked)\"/><span><strong>الغذاء الصحي:</strong> تناول الأطعمة الطيبة الطبيعية والابتعاد عن المصنعات.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"care_water\" onchange=\"saveCheck(this.id, this.checked)\"/><span><strong>شرب الماء:</strong> ترطيب الجسد باستمرار على مدار اليوم.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"care_sleep\" onchange=\"saveCheck(this.id, this.checked)\"/><span><strong>النوم الكافي:</strong> النوم ليلاً لتجديد خلايا الدماغ والجسد.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"care_move\" onchange=\"saveCheck(this.id, this.checked)\"/><span><strong>الحركة والنشاط:</strong> ممارسة المشي والتمارين الخفيفة لتنشيط الدورة الدموية.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"care_skin\" onchange=\"saveCheck(this.id, this.checked)\"/><span><strong>العناية بالبشرة والشعر:</strong> بالزيوت والمكونات الطبيعية المعتدلة.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"care_mind\" onchange=\"saveCheck(this.id, this.checked)\"/><span><strong>الراحة الذهنية:</strong> أخذ فترات استرخاء بعيداً عن الشاشات والأخبار.</span></div>\n  <div class=\"checkbox-item\"><input type=\"checkbox\" id=\"care_doctor\" onchange=\"saveCheck(this.id, this.checked)\"/><span><strong>المتابعة الصحية:</strong> استشارة الطبيبة عند الشعور بأي تعب دون إهمال.</span></div>\n</div>\n"}, {"tag": "الباب الثامن", "title": "الفصل الخامس: طموحي لا يتعارض مع عفتي", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ الثَّامِن • الفَصْلُ الخَامِس</div>\n<h1>طُمُوحِي لاَ يَتَعَارَضُ مَعَ عِفَّتِي</h1>\n\n<p>كوني صاحبة طموح عالٍ، وفكر متقد، ورغبة صادقة في التفوق العلمي والمهني والريادي. فالإسلام لم يقيد المرأة عن التعلم والإنجاز والنفع، بل فتح لها أبواب المجد تحت ظلال الكرامة والعفة.</p>\n\n<p>تأملي سيرة أمهات المؤمنين والصحابيات الجليلات: كيف كن عالمات، وفقيهات، وطبيبات، وتاجرات، ومربيات لأعظم جيل عرفه التاريخ، دون أن يفرطن في حياء أو يساومن على ستر.</p>\n\n<div class=\"wisdom-pearl\">\n  <span class=\"wisdom-badge\">وصية الباب</span>\n  اجمعي بين العلم النافع والخلق الرفيع، وبين الطموح العالي والالتزام الصادق، وكوني برهاناً ساطعاً على أن الفتاة المسلمة قادرة على بلوغ القمم دون أن تخسر حياءها.\n</div>\n"}, {"tag": "الباب التاسع", "title": "أنا صانعة أثر", "type": "opener", "html": "\n<div class=\"opener\">\n  <div class=\"chapter-number\">البَابُ التَّاسِع</div>\n  <h1>أَنَا صَانِعَةُ أَثَر</h1>\n  <div class=\"subtitle\">نفع الأسرة، خدمة المجتمع، القدوة بالأفعال، وأجور عظيمة في أعمال صغيرة</div>\n  <div class=\"ornament\">❀ ❀ ❀</div>\n  <div class=\"wisdom-pearl\" style=\"max-width: 86%;\">\n    «ليس المهم كم عشتِ من السنين؛ بل كم زرعتِ في تلك السنين من بذور الخير التي ستظل تورق وتؤتي أكلها بعد رحيلكِ.»\n  </div>\n</div>\n"}, {"tag": "الباب التاسع", "title": "الفصل الأول: ماذا سأترك خلفي؟", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ التَّاسِع • الفَصْلُ الأَوَّل</div>\n<h1>مَاذَا سَأَتْرُكُ خَلْفِي؟</h1>\n\n<p>تخيلي أنكِ بعد عشرين أو ثلاثين سنة تنظرين إلى شريط حياتكِ المنقضي... فما الذي تحبين أن تتذكريه؟ هل تحبين أن تتذكري آلاف الساعات التي ضاعت في تصفح سفاسف الأمور؟</p>\n\n<p>أم تحبين أن تتذكري علماً علمتِه لمن يجهله، وقلباً كسراً جبرتِه بكلمة طيبة، ووالدين قرت أعينهما ببركِ وإحسانكِ، ومشروعاً نافعاً غرستِ بذرته فأورق شجراً ظليلاً؟</p>\n\n<div class=\"hadith-box\">\n  <p>«مَنْ دَلَّ عَلَى خَيْرٍ فَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ»</p>\n  <div class=\"hadith-source\">رواه مسلم</div>\n</div>\n\n<p>الأثر الصادق لا يشترط أن يكون عملاقاً تهتف له الجماهير؛ بل كلمة حانية في وقت شدة قد تنقذ روحاً وتغير مسار حياة إنسان بالكامل.</p>\n"}, {"tag": "الباب التاسع", "title": "الفصل الثاني: فتاة تنفع أسرتها", "type": "reading", "html": "\n<div class=\"eyebrow\">البَابُ التَّاسِع • الفَصْلُ الثَّانِي</div>\n<h1>فَتَاةٌ تَنْفَعُ أُسْرَتَهَا</h1>\n\n<p>لا تنتظري أن تخرجي إلى العالم لتكوني نافعة ومؤثرة؛ فميدان الأثر الأول والأعظم هو بيتكِ الذي نشأتِ فيه، وبين والديكِ وإخوتكِ.</p>\n\n<div class=\"quran-box\">\n  <p>﴿وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا﴾</p>\n  <div class=\"ayah-source\">[الإسراء: ٢٣]</div>\n</div>\n\n<p>ساعدي أمكِ في أعباء البيت دون تضجر، وأدخلي السرور على قلب أبيكِ بكلمة حانية ودعاء طيب، وكوني أذناً صاغية لإخوتكِ وأخواتكِ ومصدر أمان ودفء لهم. النجاح في الخارج لا يبرر أبداً التقصير والجفاء في الداخل.</p>\n"}, {"tag": "الباب التاسع", "title": "الفصل الثالث: فتاة تنفع مجت
