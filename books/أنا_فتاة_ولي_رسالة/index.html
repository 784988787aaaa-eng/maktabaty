<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="theme-color" content="#FAF6F0"/>
  <meta name="color-scheme" content="light"/>
  <meta name="author" content="إصدارات مكتبتي الفاخرة — طبعة الرسائل الوجدانية"/>
  <meta name="description" content="أنا فتاة ولي رسالة — يا ابنتي، أنتِ غالية: رسائل من القلب إلى قلبك... رحلة إلى أعماق الذات."/>
  <title>🌸 أَنَا فَتَاةٌ وَلِي رِسَالَة — يَا ابْنَتِي، أَنْتِ غَالِيَة</title>

  <style>

:root {
  --bg-primary: #FAF6F0;
  --bg-secondary: #FFFDF9;
  --bg-soft-rose: #FCF2F5;
  --bg-soft-sage: #EFF5F0;
  --bg-pearl-gold: #FDF7EC;
  
  --accent-rose: #BD6B80;
  --accent-rose-dark: #732E41;
  --accent-rose-light: #D98C9F;
  --accent-sage: #6B856E;
  --accent-sage-dark: #445946;
  --accent-gold: #C69A4E;
  --accent-gold-soft: rgba(198,154,78,0.22);
  
  --text-primary: #38272C;
  --text-secondary: #6B565C;
  --line: rgba(189,107,128,0.18);
  --border-ornate: rgba(198,154,78,0.32);
  --paper-edge: #DDD1C4;
  
  --shadow-card: 0 16px 42px rgba(92,35,51,0.07);
  --reader-font: 21px;
  --reader-font-size: 100%;
  --font-scale: 1;
  
  --font-body: "Noto Naskh Arabic", "Amiri", serif;
  --font-headings: "Aref Ruqaa", "Amiri", serif;
  --font-chapter-titles: "Reem Kufi", "Noto Kufi Arabic", sans-serif;
  --font-quotes: "Amiri", "Noto Naskh Arabic", serif;
  --font-interface: "Noto Sans Arabic", "IBM Plex Sans Arabic", sans-serif;
  --font-numbers: "Noto Sans Arabic", "IBM Plex Sans Arabic", sans-serif;
  --reader-family: var(--font-body);
  
  color-scheme: light;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

html, body, .app {
  touch-action: pan-y !important;
}

button, input, select, textarea {
  touch-action: manipulation;
  font: inherit;
}

#bookStage, .panel {
  touch-action: pan-y;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-body);
}

body {
  overflow: hidden;
}

.app {
  height: 100vh;
  max-height: 100vh;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: linear-gradient(155deg, var(--bg-primary), #F7EDE7 55%, var(--bg-soft-rose) 100%);
}

.top-bar {
  height: 58px;
  min-height: 58px;
  flex: 0 0 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 3vw, 22px);
  gap: 10px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--line);
  z-index: 10;
  box-shadow: 0 3px 14px rgba(92,35,51,0.05);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  color: var(--accent-rose-dark);
  font-family: var(--font-interface);
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand-gem {
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  background: linear-gradient(135deg, var(--accent-rose), var(--accent-rose-dark));
  font-size: 16px;
  box-shadow: 0 3px 9px rgba(189,107,128,0.28);
}

.tools {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
}

.icon-btn, .nav-btn {
  border: 1px solid var(--line);
  background: var(--bg-primary);
  color: var(--accent-rose-dark);
  border-radius: 12px;
  min-width: 40px;
  min-height: 40px;
  padding: 6px 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-interface);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background .18s, border-color .18s, transform .15s;
}

.icon-btn svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.1;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

.icon-btn:active, .nav-btn:active {
  transform: scale(0.97);
}

.icon-btn:focus-visible, .nav-btn:focus-visible, .primary-btn:focus-visible, .toc-item:focus-visible {
  outline: 3px solid var(--accent-gold);
  outline-offset: 2px;
}

.icon-btn.bookmarked {
  background: var(--bg-pearl-gold);
  color: var(--accent-gold);
  border-color: var(--accent-gold);
}

.running-header {
  height: 36px;
  min-height: 36px;
  flex: 0 0 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 2px 14px;
  background: var(--accent-rose-dark);
  color: #FAF4EF;
  border-bottom: 2px solid var(--accent-gold);
  font-family: var(--font-interface);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .02em;
  text-align: center;
}

.running-header[hidden] {
  display: none;
}

.running-header-mark {
  color: #E6C88B;
  font-size: 12px;
}

.book-stage {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: clamp(10px, 2.7vw, 22px) clamp(9px, 2vw, 16px) 18px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  scrollbar-width: thin;
  scrollbar-color: rgba(189,107,128,0.28) transparent;
}

.page-canvas {
  width: 100%;
  max-width: 760px;
  min-height: 100%;
  height: auto;
  margin: 0 auto;
  padding: clamp(20px, 4.4vw, 38px) clamp(18px, 5vw, 44px) clamp(28px, 5vw, 44px);
  position: relative;
  background: var(--bg-secondary);
  border: 1px solid var(--paper-edge);
  border-radius: 18px;
  box-shadow: var(--shadow-card);
  display: block;
  overflow: visible;
}

.page-canvas:before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid rgba(198,154,78,0.18);
  border-radius: 12px;
  pointer-events: none;
}

.page {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 100%;
  font-family: var(--font-body);
  font-size: var(--reader-font);
  line-height: 2.05;
  overflow-wrap: break-word;
  word-wrap: break-word;
  animation: pageIn .22s ease both;
}

@keyframes pageIn {
  from { opacity: .45; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--accent-rose-dark);
  background: var(--bg-soft-rose);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 5px 16px;
  font-family: var(--font-interface);
  font-size: .61em;
  font-weight: 700;
  letter-spacing: .025em;
  margin: 0 auto 16px;
}

h1, h2, h3, p {
  margin-top: 0;
  max-width: 100%;
}

h1 {
  font-family: var(--font-headings);
  font-size: 1.62em;
  line-height: 1.55;
  color: var(--accent-rose-dark);
  margin: 0 0 16px;
  font-weight: 700;
}

h2 {
  font-family: var(--font-headings);
  font-size: 1.2em;
  line-height: 1.65;
  color: var(--accent-rose);
  margin: 0 0 14px;
  font-weight: 700;
}

h3 {
  font-family: var(--font-headings);
  font-size: 1.02em;
  color: var(--accent-sage-dark);
  margin: 20px 0 9px;
  font-weight: 700;
}

p {
  font-family: var(--font-body);
  margin: 0 0 1.02em;
  text-align: justify;
  white-space: normal;
  overflow-wrap: break-word;
  hyphens: none;
}

.reading p:not(.subtitle):not(.no-indent) {
  text-indent: 1.15em;
}

.cover-page {
  min-height: clamp(520px, 72vh, 820px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  isolation: isolate;
  padding: clamp(28px, 6vw, 54px) 14px;
  background: radial-gradient(ellipse at 50% 38%, #FFFFFF 0%, #FFF8F9 52%, #F6ECE5 100%);
  border: 1.5px solid rgba(198,154,78,0.36);
  border-radius: 14px;
  overflow: hidden;
}

.cover-page:before, .cover-page:after {
  content: "";
  position: absolute;
  z-index: -1;
  border: 1px solid rgba(198,154,78,0.28);
  border-radius: 46% 46% 14px 14px;
  width: 78%;
  height: 80%;
  top: 10%;
  left: 11%;
  pointer-events: none;
}

.cover-page:after {
  width: 71%;
  height: 73%;
  top: 13.5%;
  left: 14.5%;
  border-color: rgba(189,107,128,0.22);
  border-style: dashed;
}

.cover-art-svg {
  width: min(58%, 230px);
  height: auto;
  margin: 0 auto 16px;
  filter: drop-shadow(0 8px 16px rgba(115,46,65,0.14));
}

.cover-page .eyebrow {
  margin-bottom: 16px;
  background: rgba(255,255,255,0.85);
}

.cover-page h1 {
  font-family: var(--font-headings);
  font-size: clamp(2.1em, 7.5vw, 3.2em);
  line-height: 1.38;
  letter-spacing: .005em;
  color: var(--accent-rose-dark);
  margin: 0 0 12px;
  text-shadow: 0 2px 0 rgba(255,255,255,0.7);
}

.cover-page .subtitle {
  font-family: var(--font-body);
  font-size: 1.02em;
  line-height: 1.95;
  color: var(--text-secondary);
  max-width: 88%;
  margin: 0 auto 14px;
  text-align: center;
}

.cover-page .author {
  font-family: var(--font-interface);
  font-size: .68em;
  line-height: 1.8;
  color: var(--text-secondary);
  margin: 6px 0 24px;
  max-width: 90%;
}

.primary-btn {
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 99px;
  background: linear-gradient(135deg, var(--accent-rose), var(--accent-rose-dark));
  color: #fff;
  padding: 11px 28px;
  font-family: var(--font-interface);
  font-size: .7em;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 7px 18px rgba(115,46,65,0.22);
  transition: transform .18s, box-shadow .18s;
}

.primary-btn:active {
  transform: scale(0.97);
}

.ornament {
  color: var(--accent-gold);
  letter-spacing: .32em;
  font-size: .8em;
  margin: 16px 0;
  text-align: center;
}

.quran-box {
  margin: 18px 0;
  padding: 16px 20px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--bg-soft-rose), var(--bg-pearl-gold));
  border: 1px solid var(--accent-gold-soft);
  border-right: 4px solid var(--accent-rose);
  font-family: var(--font-quotes);
  text-align: center;
  box-shadow: 0 4px 14px rgba(92,35,51,0.04);
}

.quran-box p {
  font-family: var(--font-quotes);
  font-size: 1.15em;
  line-height: 2.1;
  color: var(--accent-rose-dark);
  margin: 0 0 6px;
  text-align: center;
}

.quran-box .ayah-source {
  font-family: var(--font-interface);
  font-size: .7em;
  color: var(--accent-gold);
  font-weight: 700;
}

.hadith-box {
  margin: 18px 0;
  padding: 15px 18px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--bg-soft-sage), var(--bg-secondary));
  border: 1px solid rgba(107,133,110,0.24);
  border-right: 4px solid var(--accent-sage);
  font-family: var(--font-quotes);
  text-align: center;
}

.hadith-box p {
  font-family: var(--font-quotes);
  font-size: 1.1em;
  line-height: 2.05;
  color: var(--accent-sage-dark);
  margin: 0 0 6px;
  text-align: center;
}

.hadith-box .hadith-source {
  font-family: var(--font-interface);
  font-size: .68em;
  color: var(--accent-sage-dark);
  font-weight: 700;
}

.wisdom-pearl {
  margin: 18px 0;
  padding: 15px 18px;
  border-radius: 12px;
  background: var(--bg-pearl-gold);
  border: 1px solid var(--accent-gold-soft);
  border-right: 3px solid var(--accent-gold);
  font-family: var(--font-quotes);
  font-size: .98em;
  line-height: 1.95;
}

.wisdom-badge {
  display: block;
  font-family: var(--font-interface);
  font-size: .63em;
  font-weight: 700;
  color: var(--accent-gold);
  margin-bottom: 6px;
}

.interactive-box {
  margin: 18px 0;
  padding: 16px 18px;
  border-radius: 14px;
  background: var(--bg-soft-rose);
  border: 1.5px solid var(--line);
}

.interactive-box h3 {
  color: var(--accent-rose-dark);
  margin-top: 0;
  margin-bottom: 12px;
}

.field-group {
  margin-bottom: 12px;
}

.field-group label {
  display: block;
  font-family: var(--font-interface);
  font-size: .74em;
  font-weight: 700;
  color: var(--accent-rose-dark);
  margin-bottom: 4px;
}

.field-input, .field-textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: #FFF;
  color: var(--text-primary);
  font-family: var(--font-interface);
  font-size: .8em;
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}

.field-textarea {
  min-height: 72px;
  resize: vertical;
  line-height: 1.7;
}

.field-input:focus, .field-textarea:focus {
  border-color: var(--accent-rose);
  box-shadow: 0 0 0 3px rgba(189,107,128,0.16);
}

.opener {
  min-height: clamp(440px, 65vh, 720px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 28px 12px;
  position: relative;
}

.opener:before {
  content: "";
  position: absolute;
  inset: 6% 6%;
  border: 1px solid var(--accent-gold-soft);
  border-radius: 46% 46% 14px 14px;
  pointer-events: none;
}

.chapter-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--accent-gold);
  background: var(--bg-pearl-gold);
  border: 1px solid var(--accent-gold-soft);
  border-radius: 99px;
  padding: 6px 22px;
  font-family: var(--font-chapter-titles);
  font-size: .7em;
  font-weight: 700;
  margin-bottom: 18px;
}

.opener h1 {
  font-family: var(--font-chapter-titles);
  font-size: clamp(1.65em, 5.2vw, 2.3em);
  line-height: 1.65;
  max-width: 90%;
  margin: 0 auto 16px;
  color: var(--accent-rose-dark);
}

.opener .subtitle {
  font-family: var(--font-body);
  font-size: .98em;
  line-height: 1.95;
  color: var(--text-secondary);
  max-width: 86%;
  margin: 0 auto 14px;
  text-align: center;
}

.toc-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 14px;
}

.toc-item {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: start;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 14px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-interface);
  font-size: .74em;
  line-height: 1.6;
  cursor: pointer;
  transition: border-color .18s, transform .15s;
}

.toc-item:active {
  transform: scale(0.99);
}

.toc-item.toc-part {
  font-family: var(--font-chapter-titles);
  background: var(--bg-soft-rose);
  border-color: var(--accent-rose-light);
  font-weight: 700;
  color: var(--accent-rose-dark);
  margin-top: 6px;
}

.toc-item small {
  color: var(--accent-gold);
  font-family: var(--font-numbers);
  font-variant-numeric: tabular-nums;
  font-size: .78em;
  font-weight: 700;
  white-space: nowrap;
  background: var(--bg-secondary);
  padding: 2px 8px;
  border-radius: 99px;
  border: 1px solid var(--accent-gold-soft);
}

.bottom-nav-dock {
  min-height: 66px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 14px calc(env(safe-area-inset-bottom, 8px) + 8px);
  background: var(--bg-secondary);
  border-top: 1px solid var(--line);
  box-shadow: 0 -4px 16px rgba(92,35,51,0.045);
  z-index: 4;
}

.nav-btn {
  min-width: 94px;
  border-radius: 12px;
  background: var(--accent-rose-dark);
  color: #fff;
  border-color: var(--accent-rose-dark);
  font-family: var(--font-interface);
  font-size: 12px;
  padding: 9px 15px;
}

.nav-btn:disabled {
  opacity: .35;
  cursor: default;
}

.page-counter {
  font-family: var(--font-numbers);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
  background: var(--bg-primary);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 6px 14px;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 45;
  background: rgba(77,28,42,0.42);
  backdrop-filter: blur(3px);
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 12px;
}

#searchPanel.overlay {
  align-items: flex-start;
  padding-top: 64px;
  padding-bottom: 76px;
}

.overlay.open {
  display: flex;
}

.panel {
  width: min(100%, 650px);
  max-height: min(78vh, 680px);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: var(--bg-secondary);
  border: 1px solid var(--paper-edge);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 20px 60px rgba(77,28,42,0.22);
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  padding-bottom: 11px;
  border-bottom: 1px solid var(--line);
}

.panel-head h2 {
  margin: 0;
  color: var(--accent-rose-dark);
  font-family: var(--font-interface);
  font-size: 16px;
  font-weight: 700;
}

.search-bar-wrap {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

#searchInput {
  width: 100%;
  min-height: 46px;
  padding: 10px 14px 10px 42px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-interface);
  font-size: 14px;
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}

#searchInput:focus {
  border-color: var(--accent-rose);
  box-shadow: 0 0 0 3px rgba(189,107,128,0.16);
}

.search-clear-btn {
  position: absolute;
  inset-inline-end: 8px;
  top: 50%;
  transform: translateY(-50%);
  min-width: 30px;
  min-height: 30px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg-secondary);
  color: var(--accent-rose);
  font-family: var(--font-interface);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 2px 8px;
}

.search-clear-btn[hidden] {
  display: none;
}

.search-status {
  font-family: var(--font-interface);
  font-size: 12px;
  color: var(--text-secondary);
  margin: 4px 2px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.search-result {
  width: 100%;
  display: block;
  text-align: start;
  padding: 12px 14px;
  margin: 8px 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-interface);
  cursor: pointer;
  transition: border-color .18s, background .18s;
}

.search-result:hover, .search-result:focus-visible {
  border-color: var(--accent-rose);
  background: var(--bg-soft-rose);
}

.search-result-head {

  <script>
    const BOOK_DATA = {
      title: "أَنَا فَتَاةٌ وَلِي رِسَالَة — يَا ابْنَتِي، أَنْتِ غَالِيَة",
      totalPages: 32,
      pages: [{"tag": "الغلاف الملكي", "title": "يا ابنتي، أنتِ غالية", "type": "cover", "html": "\n<div class=\"cover-page\">\n  <div class=\"eyebrow\">✦ طَبْعَةُ الرَّسَائِلِ الوِجْدَانِيَّةِ الفَاخِرَة • مَكْتَبَتِي ✦</div>\n  \n<svg class=\"cover-art-svg\" viewBox=\"0 0 240 240\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"شعار الغلاف الفني\">\n  <circle cx=\"120\" cy=\"120\" r=\"110\" fill=\"#FAF4F0\" stroke=\"#C69A4E\" stroke-width=\"1.8\" stroke-dasharray=\"4 3\"/>\n  <circle cx=\"120\" cy=\"120\" r=\"98\" fill=\"#FFFDF9\" stroke=\"#BD6B80\" stroke-width=\"1.5\"/>\n  <circle cx=\"120\" cy=\"120\" r=\"88\" fill=\"url(#coverRoseGlow)\"/>\n  \n  <!-- Foliage Vines & Olive Leaves -->\n  <path d=\"M60 140 C 50 110, 70 75, 120 60 C 170 75, 190 110, 180 140\" stroke=\"#6B856E\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n  <path d=\"M75 125 C 65 120, 62 110, 70 105 C 78 100, 85 110, 75 125 Z\" fill=\"#6B856E\"/>\n  <path d=\"M165 125 C 175 120, 178 110, 170 105 C 162 100, 155 110, 165 125 Z\" fill=\"#6B856E\"/>\n  <path d=\"M92 90 C 85 82, 86 72, 95 72 C 102 72, 103 82, 92 90 Z\" fill=\"#445946\"/>\n  <path d=\"M148 90 C 155 82, 154 72, 145 72 C 138 72, 137 82, 148 90 Z\" fill=\"#445946\"/>\n\n  <!-- Golden Sprigs & Filigree -->\n  <path d=\"M80 160 C 90 185, 150 185, 160 160\" stroke=\"#C69A4E\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n  <circle cx=\"95\" cy=\"176\" r=\"3.5\" fill=\"#C69A4E\"/>\n  <circle cx=\"120\" cy=\"182\" r=\"4.5\" fill=\"#C69A4E\"/>\n  <circle cx=\"145\" cy=\"176\" r=\"3.5\" fill=\"#C69A4E\"/>\n  \n  <!-- Central Bloom - Dusty Rose -->\n  <g transform=\"translate(120, 124)\">\n    <path d=\"M0 -34 C 18 -34, 30 -16, 26 4 C 20 22, -20 22, -26 4 C -30 -16, -18 -34, 0 -34 Z\" fill=\"#FCF2F5\" stroke=\"#BD6B80\" stroke-width=\"1.5\"/>\n    <path d=\"M-18 -12 C -24 4, -12 24, 0 28 C 12 24, 24 4, 18 -12 C 12 -24, -12 -24, -18 -12 Z\" fill=\"#F4D8E2\"/>\n    <path d=\"M-12 -6 C -16 6, -8 18, 0 20 C 8 18, 16 6, 12 -6 C 8 -14, -8 -14, -12 -6 Z\" fill=\"#E8B8C8\"/>\n    <circle cx=\"0\" cy=\"4\" r=\"11\" fill=\"#BD6B80\"/>\n    <circle cx=\"0\" cy=\"4\" r=\"6\" fill=\"#732E41\"/>\n    <polygon points=\"0,-2 2,2 6,4 2,6 0,10 -2,6 -6,4 -2,2\" fill=\"#FAF6F0\"/>\n  </g>\n  \n  <defs>\n    <radialGradient id=\"coverRoseGlow\" cx=\"50%\" cy=\"45%\" r=\"50%\">\n      <stop offset=\"0%\" stop-color=\"#FFFFFF\"/>\n      <stop offset=\"65%\" stop-color=\"#FCF2F5\"/>\n      <stop offset=\"100%\" stop-color=\"#F6ECE5\"/>\n    </radialGradient>\n  </defs>\n</svg>\n\n  <div style=\"font-family: var(--font-chapter-titles); font-size: 1.15em; color: var(--accent-rose); margin-bottom: 4px;\">🌸 أَنَا فَتَاةٌ وَلِي رِسَالَة 🌸</div>\n  <h1>يَا ابْنَتِي، أَنْتِ غَالِيَة</h1>\n  <div class=\"subtitle\">رَسَائِلُ مِنَ القَلْبِ إِلَى قَلْبِكِ... رِحْلَةٌ إِلَى أَعْمَاقِ الذَّاتِ مِنْ مَعْرِفَةِ النَّفْسِ إِلَى صِنَاعَةِ الأَثَر</div>\n  <div class=\"ornament\">❖ ❖ ❖</div>\n  <div class=\"author\">رَسَائِلُ تَرْبَوِيَّةٌ إِيمَانِيَّةٌ لِكُلِّ فَتَاةٍ تَبْحَثُ عَنْ نُورِهَا • الإِصْدَارُ الأَوَّل</div>\n  <button class=\"primary-btn\" onclick=\"window.goToPage(1)\">افتحي رسائل القلب ✉️</button>\n</div>\n"}, {"tag": "الإهداء", "title": "إلى كل فتاة تبتسم وفي قلبها حكاية", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">🌸</span>\n  <span class=\"letter-envelope-title\">إِهْدَاءٌ مِنَ القَلْب</span>\n</div>\n\n<h1>إِلَى كُلِّ فَتَاةٍ تَبْتَسِمُ وَفِي قَلْبِهَا حِكَايَة...</h1>\n<div class=\"ornament\">❀ ❀ ❀</div>\n\n<p>إلى كل فتاة تبتسم وفي قلبها حكاية لا يعرفها أحد.</p>\n\n<p>إلى التي تتساءل أحياناً: هل أنا جميلة بما يكفي؟ هل أنا محبوبة؟ هل أنا مهمة؟ وهل سيكون لي يوماً شأن في هذه الحياة؟</p>\n\n<p>إلى التي أخطأت ثم ندمت، وتعثرت ثم حاولت الوقوف، وابتعدت ثم اشتاقت إلى الله.</p>\n\n<p>إلى التي تخفي دموعها خلف ابتسامتها، وتحمل في قلبها أحلاماً كبيرة، لكنها لا تعرف من أين تبدأ.</p>\n\n<div class=\"wisdom-pearl\" style=\"text-align: center; font-size: 1.08em;\">\n  <strong>هذا الكتاب لكِ...</strong><br/>\n  ولعلكِ تجدين بين صفحاته كلمة تحتاجين إليها، أو معنى غاب عن قلبكِ، أو باباً جديداً للأمل.<br/>\n  <span style=\"color: var(--accent-rose-dark); font-weight: 700;\">يا ابنتي، أنتِ غالية، فلا تنسي ذلك أبداً.</span>\n</div>\n\n<div class=\"interactive-box\" style=\"margin-top: 24px;\">\n  <h3 style=\"margin-bottom: 6px;\">💌 اكتبي اسمكِ الكريم لنخاطبكِ به في رسائل الكتاب:</h3>\n  <div style=\"display: flex; gap: 8px;\">\n    <input id=\"readerNameInput\" class=\"field-input\" type=\"text\" placeholder=\"اكتبي اسمكِ هنا (مثال: مريم، سارة، فاطمة)...\" oninput=\"saveReaderName(this.value)\"/>\n    <button class=\"primary-btn\" style=\"padding: 6px 18px; font-size: .75em;\" onclick=\"alertSavedName()\">حفظ الاسم</button>\n  </div>\n</div>\n"}, {"tag": "الفهرس", "title": "فهرس الرسائل والهمسات الوجدانية", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">📜</span>\n  <span class=\"letter-envelope-title\">دَلِيلُ الرَّسَائِل</span>\n</div>\n\n<h1>فِهْرِسُ رَسَائِلِ القَلْب</h1>\n<p style=\"text-align: center; color: var(--text-secondary); font-size: .9em;\">اثنتا عشرة رسالة تلامس وجدانكِ وتضيء بصيرتكِ</p>\n\n<div class=\"toc-list\">\n  <div class=\"toc-item\" onclick=\"window.goToPage(3)\"><span>مقدمة: تعالي نتحدث قليلاً</span><small>صفحة ٤</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(4)\"><span>الرسالة ١: أنتِ أغلى مما تظنين</span><small>صفحة ٥</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(6)\"><span>الرسالة ٢: هل تشتاقين إلى الله؟</span><small>صفحة ٧</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(8)\"><span>الرسالة ٣: احكي لله ما لا تستطيعين قوله لأحد</span><small>صفحة ٩</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(10)\"><span>الرسالة ٤: لا تمنحي قلبكِ لمن لا يعرف قيمته</span><small>صفحة ١١</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(12)\"><span>الرسالة ٥: أنتِ لستِ أقل من أحد</span><small>صفحة ١٣</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(14)\"><span>الرسالة ٦: أمكِ وأبوكِ... نعمتان لا تتكرران</span><small>صفحة ١٥</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(16)\"><span>الرسالة ٧: اختاري صديقاتكِ بعناية</span><small>صفحة ١٧</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(18)\"><span>الرسالة ٨: لا تهملي عقلكِ وأحلامكِ</span><small>صفحة ١٩</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(20)\"><span>الرسالة ٩: لا بأس أن تبكي</span><small>صفحة ٢١</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(22)\"><span>الرسالة ١٠: الحياء جمال لا يطفئ شخصيتكِ</span><small>صفحة ٢٣</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(24)\"><span>الرسالة ١١: ماذا لو أخطأتِ؟</span><small>صفحة ٢٥</small></div>\n  <div class=\"toc-item toc-part\" onclick=\"window.goToPage(26)\"><span>الرسالة ١٢: أنتِ صاحبة رسالة</span><small>صفحة ٢٧</small></div>\n  <div class=\"toc-item\" onclick=\"window.goToPage(28)\"><span>الخاتمة: أريدكِ أن تبدئي الآن</span><small>صفحة ٢٩</small></div>\n  <div class=\"toc-item\" onclick=\"window.goToPage(29)\"><span>ملحق: عهدي مع نفسي والختم الشمعي</span><small>صفحة ٣٠</small></div>\n  <div class=\"toc-item\" onclick=\"window.goToPage(30)\"><span>معرض الهمسات الوجدانية ولوحة الشرف</span><small>صفحة ٣١</small></div>\n</div>\n"}, {"tag": "المقدمة", "title": "تعالي نتحدث قليلاً", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">☕</span>\n  <span class=\"letter-envelope-title\">حَدِيثٌ مِنَ الرُّوح</span>\n</div>\n\n<h1>تَعَالَيْ نَتَحَدَّثْ قَلِيلاً</h1>\n<div class=\"letter-greeting\">يا ابنتي الحبيبة <span class=\"reader-name-slot\"></span>...</div>\n\n<p>دعينا نجلس قليلاً، بعيداً عن ضجيج الحياة، وعن أحكام الناس، وعن المقارنات التي لا تنتهي.</p>\n\n<p>أريد أن أحدثكِ عن أشياء ربما لا تجدين من يحدثكِ عنها. أريد أن أسألكِ: <strong>كيف حال قلبك؟</strong></p>\n\n<p>ليس كيف تبدين أمام الناس، ولا كيف تسير دراستكِ، ولا كم عدد صديقاتكِ، ولا ماذا يقول الناس عنكِ... بل كيف أنتِ من الداخل؟</p>\n\n<p>هل أنتِ سعيدة؟ هل تشعرين بالرضا؟ هل تحبين نفسكِ؟ هل تشعرين بالقرب من الله؟ هل هناك شيء يؤلمكِ ولا تستطيعين الحديث عنه؟</p>\n\n<p>أتعلمين يا ابنتي؟ كثير من الفتيات يعشن وسط الناس، لكنهن يشعرن بالوحدة. يضحكن كثيراً، لكن قلوبهن متعبة. يبدون قويات، لكنهن يحتجن أحياناً إلى من يقول لهن: <em>لا بأس، أنا أفهمكِ</em>.</p>\n\n<div class=\"wisdom-pearl\">\n  <span class=\"wisdom-badge\">غاية هذه الرسائل</span>\n  لن أطلب منكِ أن تكوني فتاة بلا أخطاء، ولا أن تكوني مثالية في كل شيء؛ فليس هذا هو المطلوب. أريدكِ فقط أن تعرفي نفسكِ، وتفهمي قيمتكِ، وتقتربي من ربكِ، وتتعلمي كيف تعيشين حياة تليق بالنعمة التي منحكِ الله إياها. هيا يا ابنتي، لنبدأ.\n</div>\n"}, {"tag": "الرسالة الأولى", "title": "أنتِ أغلى مما تظنين", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">✉️ ١</span>\n  <span class=\"letter-envelope-title\">الرِّسَالَةُ الأُولَى</span>\n</div>\n\n<h1>أَنْتِ أَغْلَى مِمَّا تَظُنِّين</h1>\n<div class=\"letter-greeting\">تأملي معي يا ابنتي <span class=\"reader-name-slot\"></span>...</div>\n\n<p>هل حدث أن نظرتِ إلى المرآة يوماً، فلم يعجبكِ ما رأيتِ؟ ربما تمنيتِ لو كان شعركِ أجمل، أو وجهكِ مختلفاً، أو جسدكِ أكثر تناسقاً. وربما رأيتِ فتاة على مواقع التواصل، فشعرتِ أنها أجمل منكِ، وأن حياتها أفضل من حياتكِ.</p>\n\n<p>وهنا أريد أن أسألكِ سؤالاً: من الذي أقنعكِ أن قيمتكِ تُقاس بملامح وجهكِ؟ من قال إن الفتاة الجميلة هي التي تمتلك أجمل صورة، أو أكثر المتابعين، أو أغلى الملابس؟</p>\n\n<p>الجمال نعمة، لكنه ليس كل شيء. كم من وجه جميل لا يحمل صاحبه إلا الغرور! وكم من فتاة بسيطة الملامح، إذا جلستِ معها شعرتِ أن الدنيا أصبحت أجمل! هناك جمال في الكلام، وجمال في الرحمة، وجمال في الحياء، وجمال في العقل، وجمال في القلب الذي لا يؤذي أحداً.</p>\n\n<div class=\"quran-box\">\n  <p>﴿لَقَدْ خَلَقْنَا الْإِنْسَانَ فِي أَحْسَنِ تَقْوِيمٍ﴾</p>\n  <div class=\"ayah-source\">[التين: ٤]</div>\n</div>\n\n<p>أنتِ لستِ مشروع مقارنة. لقد خلقكِ الله، ومنحكِ صفات وقدرات وملامح تخصكِ وحدكِ. اعتني بنفسكِ وأحبيها، ولكن لا تجعلي حبكِ لنفسكِ مشروطاً بأن تصبحي مثل غيركِ.</p>\n"}, {"tag": "الرسالة الأولى", "title": "همسة الرسالة الأولى ومساحة البوح", "type": "exercise", "html": "\n<div class=\"heart-keepsake-card\">\n  <div class=\"heart-badge\">🌸 رِسَالَةٌ إِلَى قَلْبِكِ • الهَمْسَةُ الأُولَى</div>\n  <p>«أنتِ لا تحتاجين إلى أن تكوني أجمل فتاة في العالم حتى تستحقي الحب والاحترام. يكفي أنكِ إنسانة لها كرامتها وقيمتها، ولكِ عند الله باب مفتوح للخير والعمل الصالح.»</p>\n</div>\n\n<div class=\"interactive-box\" style=\"margin-top: 20px;\">\n  <h3 style=\"margin-bottom: 6px;\">🪞 مساحة بوح: مرآة قيمتي الحقيقية</h3>\n  <p style=\"font-size: .85em; color: var(--text-secondary); margin-bottom: 8px;\">اكتبي هنا ثلاثة أشياء جميلة في روحكِ وأخلاقكِ لا علاقة لها بالمظهر الخارجي:</p>\n  <textarea id=\"journal_letter_1\" class=\"field-textarea\" placeholder=\"١. رحمة قلبي بمن حولي... ٢. صدقي في حديثي... ٣. رغبتي في تعلم الخير...\" oninput=\"saveField(this.id, this.value)\"></textarea>\n  <div class=\"save-indicator\">✓ تُحفظ خواطركِ سراً وتلقائياً في جهازكِ</div>\n</div>\n"}, {"tag": "الرسالة الثانية", "title": "هل تشتاقين إلى الله؟", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">✉️ ٢</span>\n  <span class=\"letter-envelope-title\">الرِّسَالَةُ الثَّانِيَة</span>\n</div>\n\n<h1>هَلْ تَشْتَاقِينَ إِلَى اللَّه؟</h1>\n<div class=\"letter-greeting\">يا ابنتي الغالية <span class=\"reader-name-slot\"></span>...</div>\n\n<p>هل مرّ بكِ يوم شعرتِ فيه أنكِ بعيدة عن الله؟ تسمعين الأذان، لكنكِ تؤجلين الصلاة. تفتحين المصحف، ثم تغلقينه بعد آيات قليلة. تتذكرين أياماً كنتِ فيها أكثر قرباً، فتتمنين العودة، لكنكِ لا تعرفين كيف.</p>\n\n<p>ثم يأتيكِ الشيطان بفكرة خطيرة: <em>«لقد ابتعدتِ كثيراً، فكيف تعودين الآن؟»</em></p>\n\n<p>اسمعيني جيداً... لا تصدقي هذا الخاطر الكاذب! الله لم يغلق بابه في وجهكِ أبداً.</p>\n\n<div class=\"quran-box\">\n  <p>﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنْفُسِهِمْ لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا﴾</p>\n  <div class=\"ayah-source\">[الزمر: ٥٣]</div>\n</div>\n\n<p>تأملي كيف يناديكِ ربكِ: <strong>«يا عبادي»</strong>... حتى وأنتِ مقصرة، يدعوكِ إلى العودة والرحمة، فلماذا تيأسين؟</p>\n\n<p>لا تنتظري حتى تصبحي فتاة مثالية لتصلي؛ صلي حتى يعينكِ الله على أن تصبحي أفضل. ولا تقولي: سأعود إلى الله عندما تنتهي مشكلاتي، بل عودي إليه الآن بدموعكِ وضعفكِ وانكساركِ.</p>\n"}, {"tag": "الرسالة الثانية", "title": "همسة الرسالة الثانية ومساحة البوح", "type": "exercise", "html": "\n<div class=\"heart-keepsake-card\">\n  <div class=\"heart-badge\">🌸 رِسَالَةٌ إِلَى قَلْبِكِ • الهَمْسَةُ الثَّانِيَة</div>\n  <p>«لا تجعلي ذنوب الأمس تمنعكِ من طاعة اليوم. باب التوبة مفتوح، وربكِ أرحم بكِ من نفسكِ.»</p>\n</div>\n\n<div class=\"interactive-box\" style=\"margin-top: 20px;\">\n  <h3 style=\"margin-bottom: 6px;\">🕌 مساحة بوح: موعدي مع ربي</h3>\n  <p style=\"font-size: .85em; color: var(--text-secondary); margin-bottom: 8px;\">ما الطاعة البسيطة التي تقررين البدء بها اليوم لتجديد عهدكِ مع الله؟</p>\n  <textarea id=\"journal_letter_2\" class=\"field-textarea\" placeholder=\"مثال: ركعتا الضحى، ورد صفحتين من القرآن بعد المغرب، الاستغفار مئة مرة...\" oninput=\"saveField(this.id, this.value)\"></textarea>\n  <div class=\"save-indicator\">✓ تُحفظ خواطركِ سراً وتلقائياً في جهازكِ</div>\n</div>\n"}, {"tag": "الرسالة الثالثة", "title": "احكي لله ما لا تستطيعين قوله لأحد", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">✉️ ٣</span>\n  <span class=\"letter-envelope-title\">الرِّسَالَةُ الثَّالِثَة</span>\n</div>\n\n<h1>احْكِي لِلَّهِ مَا لاَ تَسْتَطِيعِينَ قَوْلَهُ لِأَحَد</h1>\n<div class=\"letter-greeting\">همسة لقلبكِ يا ابنتي <span class=\"reader-name-slot\"></span>...</div>\n\n<p>أحياناً يا ابنتي، لا تحتاجين إلى نصيحة؛ تحتاجين فقط إلى من يسمعكِ دون لوم أو مقاطعة. قد تكون لديكِ مشكلة تخجلين من إخبار أمكِ بها، أو خوف تخشين أن تسخر منه صديقاتكِ، أو حزن عميق لا تعرفين كيف تشرحين سببه لأحد.</p>\n\n<p>وقد تجلسين وحدكِ وتقولين بأسى: <em>«لا أحد يفهمني!»</em>... لكن هل فكرتِ يوماً أن تذهبي إلى الله بكل ما في صدركِ؟</p>\n\n<p>ليس شرطاً أن تكون كلماتكِ مرتبة أو فصيحة؛ قولي في سجودكِ: <em>يا رب، أنا متعبة... يا رب، لا أعرف ماذا أفعل... يا رب، أخاف من المستقبل... يا رب، أصلح قلبي ولا تتركني لنفسي طرفة عين</em>.</p>\n\n<div class=\"quran-box\">\n  <p>﴿وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ﴾</p>\n  <div class=\"ayah-source\">[البقرة: ١٨٦]</div>\n</div>\n\n<p>الله يعلم ما تخفينه، ويسمع نداءكِ الصامت، ولا تخفى عليه دمعة سقطت على وسادتكِ في جوف الليل. ادعيه وتوكلي عليه، ثم خذي بالأسباب واستشيري أهل الحكمة والأمانة.</p>\n"}, {"tag": "الرسالة الثالثة", "title": "همسة الرسالة الثالثة ومساحة البوح", "type": "exercise", "html": "\n<div class=\"heart-keepsake-card\">\n  <div class=\"heart-badge\">🌸 رِسَالَةٌ إِلَى قَلْبِكِ • الهَمْسَةُ الثَّالِثَة</div>\n  <p>«ليس عليكِ أن تكوني قوية طوال الوقت. اطلبي العون، وابكي إن احتجتِ، واستندي إلى الله، ولا تخجلي من طلب المساعدة.»</p>\n</div>\n\n<div class=\"interactive-box\" style=\"margin-top: 20px;\">\n  <h3 style=\"margin-bottom: 6px;\">🤲 مساحة بوح: نجوى في السجود</h3>\n  <p style=\"font-size: .85em; color: var(--text-secondary); margin-bottom: 8px;\">اكتبي الدعاء الصادق الذي تتمنين أن يستجيبه الله لقلبكِ الآن:</p>\n  <textarea id=\"journal_letter_3\" class=\"field-textarea\" placeholder=\"اللهم إني أسألك فرجاً لهمي، ونوراً لقلبي، وتوفيقاً يملأ روحي سكينة...\" oninput=\"saveField(this.id, this.value)\"></textarea>\n  <div class=\"save-indicator\">✓ تُحفظ خواطركِ سراً وتلقائياً في جهازكِ</div>\n</div>\n"}, {"tag": "الرسالة الرابعة", "title": "لا تمنحي قلبك لمن لا يعرف قيمته", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">✉️ ٤</span>\n  <span class=\"letter-envelope-title\">الرِّسَالَةُ الرَّابِعَة</span>\n</div>\n\n<h1>لاَ تَمْنَحِي قَلْبَكِ لِمَنْ لاَ يَعْرِفُ قِيمَتَه</h1>\n<div class=\"letter-greeting\">يا ابنتي الواعية <span class=\"reader-name-slot\"></span>...</div>\n\n<p>قلبكِ جميل، ومشاعركِ نعمة غالية، ومن الفطرة أن تتمني أن يحبكِ أحد ويهتم بكِ ويشعركِ أنكِ مميزة؛ لكن انتبهي بحذر شديد: ليس كل من اقترب منكِ يريد لكِ الخير، وليس كل من نطق بكلمات الغزل يعرف معنى الحب والوفاء!</p>\n\n<p>قد تجدين من يغدق عليكِ بالمديح، ثم يبدأ بالتدريج في طلب ما لا يرضي الله ولا يرضاه حياؤكِ، ويضغط عليكِ ويهددكِ بالرحيل إن لم تستجيبي لطلباته. وهنا قفي بحزم وسلي عقلكِ:</p>\n\n<div class=\"wisdom-pearl\">\n  هل هذا حب يحترم كرامتي؟ هل من يحبني يطلب مني أن أخالف ديني وحيائي؟ هل من يريد الخير لي يجعلني أخاف وأكذب وأخفي أخباري عن أهلي في ظلمات الخوف؟\n</div>\n\n<p>الحب الحقيقي النقي لا يحتاج إلى ابتزاز ولا تهديد ولا تنازلات مذلة؛ ومن يحبكِ بصدق لا يجعل كرامتكِ ثمناً للبقاء معه. لا ترسلي صوراً خاصة، ولا تكشفي أسراركِ العائلية، ولا تخافي إن تعرضتِ لابتزاز بل اقطعي التواصل فوراً واطلبي مساعدة أهلكِ أو الجهات المختصة.</p>\n"}, {"tag": "الرسالة الرابعة", "title": "همسة الرسالة الرابعة ومساحة البوح", "type": "exercise", "html": "\n<div class=\"heart-keepsake-card\">\n  <div class=\"heart-badge\">🌸 رِسَالَةٌ إِلَى قَلْبِكِ • الهَمْسَةُ الرَّابِعَة</div>\n  <p>«لا تبحثي عن شخص يمنحكِ قيمتكِ؛ فقيمتكِ ليست بيده. ابحثي عن علاقة تحفظ كرامتكِ، وتقوم على الاحترام والصدق والمسؤولية في النور.»</p>\n</div>\n\n<div class=\"interactive-box\" style=\"margin-top: 20px;\">\n  <h3 style=\"margin-bottom: 6px;\">🛡️ مساحة بوح: حياطة قلبي وعفتي</h3>\n  <p style=\"font-size: .85em; color: var(--text-secondary); margin-bottom: 8px;\">مبدأ أقطعه على نفسي لحماية قلبي وكرامتي الرقمية والواقعية:</p>\n  <textarea id=\"journal_letter_4\" class=\"field-textarea\" placeholder=\"أعاهد نفسي ألا أتنازل عن حياؤي وكرامتي من أجل كسب رضا أي عابر...\" oninput=\"saveField(this.id, this.value)\"></textarea>\n  <div class=\"save-indicator\">✓ تُحفظ خواطركِ سراً وتلقائياً في جهازكِ</div>\n</div>\n"}, {"tag": "الرسالة الخامسة", "title": "أنتِ لستِ أقل من أحد", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">✉️ ٥</span>\n  <span class=\"letter-envelope-title\">الرِّسَالَةُ الخَامِسَة</span>\n</div>\n\n<h1>أَنْتِ لَسْتِ أَقَلَّ مِنْ أَحَد</h1>\n<div class=\"letter-greeting\">يا ابنتي الكريمة <span class=\"reader-name-slot\"></span>...</div>\n\n<p>ربما تكون لكِ صديقة متفوقة في دراستها، وأخرى تملك ثياباً فاخرة، وثالثة تسافر باستمرار؛ وأنتِ تعيشين في بيت بسيط وتملكين إمكانات محدودة، فتشعرين أحياناً بضيق أو حسرة خفية.</p>\n\n<p>لكن لماذا نقارن دائماً ما في أيدينا بما يظهره الآخرون؟ أنتِ ترين واجهاتهم المصقولة ولا تعرفين ما في بيوتهم من هموم. ترين نجاحهم المعلن ولا تدرين كم سهروا وكم بكوا وكم تعثروا.</p>\n\n<div class=\"quran-box\">\n  <p>﴿وَلَا تَتَمَنَّوْا مَا فَضَّلَ اللَّهُ بِهِ بَعْضَكُمْ عَلَىٰ بَعْضٍ﴾</p>\n  <div class=\"ayah-source\">[النساء: ٣٢]</div>\n</div>\n\n<p>الحياة ليست حلبة سباق؛ لكل إنسانة رزقها المكتوب، ووقتها المقدر. افرحي لنجاح غيركِ وطهري قلبكِ من الغيرة، وإذا رأيتِ نعمة فقولي: <em>ما شاء الله لا قوة إلا بالله، اللهم بارك لهم وارزقني من واسع فضلك</em>.</p>\n"}, {"tag": "الرسالة الخامسة", "title": "همسة الرسالة الخامسة ومساحة البوح", "type": "exercise", "html": "\n<div class=\"heart-keepsake-card\">\n  <div class=\"heart-badge\">🌸 رِسَالَةٌ إِلَى قَلْبِكِ • الهَمْسَةُ الخَامِسَة</div>\n  <p>«لا تقيسي حياتكِ ببدايات الآخرين ولا بمظاهرهم. انظري إلى طريقكِ، واعملي على تحسينه، واحمدي الله على ما لديكِ من نعم عظيمة.»</p>\n</div>\n\n<div class=\"interactive-box\" style=\"margin-top: 20px;\">\n  <h3 style=\"margin-bottom: 6px;\">🌱 مساحة بوح: امتناني لمساري الشخصي</h3>\n  <p style=\"font-size: .85em; color: var(--text-secondary); margin-bottom: 8px;\">ثلاث نعم أملكها اليوم وأشكر الله عليها بملء قلبي:</p>\n  <textarea id=\"journal_letter_5\" class=\"field-textarea\" placeholder=\"١. نعمة العافية والسلامة... ٢. وجود أسرتي حولي... ٣. فرصة التعلم والنمو...\" oninput=\"saveField(this.id, this.value)\"></textarea>\n  <div class=\"save-indicator\">✓ تُحفظ خواطركِ سراً وتلقائياً في جهازكِ</div>\n</div>\n"}, {"tag": "الرسالة السادسة", "title": "أمكِ وأبوكِ... نعمتان لا تتكرران", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">✉️ ٦</span>\n  <span class=\"letter-envelope-title\">الرِّسَالَةُ السَّادِسَة</span>\n</div>\n\n<h1>أُمُّكِ وَأَبُوكِ... نِعْمَتَانِ لاَ تَتَكَرَّرَان</h1>\n<div class=\"letter-greeting\">يا قرة العين <span class=\"reader-name-slot\"></span>...</div>\n\n<p>قد تتضايقين أحياناً من كثرة نصائح أمكِ، أو من حرص أبيكِ وتدقيقه في خروجكِ ودخولكِ، وقد تقولين في سركِ: <em>«لماذا يضيقان عليّ ولا يتركان لي كامل حريتي؟»</em></p>\n\n<p>أعلم أنكِ تكبرين وترغبين في بناء شخصيتكِ المستقلة؛ لكن تذكري دائماً أن استقلالكِ لا يعني الجفاء والتمرد، وأن حرصهما نابع من خوف عميق وحب فطري لا يضاهيه في الكون حب.</p>\n\n<div class=\"quran-box\">\n  <p>﴿وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا﴾</p>\n  <div class=\"ayah-source\">[الإسراء: ٢٣]</div>\n</div>\n\n<p>الإحسان يظهر في خفض الجناح، وفي نبرة صوتكِ الهادئة، وفي الابتسامة حين تدخلين عليهما، وفي المبادرة بالمساعدة دون انتظار للطلب. اقتربي من أمكِ، اجلسي معها دون شاشة هاتف، اسألي أباكِ عن يومه وقبلي يده؛ فقد يأتي يوم تتمنين فيه لو سمعتِ صوتهما دقيقة واحدة فلا تجدينهما!</p>\n"}, {"tag": "الرسالة السادسة", "title": "همسة الرسالة السادسة ومساحة البوح", "type": "exercise", "html": "\n<div class=\"heart-keepsake-card\">\n  <div class=\"heart-badge\">🌸 رِسَالَةٌ إِلَى قَلْبِكِ • الهَمْسَةُ السَّادِسَة</div>\n  <p>«لا تؤجلي الحب والبر حتى يصبحا ذكرى وندماً. اجعلي والديكِ يشعران اليوم بأن وجودهما أعظم نعمة وبركة في حياتكِ.»</p>\n</div>\n\n<div class=\"interactive-box\" style=\"margin-top: 20px;\">\n  <h3 style=\"margin-bottom: 6px;\">💐 مساحة بوح: عمل بر سأصنعه اليوم</h3>\n  <p style=\"font-size: .85em; color: var(--text-secondary); margin-bottom: 8px;\">ما المفاجأة الطيبة التي ستقدمينها لأمكِ أو أبيكِ اليوم لإدخال السرور على قلبيهما؟</p>\n  <textarea id=\"journal_letter_6\" class=\"field-textarea\" placeholder=\"مثال: إعداد كوب قهوة لأمي وتقبيل رأسها، كتابة رسالة شكر لأبي، ترتيب الصالة دون أن يُطلب مني...\" oninput=\"saveField(this.id, this.value)\"></textarea>\n  <div class=\"save-indicator\">✓ تُحفظ خواطركِ سراً وتلقائياً في جهازكِ</div>\n</div>\n"}, {"tag": "الرسالة السابعة", "title": "اختاري صديقاتكِ بعناية", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">✉️ ٧</span>\n  <span class=\"letter-envelope-title\">الرِّسَالَةُ السَّابِعَة</span>\n</div>\n\n<h1>اخْتَارِي صَدِيقَاتِكِ بِعِنَايَة</h1>\n<div class=\"letter-greeting\">يا ابنتي المباركة <span class=\"reader-name-slot\"></span>...</div>\n\n<p>الصديقة ليست مجرد فتاة تجاوركِ في مقعد الدراسة أو تتبادلين معها الضحك والرسائل؛ الصديقة قد تكون جسراً يرفعكِ إلى طاعة الله، أو هاوية تجركِ إلى ما لا تحمد عقباه.</p>\n\n<p>الصديقة قد تشجعكِ على حفظ القرآن والتفوق الدراسي، وقد تسخر من مبادئكِ وتدفعكِ إلى التساهل في الحجاب والعفة. قد تستر عيوبكِ، وقد تجعل أسراركِ حديثاً للمجالس.</p>\n\n<div class=\"hadith-box\">\n  <p>«المَرْءُ عَلَى دِينِ خَلِيلِهِ، فَلْيَنْظُرْ أَحَدُكُمْ مَنْ يُخَالِلُ»</p>\n  <div class=\"hadith-source\">رواه أبو داود والترمذي</div>\n</div>\n\n<p>فانظري بحكمة إلى من تسمحين لها بالدخول إلى عمق حياتكِ. الصديقة الطيبة تعترف إن أخطأت، وتنصحكِ برفق إن تعثرتِ، وتفرح لنجاحكِ بصدق دون حسد. لا تدعي خوفكِ من الوحدة يجعلكِ ترضين بصحبة تفسد عليكِ دينكِ وسلامكِ.</p>\n"}, {"tag": "الرسالة السابعة", "title": "همسة الرسالة السابعة ومساحة البوح", "type": "exercise", "html": "\n<div class=\"heart-keepsake-card\">\n  <div class=\"heart-badge\">🌸 رِسَالَةٌ إِلَى قَلْبِكِ • الهَمْسَةُ السَّابِعَة</div>\n  <p>«ليس المهم أن يكون حولكِ عشرات الصديقات، بل أن يكون في دائرتكِ قلوب نقية تضيف إلى حياتكِ خيراً وأماناً وتعينكِ على مرضاة الله.»</p>\n</div>\n\n<div class=\"interactive-box\" style=\"margin-top: 20px;\">\n  <h3 style=\"margin-bottom: 6px;\">👭 مساحة بوح: مرآة صحبتي</h3>\n  <p style=\"font-size: .85em; color: var(--text-secondary); margin-bottom: 8px;\">صفات الصديقة التي أعتز بوجودها في حياتي، وكيف سأكون أنا الصديقة الصالحة لها:</p>\n  <textarea id=\"journal_letter_7\" class=\"field-textarea\" placeholder=\"تحفظ سري، تذكرني بالصلاة، تحفظ غيبتي، وتبعث في قلبي التفاؤل والهمة...\" oninput=\"saveField(this.id, this.value)\"></textarea>\n  <div class=\"save-indicator\">✓ تُحفظ خواطركِ سراً وتلقائياً في جهازكِ</div>\n</div>\n"}, {"tag": "الرسالة الثامنة", "title": "لا تهملي عقلكِ وأحلامكِ", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">✉️ ٨</span>\n  <span class=\"letter-envelope-title\">الرِّسَالَةُ الثَّامِنَة</span>\n</div>\n\n<h1>لاَ تُهْمِلِي عَقْلَكِ وَأَحْلاَمَك</h1>\n<div class=\"letter-greeting\">يا فتاة الهمة <span class=\"reader-name-slot\"></span>...</div>\n\n<p>أنتِ لم تُخلقي لتكوني مجرد متفرجة سلبية على موكب الحياة! لديكِ عقل نير يستطيع أن يتعلم، ويدان قادرتان على الإنجاز، وقلب ينبض بالحب والخير، وطاقات هائلة تنمو بالتدريب والتكرار.</p>\n\n<p>إياكِ أن تقولي: <em>«أنا عاجزة ولا أستطيع!»</em>... تعلمي، اقرئي، اسألي، جربي؛ فإن تعثرتِ في مسار أكاديمي فهناك مئات الأبواب المفتوحة للتعلم الذاتي واكتساب المهارات النافعة.</p>\n\n<div class=\"hadith-box\">\n  <p>«احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ، وَلاَ تَعْجَزْ»</p>\n  <div class=\"hadith-source\">رواه مسلم</div>\n</div>\n\n<p>كثير من العظماء خرجوا من بيوت بسيطة ولم يمتلكوا في بداياتهم إلا الإرادة والصبر والاستعانة بالله. كوني فتاة متعلمة، واعية، صاحبة مهنة أو مهارة تخدم بها دينها ومجتمعها، وتذكري أن نجاحكِ وتميزكِ لا يناقض أنوثتكِ ولا حياءكِ أبداً.</p>\n"}, {"tag": "الرسالة الثامنة", "title": "همسة الرسالة الثامنة ومساحة البوح", "type": "exercise", "html": "\n<div class=\"heart-keepsake-card\">\n  <div class=\"heart-badge\">🌸 رِسَالَةٌ إِلَى قَلْبِكِ • الهَمْسَةُ الثَّامِنَة</div>\n  <p>«لا تجعلي أحلامكِ حبيسة دفتر أمنياتكِ. اختاري حلمكِ الأكبر، وابدئي اليوم بخطوة صغيرة ملموسة نحوه بعون الله.»</p>\n</div>\n\n<div class=\"interactive-box\" style=\"margin-top: 20px;\">\n  <h3 style=\"margin-bottom: 6px;\">🎯 مساحة بوح: خطوة حلمي اليومية</h3>\n  <p style=\"font-size: .85em; color: var(--text-secondary); margin-bottom: 8px;\">حلمي الذي عقدتُ العزم على السعي إليه، والخطوة العملية التي سأبدأ بها:</p>\n  <textarea id=\"journal_letter_8\" class=\"field-textarea\" placeholder=\"حلمي: إتقان التصميم أو الكتابة... خطوتي: تخصيص نصف ساعة يومياً للتطبيق والتعلم...\" oninput=\"saveField(this.id, this.value)\"></textarea>\n  <div class=\"save-indicator\">✓ تُحفظ خواطركِ سراً وتلقائياً في جهازكِ</div>\n</div>\n"}, {"tag": "الرسالة التاسعة", "title": "لا بأس أن تبكي", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">✉️ ٩</span>\n  <span class=\"letter-envelope-title\">الرِّسَالَةُ التَّاسِعَة</span>\n</div>\n\n<h1>لاَ بَأْسَ أَنْ تَبْكِي</h1>\n<div class=\"letter-greeting\">يا رفيقة الفؤاد <span class=\"reader-name-slot\"></span>...</div>\n\n<p>هناك أيام يا ابنتي تعصف بنا رياحها بما لا نشتهي؛ قد تخفقين في امتحان بذلتِ فيه وسعكِ، أو تخسرين صديقة كنتِ تظنينها وفية، أو يتأخر دعاء ألححتِ به شهوراً طويلة... فتجلسين تبكين بحرقة وتسألين: <em>«لماذا يحدث لي هذا؟»</em></p>\n\n<p>أريدكِ أن تتيقني أن الحزن ليس عيباً، وأن البكاء ليس ضعفاً، وأن التألم لا يعني أبداً ضعف الإيمان؛ فحتى الأنبياء الكرام دمعت أعينهم واعتصرت قلوبهم حزناً.</p>\n\n<div class=\"quran-box\">\n  <p>﴿قَالَ إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ﴾</p>\n  <div class=\"ayah-source\">[يوسف: ٨٦]</div>\n</div>\n\n<p>اشكِي بثكِ إلى الله بدموعكِ، ولا تكتمي حزنكِ في صدركِ حتى يخنقه. اطلبي المساندة من والدتكِ أو مختصة نفسية إن احتجتِ، ولا تجعلي تجربة مؤلمة واحدة تحكم على بقية سنوات عمركِ المشرقة بإذن الله.</p>\n"}, {"tag": "الرسالة التاسعة", "title": "همسة الرسالة التاسعة ومساحة البوح", "type": "exercise", "html": "\n<div class=\"heart-keepsake-card\">\n  <div class=\"heart-badge\">🌸 رِسَالَةٌ إِلَى قَلْبِكِ • الهَمْسَةُ التَّاسِعَة</div>\n  <p>«إذا تعبتِ فاستريحي وخذي نفساً عميقاً، لكن إياكِ أن تتخلي عن حياتكِ ورسالتكِ؛ وإذا بكيتِ فامسحي دموعكِ برفق، وانهضي لتبدئي من جديد.»</p>\n</div>\n\n<div class=\"interactive-box\" style=\"margin-top: 20px;\">\n  <h3 style=\"margin-bottom: 6px;\">🩹 مساحة بوح: بلسم الجراح والتعافي</h3>\n  <p style=\"font-size: .85em; color: var(--text-secondary); margin-bottom: 8px;\">موقف مؤلم مر بي وتعلمتُ منه درساً زادني نضجاً وقوة:</p>\n  <textarea id=\"journal_letter_9\" class=\"field-textarea\" placeholder=\"اكتبي هنا كيف حول الله عسركِ إلى يسر ونور...\" oninput=\"saveField(this.id, this.value)\"></textarea>\n  <div class=\"save-indicator\">✓ تُحفظ خواطركِ سراً وتلقائياً في جهازكِ</div>\n</div>\n"}, {"tag": "الرسالة العاشرة", "title": "الحياء جمال لا يطفئ شخصيتكِ", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">✉️ ١٠</span>\n  <span class=\"letter-envelope-title\">الرِّسَالَةُ العَاشِرَة</span>\n</div>\n\n<h1>الحَيَاءُ جَمَالٌ لاَ يُطْفِئُ شَخْصِيَّتَك</h1>\n<div class=\"letter-greeting\">يا ذات الوقار <span class=\"reader-name-slot\"></span>...</div>\n\n<p>الحياء خلق نبيل يحفظ للفتاة عفتها وبهاءها؛ لكنه ليس خوفاً من الناس، وليس عجزاً عن الكلام، وليس تنازلاً عن حقوقكِ الشرعية والنظامية حتى يرضى الآخرون!</p>\n\n<p>كوني مؤدبة، لكن لا تسمحي لأحد أن يهينكِ أو ينتقص من كرامتكِ. كوني لطيفة هينة لينة، لكن تعلمي أن تقولي «لا» بملء فيكِ حين يتعلق الأمر بخطأ أو تجاوز لحدود الله.</p>\n\n<div class=\"wisdom-pearl\">\n  الحياء لا يعني الصمت عن الظلم، ولا الخجل من طلب العلم والتفوق، ولا التردد في الدفاع عن الحق. أجمل ما في الفتاة أن تجمع بين رقة القلب وقوة الموقف، وبين حسن الخلق ووضوح الشخصية.\n</div>\n\n<p>عبري عن رأيكِ بأدب وثقة، واعلمي أن القوة والكرامة تاج فوق رأس الفتاة المسلمة الحية.</p>\n"}, {"tag": "الرسالة العاشرة", "title": "همسة الرسالة العاشرة ومساحة البوح", "type": "exercise", "html": "\n<div class=\"heart-keepsake-card\">\n  <div class=\"heart-badge\">🌸 رِسَالَةٌ إِلَى قَلْبِكِ • الهَمْسَةُ العَاشِرَة</div>\n  <p>«كوني طيبة القلب، لكن لا تكوني سهلة الاستغلال؛ وكوني قوية حازمة في مبادئكِ، لكن لا تسمحي للقسوة والغلظة أن تسكنا فؤادكِ.»</p>\n</div>\n\n<div class=\"interactive-box\" style=\"margin-top: 20px;\">\n  <h3 style=\"margin-bottom: 6px;\">👑 مساحة بوح: عزة ووقار</h3>\n  <p style=\"font-size: .85em; color: var(--text-secondary); margin-bottom: 8px;\">موقف استطعتُ فيه أن أقول «لا» بحزم وأدب حفاظاً على قيمي:</p>\n  <textarea id=\"journal_letter_10\" class=\"field-textarea\" placeholder=\"رفضي الذهاب لمكان لا يرضي الله، وضعي حداً لحديث غير لائق...\" oninput=\"saveField(this.id, this.value)\"></textarea>\n  <div class=\"save-indicator\">✓ تُحفظ خواطركِ سراً وتلقائياً في جهازكِ</div>\n</div>\n"}, {"tag": "الرسالة الحادية عشرة", "title": "ماذا لو أخطأتِ؟", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">✉️ ١١</span>\n  <span class=\"letter-envelope-title\">الرِّسَالَةُ الحَادِيَةَ عَشْرَة</span>\n</div>\n\n<h1>مَاذَا لَوْ أَخْطَأْتِ؟</h1>\n<div class=\"letter-greeting\">يا بنيتي الصادقة <span class=\"reader-name-slot\"></span>...</div>\n\n<p>لا أريدكِ أبداً أن تظني أن هذا الكتاب كُتب لملائكة لا يخطئون؛ فكل بني آدم خطاؤون، وكلنا نمر بلحظات ضعف أو نتخذ قرارات نندم عليها لاحقاً، أو نضعف أمام ذنب ومعصية.</p>\n\n<p>لكن اسمعي وصيتي التي تحفظ قلبكِ: <strong>لا تحولي الخطأ إلى هوية دائمة! أنتِ لستِ خطأكِ.</strong></p>\n\n<div class=\"hadith-box\">\n  <p>«كُلُّ بَنِي آدَمَ خَطَّاءٌ، وَخَيْرُ الخَطَّائِينَ التَّوَّابُونَ»</p>\n  <div class=\"hadith-source\">رواه الترمذي وابن ماجه وأحمد</div>\n</div>\n\n<p>إذا أخطأتِ، فاعترفي بضعفكِ بين يدي ربكِ، وتوبي توبة صادقة، وأصلحي ما تستطيعين إصلاحه، وتذكري أن من كرم الله أنه يبدل السيئات حسنات إن صدقتِ في إنابتكِ. لا تسمحي لأحد أن يبتزكِ بماضيكِ أو يجعلكِ أسيرة لذنب استغفرتِ منه.</p>\n"}, {"tag": "الرسالة الحادية عشرة", "title": "همسة الرسالة الحادية عشرة ومساحة البوح", "type": "exercise", "html": "\n<div class=\"heart-keepsake-card\">\n  <div class=\"heart-badge\">🌸 رِسَالَةٌ إِلَى قَلْبِكِ • الهَمْسَةُ الحَادِيَةَ عَشْرَة</div>\n  <p>«لا تجعلي صفحة مظلمة عابرة في حياتكِ تحجب عنكِ بقية الصفحات البيضاء المشرقة التي تستطيعين كتابتها كل صباح.»</p>\n</div>\n\n<div class=\"interactive-box\" style=\"margin-top: 20px;\">\n  <h3 style=\"margin-bottom: 6px;\">🕊️ مساحة بوح: توبة وانطلاقة جديدة</h3>\n  <p style=\"font-size: .85em; color: var(--text-secondary); margin-bottom: 8px;\">خطأ قديم تعلمتُ منه واستغفرتُ ربي عنه، وعاهدتُ نفسي على تجاوزه:</p>\n  <textarea id=\"journal_letter_11\" class=\"field-textarea\" placeholder=\"الحمد لله الذي ستر علي وعلمني ووفقني للرجوع إليه...\" oninput=\"saveField(this.id, this.value)\"></textarea>\n  <div class=\"save-indicator\">✓ تُحفظ خواطركِ سراً وتلقائياً في جهازكِ</div>\n</div>\n"}, {"tag": "الرسالة الثانية عشرة", "title": "أنتِ صاحبة رسالة", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">✉️ ١٢</span>\n  <span class=\"letter-envelope-title\">الرِّسَالَةُ الثَّانِيَةَ عَشْرَة</span>\n</div>\n\n<h1>أَنْتِ صَاحِبَةُ رِسَالَة</h1>\n<div class=\"letter-greeting\">يا صانعة الأثر <span class=\"reader-name-slot\"></span>...</div>\n\n<p>والآن يا ابنتي، بعد أن تحدثنا عن مكنونات قلبكِ، وعن صلتكِ بربكِ، وعن أحلامكِ، وعن الناس من حولكِ... أريد أن أسألكِ السؤال الأكبر: <strong>ماذا تريدين أن تتركي خلفكِ في هذا العالم؟</strong></p>\n\n<p>هل تريدين أن تمضي سنوات عمركِ دون أن يشعر أحد بوجودكِ؟ أم تريدين أن تكوني إنسانة مباركة يورق الخير حيثما حلت؟</p>\n\n<p>لا يُشترط أن تصبحي مشهورة تلهج بذكركِ الشاشات، ولا أن تملكي أموالاً طائلة؛ فرسالتكِ قد تكون في بيتكِ حين تبرين والديكِ وتربين إخوتكِ، أو في مدرستكِ حين تعينين طالبة متعثرة، أو في إتقانكِ لعملكِ، أو في كلمة طيبة صادقة تزرع الأمل في قلب كاد ييأس.</p>\n\n<div class=\"hadith-box\">\n  <p>«أَحَبُّ النَّاسِ إِلَى اللَّهِ أَنْفَعُهُمْ لِلنَّاسِ»</p>\n  <div class=\"hadith-source\">رواه الطبراني وابن أبي الدنيا</div>\n</div>\n\n<p>كل معروف تقدمينه له وزن عند الله عظيم. لا تحتقري ابتسامتكِ، ولا مساندتكِ، ولا دفاعكِ عن مظلوم؛ فرب عمل صغير أخلصتِ فيه يرفعكِ عند الله أعلى الدرجات.</p>\n"}, {"tag": "الرسالة الثانية عشرة", "title": "همسة الرسالة الثانية عشرة ومساحة البوح", "type": "exercise", "html": "\n<div class=\"heart-keepsake-card\">\n  <div class=\"heart-badge\">🌸 رِسَالَةٌ إِلَى قَلْبِكِ • الهَمْسَةُ الثَّانِيَةَ عَشْرَة</div>\n  <p>«لا تعيشي فقط لتسألي: ماذا أريد أن آخذ من الحياة؟ بل اسألي دائماً بقلب المحسنة: ماذا أستطيع أن أقدم للحياة ولأمتي؟»</p>\n</div>\n\n<div class=\"interactive-box\" style=\"margin-top: 20px;\">\n  <h3 style=\"margin-bottom: 6px;\">🌍 مساحة بوح: بذرة أثري المبارك</h3>\n  <p style=\"font-size: .85em; color: var(--text-secondary); margin-bottom: 8px;\">الأثر الطيب الذي سأعمل على غرسه في أسرتي ومجتمعي بإذن الله:</p>\n  <textarea id=\"journal_letter_12\" class=\"field-textarea\" placeholder=\"نشر العلم النافع، إدخال السرور على المحتاجين، والقدوة الصالحة في الخلق...\" oninput=\"saveField(this.id, this.value)\"></textarea>\n  <div class=\"save-indicator\">✓ تُحفظ خواطركِ سراً وتلقائياً في جهازكِ</div>\n</div>\n"}, {"tag": "الخاتمة", "title": "أريدكِ أن تبدئي الآن", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">🌟</span>\n  <span class=\"letter-envelope-title\">وَصِيَّةُ الخِتَام</span>\n</div>\n\n<h1>أُرِيدُكِ أَنْ تَبْدَئِي الآن</h1>\n<div class=\"letter-greeting\">يا ابنتي الغالية <span class=\"reader-name-slot\"></span>...</div>\n\n<p>وصلنا إلى نهاية هذه الرسائل، لكنني لا أريد أن تكون هذه نهاية الحديث؛ بل بداية جديدة مشرقة في حياتكِ. لا تغلقي هذا الكتاب وتعودي كما كنتِ!</p>\n\n<p>انظري إلى نفسكِ بعين الرحمة، وإلى مستقبلكِ بعين الأمل، وإلى علاقتكِ بالله بقلب مشتاق محب. لا تنتظري الغد لتتغيري؛ ابدئي اليوم بخطوات صغيرة واثقة:</p>\n\n<div class=\"step-card\"><div class=\"step-num\">🌸</div><div class=\"step-content\"><strong>صلاة</strong> تحافظين عليها بخشوع.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">🌸</div><div class=\"step-content\"><strong>آية</strong> تتدبرينها وتعملين بها.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">🌸</div><div class=\"step-content\"><strong>كتاب</strong> يغذي عقلكِ ويزيد وعيكِ.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">🌸</div><div class=\"step-content\"><strong>عادة سيئة</strong> تتركينها لوجه الله.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">🌸</div><div class=\"step-content\"><strong>أم وأب</strong> تقبلين رأسيهما بحب.</div></div>\n<div class=\"step-card\"><div class=\"step-num\">🌸</div><div class=\"step-content\"><strong>حلم</strong> تخطين نحوه كل صباح خطوة.</div></div>\n\n<div class=\"wisdom-pearl\" style=\"font-size: 1.05em; line-height: 2.1; margin: 20px 0;\">\n  <strong>أنتِ غالية،</strong> فلا تبيعي كرامتكِ.<br/>\n  <strong>أنتِ قادرة،</strong> فلا تستسلمي للعجز.<br/>\n  <strong>أنتِ إنسانة،</strong> فلا تطلبي من نفسكِ الكمال المستحيل.<br/>\n  <strong>أنتِ عبدة لله،</strong> فلا تيأسي من رحمته الواسعة.<br/>\n  <strong>وأنتِ صاحبة رسالة،</strong> فلا تجعلي عمركِ يمر بلا أثر.\n</div>\n"}, {"tag": "الملحق", "title": "عهدي مع نفسي والختم الشمعي", "type": "exercise", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">🖋️</span>\n  <span class=\"letter-envelope-title\">عَهْدِي مَعَ نَفْسِي</span>\n</div>\n\n<h1>مِيثَاقُ الرِّسَالَةِ لِقَلْبِي</h1>\n<p style=\"font-size: .88em; color: var(--text-secondary); text-align: center;\">أكتب هذا العهد لنفسي وأعود إليه كلما شعرتُ أنني ابتعدتُ عن الطريق:</p>\n\n<div class=\"interactive-box\" style=\"background: linear-gradient(145deg, var(--bg-soft-rose), var(--bg-secondary)); border: 1.5px solid var(--accent-gold);\">\n  <div style=\"font-size: .88em; line-height: 1.9;\">\n    <p>١. سأحاول أن أحافظ على صلاتي، وأقترب من الله كل يوم.</p>\n    <p>٢. لن أحتقر نفسي، ولن أقارن حياتي بحياة الآخرين.</p>\n    <p>٣. سأحافظ على كرامتي، ولن أسمح لأحد باستغلالي.</p>\n    <p>٤. سأتعلم شيئاً جديداً، وأسعى إلى تطوير نفسي وعقلي.</p>\n    <p>٥. سأحسن إلى والديّ، وأحفظ حقوق الناس.</p>\n    <p>٦. سأختار صديقات يعنّني على الخير وطاعة الله.</p>\n    <p>٧. إذا أخطأت، فسأتوب سريعاً وأحاول من جديد.</p>\n    <p>٨. سأجعل لي عملاً نافعاً وأثراً أقدمه للناس.</p>\n    <p>٩. سأتعامل مع نفسي برحمة، ولن أطلب منها الكمال.</p>\n    <p>١٠. سأعيش حياتي وأنا أستشعر أن لي رسالة عند الله.</p>\n  </div>\n\n  <div class=\"quran-box\" style=\"margin: 14px 0; padding: 10px 14px;\">\n    <p style=\"font-size: 1em;\">«اللَّهُمَّ أَعِنِّي عَلَى نَفْسِي، وَاهْدِ قَلْبِي، وَاجْعَلْنِي مِفْتَاحاً لِلْخَيْرِ مِغْلاَقاً لِلشَّرِّ... آمِين»</p>\n  </div>\n\n  <div class=\"covenant-sign-box\">\n    <div class=\"field-group\">\n      <label>اسم صاحبة العهد (التوقيع المبارك):</label>\n      <input class=\"field-input\" id=\"covenant_signature\" placeholder=\"اكتبي اسمكِ وتوقيعكِ هنا...\" oninput=\"saveField(this.id, this.value)\"/>\n    </div>\n    <div class=\"field-group\">\n      <label>تاريخ إبرام الميثاق والعهد:</label>\n      <input class=\"field-input\" id=\"covenant_date\" placeholder=\"اليوم والتاريخ...\" oninput=\"saveField(this.id, this.value)\"/>\n    </div>\n    <button class=\"primary-btn\" onclick=\"saveCovenant()\">اعتماد وختم الميثاق بالشمع الوردي 🔏</button>\n  </div>\n</div>\n"}, {"tag": "معرض الهمسات", "title": "معرض الهمسات الوجدانية الاثنتي عشرة", "type": "reading", "html": "\n<div class=\"letter-envelope-header\">\n  <span class=\"letter-seal\">🌸</span>\n  <span class=\"letter-envelope-title\">مَعْرِضُ الهَمَسَات</span>\n</div>\n\n<h1>مَعْرِضُ هَمَسَاتِ القَلْبِ الاثْنَتَيْ عَشْرَة</h1>\n<p style=\"font-size: .88em; color: var(--text-secondary); text-align: center;\">خلاصة الرسائل الاثنتي عشرة... بطاقات إشراق تتزودين منها كلما احتجتِ إلى سكينة:</p>\n\n<div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 14px;\">\n  <div class=\"whisper-pill\" onclick=\"window.goToPage(5)\"><span>١. أنتِ لا تحتاجين أن تكوني أجمل فتاة لتستحقي الاحترام</span><small>ص ٦</small></div>\n  <div class=\"whisper-pill\" onclick=\"window.goToPage(7)\"><span>٢. لا تجعلي ذنوب الأمس تمنعكِ من طاعة اليوم</span><small>ص ٨</small></div>\n  <div class=\"whisper-pill\" onclick=\"window.goToPage(9)\"><span>٣. ليس عليكِ أن تكوني قوية طوال الوقت؛ استندي إلى الله</span><small>ص ١٠</small></div>\n  <div class=\"whisper-pill\" onclick=\"window.goToPage(11)\"><span>٤. لا تبحثي عن شخص يمنحكِ قيمتكِ، بل احفظي كرامتكِ</span><small>ص ١٢</small></div>\n  <div class=\"whisper-pill\" onclick=\"window.goToPage(13)\"><span>٥. لا تقيسي حياتكِ بمظاهر الآخرين، بل باركي واحمدي</span><small>ص ١٤</small></div>\n  <div class=\"whisper-pill\" onclick=\"window.goToPage(15)\"><span>٦. لا تؤجلي بر والديكِ حتى يصبحا ذكرى</span><small>ص ١٦</small></div>\n  <div class=\"whisper-pill\" onclick=\"window.goToPage(17)\"><span>٧. اختاري صديقات يضفن إلى قلبكِ أماناً وطاعة</span><small>ص ١٨</small></div>\n  <div class=\"whisper-pill\" onclick=\"window.goToPage(19)\"><span>٨. لا تجعلي أحلامكِ حبيسة الدفاتر، ابدئي بخطوة اليوم</span><small>ص ٢٠</small></div>\n  <div class=\"whisper-pill\" onclick=\"window.goToPage(21)\"><span>٩. إذا تعبتِ فاستريحي، لكن لا تتخلي عن رسالتكِ</span><small>ص ٢٢</small></div>\n  <div class=\"whisper-pill\" onclick=\"window.goToPage(23)\"><span>١٠. كوني طيبة لكن غير سهلة الاستغلال، وقوية بلا قسوة</span><small>ص ٢٤</small></div>\n  <div class=\"whisper-pill\" onclick=\"window.goToPage(25)\"><span>١١. لا تجعلي صفحة سيئة تحجب الصفحات البيضاء المشرقة</span><small>ص ٢٦</small></div>\n  <div class=\"whisper-pill\" onclick=\"window.goToPage(27)\"><span>١٢. ما دمتِ حية، فاسألي: ماذا أستطيع أن أقدم للحياة؟</span><small>ص ٢٨</small></div>\n</div>\n"}, {"tag": "لوحة الإتمام", "title": "لوحة الإتمام والشعار الختامي", "type": "closing", "html": "\n<div class=\"closing\">\n  <div class=\"eyebrow\">إِتْمَامُ الرِّحْلَةِ المُبَارَكَة</div>\n  <h1 style=\"color: var(--accent-rose-dark); margin-bottom: 6px;\">مُبَارَكٌ لِقَلْبِكِ هَذَا النُّور!</h1>\n  <div class=\"ornament\">❀ ❀ ❀</div>\n\n  <div class=\"covenant-sign-box\" style=\"margin: 16px auto; max-width: 90%; background: #FFFDF9; border-color: var(--accent-rose);\">\n    <div style=\"font-size: 1.15em; font-family: var(--font-headings); color: var(--accent-rose-dark); font-weight: 700;\">\n      شَهَادَةُ إِتْمَامِ قِرَاءَةِ رَسَائِلِ القَلْب\n    </div>\n    <p style=\"font-size: .95em; line-height: 1.9; margin: 10px 0; color: var(--text-primary);\">\n      أتمت الابنة الغالية <span class=\"reader-name-slot\" style=\"font-weight: 700; color: var(--accent-rose-dark);\"></span> قراءة رسائل هذا الكتاب بوعي، وتعهدت على صون كرامتها، وحفظ صلتها بالله، وبناء شخصيتها لتكون منارة أثر طيب.\n    </p>\n    <div style=\"font-family: var(--font-interface); font-size: .78em; color: var(--accent-gold); font-weight: 700;\">\n      مَكْتَبَتِي • طَبْعَةُ الرَّسَائِلِ الوِجْدَانِيَّةِ الفَاخِرَة\n    </div>\n  </div>\n\n  <div class=\"quran-box\" style=\"margin: 16px auto; max-width: 92%;\">\n    <div style=\"font-size: 1.3em; font-family: var(--font-headings); color: var(--accent-rose-dark); font-weight: 700;\">🌸 أَنَا فَتَاةٌ وَلِي رِسَالَة 🌸</div>\n    <div style=\"font-size: 1.05em; font-family: var(--font-body); color: var(--accent-sage-dark); margin-top: 6px;\">«أَنْتِ غَالِيَةٌ عِنْدَ اللَّهِ، فَلاَ تَرْخُصِي نَفْسَكِ عِنْدَ النَّاس»</div>\n  </div>\n\n  <div class=\"ornament\">❖ تَمَّتِ الرَّسَائِلُ بِحَمْدِ اللَّهِ وَتَوْفِيقِهِ ❖</div>\n  <button class=\"primary-btn\" onclick=\"window.goToPage(0)\">العودة إلى الغلاف الأول ↩</button>\n</div>\n"}]
    };

    let currentPageIndex = 0;
    let savedBookmarks = [];

    try {
      savedBookmarks = JSON.parse(localStorage.getItem("maktabati_ghaliyah_bookmarks") || "[]");
    } catch (e) {
      savedBookmarks = [];
    }

    const activePageArticle = document.getElementById("activePageArticle");
    const pageCounter = document.getElementById("pageCounter");
    const btnPrevPage = document.getElementById("btnPrevPage");
    const btnNextPage = document.getElementById("btnNextPage");
    const runningHeader = document.getElementById("runningHeader");
    const runningHeaderTag = document.getElementById("runningHeaderTag");
    const runningHeaderTitle = document.getElementById("runningHeaderTitle");
    const bookmarkBtn = document.getElementById("bookmarkBtn");
    const bookStage = document.getElementById("bookStage");

    const searchPanel = document.getElementById("searchPanel");
    const searchOpen = document.getElementById("searchOpen");
    const searchClose = document.getElementById("searchClose");
    const searchInput = document.getElementById("searchInput");
    const searchClearBtn = document.getElementById("searchClearBtn");
    const searchStatus = document.getElementById("searchStatus");
    const searchResults = document.getElementById("searchResults");

    const tocPanel = document.getElementById("tocPanel");
    const tocBtn = document.getElementById("tocBtn");
    const tocClose = document.getElementById("tocClose");
    const tocPanelList = document.getElementById("tocPanelList");

    function renderPage(index, highlightQuery) {
      if (index < 0) index = 0;
      if (index >= BOOK_DATA.totalPages) index = BOOK_DATA.totalPages - 1;
      currentPageIndex = index;

      const page = BOOK_DATA.pages[index];
      activePageArticle.innerHTML = page.html;

      // Counters & Buttons
      pageCounter.textContent = (index + 1) + " / " + BOOK_DATA.totalPages;
      btnPrevPage.disabled = (index === 0);
      btnNextPage.disabled = (index === BOOK_DATA.totalPages - 1);

      // Running Header
      if (page.type === "cover") {
        runningHeader.hidden = true;
      } else {
        runningHeader.hidden = false;
        runningHeaderTag.textContent = page.tag || "مكتبتي";
        runningHeaderTitle.textContent = page.title || "";
      }

      // Bookmark Button State
      if (savedBookmarks.includes(index)) {
        bookmarkBtn.classList.add("bookmarked");
      } else {
        bookmarkBtn.classList.remove("bookmarked");
      }

      // Scroll to top
      bookStage.scrollTop = 0;

      // Restore inputs & reader name
      restorePageInputs();
      updateReaderNameInDom();

      // Highlight search query if requested
      if (highlightQuery) {
        applyCalmPageSearchHighlight(highlightQuery);
      }

      // Save last read page in localStorage
      try {
        localStorage.setItem("maktabati_ghaliyah_last_page", String(index));
      } catch (e) {}

      // Inform Maktabati Android Bridge if present
      if (window.MaktabatiBridge && window.MaktabatiBridge.onPageChanged) {
        window.MaktabatiBridge.onPageChanged(index + 1, BOOK_DATA.totalPages);
      }
    }

    window.goToPage = function(idx) {
      renderPage(idx);
    };

    window.nextPage = function() {
      if (currentPageIndex < BOOK_DATA.totalPages - 1) {
        renderPage(currentPageIndex + 1);
      }
    };

    window.prevPage = function() {
      if (currentPageIndex > 0) {
        renderPage(currentPageIndex - 1);
      }
    };

    // Keyboard navigation
    window.addEventListener("keydown", function(e) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === "ArrowLeft") window.nextPage();
      if (e.key === "ArrowRight") window.prevPage();
      if (e.key === "Escape") {
        searchPanel.classList.remove("open");
        tocPanel.classList.remove("open");
      }
    });

    // Touch swipe navigation
    let touchStartX = 0;
    let touchStartY = 0;
    bookStage.addEventListener("touchstart", function(e) {
      if (e.touches && e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    bookStage.addEventListener("touchend", function(e) {
      if (e.changedTouches && e.changedTouches.length === 1) {
        const diffX = e.changedTouches[0].clientX - touchStartX;
        const diffY = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(diffX) > 65 && Math.abs(diffY) < 55) {
          if (diffX < 0) {
            window.nextPage(); // RTL swipe left
          } else {
            window.prevPage(); // RTL swipe right
          }
        }
      }
    }, { passive: true });

    // Lock 2-finger touchmove to prevent random image-like viewport zooming
    document.addEventListener("touchmove", function(e) {
      if (e.touches && e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    // Fluid Reflow Zoom Engine (75% to 200%)
    window.__maktabatiSetFluidZoom = function(zoomPct, smooth) {
      const pct = Math.max(75, Math.min(200, Number(zoomPct) || 100));
      const scale = pct / 100;
      const root = document.documentElement;
      root.style.setProperty("--reader-font", Math.round(21 * scale) + "px");
      root.style.setProperty("--reader-font-size", pct + "%");
      root.style.setProperty("--font-scale", String(scale));
      try {
        localStorage.setItem("maktabati_fluid_zoom_pct", String(pct));
      } catch (e) {}
    };

    // Bookmark Toggle
    bookmarkBtn.addEventListener("click", function() {
      const idx = currentPageIndex;
      if (savedBookmarks.includes(idx)) {
        savedBookmarks = savedBookmarks.filter(i => i !== idx);
      } else {
        savedBookmarks.push(idx);
      }
      try {
        localStorage.setItem("maktabati_ghaliyah_bookmarks", JSON.stringify(savedBookmarks));
      } catch (e) {}
      renderPage(currentPageIndex);
    });

    // TOC Panel
    tocBtn.addEventListener("click", function() {
      buildTocPanel();
      tocPanel.classList.add("open");
    });
    tocClose.addEventListener("click", function() {
      tocPanel.classList.remove("open");
    });
    tocPanel.addEventListener("click", function(e) {
      if (e.target === tocPanel) tocPanel.classList.remove("open");
    });

    function buildTocPanel() {
      let html = "";
      BOOK_DATA.pages.forEach((p, idx) => {
        const isPart = (p.type === "opener" || p.type === "reading");
        const cls = isPart ? "toc-item toc-part" : "toc-item";
        html += `<div class="${cls}" onclick="window.goToPage(${idx}); tocPanel.classList.remove('open');">
          <span>${p.tag ? p.tag + ' • ' : ''}${p.title}</span>
          <small>ص ${idx + 1}</small>
        </div>`;
      });
      tocPanelList.innerHTML = html;
    }

    // Search Engine with Arabic Normalization & Mapping
    searchOpen.addEventListener("click", function() {
      searchPanel.classList.add("open");
      setTimeout(() => searchInput.focus(), 80);
    });
    searchClose.addEventListener("click", function() {
      searchPanel.classList.remove("open");
    });
    searchPanel.addEventListener("click", function(e) {
      if (e.target === searchPanel) searchPanel.classList.remove("open");
    });
    searchClearBtn.addEventListener("click", function() {
      searchInput.value = "";
      searchClearBtn.hidden = true;
      executeBookSearch();
      searchInput.focus();
    });

    function normalizeArabicWithMap(text) {
      if (!text) return { normalized: "", map: [] };
      const tashkeelRegex = /[\u064B-\u065F\u0670\u06D6-\u06EDـ]/;
      let normalized = "";
      const map = [];
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (tashkeelRegex.test(ch)) continue;
        let c = ch;
        if (c === 'أ' || c === 'إ' || c === 'آ') c = 'ا';
        else if (c === 'ى') c = 'ي';
        else if (c === 'ة') c = 'ه';
        normalized += c.toLowerCase();
        map.push(i);
      }
      return { normalized, map };
    }

    function extractPagePlainText(html) {
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || "";
    }

    searchInput.addEventListener("input", function() {
      searchClearBtn.hidden = (searchInput.value.trim().length === 0);
      executeBookSearch();
    });

    function executeBookSearch() {
      const rawQuery = searchInput.value.trim();
      if (!rawQuery || rawQuery.length < 2) {
        searchStatus.textContent = "اكتبي كلمتين على الأقل للبحث في رسائل القلب...";
        searchResults.innerHTML = "";
        return;
      }

      const qNorm = normalizeArabicWithMap(rawQuery).normalized;
      const hits = [];

      for (let i = 0; i < BOOK_DATA.pages.length; i++) {
        const page = BOOK_DATA.pages[i];
        const plain = extractPagePlainText(page.html);
        const { normalized, map } = normalizeArabicWithMap(plain);

        let searchPos = 0;
        let matchCount = 0;

        while (true) {
          const matchIdx = normalized.indexOf(qNorm, searchPos);
          if (matchIdx === -1) break;
          matchCount++;

          if (matchCount <= 2) {
            const startOrig = map[matchIdx] || 0;
            const endNorm = matchIdx + qNorm.length - 1;
            const endOrig = (map[endNorm] !== undefined ? map[endNorm] + 1 : startOrig + rawQuery.length);

            const snippetStart = Math.max(0, startOrig - 40);
            const snippetEnd = Math.min(plain.length, endOrig + 40);

            const prefix = (snippetStart > 0 ? "..." : "") + plain.substring(snippetStart, startOrig);
            const matchText = plain.substring(startOrig, endOrig);
            const suffix = plain.substring(endOrig, snippetEnd) + (snippetEnd < plain.length ? "..." : "");

            hits.push({
              pageIndex: i,
              pageNumber: i + 1,
              title: page.title || ("صفحة " + (i + 1)),
              tag: page.tag || "",
              snippet: prefix + `<mark class="search-hit-mark">${matchText}</mark>` + suffix
            });
          }

          searchPos = matchIdx + Math.max(1, qNorm.length);
          if (hits.length >= 40) break;
        }

        if (hits.length >= 40) break;
      }

      if (hits.length === 0) {
        searchStatus.textContent = `لم يتم العثور على نتائج لكلمة «${rawQuery}»`;
        searchResults.innerHTML = `<div class="empty">جرّبي البحث بكلمة أخرى أو مرادف بديل.</div>`;
      } else {
        searchStatus.textContent = `عُثر على ${hits.length} همسة مطابقة:`;
        let html = "";
        hits.forEach(hit => {
          html += `<div class="search-result" onclick="selectSearchResult(${hit.pageIndex}, '${escapeQuery(rawQuery)}')">
            <div class="search-result-head">
              <strong>${hit.tag ? hit.tag + ' • ' : ''}${hit.title}</strong>
              <span class="search-result-page">ص ${hit.pageNumber}</span>
            </div>
            <small>${hit.snippet}</small>
          </div>`;
        });
        searchResults.innerHTML = html;
      }
    }

    function escapeQuery(str) {
      return str.replace(/['"\\]/g, "");
    }

    window.selectSearchResult = function(pageIndex, query) {
      searchPanel.classList.remove("open");
      renderPage(pageIndex, query);
    };

    function applyCalmPageSearchHighlight(query) {
      if (!query || query.length < 2) return;
      const { normalized: qNorm } = normalizeArabicWithMap(query);

      function traverse(node) {
        if (node.nodeType === 3) {
          const text = node.nodeValue;
          const { normalized, map } = normalizeArabicWithMap(text);
          const idx = normalized.indexOf(qNorm);
          if (idx !== -1) {
            const startOrig = map[idx];
            const endNorm = idx + qNorm.length - 1;
            const endOrig = map[endNorm] !== undefined ? map[endNorm] + 1 : startOrig + query.length;

            const before = text.substring(0, startOrig);
            const match = text.substring(startOrig, endOrig);
            const after = text.substring(endOrig);

            const span = document.createElement("span");
            if (before) span.appendChild(document.createTextNode(before));

            const mark = document.createElement("mark");
            mark.className = "page-search-highlight";
            mark.textContent = match;
            span.appendChild(mark);

            if (after) span.appendChild(document.createTextNode(after));

            node.parentNode.replaceChild(span, node);
            mark.scrollIntoView({ behavior: "smooth", block: "center" });
            return true;
          }
        } else if (node.nodeType === 1 && node.childNodes && !["SCRIPT", "STYLE", "BUTTON"].includes(node.tagName)) {
          for (let i = 0; i < node.childNodes.length; i++) {
            if (traverse(node.childNodes[i])) return true;
          }
        }
        return false;
      }

      traverse(activePageArticle);
    }

    // LocalStorage Interactive Field Persistence
    window.saveField = function(id, val) {
      try {
        localStorage.setItem("maktabati_ghaliyah_f_" + id, val);
      } catch (e) {}
    };

    window.saveReaderName = function(name) {
      try {
        localStorage.setItem("maktabati_ghaliyah_reader_name", name.trim());
        updateReaderNameInDom();
      } catch (e) {}
    };

    window.alertSavedName = function() {
      const input = document.getElementById("readerNameInput");
      const name = input ? input.value.trim() : "";
      if (name) {
        alert("أهلاً بكِ يا ابنتي " + name + " الغالية! 🌸 تم حفظ اسمكِ وسيرافقكِ في كل رسائل القلب.");
      }
    };

    window.saveCovenant = function() {
      const sig = document.getElementById("covenant_signature");
      const dt = document.getElementById("covenant_date");
      if (sig && sig.value.trim()) {
        alert("مبارك عليكِ ختم عهدكِ المبارك! 🔏 بارك الله في قلبكِ وجعلكِ مفتاحاً للخير.");
      } else {
        alert("اكتبي توقيعكِ الكريم لختم الميثاق المبارك 🌸");
      }
    };

    function updateReaderNameInDom() {
      const savedName = localStorage.getItem("maktabati_ghaliyah_reader_name") || "";
      const slots = document.querySelectorAll(".reader-name-slot");
      slots.forEach(slot => {
        slot.textContent = savedName ? " «" + savedName + "»" : "";
      });
      const nameInput = document.getElementById("readerNameInput");
      if (nameInput && savedName) {
        nameInput.value = savedName;
      }
    }

    function restorePageInputs() {
      const inputs = activePageArticle.querySelectorAll("input, textarea");
      inputs.forEach(el => {
        if (!el.id) return;
        const val = localStorage.getItem("maktabati_ghaliyah_f_" + el.id);
        if (val !== null) el.value = val;
      });
    }

    // Init on DOM ready
    document.addEventListener("DOMContentLoaded", function() {
      try {
        const savedZoom = localStorage.getItem("maktabati_fluid_zoom_pct");
        if (savedZoom) window.__maktabatiSetFluidZoom(savedZoom, false);
      } catch (e) {}

      let startPage = 0;
      try {
        const lp = localStorage.getItem("maktabati_ghaliyah_last_page");
        if (lp !== null) startPage = parseInt(lp, 10) || 0;
      } catch (e) {}

      renderPage(startPage);
    });
  </script>
