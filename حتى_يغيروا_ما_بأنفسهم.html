<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="theme-color" content="#F8F4E8"/>
  <meta name="color-scheme" content="light"/>
  <meta name="author" content="عمرو خالد"/>
  <meta name="description" content="حلقات فضائية للأستاذ عمرو خالد — المجموعة الأولى: التضرع، أمة واحدة، ترك المعاصي، الإيجابية، الثقة في الله، الجدية، الأخوة وسلامة الصدر، الإحسان، عزة المسلمين، التوبة، قيمة الوقت، الفخر بالشهادة"/>
  <title>حتى يغيروا ما بأنفسهم</title>

  <style>
    /* ١. ربط الخطوط العربية المدمجة أوفلاين في تطبيق مكتبتي */
    @font-face {
      font-family: "Amiri";
      src: url("https://maktabati.app/assets/fonts/amiri/amiri-400.woff2") format("woff2"),
           url("https://maktabati.app/fonts/amiri.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Amiri";
      src: url("https://maktabati.app/assets/fonts/amiri/amiri-700.woff2") format("woff2"),
           url("https://maktabati.app/fonts/amiri.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Noto Naskh Arabic";
      src: url("https://maktabati.app/assets/fonts/noto-naskh-arabic/noto-naskh-arabic-400.woff2") format("woff2"),
           url("https://maktabati.app/fonts/noto_naskh_arabic.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Noto Naskh Arabic";
      src: url("https://maktabati.app/assets/fonts/noto-naskh-arabic/noto-naskh-arabic-700.woff2") format("woff2"),
           url("https://maktabati.app/fonts/noto_naskh_arabic.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Aref Ruqaa";
      src: url("https://maktabati.app/assets/fonts/aref-ruqaa/aref-ruqaa-400.woff2") format("woff2"),
           url("https://maktabati.app/fonts/aref_ruqaa.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Aref Ruqaa";
      src: url("https://maktabati.app/assets/fonts/aref-ruqaa/aref-ruqaa-700.woff2") format("woff2"),
           url("https://maktabati.app/fonts/aref_ruqaa.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Reem Kufi";
      src: url("https://maktabati.app/assets/fonts/reem-kufi/reem-kufi-400.woff2") format("woff2"),
           url("https://maktabati.app/fonts/reem_kufi.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Reem Kufi";
      src: url("https://maktabati.app/assets/fonts/reem-kufi/reem-kufi-700.woff2") format("woff2"),
           url("https://maktabati.app/fonts/reem_kufi.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Amiri Quran";
      src: url("https://maktabati.app/fonts/amiri_quran.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Scheherazade New";
      src: url("https://maktabati.app/fonts/scheherazade_new.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Cairo";
      src: url("https://maktabati.app/fonts/cairo.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "El Messiri";
      src: url("https://maktabati.app/fonts/el_messiri.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Noto Sans Arabic";
      src: url("https://maktabati.app/assets/fonts/noto-sans-arabic/noto-sans-arabic-400.woff2") format("woff2"),
           url("https://maktabati.app/fonts/noto_sans_arabic.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Noto Kufi Arabic";
      src: url("https://maktabati.app/assets/fonts/noto-kufi-arabic/noto-kufi-arabic-700.woff2") format("woff2"),
           url("https://maktabati.app/fonts/noto_kufi_arabic.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }

    /* ٢. متغيرات الهوية البصرية والأدوار الخطية السبعة — حلة التراث والوقار الزمردي (ISLAMIC_EMERALD) */
    :root {
      --bg-primary: #F8F4E8;
      --bg-secondary: #FFFDF7;
      --paper-bg: #FFFDF7;
      --bg-card: #FFFDF7;
      --bg-soft-rose: #ECF6F1;
      --bg-soft-sage: #F3EFE2;
      --bg-pearl-gold: #FBF3E0;

      --accent-rose: #065F46;
      --accent-rose-dark: #044332;
      --accent-rose-light: #348F73;
      --accent-sage: #785323;
      --accent-sage-dark: #4D3414;
      --accent-gold: #B47B26;
      --accent-gold-soft: rgba(180,123,38,0.28);

      --text-primary: #1E2923;
      --ink-main: #1E2923;
      --text-main: #1E2923;
      --text-secondary: #4B5E54;
      --text-muted: #4B5E54;
      --line: rgba(120,83,35,0.20);
      --border-ornate: rgba(180,123,38,0.38);
      --paper-edge: #D8CEB8;
      --shadow-card: 0 16px 42px rgba(20,35,28,0.08);

      /* محرك التدفق الذكي Fluid Reflow Zoom */
      --reader-font: 21px;
      --reader-font-size: 100%;
      --font-scale: 1;

      --font-body: "Noto Naskh Arabic", "Amiri", serif;
      --font-headings: "Aref Ruqaa", "Amiri", serif;
      --font-chapter-titles: "Reem Kufi", "Noto Kufi Arabic", sans-serif;
      --font-quotes: "Amiri", "Aref Ruqaa", serif;
      --font-quran: "Amiri Quran", "Scheherazade New", "Amiri", serif;
      --font-interface: "Noto Sans Arabic", "Cairo", sans-serif;
      --font-numbers: "Noto Sans Arabic", "Cairo", sans-serif;
      --reader-family: var(--font-body);

      color-scheme: light;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    html, body, .app {
      touch-action: pan-y !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
    }

    button, input, select, textarea {
      touch-action: manipulation;
      font: inherit;
    }

    .app {
      height: 100vh;
      max-height: 100vh;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(155deg, var(--bg-primary), var(--bg-secondary) 55%, var(--bg-soft-rose) 100%);
    }

    /* المنطقة الأولى: الشريط العلوي الثابت (أيقونات SVG الثلاث فقط) */
    .top-bar {
      height: 56px;
      min-height: 56px;
      flex: 0 0 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(12px, 3vw, 20px);
      gap: 10px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--line);
      z-index: 10;
      box-shadow: 0 3px 14px rgba(0,0,0,0.04);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--accent-rose-dark);
      font-family: var(--font-interface);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-gem {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(135deg, var(--accent-rose), var(--accent-rose-dark));
      font-size: 15px;
      box-shadow: 0 3px 9px rgba(0,0,0,0.14);
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .icon-btn, .nav-btn {
      border: 1px solid var(--line);
      background: var(--bg-primary);
      color: var(--accent-rose-dark);
      border-radius: 12px;
      min-width: 40px;
      min-height: 40px;
      padding: 6px 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-interface);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s, border-color .18s, transform .15s;
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .icon-btn:active, .nav-btn:active {
      transform: scale(0.97);
    }

    .icon-btn.bookmarked {
      background: var(--bg-pearl-gold);
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }

    /* شريط عنوان الفصل الجاري */
    .running-header {
      height: 34px;
      min-height: 34px;
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 2px 14px;
      background: var(--accent-rose-dark);
      color: #FAF4EF;
      border-bottom: 2px solid var(--accent-gold);
      font-family: var(--font-interface);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }

    .running-header[hidden] {
      display: none;
    }

    .running-header-mark {
      color: #FDE68A;
    }

    /* المنطقة الثانية: مسرح الصفحة الورقية المتجاوب مع كافة الشاشات */
    .book-stage {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: clamp(10px, 2.5vw, 20px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .page-canvas {
      width: min(100%, 740px);
      min-height: 100%;
      height: auto;
      margin: 0 auto;
      background: var(--bg-secondary);
      border: 1.5px solid var(--paper-edge);
      border-radius: 18px;
      padding: clamp(20px, 4.2vw, 38px) clamp(18px, 4.8vw, 42px) clamp(26px, 4.8vw, 42px);
      box-shadow: var(--shadow-card);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .page-canvas::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid var(--accent-gold-soft);
      border-radius: 12px;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      font-family: var(--font-body);
      font-size: calc(var(--reader-font, 21px));
      line-height: 2.02;
      color: var(--text-primary);
      animation: pageIn .22s ease both;
    }

    @keyframes pageIn {
      from { opacity: .48; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }

    .page p {
      font-family: var(--font-body);
      margin: 0 0 14px;
      text-align: justify;
      line-height: 2.02;
    }

    .page h1 {
      font-family: var(--font-headings);
      font-size: clamp(1.38em, 4.2vw, 1.78em);
      line-height: 1.6;
      color: var(--accent-rose-dark);
      margin: 0 0 12px;
      font-weight: 700;
    }

    .page h2 {
      font-family: var(--font-headings);
      font-size: clamp(1.16em, 3.6vw, 1.42em);
      line-height: 1.62;
      color: var(--accent-rose-dark);
      margin: 14px 0 10px;
      font-weight: 700;
    }

    .page h3 {
      font-family: var(--font-headings);
      font-size: 1.05em;
      color: var(--accent-sage-dark);
      margin: 14px 0 8px;
      font-weight: 700;
    }

    /* ١. لوحة الغلاف الملكي الفاخر (العنوان هو المركز البصري المهيمن) */
    .cover-page {
      min-height: clamp(460px, 70vh, 760px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      isolation: isolate;
      padding: clamp(26px, 5vw, 48px) clamp(16px, 4vw, 32px);
      background: radial-gradient(ellipse at 50% 36%, #FFFFFF 0%, var(--bg-secondary) 55%, var(--bg-primary) 100%);
      border: 2px solid var(--border-ornate);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 0 0 6px var(--bg-secondary), inset 0 0 0 7.5px var(--accent-gold-soft);
    }

    .cover-page::before, .cover-page::after {
      content: "";
      position: absolute;
      z-index: -1;
      border: 1px solid var(--accent-gold-soft);
      border-radius: 48% 48% 16px 16px;
      width: 84%;
      height: 84%;
      top: 8%;
      left: 8%;
      pointer-events: none;
    }

    .cover-page::after {
      width: 76%;
      height: 76%;
      top: 12%;
      left: 12%;
      border-color: var(--line);
      border-style: dashed;
    }

    .cover-art-svg {
      width: clamp(130px, 36vw, 190px);
      height: auto;
      margin: 0 auto 16px;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.09));
    }

    .cover-title-frame {
      position: relative;
      padding: clamp(14px, 3vw, 22px) clamp(18px, 4vw, 30px);
      margin: 4px auto 14px;
      max-width: 94%;
      background: linear-gradient(180deg, rgba(255,255,255,0.92), var(--bg-pearl-gold));
      border-top: 2px solid var(--accent-gold);
      border-bottom: 2px solid var(--accent-gold);
      border-radius: 14px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.05);
    }

    .cover-page h1 {
      font-family: var(--font-headings);
      font-size: clamp(2.05em, 7.2vw, 3.1em);
      line-height: 1.42;
      color: var(--accent-rose-dark);
      margin: 0;
      text-shadow: 0 2px 10px rgba(180,123,38,0.16);
    }

    .cover-page .subtitle {
      font-family: var(--font-body);
      font-size: clamp(0.92em, 2.8vw, 1.04em);
      line-height: 1.85;
      color: var(--text-secondary);
      max-width: 88%;
      margin: 6px auto 12px;
      text-align: center;
    }

    .ornament {
      color: var(--accent-gold);
      font-size: 0.9em;
      letter-spacing: 6px;
      margin: 10px 0;
      text-align: center;
    }

    .cover-page .author {
      font-family: var(--font-interface);
      font-size: 0.74em;
      font-weight: 700;
      color: var(--accent-rose-dark);
      background: var(--bg-secondary);
      border: 1px solid var(--accent-gold-soft);
      border-radius: 99px;
      padding: 4px 18px;
      margin: 4px 0 16px;
    }

    .primary-btn {
      border: 1px solid var(--accent-gold);
      background: linear-gradient(135deg, var(--accent-rose), var(--accent-rose-dark));
      color: #fff;
      border-radius: 99px;
      padding: 10px 26px;
      font-family: var(--font-interface);
      font-size: 0.76em;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 7px 18px rgba(0,0,0,0.15);
    }

    /* ٢. فواتح الفصول والرسائل (chapter-opener) */
    .chapter-opener, .opener {
      text-align: center;
      padding: 14px 10px;
      position: relative;
    }

    .letter-envelope-header {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--bg-soft-rose), var(--bg-pearl-gold));
      border: 1px solid var(--accent-gold-soft);
      border-radius: 99px;
      padding: 5px 16px;
      margin: 0 auto 12px;
      width: fit-content;
    }

    .letter-seal {
      font-size: 14px;
      color: var(--accent-gold);
    }

    .letter-envelope-title {
      font-family: var(--font-chapter-titles);
      font-size: 0.68em;
      font-weight: 700;
      color: var(--accent-rose-dark);
    }

    .letter-greeting, .opening-lead {
      font-family: var(--font-headings);
      font-size: 1.1em;
      color: var(--accent-rose-dark);
      margin-bottom: 12px;
      font-weight: 700;
      border-bottom: 1px dashed var(--line);
      padding-bottom: 7px;
    }

    /* ٣. صناديق الآيات والأحاديث والبطاقات البصرية */
    .quran-box {
      margin: 16px 0;
      padding: 16px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--bg-pearl-gold), var(--bg-secondary));
      border: 1.5px solid var(--accent-gold-soft);
      border-inline-start: 4px solid var(--accent-gold);
      text-align: center;
    }

    .quran-box p, .quran-verse {
      font-family: var(--font-quran);
      font-size: 1.14em;
      line-height: 2.15;
      color: var(--accent-rose-dark);
      margin: 0 0 4px;
      text-align: center;
    }

    .quran-box .ayah-source {
      font-family: var(--font-interface);
      font-size: 0.68em;
      color: var(--accent-gold);
      font-weight: 700;
    }

    .hadith-box {
      margin: 16px 0;
      padding: 15px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--bg-soft-sage), var(--bg-secondary));
      border: 1px solid var(--line);
      border-inline-start: 4px solid var(--accent-sage);
      text-align: center;
    }

    .hadith-box p, .hadith-quote {
      font-family: var(--font-quotes);
      font-size: 1.08em;
      line-height: 2.05;
      color: var(--accent-sage-dark);
      margin: 0;
      text-align: center;
    }

    .hadith-box .hadith-source {
      font-family: var(--font-interface);
      font-size: 0.66em;
      color: var(--accent-sage-dark);
      font-weight: 700;
      margin-top: 4px;
    }

    .reflection-card {
      margin: 16px 0;
      padding: 16px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--bg-secondary), var(--bg-soft-rose));
      border: 1px solid var(--line);
      border-inline-start: 4px solid var(--accent-rose);
      box-shadow: 0 6px 18px rgba(0,0,0,0.03);
    }

    .reflection-card-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-interface);
      font-size: 0.68em;
      font-weight: 700;
      color: var(--accent-rose-dark);
      margin-bottom: 6px;
    }

    .reflection-card p {
      font-family: var(--font-quotes);
      font-size: 1.04em;
      color: var(--accent-rose-dark);
      margin: 0;
      line-height: 1.95;
    }

    .wisdom-pearl {
      margin: 16px 0;
      padding: 14px 18px;
      border-radius: 12px;
      background: var(--bg-pearl-gold);
      border: 1px solid var(--accent-gold-soft);
      border-inline-start: 3.5px solid var(--accent-gold);
      font-family: var(--font-quotes);
      font-size: 0.98em;
      line-height: 1.95;
    }

    .wisdom-pearl.action-callout {
      background: linear-gradient(135deg, var(--bg-soft-rose), var(--bg-pearl-gold));
      border-inline-start: 4px solid var(--accent-rose);
    }

    .wisdom-pearl.academic-callout {
      background: var(--bg-soft-sage);
      border-inline-start: 4px solid var(--accent-sage-dark);
      border-radius: 8px;
    }

    .wisdom-badge {
      display: block;
      font-family: var(--font-interface);
      font-size: 0.65em;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 5px;
    }

    .heart-keepsake-card {
      background: linear-gradient(145deg, var(--bg-secondary), var(--bg-soft-rose) 65%, var(--bg-pearl-gold) 100%);
      border: 1.5px solid var(--accent-rose-light);
      border-radius: 16px;
      padding: 18px;
      margin: 16px 0;
      text-align: center;
      box-shadow: 0 10px 24px rgba(0,0,0,0.04);
    }

    .heart-badge {
      display: inline-block;
      font-family: var(--font-interface);
      font-size: 0.68em;
      font-weight: 700;
      color: var(--accent-rose-dark);
      background: var(--bg-secondary);
      border: 1px solid var(--accent-rose-light);
      border-radius: 99px;
      padding: 3px 14px;
      margin-bottom: 10px;
    }

    .heart-keepsake-card p {
      font-family: var(--font-quotes);
      font-size: 1.12em;
      line-height: 2.1;
      color: var(--accent-rose-dark);
      margin: 0;
      text-align: center;
    }

    .step-card {
      margin: 10px 0;

            <p>إن حالنا ينقصه الكثير والكثير .. الجدية أصبحت صفة مفتقدة .. لقد ساهم الكبار في ضياعها . هل يعلم المدرس الذي لا يشرح في الفصل ويرى التلامذة تخرج وتهرب من المدرسة أنه يقتل الأمة .. أولياء الأمور الذين يطلبون من المراقب في الامتحان أن يكون رحيما ويترك الفرصة للأولاد أن يتعاونوا أو نقولها باسمها الحقيقي : يغشوا ... هل يتصوروا ما يفعلوه بأنفسهم وأمتهم .. وأكثر من ذلك الأب والأم تساعد ابنها على عمل البرشامة التي سيغش منها .. الغش ليس كلمة بسيطة وليس مشكلة هينة .. هذا التحايل على الحصول على ما نريد يصبح صفة لصيقة ومن هنا انهارت أمتنا وارتفعت الأمم الغربية .. أنهم لا يغشوا ولا يكذبوا ..</p>
            <p>علاقات الأولاد والبنات .. هل هذا معقول ؟؟؟ أليس هناك ما يستحق الاهتمام غير حبهم لبعض في التليفون وفي النادي طوال النهار . قال لي صديق : كنت أسير في الطريق فسمعت شاب يصرخ في أبيه في التليفون غاضبا لأن أباه أشتري لأخيه سيارة من ماركة كذا وهي باهظة الثمن جدا ولم يشتري له واحدة مثلها .. وأردف صديقي لقد بكيت وأنا أسير وحدي بكيت على أسلوبه في الكلام مع والده ، وبكيت على اهتماماته وأخوة له تذبح وتقتل ولا تجد ما تأكل . لماذا استوردنا أسوأ ما عند الغرب وتركنا أسباب نجاحاتهم ؟ نحن نتناسي تماما فترة النهار في حياة الشباب الغربي وجديتها الشديدة في العمل ولا نراهم إلا بعد العودة إلى البيوت وبداية انحرافاتهم واستهتارهم .</p>
          `
        },

            <h2>خذ الكتاب بقوة: نماذج الجدية الشامخة</h2>
            <p>من الميوعة أن نرى شاب يرقص في فرح ويتمايل .. والشباب والبنات سويا أمام أي مطرب متلاصقين يتمايلوا .. رأى سيدنا عمر بن الخطاب شاب يسير باستهتار فأقترب منه سائلا مريض أنت ؟؟ فقال الشاب لا .. فعلاه سيدنا عمر بالدرة – أي ضربه بعصا كانت معه – قالا ما نحب ولا نرضي لأمة محمد أن تمشي هكذا . إذا أحببتم الغناء غنوا ما يعلي همة الأمة .. وكفانا ميوعة .. نحن لا نتكلم في حلال أو حرام ، نحن نتكلم عن خلق يرتقي بالأمة وينقذها من استكمال طريق الانهيار .. انظروا إلى ألمانيا .. اليابان .. لبنان .. كيف استطاعت هذه الدول أن تقف على أقدامها بعد حروب طاحنة أتت على بنيتها الأساسية ؟؟ بالجدية طبعا .</p>
            <p>وأمثلة الجدية تبدأ بما فعلته مرجريت تاتشر ، رئيسة وزراء بريطانيا أثناء حرب بلادها مع الأرجنتين حين التزمت بارتداء ألوان ملابس داكنة .. هل هذا مهم لنتيجة الحرب ؟؟ نعم لأنه يشعر شعبها أنها جادة في هذه المعركة ولا تهتم بما كانت تهتم به من قبل .. ويرتفع معدل الجدية إلى ما قاله رسول الله ﷺ لعمه أبو طالب وهو مازال في مكة ضعيفا : والله يا عم لو وضعوا الشمس في يميني والقمر في يساري على أن أترك هذا الأمر أو أهلك دونه .. يقول تعالي لسيدنا يحي بن زكريا : يا يحي خذ الكتاب بقوة (أي بجدية) وآتيناه الحكم صبيا .</p>
            <p>سيدنا إبراهيم حين كسر الأصنام وعلق فأسه على كتف كبير لهم وحاور أهله الكفار كم كان عمره ، يقول عنه الله في كتابه العزيز : سمعنا فتى يذكرهم يقال له إبراهيم . سيدنا يحي صبيا!!! سيدنا إبراهيم فتى .. أي أن الأعمار تحت العشرين .. وكذلك أصحاب الكهف .. إنهم فتية آمنوا بربهم . الجدية تحتاج أن تبدأ من الشباب المبكر.</p>
            <p>وانظروا إلى بني إسرائيل حين لم يكن لديهم جدية : بسم الله الرحمن الرحيم ﴿ فَاذْهَبْ أَنتَ وَرَبُّكَ فَقَاتِلا إِنَّا هَاهُنَا قَاعِدُونَ ﴾ [المائدة : ٢٤] فبما عاقبهم الله على ذلك : قال فإنها محرمة عليهم أربعين سنة يتيهون في الأرض .. لماذا ٤٠ سنة ؟؟ لأنها فترة كافية لتغيير الجيل التافه الذي لا يستطيع ولا يريد قتالا .</p>
            <p>يوم أحد ينادي الرسول في الصحابة : من يدفعهم عني وله الجنة ؟؟؟ فتقدمت مجموعة من الشباب بين ١٩-٢٠ سنة تقاتل وتقتل .. وكان أخرهم يزيد بن السكن أستبسل استبسالا يعجز عنه الكثيرين ظلوا يضربوه حتى هلك وسقط وجهه إلى التراب .. فجاء النبي ﷺ طالبا أن يرفعوا وجهه عن التراب ووضع ﷺ رأس يزيد على فخذه ويمسح التراب عن وجهه الطاهر ويقول اللهم إني أشهدك أنه وفى وأني راض عنه .</p>
            <p>سيدنا أنس بن النضر تخلف عن يوم بدر فقال والله لأن أشهدني الله معركة أخرى ليرى الله ما أصنع .. لما جاءت أحد كان الجميع يتقهقرون في اتجاه ويسير في اتجاه معاكس فاستوقفه سعد بن معاذ : إلى أين يا أنس فرد قائلا : إنه وعد الأمس ، واستشهد سيدنا أنس ونزلت فيه الآية ﴿ مِنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ ﴾ [الأحزاب : ٢٣] .</p>
            <div class="heart-keepsake-card">
              <span class="heart-badge">✦ همة الشباب والشيوخ</span>
              <p>ذهب سيدنا أبو أيوب الأنصاري ليفتح القسطنطينية مع المسلمين وله من العمر ٨٠ سنة وكلما حاولا أن يثنوه يقول : انفروا خفافا وثقالا أرأيتم الجدية . محمد الفاتح تمكن من فتح القسطنطينية وهي مدينة ظلت مستعصية على الفتح وله من العمر ٢٣ سنة . هل لدينا مثل هذه الجدية .. جدية الرسول عليه الصلاة والسلام والصحابة والفاتحين وحتى المسئولة الإنجليزية ؟؟؟ فلنحاول أن نتعلم الجدية مع الله حتى نغير ما بأنفسنا فيتغير الحال إلى الحال ..</p>
            </div>

            <h2>أخوة موسى وهارون عليهما السلام</h2>
            <p>تري بعد هذه الحرب سيجد بعض الناس غلا على آخرين .. تري هل سنجد في صدورنا على أهل الكويت ؟؟ تري كيف سيكون حال شعوبنا المسلمة ؟؟ في غل وحقد ؟ أم أن الصدور ستكون سليمة والنفوس متآخية متصافية ؟ نحن أمة واحدة يا سادة .. يجب أن يحب بعضنا البعض .. أحيانا ننسي بين أمتنا العربية أهل المغرب العربي .. ننسي أنهم من العرب في زحمة الحياة مع أن كل الاستطلاعات والمشاركات يأتي أغلبها من هناك من الجزائر بالذات ..</p>
            <p>سأحكي لكم قصص عن معني الأخوة حتى نزرعها في أنفسنا ولن أبدأ برسول الله صلي الله عليه وسلم سأبدأ بأبعد من ذلك بسيدنا موسى عليه السلام .. لأن بنو إسرائيل لهم مع الأخوة وقفات خطيرة أرسل الله سيدنا موسى وأختاره نبيا إلى بني إسرائيل .. فهل تتصوروا إجابة في التاريخ تحمل كل هذا الحب للأخ أكثر من إجابة سيدنا موسى ؟</p>
            <div class="quran-box">
              <p class="quran-verse">﴿ وَاجْعَل لِّي وَزِيرًا مِّنْ أَهْلِي * هَارُونَ أَخِي * اشْدُدْ بِهِ أَزْرِي * وَأَشْرِكْهُ فِي أَمْرِي * كَيْ نُسَبِّحَكَ كَثِيرًا * وَنَذْكُرَكَ كَثِيرًا * إِنَّكَ كُنتَ بِنَا بَصِيرًا ﴾</p>

            <p>وجود أخي معي يا رب سيعينني أكثر على الذكر والشكر .. فأجابه الله إلى طلبه فقال تعالى : ﴿ قَالَ قَدْ أُوتِيتَ سُؤْلَكَ يَا مُوسَى ﴾ [ طه : ٣٦ ] . ﴿ وَوَهَبْنَا لَهُ مِن رَّحْمَتِنَا أَخَاهُ هَارُونَ نَبِيًّا ﴾ [ مريم : ٥٣ ] .</p>
            <p>وتأتي قصة أخرى تحمل من المعاني مفردات كثيرة يجب أن ننتبه إليها .. ذهب سيدنا موسى للقاء ربه وترك هارون مع القوم .. ولكن بنو إسرائيل كفروا وأشركوا وعبدوا عجلا من ذهب .. وسيدنا هارون بينهم أمام اختيار من أثنين .. إما أن يقاتل من أشرك بمن آمن فيحارب القوم بعضهم بعضا ويبيدوا بعضهم البعض .. أو أن ينتظر موسى لعل لديه مخرج يحافظ به على الأمة .. فلما جاء سيدنا موسى إلى قومه رأي بئس ما يفعلون فأتجه رأسا إلى أخيه يجذبه ويهزه ويعاتبه .. فقال سيدنا هارون – قال تعالى – :</p>

              <span class="ayah-source">[ طه : ٩٤ ]</span>

            <p>أما سيدنا رسول الله صلي الله عليه وسلم فله موقف يحتاج إلى دراسة .. حين اشتدت به الأزمة في مكة بدأ يسافر يعرض نفسه على القبائل ولكنه لم يذهب إلى المدينة .. لماذا ؟ لأن في المدينة قبيلتان كبيرتان الأوس والخزرج عاشتا أخوة طويلة حتى نزل اليهود في المدينة واستوطنوها وكالعادة كيف تسود شرذمة قليلة وسط قبائل وعشائر ؟؟ طبعا نحن نعرف بالوقيعة دس اليهود بين الأخوة فأشتعل الخصام والمعارك ولذلك لم يفكر الرسول صلي الله عليه وسلم أن يسافر إليهم .. فحيث الشحناء لا يكون إسلام ، إلى أن جاء مواسم الحج ووجد صلي الله عليه وسلم ٦ نفر جالسين فعرض عليهم الإسلام فآمنوا فسألهم من أين ؟ قالوا من الخزرج .. وفي العام التالي جاءوا ومعهم آخرين ١٢ رجل منهم ٩ من الخزرج وثلاثة من الأوس .. هنا أدرك الرسول أن الأخوة ستعود لا محالة فأرسل مصعب سفيرا وعادوا إليه في العام التالي ٧٣ رجل وامرأتان من القبيلتين .. وتمت الهجرة واختفت المشاكل وعادت الأخوة .. بل وأكثر ، حلت المؤاخاة بين المهاجرين والأنصار .. وقد حاول اليهود الوقيعة كالعادة ولكن هذه المرة لم يفلحوا فقد كانت آيات الله تتلي عليهم وكلها دعوة للتوحد والتآخي والاجتماع .</p>
            <div class="quran-box">
              <p class="quran-verse">﴿ وَاعْتَصِمُواْ بِحَبْلِ اللّهِ جَمِيعًا وَلاَ تَفَرَّقُواْ وَاذْكُرُواْ نِعْمَةَ اللّهِ عَلَيْكُمْ إِذْ كُنتُمْ أَعْدَاء فَأَلَّفَ بَيْنَ قُلُوبِكُمْ فَأَصْبَحْتُم بِنِعْمَتِهِ إِخْوَانًا وَكُنتُمْ عَلَىَ شَفَا حُفْرَةٍ مِّنَ النَّارِ فَأَنقَذَكُم مِّنْهَا كَذَلِكَ يُبَيِّنُ اللّهُ لَكُمْ آيَاتِهِ لَعَلَّكُمْ تَهْتَدُونَ ﴾</p>

              <p class="quran-verse">﴿ وَالَّذِينَ جَاؤُوا مِن بَعْدِهِمْ يَقُولُونَ رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالإِيمَانِ وَلا تَجْعَلْ فِي قُلُوبِنَا غِلاًّ لِّلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَؤُوفٌ رَّحِيمٌ ﴾</p>
              <span class="ayah-source">[ الحشر : ١٠ ]</span>

            </div>
            <p class="opening-lead">الحمد لله نحمده ونستهديه ونستغفره ونعوذ به من شرور أنفسنا ومن سيئات أعمالنا ، من يهده الله فلا مضل له ومن يضلل فلا هادي له ونصلي ونسلم على الحبيب المصطفي سيدنا محمد وعلى آله وصحبه وسلم .</p>
            <p>قبل أن نبدأ حديثنا عن التغيير أود أن أصف منظرا رأيته .. رأيت حى الشعلة في بغداد يشتعل نارا .. ومستودع للأغذية منفجر وآلاف القتلى والجرحى .. ولكني هذه المرة لم أبك على ذلك هذه المرة بكيت بغداد .. بغداد اسم له رنين محبب إلى قلوبنا .. عاصمة الخلافة الإسلامية لمئات السنين .. قلعة الأسود وكعبة المجد والصمود كما تغني بها الشعراء .. بغداد التي وصفها المستشرقون بقولهم : نشهد إننا لم نجد على الأرض مكانا كان أصحاب الأديان أحرار في ممارسة شعائرهم كما حدث في بغداد .</p>
            <p>وبهذه المناسبة أيضا أريد أن أوضح أن قانون الله سبحانه وتعالى في التغيير لا يتعلق بالمسلمين .. فالآية تقول أن الله لا يغير ما بقوم .. فأي قوم اتخذوا أسباب التغيير الإيجابي في السلوك يمنحهم الله قيادة البشرية .. والتغيير ليس زرا يتم الضغط عليه فتتغير الصفة .. بل هي عملية صعبة إعادة صناعة الإنسان تحتاج إلى جهد .. وبناء على الأفكار بالعمل في كل المجالات .. التغيير صناعة صعبة ولكنها ليست مستحيلة .. ودليلنا أمة عاشت قرون ترعي الغنم وتحولت بعد ٢٥ سنة فقط إلى أمة ترعي الأمم هؤلاء هم صحابة رسول الله .</p>

            <h2>الإحسان في كل مناحي الحياة</h2>
            <p>وجب علينا الإتقان والإحسان في كل مناحي الحياة .. أتدرون أين سوء الأداء وقلة الإحسان ؟ في طالب يذاكر شيء ليحصل به على نتيجة .. في مدرس لا يشرح كما ينبغي .. في سلعة زراعية أو صناعية صنعناها لتعيش أيام ثم تتحطم .. هناك دول بعينها تشتهر بصناعات معينة ولا ينافسها فيها أحد وهناك دول أخرى تحتكر صناعة وإتقان مجموعات من الصناعات ونحن أين منتجنا العربي ؟ ما الذي نستطيع أن نرفع راية الفخار به ونقول هذه صناعة لا يقدر عليها سوانا .. لا يوجد .. إذا قرأنا صنع في .. دولة غربية فنحن نشتري المنتج دون تفكير مع ثقة كاملة في جودته أما إذا كان صنع في بلد عربي فنحن نقلبه وننظر للسعر ونفكر كم سيدوم عمره ..</p>

            <div class="hadith-box">
              <p class="hadith-quote">قال رسول الله ﷺ : ( إن الله كتب الإحسان على كل شيء فإذا قتلتم فأحسنوا القتلة وإذا ذبحتم فأحسنوا الذبحة وليحد أحدكم شفرته وليرح ذبيحته ) .</p>
            </div>
            <p>أتدرون لماذا اختار رسول الله هذا المثال حين طلب منا الإحسان في العمل ؟ هل لفت نظركم أنه يطلب منا الإتقان في لحظة إنهاء حياة .. إذا أراد شخص أن يذبح شاة أو دجاجة فعلام الإتقان وهي ستصبح ميتة في ثوان .. لا بل حتى الإتقان مطلوب في هذه اللحظة لأن الإتقان خلق مسلم .. ولقد أعطانا الرسول وسائل الإتقان : حد الشفرة أي نصلها مسنونا حادا وإراحة وضع الذبيحة .. إذن فالإتقان له وسائل يجب اللجوء إليها ولا يصلح معه الفهلوة ..</p>
            <p>من أجمل معاني الإتقان والإحسان ، الإحسان في العبادة .. وأحسن كما أحسن الله إليك . أعبد الله كأنك تراه فإن لم تكن تراه فإنه يراك . نشكو من أن صلاتنا لا طعم لها فهل أتقننا خطواتنا وأركانها وقراءاتها .. حتى الجدال .. أي عراك الكلام في ديننا يجب أن يتم بإحسان بسم الله الرحمن الرحيم ﴿ وَجَادِلْهُم بِالَّتِي هِيَ أَحْسَنُ ﴾ [ النحل : ١٢٥ ] . حتى الطلاق : بسم الله الرحمن الرحيم ﴿ الطَّلاَقُ مَرَّتَانِ فَإِمْسَاكٌ بِمَعْرُوفٍ أَوْ تَسْرِيحٌ بِإِحْسَانٍ ﴾ [ البقرة : ٢٢٩ ]</p>
            <p>انظروا إلى الكريم بن الأكرمين سيدنا يوسف عليه وعلى نبينا الصلاة والسلام حين احتاج الملك إلى تفسير الرؤيا لم يمتنع .. لم يضع شرط الإفراج عنه أولا .. مع أن تفسيره كان خطة اقتصادية .. زيادة إنتاج ثم ترشيد استهلاك . لم يطالب بالتحقيق من براءته أولا .. لم يقايض على تحرره وللعلم كانوا مشركين .. لم يذكر القرآن أنهم أسلموا أو آمنوا فما الذي دفع سيدنا يوسف لكل هذه المساعدة ؟؟ إنه الإحسان هل كان الكريم سيترك الأمة كلها تقع في مأزق المجاعة والفقر انتقاما لنفسه .. هذا ليس خلقنا .. ليس ما أمرنا الله به .</p>
            <div class="heart-keepsake-card">
              <span class="heart-badge">✦ السيادة لصاحب الإتقان</span>
              <p>أن الإتقان صفة من صفات الكمال .. والكمال هو جوهر طموحاتنا .. أن نبلغ رضي الله سبحانه وتعالى وهو الكمال المطلق بمحاولة إكمال واستكمال كل نقص وعيب حولنا فلا نترك عملا أو أداء إلا أتممناه على أكمل وجه حتى يليق بالتقديم إلى رب العباد .. وإلا لا نلومن إلا أنفسنا إذا ساد غيرنا علينا وأذاقنا ذل التبعية فإن السيادة لصاحب الكمال وليست أبدا لمدعي الأداء وسؤ الإنجاز اللهم نجنا من ذلك .</p>
            </div>

            <p>رسول الله ﷺ في مجلس يضم كبار القوم وعلى يمينه بن العباس وكان فتى يافعا .. وقد أعتاد أن يبدأ في توزيع الشراب من يمينه فقال له : هل تأذن لي أن أعطى نصيبك لإخواني قبلك ؟؟؟ كان باستطاعة الرسول أن يبدأ بالكبار وله في ذلك منطق ولكنه لم يشأ أن يكسر كرامة الفتي فماذا كان رد بن العباس : والله لا أوثر بنصيبي منك أحد .. أرايتم كيف تربى العزة في النفوس .</p>

          html: `
            <h2>مصدر العزة هو الله وحده</h2>
            <p>إن العربي بطبيعته العربية حتى قبل الإسلام يأبى الذلة .. هذه أحد صفات العربي الأساسية .. لأن كلمة ذليل عند العرب معناها تحت التصرف .. فنقول الأرض ذللت والدابة ذلول .. سألت السيدة عائشة رسول الله ﷺ لماذا رفع العرب باب الكعبة عاليا : قال تعززا حتى لا يدخلها إلا من أرادوا . فما بالكم بمدينة الإسراء .. ما بالكم بفلسطين .. ما بالكم بكل أراضي المسلمين .</p>
            <p>يجب أن يصبح الفرد عزيزا لتصبح الأمة عزيزة هذا هدف استراتيجي كبير ولا يوجد مصدر للعزة إلا مصدر واحد .. مصدر العزة هو الله سبحانه وتعالى .</p>
            <div class="quran-box">
              <p class="quran-verse">﴿ مَن كَانَ يُرِيدُ الْعِزَّةَ فَلِلَّهِ الْعِزَّةُ جَمِيعًا ﴾</p>
              <span class="ayah-source">[فاطر : ١٠]</span>
            </div>
            <p>إن أهل الأرض لا يملكون لأنفسهم عزة ولا ذلة سبحانه وتعالى هو المعز المذل ، إذا لجأت لعزيز من أهل الأرض غدا قد يكون ذليلا .. أو غنيا فيصبح فقيرا .. أو حيا فتجده ميتا .. إذا لجأت لغير الله فإن مشكلتك مع نفسك .. في إيمانك .. في التوحيد . أنت لست عبد المأمور ولا يجب أن تكون .. أنت عبد الله ! يأبى الله لعباده الذل إلا له .. ولم يذكر سبحانه الذل إلا للوالدين بعده ، بسم الله الرحمن الرحيم ﴿ وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُل رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا ﴾ [الإسراء : ٢٤] وهناك موقف آخر للذلة يرضاه الله .. الذلة لإخوانك من المؤمنين : قال تعالى ﴿ فَسَوْفَ يَأْتِي اللّهُ بِقَوْمٍ يُحِبُّهُمْ وَيُحِبُّونَهُ أَذِلَّةٍ عَلَى الْمُؤْمِنِينَ أَعِزَّةٍ عَلَى الْكَافِرِينَ ﴾ [المائدة : ٥٤] .</p>
            <p>من المواقف التي يشعر فيها العبد بالذل إذا ظلم ولذلك دعاه الله سبحانه وتعالى إليه وقال : دعوة المظلوم ليس بينها وبين الله حجاب وعزتي وجلالي لأنصرنك ولو بعد حين . بسم الله الرحمن الرحيم ﴿ قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَن تَشَاء وَتَنزِعُ الْمُلْكَ مِمَّن تَشَاء وَتُعِزُّ مَن تَشَاء وَتُذِلُّ مَن تَشَاء بِيَدِكَ الْخَيْرُ إِنَّكَ عَلَىَ كُلِّ شَيْءٍ قَدِيرٌ ﴾ [آل عمران : ٢٦] .</p>
            <h3>والإنسان يصبح ذليلا بأربع أشياء :</h3>
            <div class="step-card"><div class="step-num">١</div><div class="step-content"><strong>استسلامه للشيطان ،</strong> لقد قال إبليس لله بعد أن طرده من رحمته ومن الجنة ﴿ قَالَ أَرَأَيْتَكَ هَـذَا الَّذِي كَرَّمْتَ عَلَيَّ لَئِنْ أَخَّرْتَنِ إِلَى يَوْمِ الْقِيَامَةِ لأَحْتَنِكَنَّ ذُرِّيَّتَهُ إَلاَّ قَلِيلاً ﴾ [الإسراء : ٦٢] واحتنكن مشتقة من الحنك أي الفم ومعناها سأضع لجاما في فمه أتحكم به في تصرفاته وأدائه وأجره كما تجر الدابة .</div></div>
            <div class="step-card"><div class="step-num">٢</div><div class="step-content"><strong>اتباع الهوى ..</strong> مزاجي يقودني في حياتي مزاجي في المال أو الناس . قال رسول الله ﷺ : تعس عبد الدرهم والدينار .. وقال أيضا : المحبوس من حبسه قلبه عن ربه والمأسور من أسره هواه .</div></div>
            <div class="step-card"><div class="step-num">٣</div><div class="step-content"><strong>أن تفقد الإحساس بالله .. بالدين .. بالمنهج والأمة ..</strong> بين أيدينا منهج ولكن لا نشعر بقيمته .. نبحث عن الانتماء لشيء آخر لبلد أخري .</div></div>
            <div class="step-card"><div class="step-num">٤</div><div class="step-content"><strong>فقد الثقة بالله وبأن كل شيء مكتوب ،</strong> قال ﷺ : لقد نفث روح القدس في روعي أن نفسا لن تموت قبل أن تستكمل أجلها ورزقها.</div></div>
            <p>إذا أصابك شيء من هذه الأربعة أو كلهم أصبحت ذليلا .. فيذلك من حولك أكثر وأكثر . أثناء معارك التتار كانت المرأة التترية تأتي إلى الرجال العشر وتصفهم وتقول انتظروا ليس معي ما أقتلكم به وتذهب لتحضر سيفا فتقتلهم .. ما هذا الذل وما هذا الهوان .</p>
          `

            <p>وحتى نحيى همتنا قليلا تعالوا ننظر مواقف ونماذج العزة عند المسلمين : يوم أسلم سيدنا عمر بن الخطاب قال لرسول الله ألسنا على الحق ، قال: نعم ، قال أليسوا على الباطل ، قال: نعم ، قال ففيما الخفاء .. وخرج وأعلن إسلامه بين أهل مكة ولذلك سماه رسول الله الفاروق وعمر بن الخطاب ، الفاروق يدخل إلى القدس ليتسلم مفاتيحها وهو يجر الناقة التي يركب عليها غلامه فقد كان هذا دور الغلام في الركوب ، أرأيتم كيف يربي العزة في غلامه ، أثناء سيره يتعثر في ماء فيصيب ثيابه الطين فيأتي إليه أبو عبيدة بن الجراح طالبا منه أن يركب فالقوم تنظره لتسليمه مفتاح المدينة فبماذا يرد عمر قال : أواه .. لو قالها غيرك يا أبو عبيدة .. كنا أذل الناس فأعزنا الإسلام فلو ابتغينا العزة في سواه أذلنا الله .</p>
            <p>في بداية خلافة أبي بكر وقد ارتدت القبائل وبدأ الناس تنصحه بالسياسة والمهادنة بما فيهم عمر بن الخطاب إشفاقا على الأمة بعد وفاة الرسول فينتفض أبو بكر الصحابي البكاء الرقيق ويقول : أجبار في الجاهلية خوار في الإسلام يا عمر والله لو منعوني عقالا كانوا يعطوه لرسول الله ﷺ لقاتلتهم .</p>

            <p>ذهب ربعي بن عامر ليدعو الفرس لعبادة الله فأراد القائد رستم أن يبهره ويبرجل عقله بما يأكل عقل الرجال المال والنساء .. ففرش الصحراء في طريق مسيره بالسجاد الفاخر وجعل على الضفتين أجمل الجواري .. وربعي بن عامر فطن للفتنة فلم يلتفت بل سار بحربته يدك السجاد ولا يلتفت إلى الجواري حتى وصل إلى رستم الذي أسقط يده فقال له ماذا تريد ، قال ربعي : إن الله ابتعثنا لنخرج العباد من عبادة العباد على عبادة رب العباد .. ومن ضيق الدنيا على سعة الآخرة ، ومن جور الأديان إلى عدل الإسلام .</p>
            <p>حين لطم جنود الروم امرأة في أحد الأسواق فصرخت وامعتصماه .. فأرسل المعتصم رسالة إلى ملك الروم بدأها كالتالي : من المعتصم إلى كلب الروم ، أرسل إلي المرأة معززة مكرمة وإلا جئتك بجيش يكون أوله عندك وآخره عندي .. كرامة امرأة واحدة مسلمة تسير لها الجيوش .. آه لنساء المسلمين تذبح وتغتصب ولا مغيث .</p>

            <h2>باب التوبة مفتوح دائماً</h2>
            <p>إن كل هذه الفتنة والعذاب من الممكن أن تكون بسبب واحد منا يذنب ذنبا ولو صغيرا ويصر عليه .. والناس من حوله لا تحرك ساكنا لتنصحه .. تعالوا نتوب من تقصيرنا في الدعوة إلى الله .. تعالوا نتوب من تقصيرنا في الإيجابية تجاه ذنوب الأفراد ومعاصيها . تعالوا نتوب عن أي صورة سيئة تسببنا بها في رفض الناس للدعوة .. شاب متدين وملتزم ولكنه فاشل دراسيا رجل يدعو الناس إلى الله بعنف وبشدة منفردة .. وغيرهم كثير . إن أي ذنب مهما كان صغيرا مادام تصر عليه فهو كبير جدا : قال تعالى وتحسبونه هينا وهو عند الله عظيم .</p>
            <div class="quran-box">
              <p class="quran-verse">﴿ قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَى أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا ﴾ [الزمر : ٥٣]</p>
              <p class="quran-verse">﴿ إِنَّ اللّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ ﴾ [البقرة : ٢٢٢]</p>
              <p class="quran-verse">﴿ أَلَمْ يَعْلَمُواْ أَنَّ اللّهَ هُوَ يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ ﴾ [التوبة : ١٠٤]</p>
            </div>
            <p>إن الله يحثنا على التوبة .. باب مفتوح دائما .. وبتوبتنا عن الذنوب سنحقن إن شاء الله دم إخواننا الذي يراق في كل مكان .. هل نستطيع أن نستشعر سويا هذا المعنى الكبير؟ ولقد قسم الله العباد نوعين : نوع تائب والآخر ظالم .. يقول تبارك وتعالى : ﴿ وَمَن لَّمْ يَتُبْ فَأُوْلَئِكَ هُمُ الظَّالِمُونَ ﴾ [الحجرات : ١١] .</p>
            <p>قل لي بالله عليك لماذا لا تتوب ؟ هل أنت في غنى عن رحمة الله ؟ هل لا تحتاج لعطاء من الله ؟ هل أنت بلا ذنوب ؟؟ لماذا لا تتوب ؟؟؟؟ لماذا لا تتوب عن الصغيرة التي تصر عليها ؟ لماذا لا تتوب عن عدم شكرك الكافي لنعم الله عليك .. تدعى أنك رجل طيب وتدعى أنك امرأة على خلق .. نعم أنتما كذلك .. ولكن مشكلتكما أعمق وأكبر مما تتصوران .. إنكما غافلان عن نظر الله إليكما .. هذه الغفلة وحدها ذنب كبير .. أنت وهي غافلان عن رضا الله ، قال الله لجيل الصحابة أفضل الأجيال المؤمنة على الأرض :</p>
            <div class="quran-box">
              <p class="quran-verse">﴿ وَتُوبُوا إِلَى اللَّهِ جَمِيعًا أَيُّهَا الْمُؤْمِنُونَ ﴾</p>
              <span class="ayah-source">[النور : ٣١]</span>
            </div>
            <p>عليه الصلاة والسلام كان يستغفر في اليوم أكثر من مائة مرة وهو المعصوم .. كان الصحابة يعدون له في كل مجلس ما يقرب من سبعين استغفار .. الرسول الكامل المعصوم يتوب ويستغفر وأنت لا ترى لنفسك ولا في نفسك ما يستحق التوبة .</p>
          `
        },

            <h2>فرح الله بالتائب وبركة التوبة الصادقة</h2>
            <p>والله يفرح بالتوبة ويضرب النبي مثل لذلك قصة ذات معنى كبير فيقول أن رجلا كان مسافرا في الصحراء ومعه دابته عليها طعامه وشرابه ولكنها أفلتت منه وهربت ولم يلحق بها .. فأيقن الرجل بالهلاك حتى أنه حفر لنفسه قبرا ونام فيه حتى إذا أدركته الوفاة كان مكرما مدفونا وبينما هو كذلك إذا براحلته تقف عند رأسه وعليها ما عليها .. فيفرح الرجل بالنجاة ويقوم ليشكر الله سبحانه وتعالى ومن شدة تأثره وانفعاله يخطئ فيقول (اللهم أنت عبدي وأنا ربك) من شدة الفرح فالله سبحانه وتعالى أكثر فرحا بالعبد التائب من هذا الرجل .. ولماذا يفرح الله بتوبتنا كل هذا الفرح ونحن لا نقدم ولا نؤخر بتوبتنا أو بمعاصينا في ملكه سبحانه شيئا ؟ لأنه هو الكريم الرحيم الغفور والتواب ، لأنه الله يحب أن يعطينا ويتجلى علينا نحن العباد بصفات الجمال والرحمة منه .</p>
            <p>إن الله يعرض علينا التوبة والمغفرة يوميا .. إن الله يبسط يده بالليل ليتوب مسيء النهار ويبسط يده بالنهار ليتوب مسيء الليل .. تخيل الله جل وعلا هو الذي يدعونا للتوبة .. وأنت تقف بعيد اسأل نفسك لماذا لا أريد أن أتوب عن صحبة البنات ؟ لماذا لا أريد أن أتوب عن هذا التصرف لأنني اعتدته ؟؟ لماذا لا تكف عن هذا الموقع الذي اعتدت ارتياده ؟ لماذا لا تبتعد عن هذا المال الذي فيه شبهة .</p>
            <p>يحكى أنه كان هناك ملك عنده مجموعة من العبيد يكرمهم ويحسن إليهم ويكلفهم ببعض التكاليف .. فجاء عدو الملك على أحدهم وقال له إن هذا الملك يتعبك بهذه التكاليف وإحسانه إليك ضعيف .. تعالى معي لم أكلفك شيئا وستحيا في نعيم دائم .. وبالفعل هرب العبد مع عدو الملك بل وعادى الملك علنا .. وبعد فترة أكتشف كذب العدو .. فلا هو حصل على السعادة التي كان يرجوها ولا الراحة وظهر الوجه القبيح للعدو وعاد العبد يجر قدميه إلى باب الملك وهو لا يدري أيقبله أم يطرده بعد كل هذه الإساءة .. فقابله الملك بالترحاب .</p>
            <div class="hadith-box">
              <p class="hadith-quote">يقول تعالى في الحديث القدسي : ( من تقرب مني شبرا تقربت له ذراعا ومن أتاني يمشي أتيته هرولة ) . ( يا ابن آدم لو بلغت ذنوبك عنان السماء ثم استغفرتني غفرت لك ولا أبالي ، يا بن آدم إنك لو أتيتني بقراب الأرض خطايا ثم لقيتني لا تشرك بي شيئا لأتيتك بقرابها مغفرة ) .</p>

            <p>إذا أردتم أن تتأكدوا أن معصية عبد واحد قد تؤذي أمة بأكملها فاسمعوا معي قصة سيدنا موسى وبني إسرائيل . انقطع المطر لفترة حتى شكي بنو إسرائيل من العطش فرفع سيدنا موسى يديه إلى السماء طالبا من الله السقيا .. وتضرع سيدنا موسى ولكن الله لم يستجيب .. فتعجب النبي الكريم قائلا يا رب عودتني الإجابة ، فقال تعالى : بينكم عبد يعصاني من ٤٠ سنة فبشؤم معصيته منعتم المطر من السماء أخرجوه من بينكم حتى ينزل المطر .. فالتفت سيدنا موسى إلى قومه مناديا أن بينكم رجل يعصى الله من ٤٠ سنة ولن تمطر السماء حتى يخرج من بيننا .. والرجل بينهم يعرف نفسه وانتظر أن يخرج غيره فلم يحدث .. فجلس واحد يتضرع إلى الله .. يا رب إنني لو خرجت افتضح وسط أهلي ولو بقيت بينهم ماتوا من العطش يا رب استرني وأنا سأتوب إليك من هذه اللحظة أنا تبت يا رب عن المعاصي فاسترني يا رب .. فنزل المطر غزيرا .. غزيرا .. فرفع سيدنا موسى يده مرة أخرى قائلا يا رب هذا المطر ولم يخرج أحد فقال تعالى نزل المطر بتوبة عبدي الذي كان يعصاني .. فقال سيدنا موسى : دلني عليه يا رب .. فقال تعالى : سترته وهو يعصاني أفأفضحه بعد أن تاب .</p>
            <div class="heart-keepsake-card">
              <span class="heart-badge">✦ أحلى يوم في العمر</span>
              <p>أرأيتم معصية رجل كادت تهلك أمة .. إن الله يحب توبتنا .. يحب أنين المذنب وهو يطلب العفو والمغفرة . حين عصى آدم ظل يجرى في الجنة فسأله الله تعالى أفرارا مني يا آدم ، قال بل حياء منك يا الله .. إن الله من صفاته الرحمة والمغفرة والجود والكرم فلو خلقنا معصومين فكيف تتجلى صفاته هذه في الخلق . أتدرون أي يوم هو أحلى يوم في العمر كله ؟ يوم أن يتوب الله علينا .. حين تاب الله على كعب بن مالك قال له رسول الله ﷺ : أبشر يا كعب بخير يوم طلع عليك منذ ولدتك أمك .. ننوي التوبة جميعا هذه الليلة وسيكرمنا الله بالنصر والمعونة إن شاء الله .</p>

            <h2>الوقت هو العمر: حساب كل دقيقة ونَفَس</h2>
            <p>كان بيني وبين أجنبي موعد فتأخرت عليه قليلا في الوصول فحين لقاني ابتدرني سائلا : هل أنت مسلم ؟ قلت نعم ، قال : هل تصلي ؟ قلت نعم .. هل حججت ؟ فأدركت ما يعنى وشعرت بحرج شديد .. وكأنه يتهمني في ديني لأني لم أقدر قيمة الوقت وألتزم بموعدي . إن إقامة الحجة على بن آدم يوم القيامة مرتبطة بالوقت .</p>
            <div class="quran-box">
              <p class="quran-verse">﴿ أَوَلَمْ نُعَمِّرْكُم مَّا يَتَذَكَّرُ فِيهِ مَن تَذَكَّرَ وَجَاءكُمُ النَّذِيرُ فَذُوقُوا فَمَا لِلظَّالِمِينَ مِن نَّصِيرٍ ﴾</p>
              <span class="ayah-source">[فاطر: ٣٧]</span>
            </div>
            <div class="hadith-box">
              <p class="hadith-quote">وقال رسول الله ﷺ : « لا تزولا قدما عبد يوم القيامة حتى يسأل عن أربع . عن عمره فيما أفناه ، عن شبابه فيما أبلاه »</p>
            </div>
            <p>– نعم الشباب جزء من العمر لكن وقت الشباب بالذات له حساب آخر – في اليوم الفلاني فيما أضعت وقتك .؟ في مجلة خارجة أو تافهة تقلب صفحاتها .. في اللف والدوران تقود سيارتك في الطرقات بغير هدي لقرب آذان الفجر .. هل هذه هي أمة محمد خير أمة أخرجت للناس .. سنحاسب على كل دقيقة .. بل على كل نفس .. كل شهيق يتبعه زفير وكأنه يوضع في صندوق أو خزنة صغيرة ثم تأتي يوم القيامة بكل خزائنك تفتح أمام عينيك واحدة تلو الأخرى .. وتعالوا نتخيل : الأولى فارغة .. الثانية أيضا والثالثة والرابعة وما تلاها حتى المائة هذه فيها حضور لدرس ثم صلاة جماعة .. ثم فراغ وتوافه .. ثم إن هذا ما سيحدث يا شباب .</p>
            <p>إنني أحاول أن أبذل مجهودا لأجعلكم تؤمنوا وتصدقوا أن للوقت قيمة عظيمة مع إن هذا المعني مستقر تماما في عقول أهل الغرب ولذلك يسبقوننا .. ونقول في المثل الوقت من ذهب .. لا والله .. الوقت أغلى من الذهب .. فالذهب يباع ويشتري أما الوقت فإذا ذهب لا يعود .. إذا ضاع وقتك ضاع عمرك .</p>
            <div class="wisdom-pearl">
              <span class="wisdom-badge">✦ من أقوال الحسن البصري وابن القيم</span>

            </div>

            <h2>فلا تبع عمرك رخيصاً</h2>
            <p>كلمة : أصلي لا أجد ما أفعل .. كلمة قاتلة .. فبداية المعصية فراغ .. امرأة العزيز راودت يوسف لإحساسها الشديد بالفراغ .. والنسوة في المدينة .. أكثر ما نخافه على البنات الفراغ ... شباب ينام فترات طويلة .. ولا يجرؤ على إيقاظه أحد .. بنات تظل بالساعات تضبط ماكياج نساء كل يوم لها ٣ أو ٤ ساعات تسوق ولف في المحلات .. أو جلسات نميمة في الأندية .. أو مكالمات بعد منتصف الليل .. ونتصور إننا سننتصر .. هيهات . إنك لا تضيع نفسك فقط إنك تضيع أمة .. تسيء إلى والديك حتى إذا أفقت كانا قد فارقا الدنيا فتندم أنك لم تبرهما أحياء .</p>
            <p>رأيت عجوز يدخل المسجد ويدخل حوله مجموعة من الشباب فإذا به يبكي .. فسألته ما الذي يبكيك يا سيدي ؟ قال إنني لم أعرف طريق المسجد والصلاة إلا منذ فترة قليلة وأرى الشباب حولي فأبكي أن أضعت عمري ولم أتعرف إلى الصلاة من قبل .</p>

    const STORAGE_PREFIX = "maktabati_book_" + (BOOK_DATA.title || "default") + "_";
    let currentPageIndex = 0;
    window.currentPageIndex = 0;
    window.currentPage = 0;
    let savedBookmarks = [];
    try {
      const rawBm = localStorage.getItem(STORAGE_PREFIX + "bookmarks");
      if (rawBm) savedBookmarks = JSON.parse(rawBm) || [];
    } catch (e) {}

    const activePageArticle = document.getElementById("activePageArticle");
    const pageCounter = document.getElementById("pageCounter");
    const btnPrevPage = document.getElementById("btnPrevPage");
    const btnNextPage = document.getElementById("btnNextPage");
    const runningHeader = document.getElementById("runningHeader");
    const runningHeaderTag = document.getElementById("runningHeaderTag");
    const bookmarkBtn = document.getElementById("bookmarkBtn");
    const bookStage = document.getElementById("bookStage");

    const searchPanel = document.getElementById("searchPanel");
    const searchOpen = document.getElementById("searchOpen");
    const searchClose = document.getElementById("searchClose");
    const searchInput = document.getElementById("searchInput");
    const searchClearBtn = document.getElementById("searchClearBtn");
    const searchStatus = document.getElementById("searchStatus");
    const searchResults = document.getElementById("searchResults");

    const tocPanel = document.getElementById("tocPanel");
    const tocBtn = document.getElementById("tocBtn");
    const tocClose = document.getElementById("tocClose");
    const tocPanelList = document.getElementById("tocPanelList");

    function renderPage(index, highlightQuery) {
      const total = BOOK_DATA.pages.length;
      if (index < 0) index = 0;
      if (index >= total) index = total - 1;
      currentPageIndex = index;
      window.currentPageIndex = index;
      window.currentPage = index;
      window.__maktabatiLastSavedPage = index;
      window.__maktabatiFallbackPage = index;

      const page = BOOK_DATA.pages[index];
      activePageArticle.innerHTML = page.html;

      pageCounter.textContent = (index + 1) + " / " + total;
      btnPrevPage.disabled = (index === 0);
      btnNextPage.disabled = (index === total - 1);

      if (page.type === "cover" || page.type === "opener" || index === 0 || activePageArticle.querySelector("h1")) {
        runningHeader.hidden = true;
      } else {
        const cleanTag = (page.tag || "").trim();
        const cleanTitle = (page.title || "").trim();
        const isSameAsBook = !cleanTitle || cleanTitle === (BOOK_DATA.title || "").trim();
        const pageH2 = activePageArticle.querySelector("h2");
        const h2Text = pageH2 ? (pageH2.textContent || "").trim() : "";
        const effectiveTitle = (cleanTitle && cleanTitle !== h2Text && !isSameAsBook) ? cleanTitle : "";
        const headerLabel = (cleanTag && effectiveTitle && cleanTag !== effectiveTitle)
          ? (cleanTag + " • " + effectiveTitle)
          : (effectiveTitle || cleanTag);
        if (headerLabel && headerLabel !== (BOOK_DATA.title || "").trim()) {
          runningHeader.hidden = false;
          runningHeaderTag.textContent = headerLabel;
        } else {
          runningHeader.hidden = true;
        }
      }

      bookmarkBtn.classList.toggle("bookmarked", savedBookmarks.includes(index));
      bookStage.scrollTop = 0;

      if (highlightQuery) {
        applyCalmPageSearchHighlight(highlightQuery);
      }

      try {
        localStorage.setItem(STORAGE_PREFIX + "last_page", String(index));
      } catch (e) {}

      if (window.MaktabatiBridge && window.MaktabatiBridge.onPageChanged) {
        window.MaktabatiBridge.onPageChanged(index + 1, total);
      }
    }

    window.goToPage = function(idx) {
      renderPage(idx);
    };

    window.nextPage = function() {
      const now = Date.now();
      if (window.__maktabatiLastPageTurnAt && (now - window.__maktabatiLastPageTurnAt) < 220) return;
      if (currentPageIndex < BOOK_DATA.pages.length - 1) {
        window.__maktabatiLastPageTurnAt = now;
        renderPage(currentPageIndex + 1);
      }
    };

    window.prevPage = function() {
      const now = Date.now();
      if (window.__maktabatiLastPageTurnAt && (now - window.__maktabatiLastPageTurnAt) < 220) return;
      if (currentPageIndex > 0) {
        window.__maktabatiLastPageTurnAt = now;
        renderPage(currentPageIndex - 1);
      }
    };

    window.__maktabatiSetFluidZoom = function(zoomPct) {
      const pct = Math.max(75, Math.min(200, Number(zoomPct) || 100));
      const scale = pct / 100;
      const root = document.documentElement;
      root.style.setProperty("--reader-font", Math.round(21 * scale) + "px");
      root.style.setProperty("--reader-font-size", pct + "%");
      root.style.setProperty("--font-scale", String(scale));
      try {
        localStorage.setItem("maktabati_fluid_zoom_pct", String(pct));
      } catch (e) {}
    };

    bookmarkBtn.addEventListener("click", function() {
      const idx = currentPageIndex;
      if (savedBookmarks.includes(idx)) {
        savedBookmarks = savedBookmarks.filter(i => i !== idx);
      } else {
        savedBookmarks.push(idx);
      }
      try {
        localStorage.setItem(STORAGE_PREFIX + "bookmarks", JSON.stringify(savedBookmarks));
      } catch (e) {}
      renderPage(currentPageIndex);
    });

    let tocBuilt = false;
    function buildTocPanel() {
      if (tocBuilt) return;
      const parts = [];
      let lastSig = "";
      for (let idx = 0; idx < BOOK_DATA.pages.length; idx++) {
        const p = BOOK_DATA.pages[idx];
        const cleanTag = (p.tag || "").trim();
        const cleanTitle = (p.title || ("صفحة " + (idx + 1))).trim().slice(0, 45);
        const sig = (cleanTag + "|" + cleanTitle).toLowerCase();
        const isOpener = (p.type === "opener" || p.type === "cover" || idx === 0);
        if (idx > 0 && !isOpener && sig === lastSig) continue;
        lastSig = sig;
        const cls = isOpener ? "toc-item toc-part" : "toc-item";
        const showTag = cleanTag && cleanTag !== cleanTitle && !cleanTitle.startsWith(cleanTag);
        const label = showTag ? (cleanTag + " • " + cleanTitle) : cleanTitle;
        parts.push(`<div class="${cls}" onclick="window.goToPage(${idx}); tocPanel.classList.remove('open');"><span>${label}</span><small dir="ltr">${idx + 1}</small></div>`);
      }
      tocPanelList.innerHTML = parts.join("");
      tocBuilt = true;
    }

    tocBtn.addEventListener("click", function() {
      buildTocPanel();
      tocPanel.classList.add("open");
    });
    tocClose.addEventListener("click", function() {
      tocPanel.classList.remove("open");
    });
    tocPanel.addEventListener("click", function(e) {
      if (e.target === tocPanel) tocPanel.classList.remove("open");
    });

    searchOpen.addEventListener("click", function() {
      searchPanel.classList.add("open");
      setTimeout(() => searchInput.focus(), 80);
    });
    searchClose.addEventListener("click", function() {
      searchPanel.classList.remove("open");
    });
    searchPanel.addEventListener("click", function(e) {
      if (e.target === searchPanel) searchPanel.classList.remove("open");
    });
    searchClearBtn.addEventListener("click", function() {
      searchInput.value = "";
      searchClearBtn.hidden = true;
      executeBookSearch();
      searchInput.focus();
    });

    function normalizeArabicWithMap(text) {
      if (!text) return { normalized: "", map: [] };
      const tashkeelRegex = /[\u064B-\u065F\u0670\u06D6-\u06EDـ]/;
      let normalized = "";
      const map = [];
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (tashkeelRegex.test(ch)) continue;
        let c = ch;
        if (c === "أ" || c === "إ" || c === "آ") c = "ا";
        else if (c === "ى") c = "ي";
        else if (c === "ة") c = "ه";
        normalized += c.toLowerCase();
        map.push(i);
      }
      return { normalized, map };
    }

    function extractPagePlainText(html) {
      if (!html) return "";
      return html
        .replace(/<[^>]+>/g, " ")
        .replace(/&nbsp;/g, " ")
        .replace(/&quot;/g, "\"")
        .replace(/&apos;/g, "'")
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">")
        .replace(/&amp;/g, "&");
    }

    searchInput.addEventListener("input", function() {
      searchClearBtn.hidden = (searchInput.value.trim().length === 0);
      executeBookSearch();
    });

    function executeBookSearch() {
      const rawQuery = searchInput.value.trim();
      if (!rawQuery || rawQuery.length < 2) {
        searchStatus.textContent = "اكتب كلمة للبحث في جميع صفحات الكتاب...";
        searchResults.innerHTML = "";
        return;
      }

      const qNorm = normalizeArabicWithMap(rawQuery).normalized;
      const hits = [];

      for (let i = 0; i < BOOK_DATA.pages.length; i++) {
        const page = BOOK_DATA.pages[i];
        const plain = extractPagePlainText(page.html);
        const { normalized, map } = normalizeArabicWithMap(plain);

        let searchPos = 0;
        let matchCount = 0;

        while (true) {
          const matchIdx = normalized.indexOf(qNorm, searchPos);
          if (matchIdx === -1) break;
          matchCount++;

          if (matchCount <= 2) {
            const startOrig = map[matchIdx] || 0;
            const endNorm = matchIdx + qNorm.length - 1;
            const endOrig = (map[endNorm] !== undefined ? map[endNorm] + 1 : startOrig + rawQuery.length);

            const snippetStart = Math.max(0, startOrig - 40);
            const snippetEnd = Math.min(plain.length, endOrig + 40);

            const prefix = (snippetStart > 0 ? "..." : "") + plain.substring(snippetStart, startOrig);
            const matchText = plain.substring(startOrig, endOrig);
            const suffix = plain.substring(endOrig, snippetEnd) + (snippetEnd < plain.length ? "..." : "");

            hits.push({
              pageIndex: i,
              pageNumber: i + 1,
              title: page.title || ("صفحة " + (i + 1)),
              tag: page.tag || "",
              snippet: prefix + `<mark class="search-hit-mark">${matchText}</mark>` + suffix
            });
          }

          searchPos = matchIdx + Math.max(1, qNorm.length);
          if (hits.length >= 40) break;
        }
        if (hits.length >= 40) break;
      }

      if (hits.length === 0) {
        searchStatus.textContent = `لا توجد نتائج مطابقة لـ «${rawQuery}»`;
        searchResults.innerHTML = "";
      } else {
        searchStatus.textContent = `تم العثور على ${hits.length} نتيجة:`;
        searchResults.innerHTML = hits.map(hit => `
          <div class="search-result" onclick="selectSearchResult(${hit.pageIndex}, '${rawQuery.replace(/['"\\]/g, "")}')">
            <div class="search-result-head">
              <strong>${hit.tag ? hit.tag + " • " : ""}${hit.title}</strong>
              <span class="search-result-page">${hit.pageNumber}</span>
            </div>
            <small>${hit.snippet}</small>
          </div>
        `).join("");
      }
    }

    window.selectSearchResult = function(pageIndex, query) {
      searchPanel.classList.remove("open");
      renderPage(pageIndex, query);
    };

    function applyCalmPageSearchHighlight(query) {
      if (!query || query.length < 2) return;
      const { normalized: qNorm } = normalizeArabicWithMap(query);

      function traverse(node) {
        if (node.nodeType === 3) {
          const text = node.nodeValue;
          const { normalized, map } = normalizeArabicWithMap(text);
          const idx = normalized.indexOf(qNorm);
          if (idx !== -1) {
            const startOrig = map[idx];
            const endNorm = idx + qNorm.length - 1;
            const endOrig = map[endNorm] !== undefined ? map[endNorm] + 1 : startOrig + query.length;

            const before = text.substring(0, startOrig);
            const match = text.substring(startOrig, endOrig);
            const after = text.substring(endOrig);

            const span = document.createElement("span");
            if (before) span.appendChild(document.createTextNode(before));

            const mark = document.createElement("mark");
            mark.className = "page-search-highlight";
            mark.textContent = match;
            span.appendChild(mark);

            if (after) span.appendChild(document.createTextNode(after));

            node.parentNode.replaceChild(span, node);
            mark.scrollIntoView({ behavior: "smooth", block: "center" });
            return true;
          }
        } else if (node.nodeType === 1 && node.childNodes && !["SCRIPT", "STYLE", "BUTTON"].includes(node.tagName)) {
          for (let i = 0; i < node.childNodes.length; i++) {
            if (traverse(node.childNodes[i])) return true;
          }
        }
        return false;
      }

      traverse(activePageArticle);
    }

    document.addEventListener("DOMContentLoaded", function() {
      try {
        const savedZoom = localStorage.getItem("maktabati_fluid_zoom_pct");
        if (savedZoom) window.__maktabatiSetFluidZoom(savedZoom);
      } catch (e) {}

      let startPage = 0;
      try {
        const lp = localStorage.getItem(STORAGE_PREFIX + "last_page");
        if (lp !== null) startPage = parseInt(lp, 10) || 0;
      } catch (e) {}

      renderPage(startPage);
    });
  </script>
</body>
</html>
